name: GTA VI GUIDE - veille quotidienne

on:
  schedule:
    - cron: "17 6 * * *"   # tous les jours vers 7h17 heure de Paris
  workflow_dispatch: {}     # bouton "Run workflow" pour lancer à la main

permissions:
  contents: write

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Chercher les nouveautés
        run: python gta6-by-mgm/veille/veille.py
      - name: Publier si quelque chose a changé
        run: |
          if git diff --quiet; then echo "Rien à publier"; exit 0; fi
          git config user.name "gta6-veille[bot]"
          git config user.email "gta6-veille@users.noreply.github.com"
          git add gta6-by-mgm/nouveautes.json
          git commit -m "GTA VI GUIDE : nouveautés du $(date +%d/%m/%Y)"
          git push
