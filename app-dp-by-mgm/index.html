<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5b2e1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ma DP">
<title>app dp by mgm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE  tendre et pratique : un carnet perso qu'on ouvre à l'écurie, qui la tutoie
   IDEA   le carnet de demi-pension, un par cheval, rangés dans un tiroir latéral
   PICTURE la photo du cheval en grand médaillon, puis le calendrier du mois
   COLOUR bai profond (robe) en bandeau, blanc, rose vif de flot de concours ; bleu pour les soins
   TYPE   Gloock pour titres et chiffres, Figtree pour le reste
   LAYOUT appli mobile : bandeau, une colonne, tiroir à gauche, onglets en bas */
:root{color-scheme:light dark;
--bg:light-dark(#faf8f6,#15100d);--card:light-dark(#fff,#211915);--ink:light-dark(#2a1810,#f4ece6);
--mute:light-dark(#7d695c,#b39f93);--line:light-dark(#ebe1d8,#3a2d26);--tint:light-dark(#f2e7df,#2d221c);
--bay:light-dark(#5b2e1a,#3b2014);--bay2:light-dark(#7a4227,#5b3321);
--rose:light-dark(#d1356a,#ff7ca5);--rosebg:light-dark(#fde6ee,#4a1e2d);
--sky:light-dark(#2d6aa8,#86b8ec);--skybg:light-dark(#e3eefa,#1b2b3d);--warn:light-dark(#bf3324,#ff8a7a);
--ease:cubic-bezier(.2,.8,.2,1)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:8;background:var(--bay);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) max(4vw,14px) 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.who{display:flex;align-items:center;gap:10px;border:0;background:#ffffff14;border-radius:999px;padding:4px 14px 4px 4px;min-height:48px;color:#fff;text-align:left;transition:background .2s}
.who:active{background:#ffffff2a}
.av{width:40px;height:40px;border-radius:50%;overflow:hidden;background:var(--bay2);flex:none;display:block}
.av img,.av svg{width:100%;height:100%;object-fit:cover;display:block}
.who small{display:block;font-size:13px;opacity:.75;line-height:1.1}
.who b{display:block;font:400 20px/1.1 Gloock,serif;max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who svg.chev{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2.2;opacity:.8}
.st{font-size:13px;display:inline-flex;align-items:center;gap:6px;opacity:.9}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:#f5c36b}
.st[data-m=ok]::before{background:#7ee0a6}.st[data-m=err]::before,.st[data-m=ro]::before{background:#ff8a7a}
.st[data-m=local]{display:none}
main{max-width:760px;margin:0 auto;padding:16px max(4vw,14px) calc(110px + env(safe-area-inset-bottom))}
main.enter>*{animation:rise .45s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
main.swap{animation:swap .5s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes swap{from{opacity:0;transform:translateX(-24px)}}
h2{font:400 26px/1.1 Gloock,serif;margin:22px 0 10px;text-wrap:balance}
h3{font:400 22px/1.15 Gloock,serif;margin:0}
h4{font-size:16px;margin:18px 0 8px}
p{margin:0}
.mute{color:var(--mute)}.sm{font-size:14px}
.hero{background:var(--bay);color:#fff;margin:-16px calc(-1*max(4vw,14px)) 6px;padding:12px max(4vw,14px) 26px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;border-radius:0 0 28px 28px}
.photo{width:clamp(120px,34vw,190px);aspect-ratio:1;border-radius:50%;overflow:hidden;background:var(--bay2);border:4px solid #ffffff2e;display:block;cursor:pointer;position:relative;box-shadow:0 12px 30px #0005;transition:transform .3s var(--ease)}
.photo:active{transform:scale(.96)}
.photo img,.photo svg{width:100%;height:100%;object-fit:cover;display:block}
.photo .add{position:absolute;inset:auto 0 12% 0;text-align:center;font-size:13px;font-weight:600}
.kick{font-size:14px;opacity:.8}
.hname{font:400 clamp(34px,8vw,48px)/1.02 Gloock,serif;margin:2px 0 4px;color:#fff;overflow-wrap:anywhere}
.hero .sub{opacity:.85;font-size:15px}
.stats{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:#ffffff17;border-radius:16px;padding:10px 12px}
.stat b{display:block;font:400 28px/1.1 Gloock,serif;white-space:nowrap}
.stat span{font-size:13px;opacity:.85}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:10px;display:block;width:100%;text-align:left;transition:transform .2s var(--ease),box-shadow .2s}
button.card:active{transform:scale(.985)}
@media(hover:hover){button.card:hover{box-shadow:0 6px 20px #2a18100f}}
.big{font:400 30px/1.1 Gloock,serif}.cap::first-letter{text-transform:uppercase}
.btn{min-height:44px;padding:0 18px;border-radius:999px;border:0;background:var(--rose);color:#fff;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .15s var(--ease),filter .2s}
.btn:active{transform:scale(.96)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.wide{width:100%}
.btn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.fab{position:fixed;right:18px;bottom:calc(80px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;border:0;background:var(--rose);color:#fff;font-size:32px;line-height:1;box-shadow:0 10px 26px #d1356a66;z-index:6;transition:transform .3s var(--ease),opacity .3s}
.fab:active{transform:scale(.9) rotate(90deg)}
.fab[hidden]{display:block;opacity:0;transform:scale(.4);pointer-events:none}
.tabs{position:fixed;inset:auto 0 0 0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding-bottom:env(safe-area-inset-bottom);z-index:7;--x:0}
.tabs::before{content:"";position:absolute;top:7px;left:calc(var(--x)*20% + 10% - 28px);width:56px;height:32px;border-radius:999px;background:var(--rosebg);transition:left .4s var(--ease)}
.tabs button{position:relative;border:0;background:none;min-height:62px;font-size:12px;font-weight:600;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding-top:4px;transition:color .25s}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s var(--ease)}
.tabs [aria-current]{color:var(--rose)}.tabs [aria-current] svg{transform:translateY(-1px) scale(1.08)}
.chip{display:inline-flex;align-items:center;min-height:26px;padding:0 10px;border-radius:999px;background:var(--rosebg);color:var(--rose);font-size:13px;font-weight:600;white-space:nowrap}
.chip.sky{background:var(--skybg);color:var(--sky)}.chip.warn{background:var(--warn);color:#fff}.chip.plain{background:var(--tint);color:var(--ink)}
.scroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.scroll button{flex:none;min-height:40px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:600;transition:background .25s,color .25s}
.scroll button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ses{display:grid;grid-template-columns:54px minmax(0,1fr);gap:12px;align-items:start}
.dnum{font:400 32px/1 Gloock,serif;text-align:center}
.dnum small{display:block;font:600 13px Figtree,sans-serif;color:var(--mute);margin-top:4px}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:4px}
.hearts{display:inline-flex;gap:1px;vertical-align:middle}
.hearts svg,.rate svg{width:16px;height:16px;fill:var(--line)}.hearts svg.on{fill:var(--rose)}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:14px;color:var(--mute);align-items:center}
.mhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:20px 2px 8px;font-weight:700}
.mhead span{font-weight:500;color:var(--mute);font-size:14px}
.empty{text-align:center;padding:28px 16px;color:var(--mute)}
.empty b{display:block;font:400 22px Gloock,serif;color:var(--ink);margin-bottom:6px}
.row2{display:flex;gap:12px;align-items:center;padding:10px 12px}
.row2 .grow{flex:1;border:0;background:none;text-align:left;padding:4px 0;min-height:44px}
.ck{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:none;display:grid;place-items:center;padding:0;transition:background .25s,border-color .25s}
.ck.on{background:var(--rose);border-color:var(--rose)}
.ck.on::after{content:"";width:9px;height:14px;border:solid #fff;border-width:0 3px 3px 0;transform:translateY(-2px) rotate(45deg);animation:pop .35s var(--ease)}
@keyframes pop{from{transform:translateY(-2px) rotate(45deg) scale(0)}}
.ttl{font-weight:600}.done .ttl{text-decoration:line-through;color:var(--mute)}
.sec{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:24px 0 10px}
.sec h2{margin:0}
.sec .btn{min-height:40px;padding:0 14px;font-size:15px}
details summary{cursor:pointer;color:var(--mute);font-weight:600;padding:10px 2px;min-height:44px}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 0 10px}
.mnav h2{margin:0;text-transform:capitalize}
.mnav button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:22px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{text-align:center;font-size:13px;color:var(--mute);font-weight:600;padding:4px 0}
.cd{aspect-ratio:1/1.08;border-radius:12px;border:2px solid transparent;background:var(--card);display:flex;flex-direction:column;align-items:center;padding-top:6px;font-weight:600;position:relative;font-size:15px;transition:transform .2s var(--ease)}
.cd:active{transform:scale(.92)}
.cd.fix{background:var(--tint)}
.cd.plan{border:2px dashed var(--rose)}
.cd.done{background:var(--bay);color:#fff;border-color:var(--bay)}
.cd.past:not(.done){color:var(--mute)}
.cd.today span{background:var(--rose);color:#fff;border-radius:999px;padding:0 7px}
.cd i{position:absolute;bottom:7px;width:7px;height:7px;border-radius:50%;background:var(--sky)}
.cd.done i{background:#fff}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--mute);margin:10px 2px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend em{width:14px;height:14px;border-radius:4px;display:inline-block}
dl{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr);gap:8px 14px;margin:0}
dt{color:var(--mute);font-size:14px}dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.fhead{display:flex;gap:16px;align-items:center;margin:16px 0}
.fhead .photo{width:110px;border-color:var(--line);background:var(--tint)}
.fhead .photo .add{color:var(--ink);inset:40% 0 auto}
.budget{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.budget div{background:var(--tint);border-radius:14px;padding:10px 12px}
.budget b{display:block;font:400 24px/1.15 Gloock,serif;white-space:nowrap}
.budget span{font-size:13px;color:var(--mute)}
.ep{background:var(--bay);color:#fff;border:0;padding:18px}
.ep .mute{color:#ffffffb8}
.ep-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.epn{display:block;font:400 clamp(40px,11vw,56px)/1 Gloock,serif;margin-top:4px;white-space:nowrap}
.ep .btn.ghost{color:#fff;border-color:#ffffff55}
.bar{height:12px;border-radius:999px;background:#ffffff26;overflow:hidden;margin:16px 0 8px}
.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#ff9bbb,var(--rose));transition:width .8s var(--ease)}
.ep-btns{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-top:14px}
.ep-btns .btn:first-child{background:#fff;color:var(--bay)}
.mini{height:5px;border-radius:999px;background:var(--tint);overflow:hidden;margin-top:8px}
.mini i{display:block;height:100%;background:var(--rose);border-radius:inherit}
main.enter .bar i,main.enter .mini i{animation:grow 1s var(--ease) both .15s}
@keyframes grow{from{width:0}}
.mv{display:flex;justify-content:space-between;gap:10px;width:100%;border:0;border-top:1px solid #ffffff22;background:none;color:#fff;padding:10px 0;min-height:46px;text-align:left}
.mv b{white-space:nowrap}
input,select,textarea{width:100%;font:16px Figtree,sans-serif;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);transition:border-color .2s}
textarea{resize:vertical;min-height:80px}
.fld{margin:0 0 14px;border:0;padding:0}
.fld label,.fld legend{display:block;font-size:14px;font-weight:600;margin-bottom:6px;padding:0}
.togs{display:flex;flex-wrap:wrap;gap:6px}
.tog input{position:absolute;opacity:0;pointer-events:none}
.tog span{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);font-size:15px;cursor:pointer;transition:background .2s,color .2s,transform .15s}
.tog span:active{transform:scale(.95)}
.tog input:checked+span{background:var(--rose);border-color:var(--rose);color:#fff}
.tog input:focus-visible+span{outline:2px solid var(--rose)}
.rate{display:flex;gap:4px}
.rate button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;padding:0}
.rate svg{width:22px;height:22px;transition:fill .2s,transform .3s var(--ease)}.rate button.on svg{fill:var(--rose);transform:scale(1.12)}
.ov{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:fade .25s both;transition:opacity .2s}
.ov.out{opacity:0}.ov.out .sheet{transform:translateY(40px);transition:transform .2s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--card);width:min(640px,100%);max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));animation:up .38s var(--ease)}
.sheet::before{content:"";display:block;width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 10px}
@keyframes up{from{transform:translateY(60%)}}
.sh-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.x{width:44px;height:44px;border:0;background:var(--tint);border-radius:50%;font-size:24px}
.sh-a{display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:-18px;background:var(--card);padding:10px 0}
.sh-a .btn:last-child{flex:1;max-width:260px}
.line{display:flex;justify-content:space-between;gap:10px;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 2px;min-height:48px;text-align:left}
.toast{position:fixed;left:50%;bottom:calc(152px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 8px 8px 18px;display:flex;gap:10px;align-items:center;z-index:30;max-width:92vw;font-size:15px;transform:translate(-50%,0);transition:transform .35s var(--ease),opacity .25s;box-shadow:0 10px 30px #0003}
.toast[hidden]{display:flex;opacity:0;transform:translate(-50%,24px);pointer-events:none}
.toast button{border:0;background:var(--rose);color:#fff;border-radius:999px;min-height:36px;padding:0 14px;font-weight:600;white-space:nowrap}
.dr{position:fixed;inset:0;z-index:15;pointer-events:none}
.dr-bg{position:absolute;inset:0;background:#0009;opacity:0;transition:opacity .35s;border:0;width:100%;padding:0}
.dr-p{position:absolute;inset:0 auto 0 0;width:min(330px,86vw);background:var(--bg);transform:translateX(-102%);transition:transform .42s var(--ease);padding:calc(env(safe-area-inset-top) + 18px) 14px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;overflow-y:auto}
.dr.open .dr-p{box-shadow:12px 0 40px #0004}
.dr.open{pointer-events:auto}.dr.open .dr-bg{opacity:1}.dr.open .dr-p{transform:none}
.dr h3{margin:4px 6px 12px;font-size:28px}
.hitem{display:flex;align-items:center;gap:12px;width:100%;border:1px solid transparent;background:none;border-radius:18px;padding:8px;text-align:left;min-height:64px;transition:background .2s,transform .2s var(--ease)}
.hitem:active{transform:scale(.98)}
.hitem .av{width:52px;height:52px;background:var(--bay2)}
.hitem[aria-current]{background:var(--card);border-color:var(--line);box-shadow:0 4px 16px #2a18100d}
.hitem[aria-current] .av{outline:3px solid var(--rose);outline-offset:2px}
.hitem b{display:block;font:400 20px/1.15 Gloock,serif}
.hitem span span{font-size:13px;color:var(--mute)}
.dr.open .hitem,.dr.open .dr-add{animation:slin .45s var(--ease) both;animation-delay:calc(var(--i,0)*50ms + 80ms)}
@keyframes slin{from{opacity:0;transform:translateX(-20px)}}
.dr-add{margin-top:8px;border:2px dashed var(--line);background:none;border-radius:18px;min-height:56px;font-weight:600;color:var(--rose)}
.dr-foot{margin-top:auto;padding:16px 6px 0;font-size:13px;color:var(--mute)}
@media(max-width:420px){.hero{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center}.stat b{font-size:24px}dl{grid-template-columns:minmax(0,1fr);gap:2px}dd{margin-bottom:8px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top"><button class="who" data-a="dropen" aria-label="Choisir un cheval"><span class="av" id="hav"></span><span><small>Mes chevaux</small><b id="hnm">Mon cheval</b></span><svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button><span id="st" class="st" data-m="local">Sur ce téléphone</span></header>
<main id="main"></main>
<button id="fab" class="fab" data-a="newses" aria-label="Nouvelle séance">+</button>
<div id="toast" class="toast" hidden role="status"></div>
<div id="dr" class="dr" aria-hidden="true"><button class="dr-bg" data-a="drclose" aria-label="Fermer" tabindex="-1"></button><aside class="dr-p" id="drp"></aside></div>
<nav class="tabs" id="tabs">
  <button data-a="tab" data-id="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Accueil</button>
  <button data-a="tab" data-id="ses"><svg viewBox="0 0 24 24"><path d="M6.5 21C4.2 18 3.4 15 3.9 11.5 4.5 7 7.8 3.8 12 3.8s7.5 3.2 8.1 7.7c.5 3.5-.3 6.5-2.6 9.5"/><path d="M7.5 9.5h.01M7 14h.01M16.5 9.5h.01M17 14h.01"/></svg>Séances</button>
  <button data-a="tab" data-id="plan"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Planning</button>
  <button data-a="tab" data-id="todo"><svg viewBox="0 0 24 24"><path d="M10 6h10M10 12h10M10 18h10M3.5 6l1.5 1.5L7.5 5M3.5 12l1.5 1.5 2.5-2.5M3.5 18l1.5 1.5 2.5-2.5"/></svg>À prévoir</button>
  <button data-a="tab" data-id="fiche"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="9" cy="11" r="2.3"/><path d="M14 10h4M14 14h3M5.5 17c.8-1.5 2-2.3 3.5-2.3s2.7.8 3.5 2.3"/></svg>Fiches</button>
</nav>
<script>
{
const TYPES=['Plat','Obstacle','Balade','Dressage','Longe','Travail à pied','Cross','Liberté','Pansage & soins'];
const MOODS=['Calme','Motivé','Au top','Câlin','Speed','Tendu','Distrait','Fatigué'];

const LABEL={local:'Sur ce téléphone',wait:'Connexion…',ok:'Synchronisé',ro:'Sur ce téléphone',err:'Hors ligne'};
let mode='local',dbh=null,uid=null,ref=null,writing=false,again=false;const psub={};
const setStatus=m=>{mode=m;const el=$('#st');el.textContent=LABEL[m];el.dataset.m=m};
const keepLocal=()=>{try{localStorage.setItem('madp2',JSON.stringify(S))}catch(e){}};
const keepPh=()=>{try{localStorage.setItem('madp2-ph',JSON.stringify(P))}catch(e){toast('Mémoire pleine : photo non gardée')}};
function save(){S.t=Date.now();keepLocal();clearTimeout(save.tm);save.tm=setTimeout(push,700);render()}
async function push(){
  if(!ref||mode==='ro')return;
  if(writing){again=true;return}
  writing=true;
  try{await ref.set({t:S.t,data:clone(S)});setStatus('ok')}
  catch(e){setStatus(e&&e.code==='invalid_argument'?'ro':'err')}
  writing=false;if(again){again=false;push()}
}
const pdoc=k=>dbh.doc(`data/users/${uid}/photo-${k}`);
function savePhoto(k,img){
  P[k]=img;keepPh();
  if(dbh&&mode!=='ro')pdoc(k).set({img,t:Date.now()}).catch(()=>{});
  render();
}
function watchPhotos(){
  if(!dbh)return;
  for(const k of['me',...S.horses.map(h=>h.id)]){if(psub[k])continue;
    psub[k]=pdoc(k).onSnapshot(s=>{
      if(s.metadata.hasPendingWrites)return;
      if(s.exists){const im=s.data().img;if(im&&im!==P[k]){P[k]=im;keepPh();render()}}
      else if(!s.metadata.fromCache&&P[k]&&mode!=='ro')pdoc(k).set({img:P[k],t:Date.now()}).catch(()=>{});
    },()=>{});}
}
(async()=>{
  try{
    if(!window.claude||!window.claude.use)return;
    const[db,us]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!us)return;
    uid=await us.id();if(!uid)return;
    dbh=db;setStatus('wait');
    ref=db.doc(`data/users/${uid}/app2`);
    const timer=setTimeout(()=>{if(mode==='wait')setStatus('err')},10000);
    ref.onSnapshot(s=>{
      if(!s.metadata.fromCache){clearTimeout(timer);if(mode==='wait'||mode==='err')setStatus('ok')}
      if(s.metadata.hasPendingWrites)return;
      if(s.exists){const v=s.data();
        if((v.t||0)>S.t){S=norm(clone(v.data||{}));S.t=v.t;keepLocal();render()}
        else if((v.t||0)<S.t&&!s.metadata.fromCache)push();
      }else if(!s.metadata.fromCache&&S.t>0)push();
      watchPhotos();
    },()=>{clearTimeout(timer);setStatus('err')});
    watchPhotos();
  }catch(e){setStatus('local')}
})();

function field(f,v){
  const id='f_'+f.k;
  if(f.t==='chips')return`<fieldset class="fld"><legend>${esc(f.l)}</legend><div class="togs">${f.o.map(o=>`<label class="tog"><input type="checkbox" name="${f.k}" value="${esc(o)}"${(v||[]).includes(o)?' checked':''}><span>${esc(o)}</span></label>`).join('')}</div></fieldset>`;
  if(f.t==='rating')return`<fieldset class="fld"><legend>${esc(f.l)}</legend><div class="rate"><input type="hidden" name="${f.k}" value="${+v||0}">${[1,2,3,4,5].map(i=>`<button type="button" data-r="${i}" aria-label="${i} sur 5" class="${i<=(+v||0)?'on':''}">${heart(1)}</button>`).join('')}</div></fieldset>`;
  let h=`<div class="fld"><label for="${id}">${esc(f.l)}</label>`;
  if(f.t==='textarea')h+=`<textarea id="${id}" name="${f.k}" rows="3" placeholder="${esc(f.ph||'')}">${esc(v)}</textarea>`;
  else if(f.t==='select')h+=`<select id="${id}" name="${f.k}">${f.o.map(o=>`<option value="${esc(o)}"${o===v?' selected':''}>${esc(o||'—')}</option>`).join('')}</select>`;
  else h+=`<input id="${id}" name="${f.k}" type="${f.t}"${f.t==='number'?' inputmode="decimal" step="any"':''} value="${esc(v)}" placeholder="${esc(f.ph||'')}"${f.req?' required':''}>`;
  return h+'</div>';
}
function openForm(title,fields,val,onSave,o={}){
  const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML=`<form class="sheet"><div class="sh-h"><h3>${esc(title)}</h3><button type="button" class="x" data-close aria-label="Fermer">×</button></div>${o.top||''}${fields.map(f=>field(f,val[f.k])).join('')}<div class="sh-a">${o.onDel?`<button type="button" class="btn ghost" data-del>${esc(o.delLabel||'Supprimer')}</button>`:''}<button class="btn">${esc(o.okLabel||'Enregistrer')}</button></div></form>`;
  let closed=false;
  const close=()=>{if(closed)return;closed=true;document.removeEventListener('keydown',kd);ov.classList.add('out');setTimeout(()=>ov.remove(),RM?0:200)};
  const kd=e=>{if(e.key==='Escape')close()};
  document.addEventListener('keydown',kd);
  ov.addEventListener('click',e=>{
    if(e.target===ov||e.target.closest('[data-close]'))return close();
    const r=e.target.closest('[data-r]');
    if(r){const w=r.parentNode,n=+r.dataset.r,inp=w.querySelector('input'),nv=+inp.value===n?0:n;inp.value=nv;w.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.r<=nv));return}
    if(e.target.closest('[data-del]')){close();o.onDel();return}
    if(o.onClick)o.onClick(e,close);
  });
  const form=ov.querySelector('form');
  form.addEventListener('submit',e=>{
    e.preventDefault();const d=new FormData(form),out={};
    for(const f of fields){
      if(f.t==='chips')out[f.k]=d.getAll(f.k);
      else if(f.t==='number'||f.t==='rating'){const x=String(d.get(f.k)||'').replace(',','.');out[f.k]=x===''?'':+x}
      else out[f.k]=String(d.get(f.k)||'').trim();
    }
    close();onSave(out);
  });
  document.body.append(ov);
}

function countUp(){
  document.querySelectorAll('[data-n]').forEach(el=>{
    const k=el.dataset.k,to=+el.dataset.n,f=el.dataset.f,from=prevN[k]??0;prevN[k]=to;

    const t0=performance.now(),D=700;

    case'efiche':{const h=H();
      if(id==='horse')openForm('Fiche de '+hName(h),F.horse,h.info,o=>{h.info={...h.info,...o};save()},S.horses.length>1?{delLabel:'Supprimer ce cheval',onDel:()=>{
        const i=S.horses.indexOf(h);S.horses.splice(i,1);S.cur=S.horses[0].id;save();render('swap');toast(`${hName(h)} supprimé`,()=>{S.horses.splice(i,0,h);S.cur=h.id;save();render('swap')})}}:{});
      else if(id==='dp')openForm('La DP de '+hName(h),F.dp,h.dp,o=>{h.dp={...h.dp,...o};save()});
      else openForm('Ma fiche',F.me,S.me,o=>{S.me={...S.me,...o};save()});break;}
    case'copy':{const txt=JSON.stringify({...S,photos:P});
      const fallback=()=>openForm('Ma sauvegarde',[{k:'t',l:'Sélectionne et copie ce texte',t:'textarea'}],{t:txt},()=>{},{okLabel:'Fermer'});
      try{navigator.clipboard.writeText(txt).then(()=>toast('Sauvegarde copiée : colle-la dans une note')).catch(fallback)}catch(e){fallback()}break;}
    case'imp':openForm('Restaurer une sauvegarde',[{k:'t',l:'Colle ici le texte de ta sauvegarde',t:'textarea'}],{},o=>{
      try{const v=JSON.parse(o.t);if(!v||!Array.isArray(v.horses))throw 0;const ph=v.photos;delete v.photos;
        const old=S;S=norm(v);if(ph&&typeof ph==='object')for(const k in ph)if(typeof ph[k]==='string'&&ph[k].startsWith('data:image/'))P[k]=ph[k];keepPh();save();watchPhotos();
        for(const k in P)if(dbh&&mode!=='ro')pdoc(k).set({img:P[k],t:Date.now()}).catch(()=>{});
        toast('Sauvegarde restaurée',()=>{S=old;save()})}
      catch(e){toast("Ce texte n'est pas une sauvegarde valide")}},{okLabel:'Restaurer'});break;
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.photo&&t.files&&t.files[0])readImg(t.files[0],d=>savePhoto(t.dataset.photo,d));
  if(t.id==='goal'){H().goals[ym]=t.value;save()}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;$('#slist').innerHTML=listSes()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#dr').classList.contains('open'))drawer(false)});
let tx=null,ty=0;
document.addEventListener('touchstart',e=>{const p=e.touches[0],open=$('#dr').classList.contains('open');if((!open&&p.clientX<28&&!document.querySelector('.ov'))||open){tx=p.clientX;ty=p.clientY}else tx=null},{passive:true});
document.addEventListener('touchend',e=>{if(tx==null)return;const p=e.changedTouches[0],dx=p.clientX-tx,dy=Math.abs(p.clientY-ty),open=$('#dr').classList.contains('open');
  if(dy<60){if(!open&&dx>60)drawer(true);else if(open&&dx<-60)drawer(false)}tx=null},{passive:true});

/* ---------- appli installée (écran d'accueil) ---------- */
if(isTop&&location.protocol==='https:'){
  for(const[r,h]of[['manifest','manifest.webmanifest'],['apple-touch-icon','icon-180.png'],['icon','icon-192.png']]){const l=document.createElement('link');l.rel=r;l.href=h;document.head.append(l)}
  if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reg.update().catch(()=>{})});
  }).catch(()=>{});
  const APP_V='1';
  const checkV=()=>fetch('version.txt',{cache:'no-store'}).then(r=>r.ok?r.text():'').then(v=>{v=v.trim();let seen='';try{seen=sessionStorage.getItem('madp-rv')||''}catch(e){}
    if(v&&v!==APP_V&&v!==seen&&!document.querySelector('.ov')){try{sessionStorage.setItem('madp-rv',v)}catch(e){}location.reload()}}).catch(()=>{});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkV()});
  checkV();
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
}
render('enter');
}
</script>
