s=\"sm\"><li>Ton objectif idéal et ton objectif minimum.<\/li><li>5 ou 6 questions de découverte.<\/li><li>3 ou 4 arguments CAP, avec preuves.<\/li><li>Les objections probables et leurs réponses.<\/li><li>Ton prix, tes concessions et leurs contreparties.<\/li><li>Ta technique de conclusion et la suite (vente additionnelle, suivi).<\/li><li>Tes supports : catalogue, tablette, simulation chiffrée.<\/li><\/ul><\/div>\n<div class=\"card cO\"><h3>Pendant la simulation<\/h3><ul class=\"sm\"><li>Entre dans le rôle dès la première seconde : 4 × 20.<\/li><li>Écoute vraiment : le jury glisse des indices dans ses réponses.<\/li><li>Reformule avant d'argumenter.<\/li><li>Ne récite pas : adapte tes arguments à ce que dit le client.<\/li><li>Ne lâche pas sur le prix sans contrepartie.<\/li><li>Conclus : un rendez-vous, une commande ou un accord, même partiel.<\/li><\/ul><\/div>\n<\/div>\n<h2>Les questions que le jury pose souvent<\/h2>\n<div class=\"g2\">\n<div class=\"card\"><ul class=\"sm\"><li>Pourquoi avez-vous ciblé ce client ou ce segment ?<\/li><li>Combien a coûté votre prospection, et qu'a-t-elle rapporté ?<\/li><li>Comment avez-vous qualifié vos prospects ?<\/li><li>Quelle était votre marge de négociation ?<\/li><\/ul><\/div>\n<div class=\"card\"><ul class=\"sm\"><li>Que feriez-vous différemment ?<\/li><li>Comment avez-vous suivi les contacts de l'évènement ?<\/li><li>Quelles informations avez-vous transmises, à qui, comment ?<\/li><li>Qu'avez-vous proposé à votre entreprise ?<\/li><\/ul><\/div>\n<\/div>\n<div class=\"card cY\"><h3>L'analyse réflexive après la simulation<\/h3><p class=\"sm\">Le jury te demande ce que tu as pensé de ta prestation. Sois lucide : un point fort, un point à améliorer, et ce que tu aurais fait autrement. Reconnaître une erreur bien analysée rapporte des points.<\/p><\/div>","x":"simulation réussir la simulation utiliser les 40 minutes de préparation lire · 5 simulation · 15 prospection · 10 information · 10 en minutes. repère d'abord ce que la fiche-sujet a changé par rapport à ta fiche, puis adapte tout le reste à ce changement. la préparation de la simulation ton objectif idéal et ton objectif minimum. 5 ou 6 questions de découverte. 3 ou 4 arguments cap, avec preuves. les objections probables et leurs réponses. ton prix, tes concessions et leurs contreparties. ta technique de conclusion et la suite (vente additionnelle, suivi). tes supports : catalogue, tablette, simulation chiffrée. pendant la simulation entre dans le rôle dès la première seconde : 4 × 20. écoute vraiment : le jury glisse des indices dans ses réponses. reformule avant d'argumenter. ne récite pas : adapte tes arguments à ce que dit le client. ne lâche pas sur le prix sans contrepartie. conclus : un rendez-vous, une commande ou un accord, même partiel. les questions que le jury pose souvent pourquoi avez-vous ciblé ce client ou ce segment ? combien a coûté votre prospection, et qu'a-t-elle rapporté ? comment avez-vous qualifié vos prospects ? quelle était votre marge de négociation ? que feriez-vous différemment ? comment avez-vous suivi les contacts de l'évènement ? quelles informations avez-vous transmises, à qui, comment ? qu'avez-vous proposé à votre entreprise ? l'analyse réflexive après la simulation le jury te demande ce que tu as pensé de ta prestation. sois lucide : un point fort, un point à améliorer, et ce que tu aurais fait autrement. reconnaître une erreur bien analysée rapporte des points."},{"t":"Ton kit minimum et le jour J","h":"<p class=\"kick tB\">Jour J<\/p>\n<h1>Ton kit minimum et le jour J<\/h1>\n<div class=\"g2\">\n<div class=\"card cB\"><span class=\"tag fB\">C1<\/span><p class=\"sm\">Analyse ABC du portefeuille · critères de segmentation · objectif SMART · plan d'appel CROC · taux de transformation et coût par contact.<\/p><\/div>\n<div class=\"card cO\"><span class=\"tag fO\">C2<\/span><p class=\"sm\">4 × 20 · QQOQCCP · SONCAS · CAP · traitement des objections · défense du prix · techniques de conclusion · centre d'achat · réclamation.<\/p><\/div>\n<div class=\"card cP\"><span class=\"tag fP\">C3<\/span><p class=\"sm\">Objectifs, budget, rétroplanning · communication avant / pendant / après · bilan quantitatif et qualitatif · suivi des contacts.<\/p><\/div>\n<div class=\"card cG\"><span class=\"tag fG\">C4<\/span><p class=\"sm\">Veille et sources · CRM · compte rendu et reporting · sélectionner et hiérarchiser · une proposition chiffrée.<\/p><\/div>\n<\/div>\n<div class=\"g2\" style=\"align-items:start\">\n<div class=\"card cY\"><h3>Plan de révision<\/h3>\n<div class=\"sm\" style=\"display:flex;flex-direction:column;gap:7px\">\n<span>☐ Connaître tes 2 fiches par cœur, chiffres compris<\/span>\n<span>☐ Connaître ton offre : prix, caractéristiques, concurrents<\/span>\n<span>☐ Savoir refaire tous les calculs de la page 12<\/span>\n<span>☐ Préparer une présentation de 10 min pour la partie 1 et pour la partie 3<\/span>\n<span>☐ Faire 3 simulations chronométrées avec quelqu'un qui joue le client<\/span>\n<span>☐ Préparer ton analyse réflexive pour chaque fiche<\/span>\n<\/div><\/div>\n<div class=\"card dark\"><h3>Le jour J<\/h3>\n<ol class=\"sm\" style=\"color:#E4E5EE;display:flex;flex-direction:column;gap:5px\">\n<li>Apporte ton dossier, tes supports et tes outils numériques chargés.<\/li>\n<li>Tenue professionnelle, adaptée à ton secteur.<\/li>\n<li>En préparation : repère ce qui change dans la fiche-sujet.<\/li>\n<li>Pendant l'oral : regarde les deux membres du jury, parle avec des chiffres.<\/li>\n<li>Pendant la simulation : écoute, reformule, argumente, conclus.<\/li>\n<li>À la fin : remercie le jury.<\/li>\n<\/ol><\/div>\n<\/div>\n<div class=\"card cO\" style=\"padding:18px 20px\"><p class=\"quote\" style=\"font-size:20px\">Le jury ne cherche pas un vendeur parfait : il cherche quelqu'un qui écoute, qui s'adapte et qui sait expliquer ses choix.<\/p><\/div>\n<div class=\"card\"><h3>Sources vérifiées<\/h3><p class=\"sm mut\">Référentiel du BTS NDRC (France Compétences, RNCP 38368) : définition de l'épreuve E4, compétences et savoirs du bloc 1 · guide du dossier E4, SIEC session 2026 · DGCCRF et loi n° 2025-594 du 30 juin 2025 (démarchage téléphonique) · CNIL (prospection électronique). Vérifié le 16 novembre 2026.<\/p><\/div>","x":"jour j ton kit minimum et le jour j c1 analyse abc du portefeuille · critères de segmentation · objectif smart · plan d'appel croc · taux de transformation et coût par contact. c2 4 × 20 · qqoqccp · soncas · cap · traitement des objections · défense du prix · techniques de conclusion · centre d'achat · réclamation. c3 objectifs, budget, rétroplanning · communication avant / pendant / après · bilan quantitatif et qualitatif · suivi des contacts. c4 veille et sources · crm · compte rendu et reporting · sélectionner et hiérarchiser · une proposition chiffrée. plan de révision ☐ connaître tes 2 fiches par cœur, chiffres compris ☐ connaître ton offre : prix, caractéristiques, concurrents ☐ savoir refaire tous les calculs de la page 12 ☐ préparer une présentation de 10 min pour la partie 1 et pour la partie 3 ☐ faire 3 simulations chronométrées avec quelqu'un qui joue le client ☐ préparer ton analyse réflexive pour chaque fiche le jour j apporte ton dossier, tes supports et tes outils numériques chargés. tenue professionnelle, adaptée à ton secteur. en préparation : repère ce qui change dans la fiche-sujet. pendant l'oral : regarde les deux membres du jury, parle avec des chiffres. pendant la simulation : écoute, reformule, argumente, conclus. à la fin : remercie le jury. le jury ne cherche pas un vendeur parfait : il cherche quelqu'un qui écoute, qui s'adapte et qui sait expliquer ses choix. sources vérifiées référentiel du bts ndrc (france compétences, rncp 38368) : définition de l'épreuve e4, compétences et savoirs du bloc 1 · guide du dossier e4, siec session 2026 · dgccrf et loi n° 2025-594 du 30 juin 2025 (démarchage téléphonique) · cnil (prospection électronique). vérifié le 16 novembre 2026."}],"g":[{"n":"Déroulement de l'épreuve","tag":"","e":true,"p":[0,1,2,13,14]},{"n":"Cibler et prospecter","tag":"C1","e":false,"p":[3,4]},{"n":"Négocier, vendre, fidéliser","tag":"C2","e":false,"p":[5,6,7,8]},{"n":"L'évènement commercial","tag":"C3","e":false,"p":[9]},{"n":"L'information commerciale","tag":"C4","e":false,"p":[10]},{"n":"Calculs commerciaux","tag":"","e":false,"p":[11]},{"n":"Le droit pour vendre","tag":"","e":false,"p":[12]}],"q":[{"id":"e4q0","q":"Que désigne la règle des 4 × 20 ?","o":["Les 20 premières secondes, mots, gestes et 20 cm du visage","4 rendez-vous de 20 minutes","20 % de remise sur 4 produits","4 objections en 20 secondes"],"a":0,"e":"Tout se joue au moment de la prise de contact."},{"id":"e4q1","q":"QQOQCCP sert à…","o":["conclure la vente","découvrir les besoins du client","calculer la marge","traiter une réclamation"],"a":1,"e":"Qui, quoi, où, quand, comment, combien, pourquoi."},{"id":"e4q2","q":"La technique du « boomerang » consiste à…","o":["ignorer l'objection","retourner l'objection en argument","baisser le prix","changer de sujet"],"a":1,"e":"« C'est justement pour cela que… »"},{"id":"e4q3","q":"L'up-selling, c'est…","o":["vendre un produit complémentaire","faire monter le client en gamme","baisser le prix","relancer un prospect"],"a":1,"e":"Le cross-selling, lui, vend un produit complémentaire."},{"id":"e4q4","q":"Un objectif SMART est…","o":["Spécifique, Mesurable, Atteignable, Réaliste, Temporel","Simple, Moderne, Ambitieux, Rapide, Total","Stratégique, Marketing, Annuel, Rentable, Testé","Sûr, Mesuré, Adapté, Rapide, Tenu"],"a":0,"e":"Ex. : 10 rendez-vous en 3 semaines."},{"id":"e4q5","q":"Dans SONCAS, que signifie le A ?","o":["Amitié","Argent","Avantage","Action"],"a":1,"e":"Sécurité, Orgueil, Nouveauté, Confort, Argent, Sympathie."},{"id":"e4q6","q":"Que signifie CAP dans l'argumentation ?","o":["Client, Achat, Prix","Caractéristique, Avantage, Preuve","Contact, Argument, Proposition","Conclusion, Accord, Paiement"],"a":1,"e":"Caractéristique, Avantage pour le client, Preuve."},{"id":"e4q7","q":"Que signifie CROC pour un appel de prospection ?","o":["Contact, Raison, Objectif, Conclusion","Client, Rendez-vous, Offre, Commande","Cible, Relance, Objection, Contrat","Contact, Remise, Offre, Clôture"],"a":0,"e":"Contact, Raison de l'appel, Objectif (rendez-vous), Conclusion."},{"id":"e4q8","q":"Taux de marque =","o":["marge / coût d'achat HT × 100","marge / prix de vente HT × 100","PV TTC / coût d'achat HT","CA / clients"],"a":1,"e":"Le taux de marge, lui, divise par le coût d'achat."},{"id":"e4q9","q":"Un produit acheté 40 € HT et vendu 60 € HT : taux de marge ?","o":["20 %","33,3 %","50 %","60 %"],"a":2,"e":"Marge 20 € / coût d'achat 40 € = 50 %."},{"id":"e4q10","q":"Deux remises successives de 10 % donnent au total…","o":["20 %","19 %","21 %","10 %"],"a":1,"e":"100 → 90 → 81 : soit 19 %."},{"id":"e4q11","q":"Depuis le 11 août 2026, démarcher un particulier par téléphone exige…","o":["une inscription sur Bloctel","son consentement préalable","un courrier préalable","rien de particulier"],"a":1,"e":"Loi du 30 juin 2025 : consentement préalable, Bloctel a disparu."},{"id":"e4q12","q":"Un client achète sur ton stand d'une foire. A-t-il un droit de rétractation ?","o":["Oui, 14 jours","Oui, 7 jours","Non (sauf crédit affecté), et le vendeur doit l'afficher","Oui, 30 jours"],"a":2,"e":"Pas de rétractation en foire ou salon, sauf crédit affecté."},{"id":"e4q13","q":"Délai de rétractation pour un achat à distance ?","o":["7 jours","10 jours","14 jours","30 jours"],"a":2,"e":"14 jours sans motif."},{"id":"e4q14","q":"Délais de paiement B2B (cas général) ?","o":["30 jours","60 jours après facture ou 45 jours fin de mois","90 jours","Libres"],"a":1,"e":"60 jours date de facture, ou 45 jours fin de mois."},{"id":"e4q15","q":"Selon la règle de Pareto, environ 20 % des clients font…","o":["20 % du CA","50 % du CA","80 % du CA","100 % du CA"],"a":2,"e":"Règle empirique à vérifier sur tes chiffres."},{"id":"e4q16","q":"Dans le centre d'achat, le prescripteur est celui qui…","o":["signe","recommande","utilise","paie"],"a":1,"e":"Il recommande (technicien, consultant) ; le décideur signe."},{"id":"e4q17","q":"La négociation raisonnée (Harvard) consiste à se concentrer sur…","o":["les positions","les intérêts","le rapport de force","le prix uniquement"],"a":1,"e":"Intérêts plutôt que positions, options mutuelles, critères objectifs."},{"id":"e4q18","q":"La reformulation « écho » consiste à…","o":["résumer tout l'entretien","reprendre les mots du client","changer de sujet","conclure"],"a":1,"e":"Elle montre au client qu'il est écouté."},{"id":"e4q19","q":"Laquelle est une question alternative ?","o":["Comment l'utilisez-vous ?","Préférez-vous mardi ou jeudi ?","C'est-à-dire ?","Êtes-vous satisfait ?"],"a":1,"e":"Deux choix : utile pour obtenir un rendez-vous ou conclure."},{"id":"e4q20","q":"En analyse transactionnelle, le vendeur vise une relation…","o":["Parent-Enfant","Adulte-Adulte","Enfant-Enfant","Parent-Parent"],"a":1,"e":"Calme, factuelle, d'égal à égal."},{"id":"e4q21","q":"La méthode « sandwich » sert à présenter…","o":["une objection","le prix entre deux avantages","le vendeur","un concurrent"],"a":1,"e":"Avantage, prix, avantage."},{"id":"e4q22","q":"Lequel est un signal d'achat ?","o":["Le client regarde l'heure","Le client demande les délais de livraison","Le client fronce les sourcils","Le client se tait"],"a":1,"e":"Questions sur la livraison, le paiement, ou client qui reprend le produit en main."},{"id":"e4q23","q":"La conclusion « implicite » consiste à…","o":["demander une signature","faire comme si l'achat était décidé (« Je vous la livre mardi ? »)","proposer deux choix","baisser le prix"],"a":1,"e":"On présume l'accord du client."},{"id":"e4q24","q":"Le cross-selling, c'est…","o":["vendre un produit complémentaire","faire monter en gamme","vendre à l'étranger","vendre à perte"],"a":0,"e":"Ex. : une housse avec une tablette."},{"id":"e4q25","q":"La MESORE, c'est…","o":["un indicateur de vente","ta meilleure solution de rechange si l'accord échoue","une technique de conclusion","un contrat"],"a":1,"e":"Plus elle est bonne, plus tu es fort dans la négociation."},{"id":"e4q26","q":"300 visiteurs et 45 acheteurs : taux de transformation ?","o":["10 %","15 %","20 %","45 %"],"a":1,"e":"45 / 300 × 100 = 15 %."},{"id":"e4q27","q":"Coût d'achat 40 € HT, prix de vente 72 € TTC : coefficient multiplicateur ?","o":["1,5","1,8","2","0,55"],"a":1,"e":"72 / 40 = 1,8."},{"id":"e4q28","q":"Un rabais est accordé…","o":["pour une grosse quantité","pour un défaut de qualité ou de conformité","pour un paiement anticipé","en fin d'année"],"a":1,"e":"Remise : quantité ou fidélité. Escompte : paiement anticipé."},{"id":"e4q29","q":"Une ristourne est accordée…","o":["sur chaque facture","en fin de période, sur le CA cumulé","pour un défaut","pour un paiement comptant"],"a":1,"e":"Elle récompense le volume d'achats sur une période."},{"id":"e4q30","q":"Charges fixes 30 000 €, taux de marge sur coût variable 40 % : seuil de rentabilité ?","o":["12 000 €","70 000 €","75 000 €","120 000 €"],"a":2,"e":"30 000 / 0,40 = 75 000 € de CA."},{"id":"e4q31","q":"Montant de l'indemnité forfaitaire pour retard de paiement entre professionnels ?","o":["10 €","40 €","100 €","Aucune"],"a":1,"e":"En plus des pénalités de retard."},{"id":"e4q32","q":"Une négociation « distributive » est…","o":["gagnant-gagnant","gagnant-perdant","perdant-perdant","sans enjeu"],"a":1,"e":"On se partage un gâteau fixe."},{"id":"e4q33","q":"Pour un prix barré, le prix de référence doit être…","o":["le prix conseillé","le plus bas pratiqué dans les 30 derniers jours","le prix d'un concurrent","libre"],"a":1,"e":"Règle de l'annonce de réduction de prix."}],"r":[{"id":"e4r0","q":"Un client te dit : « C'est trop cher. » Rédige ta réponse.","p":[{"t":"Reformuler ou questionner","k":["qu'entendez","comprends","si je comprends","par rapport","compare"]},{"t":"Valoriser les avantages","k":["avantage","qualite","durable","garantie","econom"]},{"t":"Une technique de prix (division, comparaison)","k":["par jour","par mois","soit","seulement","rentabil"]},{"t":"Valider ou proposer avec une contrepartie","k":["cela repond","qu'en pensez","si vous","est-ce que","contrepartie"]}],"m":"« Je comprends, c'est un vrai budget. Qu'entendez-vous par trop cher : par rapport à quoi ? (…) Ce modèle est garanti 5 ans et consomme moitié moins d'énergie : sur sa durée de vie, il vous revient à environ 1,20 € par jour et vous fait économiser sur vos factures. Cela répond-il à votre inquiétude ? Si vous commandez aujourd'hui, je peux vous offrir la livraison. »"},{"id":"e4r1","q":"Rédige un plan d'appel CROC pour obtenir un rendez-vous avec un prospect.","p":[{"t":"Contact : se présenter, vérifier l'interlocuteur","k":["bonjour","je suis","je m'appelle","contact"]},{"t":"Raison de l'appel, centrée sur le client","k":["je vous appelle","raison","parce que","afin de"]},{"t":"Objectif : un rendez-vous avec 2 créneaux","k":["rendez-vous","rdv","mardi","jeudi","creneau","ou"]},{"t":"Conclusion : reformuler, remercier, confirmer","k":["confirm","merci","recap","je vous envoie"]}],"m":"Contact : « Bonjour, je suis Léa, de la société X. Suis-je bien avec M. Martin, responsable des achats ? » Raison : « Je vous appelle car nous aidons des entreprises comme la vôtre à réduire leurs coûts d'impression de 20 %. » Objectif : « Je vous propose d'en parler 20 minutes : préférez-vous mardi 10 h ou jeudi 14 h ? » Conclusion : « C'est noté pour jeudi 14 h, je vous envoie une confirmation par e-mail. Merci et bonne journée. »"},{"id":"e4r2","q":"Présente un argument avec la méthode CAP pour un produit de ton choix.","p":[{"t":"Une caractéristique","k":["caracteristique","c'est","il est","elle est","dote","equipe"]},{"t":"Un avantage pour le client","k":["avantage","vous permet","pour vous","vous pourrez","grace"]},{"t":"Une preuve","k":["preuve","garanti","demonstr","test","avis","label","essay"]}],"m":"Caractéristique : « Ce vélo électrique a une batterie de 600 Wh. » Avantage : « Vous pourrez faire vos trajets de la semaine sans le recharger. » Preuve : « Notre test sur route a mesuré 110 km d'autonomie, et je vous propose de l'essayer maintenant. »"},{"id":"e4r3","q":"Quelles questions poses-tu en découverte à un client qui veut un ordinateur portable ?","p":[{"t":"Une question ouverte sur l'usage","k":["usage","utilis","pour quoi","pourquoi","faire"]},{"t":"Le budget","k":["budget","combien"]},{"t":"Les critères techniques ou les contraintes","k":["autonom","poids","ecran","performance","stockage","transport","deplac"]},{"t":"Une reformulation pour valider","k":["si je resume","si je comprends","donc vous","c'est bien"]}],"m":"« Pour quoi allez-vous utiliser cet ordinateur ? » « Le transporterez-vous souvent ? » « Quelle autonomie vous faut-il ? » « Quels logiciels utilisez-vous ? » « Quel budget avez-vous prévu ? » « Pour quand en avez-vous besoin ? » Puis reformuler : « Si je résume, vous cherchez un ordinateur léger, avec une longue autonomie, pour moins de 800 € : c'est bien cela ? »"},{"id":"e4r4","q":"Comment évaluer la rentabilité d'une action de prospection ? Donne les indicateurs et un exemple de calcul.","p":[{"t":"Le taux de transformation","k":["transformation"]},{"t":"Le coût par contact ou d'acquisition","k":["cout par contact","cout d'acquisition","cout"]},{"t":"Le retour sur investissement","k":["retour sur investissement","roi","rentabilite"]},{"t":"Un calcul chiffré","k":["%","="]}],"m":"On mesure le taux de transformation (ventes / contacts × 100), le coût par contact (coût de l'action / nombre de contacts) et le retour sur investissement : (marge générée − coût) / coût × 100. Exemple : une action coûte 4 000 € et génère 6 000 € de marge ; ROI = (6 000 − 4 000) / 4 000 × 100 = 50 % : l'action est rentable."},{"id":"e4r5","q":"Comment traites-tu la réclamation d'un client mécontent ?","p":[{"t":"Écouter sans couper ni se justifier","k":["ecout"]},{"t":"Montrer de l'empathie, s'excuser","k":["empath","comprends","excus","desole"]},{"t":"Proposer une solution","k":["solution","rembours","echange","geste","remplac"]},{"t":"Assurer le suivi pour fidéliser","k":["suivi","rappel","fideli","recontact"]}],"m":"1. J'écoute le client sans le couper ni me justifier. 2. Je montre de l'empathie : « Je comprends votre mécontentement, je suis désolé. » 3. Je questionne pour comprendre et vérifier les faits. 4. Je propose une solution : échange, réparation, remboursement ou geste commercial. 5. Je le rappelle ensuite pour vérifier qu'il est satisfait : une réclamation bien traitée peut fidéliser le client."},{"id":"e4r6","q":"Un produit est acheté 50 € HT et vendu 80 € HT. Calcule la marge, le taux de marge et le taux de marque.","p":[{"t":"Marge = 30 €","k":["30"]},{"t":"Taux de marge = 60 %","k":["60"]},{"t":"Taux de marque = 37,5 %","k":["37,5","37.5"]},{"t":"Les bonnes formules","k":["achat","vente","/"]}],"m":"Marge = 80 − 50 = 30 €. Taux de marge = marge / coût d'achat × 100 = 30 / 50 × 100 = 60 %. Taux de marque = marge / prix de vente HT × 100 = 30 / 80 × 100 = 37,5 %."},{"id":"e4r7","q":"Un client a acheté sur ton stand pendant une foire et veut annuler le lendemain. Que lui réponds-tu ?","p":[{"t":"Pas de droit de rétractation en foire ou salon","k":["pas de droit","pas du droit","ne beneficie pas","pas de retract","aucun droit","ne peut pas","pas possible"]},{"t":"Sauf crédit affecté","k":["credit"]},{"t":"Le vendeur doit l'afficher","k":["affich","panneau","inform"]}],"m":"En foire ou en salon, le consommateur ne bénéficie pas du droit de rétractation (sauf si l'achat est financé par un crédit affecté). Le vendeur doit l'indiquer clairement par un affichage sur le stand. Je l'explique au client avec courtoisie, et je peux chercher un geste commercial pour garder une bonne relation."}]},{"k":"e5","n":"Digitalisation","s":"E5 · Relation à distance","c":"#7B4FD6","p":[{"t":"Vue d'ensemble","h":"<div style=\"display:flex;flex-direction:column;gap:12px;padding-top:8px\">\n<span class=\"tag\" style=\"background:#16182B\">Fiche de révision · Bloc 2 · Épreuve E5<\/span>\n<div style=\"font-family:'Bricolage Grotesque',Inter,sans-serif;font-weight:800;font-size:clamp(34px,11vw,80px);line-height:.92;letter-spacing:-.03em\"><span style=\"color:#2F5BEA\">Relation client à distance<\/span><br><span style=\"color:#7B4FD6\">&amp; digitalisation<\/span><\/div>\n<p style=\"font-size:17px;line-height:1.45;max-width:640px\">La relation client par téléphone, sur les réseaux et sur un site e-commerce. Tout pour réussir l'écrit et la partie pratique sur ordinateur.<\/p>\n<\/div>\n<div class=\"g4\">\n<div class=\"card dark\"><span class=\"bign\">Coef. 4<\/span><span class=\"sm\" style=\"color:#D6D8E6\">2 + 2<\/span><\/div>\n<div class=\"card dark\"><span class=\"bign\">3 h<\/span><span class=\"sm\" style=\"color:#D6D8E6\">écrit : une étude de cas<\/span><\/div>\n<div class=\"card dark\"><span class=\"bign\">40 min<\/span><span class=\"sm\" style=\"color:#D6D8E6\">pratique sur ordinateur<\/span><\/div>\n<div class=\"card dark\"><span class=\"bign\">Ponctuel<\/span><span class=\"sm\" style=\"color:#D6D8E6\">pour tous, pas de CCF<\/span><\/div>\n<\/div>\n<h2>Les 3 compétences évaluées<\/h2>\n<div class=\"g3\">\n<div class=\"card cB\"><span class=\"tag fB\">C1<\/span><h3>Maîtriser la relation omnicanale<\/h3><p class=\"sm\">Vendre et accompagner à distance, suivre les indicateurs, encadrer une équipe de téléconseillers.<\/p><\/div>\n<div class=\"card cP\"><span class=\"tag fP\">C2<\/span><h3>Animer la relation client digitale<\/h3><p class=\"sm\">Produire et publier des contenus, les rendre visibles, animer une communauté, surveiller l'e-réputation.<\/p><\/div>\n<div class=\"card cG\"><span class=\"tag fG\">C3<\/span><h3>Développer la relation client en e-commerce<\/h3><p class=\"sm\">Dynamiser le site, sécuriser la vente, analyser les résultats.<\/p><\/div>\n<\/div>\n<div class=\"g2 sm\" style=\"gap:4px 20px\">\n<span><b>02<\/b> · Le déroulement de l'épreuve<\/span><span><b>09<\/b> · C2 : le référencement<\/span>\n<span><b>03<\/b> · Méthode de l'écrit et de la pratique<\/span><span><b>10<\/b> · C3 : dynamiser le site<\/span>\n<span><b>04<\/b> · C1 : l'omnicanal et les outils<\/span><span><b>11<\/b> · C3 : sécuriser la vente en ligne<\/span>\n<span><b>05<\/b> · C1 : les indicateurs à distance<\/span><span><b>12<\/b> · C3 : les indicateurs e-commerce<\/span>\n<span><b>06<\/b> · C1 : manager une équipe<\/span><span><b>13<\/b> · Les outils de la pratique<\/span>\n<span><b>07<\/b> · C2 : la stratégie de contenu<\/span><span><b>14<\/b> · Données client et lexique<\/span>\n<span><b>08<\/b> · C2 : réseaux sociaux, e-réputation<\/span><span><b>15<\/b> · Kit minimum et jour J<\/span>\n<\/div>","x":"fiche de révision · bloc 2 · épreuve e5 relation client à distance & digitalisation la relation client par téléphone, sur les réseaux et sur un site e-commerce. tout pour réussir l'écrit et la partie pratique sur ordinateur. coef. 4 2 + 2 3 h écrit : une étude de cas 40 min pratique sur ordinateur ponctuel pour tous, pas de ccf les 3 compétences évaluées c1 maîtriser la relation omnicanale vendre et accompagner à distance, suivre les indicateurs, encadrer une équipe de téléconseillers. c2 animer la relation client digitale produire et publier des contenus, les rendre visibles, animer une communauté, surveiller l'e-réputation. c3 développer la relation client en e-commerce dynamiser le site, sécuriser la vente, analyser les résultats. 02 · le déroulement de l'épreuve 09 · c2 : le référencement 03 · méthode de l'écrit et de la pratique 10 · c3 : dynamiser le site 04 · c1 : l'omnicanal et les outils 11 · c3 : sécuriser la vente en ligne 05 · c1 : les indicateurs à distance 12 · c3 : les indicateurs e-commerce 06 · c1 : manager une équipe 13 · les outils de la pratique 07 · c2 : la stratégie de contenu 14 · données client et lexique 08 · c2 : réseaux sociaux, e-réputation 15 · kit minimum et jour j"},{"t":"Comment se passe l'épreuve","h":"<p class=\"kick tO\">L'épreuve<\/p>\n<h1>Le déroulement de l'épreuve<\/h1>\n<p class=\"mut\">Pas de CCF pour l'E5 : quel que soit ton statut, l'épreuve est ponctuelle, en deux parties qui comptent autant l'une que l'autre.<\/p>\n<div class=\"g2\" style=\"align-items:start\">\n<div class=\"card cB\" style=\"gap:8px\"><span class=\"tag fB\">Partie 1 · Écrit · 3 h · coef. 2<\/span><h2>Une étude de cas<\/h2>\n<ul class=\"sm\"><li>Une organisation réelle et ses problèmes commerciaux, avec des documents en annexe.<\/li><li>Une relation client omnicanale, avec des outils digitaux.<\/li><li>Les questions sont souvent regroupées en 2 ou 3 dossiers (ex. 2025 : « construire une image et veiller à l'e-réputation »).<\/li><li>Tu peux devoir mobiliser de l'économie, du droit et du management, et une vraie réflexion commerciale.<\/li><li>Corrigé par deux professeurs.<\/li><\/ul><\/div>\n<div class=\"card cP\" style=\"gap:8px\"><span class=\"tag fP\">Partie 2 · Pratique · 40 min · coef. 2<\/span><h2>Sur ordinateur, sans préparation<\/h2>\n<ul class=\"sm\"><li>Un « contexte digital de référence » : un site web ou un site e-commerce créé au niveau national, diffusé en début de session.<\/li><li>Un sujet tiré de ce contexte : questions, situations à gérer, opérations à faire, contenus à produire.<\/li><li>Tu travailles sous le regard d'un examinateur, qui peut suivre jusqu'à 3 candidats en même temps.<\/li><li>Tu dois <b>expliquer et justifier<\/b> tes choix et tes actions.<\/li><\/ul><\/div>\n<\/div>\n<div class=\"card cY\"><h3>Le conseil le plus utile<\/h3><p class=\"sm\">Le contexte digital est connu à l'avance. Entraîne-toi dessus avec ton professeur : connaître le site, ses produits et l'interface te fait gagner un temps précieux le jour J.<\/p><\/div>\n<h2>Ce que le jury regarde<\/h2>\n<table class=\"tb\"><tr><th style=\"width:24%\">Compétence<\/th><th>Critères de la grille<\/th><\/tr><tr><td><span class='tB'>C1 · Omnicanal<\/span><\/td><td>Usage efficace des outils à distance, appropriation du dossier client, rapidité et proactivité, rigueur du reporting, évaluation de la performance, organisation et animation d'une équipe<\/td><\/tr><tr><td><span class='tP'>C2 · Digital<\/span><\/td><td>Qualité des contenus, référencement suivi et optimisé, cohérence entre outils, contenus et canaux, rythme de publication, contrôle de l'image<\/td><\/tr><tr><td><span class='tG'>C3 · E-commerce<\/span><\/td><td>Actions pertinentes pour développer ventes et valeur, qualité de l'assistance, prise en compte des risques et de la réglementation, indicateurs pertinents<\/td><\/tr><\/table>","x":"l'épreuve le déroulement de l'épreuve pas de ccf pour l'e5 : quel que soit ton statut, l'épreuve est ponctuelle, en deux parties qui comptent autant l'une que l'autre. partie 1 · écrit · 3 h · coef. 2 une étude de cas une organisation réelle et ses problèmes commerciaux, avec des documents en annexe. une relation client omnicanale, avec des outils digitaux. les questions sont souvent regroupées en 2 ou 3 dossiers (ex. 2025 : « construire une image et veiller à l'e-réputation »). tu peux devoir mobiliser de l'économie, du droit et du management, et une vraie réflexion commerciale. corrigé par deux professeurs. partie 2 · pratique · 40 min · coef. 2 sur ordinateur, sans préparation un « contexte digital de référence » : un site web ou un site e-commerce créé au niveau national, diffusé en début de session. un sujet tiré de ce contexte : questions, situations à gérer, opérations à faire, contenus à produire. tu travailles sous le regard d'un examinateur, qui peut suivre jusqu'à 3 candidats en même temps. tu dois expliquer et justifier tes choix et tes actions. le conseil le plus utile le contexte digital est connu à l'avance. entraîne-toi dessus avec ton professeur : connaître le site, ses produits et l'interface te fait gagner un temps précieux le jour j. ce que le jury regarde compétence critères de la grille c1 · omnicanal usage efficace des outils à distance, appropriation du dossier client, rapidité et proactivité, rigueur du reporting, évaluation de la performance, organisation et animation d'une équipe c2 · digital qualité des contenus, référencement suivi et optimisé, cohérence entre outils, contenus et canaux, rythme de publication, contrôle de l'image c3 · e-commerce actions pertinentes pour développer ventes et valeur, qualité de l'assistance, prise en compte des risques et de la réglementation, indicateurs pertinents"},{"t":"Méthode de l'écrit et de la pratique","h":"<p class=\"kick tO\">Méthode<\/p>\n<h1>Méthode de l'écrit et de la pratique<\/h1>\n<h2>L'écrit : 3 heures<\/h2>\n<div class=\"g4\"><div class=\"step\"><span class=\"bign tO\" style=\"font-size:24px\">1<\/span><b>Lire le contexte<\/b><span>L'entreprise, sa cible, ses canaux, son problème. 15 min.<\/span><\/div><div class=\"step\"><span class=\"bign tO\" style=\"font-size:24px\">2<\/span><b>Lire les annexes<\/b><span>Note quelle annexe sert à quelle question. Repère les chiffres.<\/span><\/div><div class=\"step\"><span class=\"bign tO\" style=\"font-size:24px\">3<\/span><b>Traiter les dossiers<\/b><span>Dans l'ordre, en gardant du temps pour chacun. Environ 2 h 15.<\/span><\/div><div class=\"step\"><span class=\"bign tO\" style=\"font-size:24px\">4<\/span><b>Relire<\/b><span>Calculs, unités, orthographe. 15 min.<\/span><\/div><\/div>\n<div class=\"g2\" style=\"align-items:start\">\n<div class=\"card cO\"><h3>Les types de questions<\/h3><div class=\"mini\"><div class=\"def\"><b>Calculer<\/b> · un indicateur, avec la formule, le calcul et une phrase qui interprète<\/div><div class=\"def\"><b>Analyser<\/b> · un diagnostic avec des preuves tirées des annexes<\/div><div class=\"def\"><b>Proposer<\/b> · des actions concrètes, justifiées, adaptées à la cible<\/div><div class=\"def\"><b>Rédiger<\/b> · un post, un e-mail, un script d'appel, une réponse à un avis, une fiche produit<\/div><div class=\"def\"><b>Justifier un choix<\/b> · comparer des options sur des critères, puis trancher<\/div><\/div><\/div>\n<div class=\"card cO\"><h3>Les réflexes qui rapportent<\/h3><ul class=\"sm\"><li>Toujours relier la réponse à l'entreprise et à sa cible.<\/li><li>Un chiffre ne suffit pas : dis ce qu'il signifie et ce qu'il faut faire.<\/li><li>Une production rédigée respecte les codes du canal (longueur, ton, appel à l'action).<\/li><li>Utilise le vocabulaire précis : taux de conversion, SEO, persona…<\/li><li>Pense au droit : RGPD, consentement, mentions obligatoires.<\/li><\/ul><\/div>\n<\/div>\n<h2>La pratique : 40 minutes sur ordinateur<\/h2>\n<div class=\"g2\" style=\"align-items:start\">\n<div class=\"card cP\"><h3>Pendant l'épreuve<\/h3><ul class=\"sm\"><li>Lis tout le sujet avant de toucher à la souris.<\/li><li>Fais les opérations dans l'ordre logique (une catégorie avant le produit qu'elle contient).<\/li><li><b>Commente à voix haute<\/b> : ce que tu fais, pourquoi, pour quelle cible.<\/li><li>Vérifie le résultat côté visiteur (la page publique).<\/li><li>Bloqué ? Explique ce que tu voulais faire et passe à la suite.<\/li><\/ul><\/div>\n<div class=\"card cP\"><h3>Ce qu'on peut te demander<\/h3><ul class=\"sm\"><li>Créer ou modifier une page, un article, une fiche produit.<\/li><li>Optimiser le référencement d'une page.<\/li><li>Créer une promotion, un code de réduction, une catégorie.<\/li><li>Rédiger un post, une newsletter, une réponse à un avis.<\/li><li>Analyser des statistiques et proposer des actions.<\/li><\/ul><\/div>\n<\/div>","x":"méthode méthode de l'écrit et de la pratique l'écrit : 3 heures 1 lire le contexte l'entreprise, sa cible, ses canaux, son problème. 15 min. 2 lire les annexes note quelle annexe sert à quelle question. repère les chiffres. 3 traiter les dossiers dans l'ordre, en gardant du temps pour chacun. environ 2 h 15. 4 relire calculs, unités, orthographe. 15 min. les types de questions calculer · un indicateur, avec la formule, le calcul et une phrase qui interprète analyser · un diagnostic avec des preuves tirées des annexes proposer · des actions concrètes, justifiées, adaptées à la cible rédiger · un post, un e-mail, un script d'appel, une réponse à un avis, une fiche produit justifier un choix · comparer des options sur des critères, puis trancher les réflexes qui rapportent toujours relier la réponse à l'entreprise et à sa cible. un chiffre ne suffit pas : dis ce qu'il signifie et ce qu'il faut faire. une production rédigée respecte les codes du canal (longueur, ton, appel à l'action). utilise le vocabulaire précis : taux de conversion, seo, persona… pense au droit : rgpd, consentement, mentions obligatoires. la pratique : 40 minutes sur ordinateur pendant l'épreuve lis tout le sujet avant de toucher à la souris. fais les opérations dans l'ordre logique (une catégorie avant le produit qu'elle contient). commente à voix haute : ce que tu fais, pourquoi, pour quelle cible. vérifie le résultat côté visiteur (la page publique). bloqué ? explique ce que tu voulais faire et passe à la suite. ce qu'on peut te demander créer ou modifier une page, un article, une fiche produit. optimiser le référencement d'une page. créer une promotion, un code de réduction, une catégorie. rédiger un post, une newsletter, une réponse à un avis. analyser des statistiques et proposer des actions."},{"t":"Omnicanal et outils à distance","h":"<div class=\"row\" style=\"align-items:center;gap:14px\"><div class=\"fB\" style=\"width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#FFFFFF\"><span class=\"bign\">C1<\/span><\/div><div style=\"display:flex;flex-direction:column;gap:2px\"><p class=\"kick mut\">Maîtriser la relation omnicanale · 1/3<\/p><h1 style=\"font-size:31px\">Omnicanal et outils à distance<\/h1><\/div><\/div>\n<div class=\"card cB\" style=\"gap:8px\"><h3>Du multicanal à l'omnicanal<\/h3>\n<div class=\"g3\" style=\"gap:8px\"><div class=\"card\" style=\"background:#FFFFFF;padding:10px\"><b>Multicanal<\/b><span class=\"mini\">plusieurs canaux, qui fonctionnent séparément<\/span><\/div><div class=\"card\" style=\"background:#FFFFFF;padding:10px\"><b>Cross-canal<\/b><span class=\"mini\">les canaux se complètent : commander en ligne, retirer en magasin<\/span><\/div><div class=\"card\" style=\"background:#FFFFFF;padding:10px\"><b>Omnicanal<\/b><span class=\"mini\">tous les canaux partagent les mêmes données : le client passe de l'un à l'autre sans rupture<\/span><\/div><\/div>\n<p class=\"sm\"><b>Parcours client<\/b> : <i>web-to-store<\/i> (se renseigner en ligne, acheter en magasin), <i>store-to-web<\/i> ou <i>showrooming<\/i> (voir en magasin, acheter en ligne), <i>click and collect<\/i>.<\/p><\/div>\n<div class=\"g2\" style=\"align-items:start\"><div class=\"card cB\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fB\">Outils<\/span><h3>La communication unifiée<\/h3><div class=\"mini\"><div class=\"def\"><b>Principe<\/b> · réunir téléphone, messagerie, visio, chat et partage de documents sur une même plateforme<\/div><div class=\"def\"><b>Centre de contacts<\/b> · appels entrants (service client, commandes) et sortants (prospection, relance)<\/div><div class=\"def\"><b>CTI<\/b> · couplage téléphonie-informatique : la fiche client s'affiche quand il appelle<\/div><div class=\"def\"><b>SVI<\/b> · serveur vocal interactif : « tapez 1 pour… »<\/div><div class=\"def\"><b>ACD<\/b> · distribution automatique des appels au bon conseiller<\/div><div class=\"def\"><b>Chat, chatbot, callbot<\/b> · réponse instantanée, par un humain ou un robot<\/div><div class=\"def\"><b>Rappel<\/b> · click-to-call, callback : le client demande à être rappelé<\/div><\/div><\/div><div class=\"card cB\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fB\">Vendre à distance<\/span><h3>Les spécificités<\/h3><div class=\"mini\"><div class=\"def\"><b>Au téléphone<\/b> · pas de non-verbal : le sourire s'entend, la voix compte, il faut reformuler davantage<\/div><div class=\"def\"><b>Script<\/b> · un guide d'appel (CROC) qu'on adapte, sans le réciter<\/div><div class=\"def\"><b>Réactivité<\/b> · répondre vite, sur le canal choisi par le client<\/div><div class=\"def\"><b>Dossier client<\/b> · le consulter avant ou pendant l'échange, le mettre à jour après<\/div><div class=\"def\"><b>Gérer les conflits et le stress<\/b> · écoute, empathie, ton calme, solution, suivi ; pauses et soutien de l'équipe<\/div><\/div><\/div><\/div>\n<div class=\"card dark\"><h3>Le mot-clé de la compétence : expérience client<\/h3><p class=\"sm\" style=\"color:#E4E5EE\">Le client veut une réponse rapide, cohérente et personnalisée, quel que soit le canal. Toute proposition à l'écrit doit améliorer son parcours : moins d'attente, moins d'effort, plus de personnalisation.<\/p><\/div>","x":"c1 maîtriser la relation omnicanale · 1/3 omnicanal et outils à distance du multicanal à l'omnicanal multicanal plusieurs canaux, qui fonctionnent séparément cross-canal les canaux se complètent : commander en ligne, retirer en magasin omnicanal tous les canaux partagent les mêmes données : le client passe de l'un à l'autre sans rupture parcours client : web-to-store (se renseigner en ligne, acheter en magasin), store-to-web ou showrooming (voir en magasin, acheter en ligne), click and collect . outils la communication unifiée principe · réunir téléphone, messagerie, visio, chat et partage de documents sur une même plateforme centre de contacts · appels entrants (service client, commandes) et sortants (prospection, relance) cti · couplage téléphonie-informatique : la fiche client s'affiche quand il appelle svi · serveur vocal interactif : « tapez 1 pour… » acd · distribution automatique des appels au bon conseiller chat, chatbot, callbot · réponse instantanée, par un humain ou un robot rappel · click-to-call, callback : le client demande à être rappelé vendre à distance les spécificités au téléphone · pas de non-verbal : le sourire s'entend, la voix compte, il faut reformuler davantage script · un guide d'appel (croc) qu'on adapte, sans le réciter réactivité · répondre vite, sur le canal choisi par le client dossier client · le consulter avant ou pendant l'échange, le mettre à jour après gérer les conflits et le stress · écoute, empathie, ton calme, solution, suivi ; pauses et soutien de l'équipe le mot-clé de la compétence : expérience client le client veut une réponse rapide, cohérente et personnalisée, quel que soit le canal. toute proposition à l'écrit doit améliorer son parcours : moins d'attente, moins d'effort, plus de personnalisation."},{"t":"Les indicateurs de la relation à distance","h":"<div class=\"row\" style=\"align-items:center;gap:14px\"><div class=\"fB\" style=\"width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#FFFFFF\"><span class=\"bign\">C1<\/span><\/div><div style=\"display:flex;flex-direction:column;gap:2px\"><p class=\"kick mut\">Maîtriser la relation omnicanale · 2/3<\/p><h1 style=\"font-size:31px\">Les indicateurs de la relation à distance<\/h1><\/div><\/div><p class=\"mut\">Ils servent à évaluer la performance d'un service client ou d'une équipe de téléconseillers.<\/p><table class=\"tb\"><tr><th style=\"width:30%\">Indicateur<\/th><th style=\"width:40%\">Calcul<\/th><th>Ce qu'il mesure<\/th><\/tr><tr><td>Taux de décroché<\/td><td>appels décrochés / appels reçus × 100<\/td><td>La capacité à répondre aux clients<\/td><\/tr><tr><td>Taux d'abandon<\/td><td>appels abandonnés avant réponse / appels reçus × 100<\/td><td>L'attente trop longue<\/td><\/tr><tr><td>Durée moyenne de traitement (DMT)<\/td><td>(temps de communication + temps de traitement après l'appel) / nombre d'appels<\/td><td>La productivité<\/td><\/tr><tr><td>Taux de résolution au premier contact<\/td><td>demandes réglées au 1er contact / demandes × 100<\/td><td>L'efficacité et la qualité<\/td><\/tr><tr><td>Taux de réitération<\/td><td>clients qui rappellent pour la même demande / clients × 100<\/td><td>Les problèmes mal réglés<\/td><\/tr><tr><td>Taux de joignabilité (appels sortants)<\/td><td>contacts joints / appels passés × 100<\/td><td>La qualité du fichier<\/td><\/tr><tr><td>Taux de transformation<\/td><td>ventes / contacts argumentés × 100<\/td><td>L'efficacité commerciale<\/td><\/tr><tr><td>Appels par heure<\/td><td>nombre d'appels / heures de travail<\/td><td>Le rythme de production<\/td><\/tr><\/table>\n<h2>Mesurer la satisfaction<\/h2>\n<div class=\"g3\">\n<div class=\"card cB\"><span class=\"bign tB\" style=\"font-size:26px\">CSAT<\/span><p class=\"sm\">Satisfaction après un contact : « Êtes-vous satisfait ? » noté de 1 à 5.<\/p><\/div>\n<div class=\"card cB\"><span class=\"bign tB\" style=\"font-size:26px\">NPS<\/span><p class=\"sm\">« Recommanderiez-vous… ? » de 0 à 10. NPS = % de promoteurs (9-10) − % de détracteurs (0-6).<\/p><\/div>\n<div class=\"card cB\"><span class=\"bign tB\" style=\"font-size:26px\">CES<\/span><p class=\"sm\">L'effort client : « A-t-il été facile de régler votre demande ? »<\/p><\/div>\n<\/div>\n<div class=\"card cY\"><h3>Exemple d'interprétation<\/h3><p class=\"sm\">300 appels reçus, 240 décrochés : taux de décroché de 80 %, donc 1 client sur 5 n'obtient pas de réponse. <b>Proposition<\/b> : renforcer l'équipe aux heures de pointe, proposer le rappel automatique ou un chatbot pour les questions simples.<\/p><\/div>","x":"c1 maîtriser la relation omnicanale · 2/3 les indicateurs de la relation à distance ils servent à évaluer la performance d'un service client ou d'une équipe de téléconseillers. indicateur calcul ce qu'il mesure taux de décroché appels décrochés / appels reçus × 100 la capacité à répondre aux clients taux d'abandon appels abandonnés avant réponse / appels reçus × 100 l'attente trop longue durée moyenne de traitement (dmt) (temps de communication + temps de traitement après l'appel) / nombre d'appels la productivité taux de résolution au premier contact demandes réglées au 1er contact / demandes × 100 l'efficacité et la qualité taux de réitération clients qui rappellent pour la même demande / clients × 100 les problèmes mal réglés taux de joignabilité (appels sortants) contacts joints / appels passés × 100 la qualité du fichier taux de transformation ventes / contacts argumentés × 100 l'efficacité commerciale appels par heure nombre d'appels / heures de travail le rythme de production mesurer la satisfaction csat satisfaction après un contact : « êtes-vous satisfait ? » noté de 1 à 5. nps « recommanderiez-vous… ? » de 0 à 10. nps = % de promoteurs (9-10) − % de détracteurs (0-6). ces l'effort client : « a-t-il été facile de régler votre demande ? » exemple d'interprétation 300 appels reçus, 240 décrochés : taux de décroché de 80 %, donc 1 client sur 5 n'obtient pas de réponse. proposition : renforcer l'équipe aux heures de pointe, proposer le rappel automatique ou un chatbot pour les questions simples."},{"t":"Encadrer une équipe de téléconseillers","h":"<div class=\"row\" style=\"align-items:center;gap:14px\"><div class=\"fB\" style=\"width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#FFFFFF\"><span class=\"bign\">C1<\/span><\/div><div style=\"display:flex;flex-direction:column;gap:2px\"><p class=\"kick mut\">Maîtriser la relation omnicanale · 3/3<\/p><h1 style=\"font-size:31px\">Encadrer une équipe de téléconseillers<\/h1><\/div><\/div><div class=\"g4\"><div class=\"step\"><span class=\"bign tB\" style=\"font-size:24px\">1<\/span><b>Recruter<\/b><span>Profil de poste, annonce, entretien, mise en situation au téléphone.<\/span><\/div><div class=\"step\"><span class=\"bign tB\" style=\"font-size:24px\">2<\/span><b>Intégrer et former<\/b><span>Produits, outils, scripts, double écoute avec un ancien.<\/span><\/div><div class=\"step\"><span class=\"bign tB\" style=\"font-size:24px\">3<\/span><b>Organiser<\/b><span>Planning selon les pics d'appels, objectifs individuels et collectifs.<\/span><\/div><div class=\"step\"><span class=\"bign tB\" style=\"font-size:24px\">4<\/span><b>Évaluer<\/b><span>Tableaux de bord, écoutes, entretiens, coaching.<\/span><\/div><\/div>\n<div class=\"g2\" style=\"align-items:start\"><div class=\"card cB\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fB\">Motiver<\/span><h3>Les leviers<\/h3><div class=\"mini\"><div class=\"def\"><b>Financiers<\/b> · primes sur objectifs, challenges avec récompenses<\/div><div class=\"def\"><b>Non financiers<\/b> · reconnaissance, autonomie, formation, perspectives d'évolution, bonne ambiance<\/div><div class=\"def\"><b>Herzberg<\/b> · le salaire évite l'insatisfaction ; la reconnaissance et les responsabilités motivent<\/div><div class=\"def\"><b>Animation<\/b> · briefing quotidien, challenges d'équipe, célébrer les réussites<\/div><div class=\"def\"><b>Communication managériale<\/b> · objectifs clairs, retours réguliers, écoute<\/div><\/div><\/div><div class=\"card cB\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fB\">Piloter<\/span><h3>La performance<\/h3><div class=\"mini\"><div class=\"def\"><b>Objectifs<\/b> · SMART, individuels et collectifs<\/div><div class=\"def\"><b>Tableau de bord<\/b> · quelques indicateurs clés, suivis chaque jour ou semaine<\/div><div class=\"def\"><b>Écoute et coaching<\/b> · écouter des appels, puis faire un retour constructif : un point fort, un point à travailler<\/div><div class=\"def\"><b>Régulation<\/b> · réorganiser le planning, remotiver, former si un indicateur se dégrade<\/div><\/div><\/div><\/div>\n<div class=\"card cP\" style=\"gap:6px\"><span class=\"tag fP\">Droit du travail<\/span><h3>Les repères à connaître<\/h3>\n<div class=\"g2 mini\" style=\"gap:4px 18px\"><span><b>Durée légale<\/b> : 35 h par semaine ; au-delà, heures supplémentaires.<\/span><span><b>Maximums<\/b> : 10 h par jour, 48 h par semaine.<\/span><span><b>Repos<\/b> : 11 h consécutives entre deux journées.<\/span><span><b>Pause<\/b> : 20 min dès 6 h de travail.<\/span><span><b>Santé et sécurité<\/b> : l'employeur doit prévenir les risques, y compris le stress (risques psychosociaux).<\/span><span><b>Formation<\/b> : l'employeur doit maintenir l'adaptation des salariés à leur poste.<\/span><span><b>Recrutement<\/b> : aucune discrimination ; les questions doivent porter sur les compétences.<\/span><span><b>Contrôle<\/b> : l'écoute des appels est possible si les salariés en sont informés.<\/span><\/div><\/div>","x":"c1 maîtriser la relation omnicanale · 3/3 encadrer une équipe de téléconseillers 1 recruter profil de poste, annonce, entretien, mise en situation au téléphone. 2 intégrer et former produits, outils, scripts, double écoute avec un ancien. 3 organiser planning selon les pics d'appels, objectifs individuels et collectifs. 4 évaluer tableaux de bord, écoutes, entretiens, coaching. motiver les leviers financiers · primes sur objectifs, challenges avec récompenses non financiers · reconnaissance, autonomie, formation, perspectives d'évolution, bonne ambiance herzberg · le salaire évite l'insatisfaction ; la reconnaissance et les responsabilités motivent animation · briefing quotidien, challenges d'équipe, célébrer les réussites communication managériale · objectifs clairs, retours réguliers, écoute piloter la performance objectifs · smart, individuels et collectifs tableau de bord · quelques indicateurs clés, suivis chaque jour ou semaine écoute et coaching · écouter des appels, puis faire un retour constructif : un point fort, un point à travailler régulation · réorganiser le planning, remotiver, former si un indicateur se dégrade droit du travail les repères à connaître durée légale : 35 h par semaine ; au-delà, heures supplémentaires. maximums : 10 h par jour, 48 h par semaine. repos : 11 h consécutives entre deux journées. pause : 20 min dès 6 h de travail. santé et sécurité : l'employeur doit prévenir les risques, y compris le stress (risques psychosociaux). formation : l'employeur doit maintenir l'adaptation des salariés à leur poste. recrutement : aucune discrimination ; les questions doivent porter sur les compétences. contrôle : l'écoute des appels est possible si les salariés en sont informés."},{"t":"La stratégie de contenu","h":"<div class=\"row\" style=\"align-items:center;gap:14px\"><div class=\"fP\" style=\"width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#FFFFFF\"><span class=\"bign\">C2<\/span><\/div><div style=\"display:flex;flex-direction:column;gap:2px\"><p class=\"kick mut\">Animer la relation client digitale · 1/3<\/p><h1 style=\"font-size:31px\">La stratégie de contenu<\/h1><\/div><\/div>\n<div class=\"card cP\" style=\"gap:8px\"><h3>L'inbound marketing : faire venir le client à soi<\/h3>\n<div class=\"bar\" style=\"display:flex;height:44px;border-radius:12px;overflow:hidden;font-weight:700;font-size:12.5px;color:#FFFFFF\">\n<div class=\"fP\" style=\"flex:1;display:flex;align-items:center;justify-content:center\">Attirer<\/div>\n<div style=\"flex:1;display:flex;align-items:center;justify-content:center;background:#6A40C4\">Convertir<\/div>\n<div style=\"flex:1;display:flex;align-items:center;justify-content:center;background:#5531A8\">Conclure<\/div>\n<div style=\"flex:1;display:flex;align-items:center;justify-content:center;background:#16182B\">Fidéliser<\/div>\n<\/div>\n<p class=\"sm\">Des contenus utiles (articles, tutoriels, vidéos) attirent des visiteurs, qu'on transforme en contacts (formulaire, newsletter), puis en clients, puis en ambassadeurs. À l'opposé, l'<b>outbound<\/b> va chercher le client (publicité, prospection).<\/p><\/div>\n<div class=\"g2\" style=\"align-items:start\"><div class=\"card cP\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fP\">Préparer<\/span><h3>Les bases<\/h3><div class=\"mini\"><div class=\"def\"><b>Persona<\/b> · un portrait fictif mais précis du client type : âge, besoins, freins, canaux préférés<\/div><div class=\"def\"><b>Ligne éditoriale<\/b> · les sujets, le ton et le style de la marque<\/div><div class=\"def\"><b>Calendrier éditorial<\/b> · quoi publier, où, quand<\/div><div class=\"def\"><b>Charte graphique<\/b> · couleurs, polices, logo : une image cohérente<\/div><div class=\"def\"><b>Objectifs<\/b> · notoriété, trafic, engagement, conversion, fidélisation<\/div><\/div><\/div><div class=\"card cP\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fP\">Produire<\/span><h3>Les contenus<\/h3><div class=\"mini\"><div class=\"def\"><b>Types<\/b> · articles de blog, vidéos, stories, infographies, newsletters, tutoriels, avis clients, live<\/div><div class=\"def\"><b>Storytelling<\/b> · raconter une histoire pour créer de l'émotion<\/div><div class=\"def\"><b>Contenu généré par les utilisateurs (UGC)<\/b> · photos et avis de clients : très crédibles<\/div><div class=\"def\"><b>Appel à l'action<\/b> · un bouton ou une phrase qui dit quoi faire : « Découvrir », « Commander »<\/div><div class=\"def\"><b>Image et vidéo<\/b> · respecter le droit à l'image et les droits d'auteur (banques d'images libres de droits ou achetées)<\/div><\/div><\/div><\/div>\n<div class=\"card cY\"><h3>Rédiger pour le web<\/h3><div class=\"g2 sm\" style=\"gap:4px 18px\"><span>L'essentiel d'abord (pyramide inversée).<\/span><span>Phrases courtes, paragraphes aérés, intertitres.<\/span><span>Des mots-clés que tape la cible.<\/span><span>Un ton adapté au canal et à la cible.<\/span><span>Un appel à l'action clair.<\/span><span>Des liens vers d'autres pages du site.<\/span><\/div><\/div>","x":"c2 animer la relation client digitale · 1/3 la stratégie de contenu l'inbound marketing : faire venir le client à soi attirer convertir conclure fidéliser des contenus utiles (articles, tutoriels, vidéos) attirent des visiteurs, qu'on transforme en contacts (formulaire, newsletter), puis en clients, puis en ambassadeurs. à l'opposé, l' outbound va chercher le client (publicité, prospection). préparer les bases persona · un portrait fictif mais précis du client type : âge, besoins, freins, canaux préférés ligne éditoriale · les sujets, le ton et le style de la marque calendrier éditorial · quoi publier, où, quand charte graphique · couleurs, polices, logo : une image cohérente objectifs · notoriété, trafic, engagement, conversion, fidélisation produire les contenus types · articles de blog, vidéos, stories, infographies, newsletters, tutoriels, avis clients, live storytelling · raconter une histoire pour créer de l'émotion contenu généré par les utilisateurs (ugc) · photos et avis de clients : très crédibles appel à l'action · un bouton ou une phrase qui dit quoi faire : « découvrir », « commander » image et vidéo · respecter le droit à l'image et les droits d'auteur (banques d'images libres de droits ou achetées) rédiger pour le web l'essentiel d'abord (pyramide inversée). phrases courtes, paragraphes aérés, intertitres. des mots-clés que tape la cible. un ton adapté au canal et à la cible. un appel à l'action clair. des liens vers d'autres pages du site."},{"t":"Réseaux sociaux et e-réputation","h":"<div class=\"row\" style=\"align-items:center;gap:14px\"><div class=\"fP\" style=\"width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#FFFFFF\"><span class=\"bign\">C2<\/span><\/div><div style=\"display:flex;flex-direction:column;gap:2px\"><p class=\"kick mut\">Animer la relation client digitale · 2/3<\/p><h1 style=\"font-size:31px\">Réseaux sociaux et e-réputation<\/h1><\/div><\/div>\n<div class=\"g2\" style=\"align-items:start\"><div class=\"card cP\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fP\">Choisir<\/span><h3>Le bon réseau<\/h3><div class=\"mini\"><div class=\"def\"><b>Selon la cible<\/b> · où est-elle ? Quel âge, quel usage (loisir ou professionnel) ?<\/div><div class=\"def\"><b>Selon le contenu<\/b> · image, vidéo courte, article, échange<\/div><div class=\"def\"><b>Selon l'objectif<\/b> · B2B : réseau professionnel ; B2C : réseaux visuels ou vidéo<\/div><\/div><\/div><div class=\"card cP\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fP\">Animer<\/span><h3>Le community management<\/h3><div class=\"mini\"><div class=\"def\"><b>Rôle<\/b> · créer, publier, animer, répondre, modérer, analyser<\/div><div class=\"def\"><b>Engager<\/b> · questions, sondages, jeux-concours (avec règlement), lives, partages de clients<\/div><div class=\"def\"><b>Répondre<\/b> · vite, poliment, en personnalisant<\/div><div class=\"def\"><b>Charte de modération<\/b> · ce qui est accepté, ce qui est supprimé (insultes, spam, contenus illicites)<\/div><div class=\"def\"><b>Influenceurs<\/b> · partenariats déclarés : mention « publicité » ou « collaboration commerciale » obligatoire depuis la loi du 9 juin 2023<\/div><\/div><\/div><\/div>\n<div class=\"g2\" style=\"align-items:start\"><div class=\"card cP\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fP\">Surveiller<\/span><h3>L'e-réputation<\/h3><div class=\"mini\"><div class=\"def\"><b>Définition<\/b> · l'image de la marque sur internet : avis, commentaires, articles, posts<\/div><div class=\"def\"><b>Veille<\/b> · alertes sur le nom de la marque, outils de suivi des mentions, lecture des avis<\/div><div class=\"def\"><b>Avis clients<\/b> · répondre à tous, surtout aux négatifs ; ne jamais acheter de faux avis (interdit)<\/div><div class=\"def\"><b>Indicateurs<\/b> · note moyenne, nombre d'avis, sentiment des mentions (positif, neutre, négatif)<\/div><\/div><\/div>\n<div class=\"card cO\" style=\"gap:6px\"><h3>Répondre à un avis négatif<\/h3><ol class=\"sm\"><li><b>Remercier<\/b> le client pour son retour.<\/li><li><b>Reconnaître<\/b> le problème, sans se justifier ni accuser.<\/li><li><b>S'excuser<\/b> et expliquer brièvement.<\/li><li><b>Proposer une solution<\/b> ou un contact privé.<\/li><li><b>Inviter<\/b> à revenir.<\/li><\/ol><p class=\"sm\"><b>Bad buzz<\/b> : réagir vite, reconnaître, corriger, communiquer clairement. Ne jamais supprimer les critiques légitimes.<\/p><\/div>\n<\/div>\n<h2>Les indicateurs des réseaux<\/h2>\n<table class=\"tb\"><tr><th style=\"width:32%\">Indicateur<\/th><th>Calcul ou définition<\/th><\/tr><tr><td>Portée<\/td><td>nombre de personnes qui ont vu la publication<\/td><\/tr><tr><td>Impressions<\/td><td>nombre total d'affichages (une personne peut voir plusieurs fois)<\/td><\/tr><tr><td>Taux d'engagement<\/td><td>interactions (j'aime, commentaires, partages, clics) / portée × 100<\/td><\/tr><tr><td>Croissance de la communauté<\/td><td>(abonnés fin − abonnés début) / abonnés début × 100<\/td><\/tr><tr><td>Taux de clic<\/td><td>clics / impressions × 100<\/td><\/tr><\/table>","x":"c2 animer la relation client digitale · 2/3 réseaux sociaux et e-réputation choisir le bon réseau selon la cible · où est-elle ? quel âge, quel usage (loisir ou professionnel) ? selon le contenu · image, vidéo courte, article, échange selon l'objectif · b2b : réseau professionnel ; b2c : réseaux visuels ou vidéo animer le community management rôle · créer, publier, animer, répondre, modérer, analyser engager · questions, sondages, jeux-concours (avec règlement), lives, partages de clients répondre · vite, poliment, en personnalisant charte de modération · ce qui est accepté, ce qui est supprimé (insultes, spam, contenus illicites) influenceurs · partenariats déclarés : mention « publicité » ou « collaboration commerciale » obligatoire depuis la loi du 9 juin 2023 surveiller l'e-réputation définition · l'image de la marque sur internet : avis, commentaires, articles, posts veille · alertes sur le nom de la marque, outils de suivi des mentions, lecture des avis avis clients · répondre à tous, surtout aux négatifs ; ne jamais acheter de faux avis (interdit) indicateurs · note moyenne, nombre d'avis, sentiment des mentions (positif, neutre, négatif) répondre à un avis négatif remercier le client pour son retour. reconnaître le problème, sans se justifier ni accuser. s'excuser et expliquer brièvement. proposer une solution ou un contact privé. inviter à revenir. bad buzz : réagir vite, reconnaître, corriger, communiquer clairement. ne jamais supprimer les critiques légitimes. les indicateurs des réseaux indicateur calcul ou définition portée nombre de personnes qui ont vu la publication impressions nombre total d'affichages (une personne peut voir plusieurs fois) taux d'engagement interactions (j'aime, commentaires, partages, clics) / portée × 100 croissance de la communauté (abonnés fin − abonnés début) / abonnés début × 100 taux de clic clics / impressions × 100"},{"t":"Le référencement","h":"<div class=\"row\" style=\"align-items:center;gap:14px\"><div class=\"fP\" style=\"width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#FFFFFF\"><span class=\"bign\">C2<\/span><\/div><div style=\"display:flex;flex-direction:column;gap:2px\"><p class=\"kick mut\">Animer la relation client digitale · 3/3<\/p><h1 style=\"font-size:31px\">Le référencement<\/h1><\/div><\/div><p class=\"mut\">Être visible quand le client cherche sur un moteur de recherche.<\/p>\n<div class=\"g3\">\n<div class=\"card cP\"><span class=\"bign tP\" style=\"font-size:28px\">SEO<\/span><b>Référencement naturel<\/b><p class=\"sm\">Gratuit, mais lent : optimiser le site pour remonter dans les résultats.<\/p><\/div>\n<div class=\"card cP\"><span class=\"bign tP\" style=\"font-size:28px\">SEA<\/span><b>Référencement payant<\/b><p class=\"sm\">Annonces sponsorisées, rapides. On paie au clic (CPC), selon des enchères sur des mots-clés.<\/p><\/div>\n<div class=\"card cP\"><span class=\"bign tP\" style=\"font-size:28px\">SMO<\/span><b>Réseaux sociaux<\/b><p class=\"sm\">Optimiser sa présence sur les réseaux (SMA : la publicité sur les réseaux).<\/p><\/div>\n<\/div>\n<p class=\"sm mut\">SEM (marketing des moteurs de recherche) = SEO + SEA.<\/p>\n<div class=\"g2\" style=\"align-items:start\"><div class=\"card cP\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fP\ =\"def\"><b>Cyberattaques<\/b> · mises à jour, mots de passe solides, sauvegardes<\/div><div class=\"def\"><b>Données<\/b> · protéger les données clients (RGPD) : accès limités, sécurité<\/div><\/div><\/div><\/div>\n<h2>Le droit de la vente en ligne<\/h2>\n<table class=\"tb\"><tr><th style=\"width:30%\">Règle<\/th><th>À retenir<\/th><\/tr><tr><td>Mentions légales<\/td><td>Identité de l'éditeur, coordonnées, hébergeur : obligatoires sur tout site (loi pour la confiance dans l'économie numérique, 2004)<\/td><\/tr><tr><td>CGV<\/td><td>Obligatoires et acceptées avant la commande : prix, livraison, paiement, rétractation, garanties<\/td><\/tr><tr><td>Commande<\/td><td>Récapitulatif avant validation, bouton clair (« commande avec obligation de paiement »), confirmation par e-mail<\/td><\/tr><tr><td>Droit de rétractation<\/td><td>14 jours sans motif pour le consommateur<\/td><\/tr><tr><td>Livraison<\/td><td>Dans le délai annoncé ; sans date indiquée, 30 jours maximum<\/td><\/tr><tr><td>Garantie légale de conformité<\/td><td>2 ans pour un bien neuf<\/td><\/tr><tr><td>Cookies<\/td><td>Consentement préalable pour les cookies publicitaires ; refuser doit être aussi simple qu'accepter (CNIL)<\/td><\/tr><tr><td>Prospection par e-mail<\/td><td>Particuliers : consentement préalable. Professionnels : information et droit d'opposition<\/td><\/tr><tr><td>Droit à l'image, droit d'auteur<\/td><td>Autorisation de la personne photographiée ; images libres de droits ou achetées<\/td><\/tr><tr><td>Plateformes<\/td><td>Le règlement européen sur les services numériques (DSA) impose aux plateformes de lutter contre les contenus illicites<\/td><\/tr><\/table>","x":"c3 développer la relation client en e-commerce · 2/3 faciliter et sécuriser la vente en ligne assister faciliter l'achat aide · faq, chat, chatbot, téléphone, e-mail suivi · confirmation de commande, suivi de livraison, notifications retours · procédure simple, étiquette fournie, remboursement rapide accessibilité · site lisible sur mobile, parcours simple, peu de clics sécuriser les risques paiement · site en https, authentification forte du client (directive européenne dsp2, ex. 3d secure) fraude · faux paiements, usurpation : contrôles, plafonds, vérifications cyberattaques · mises à jour, mots de passe solides, sauvegardes données · protéger les données clients (rgpd) : accès limités, sécurité le droit de la vente en ligne règle à retenir mentions légales identité de l'éditeur, coordonnées, hébergeur : obligatoires sur tout site (loi pour la confiance dans l'économie numérique, 2004) cgv obligatoires et acceptées avant la commande : prix, livraison, paiement, rétractation, garanties commande récapitulatif avant validation, bouton clair (« commande avec obligation de paiement »), confirmation par e-mail droit de rétractation 14 jours sans motif pour le consommateur livraison dans le délai annoncé ; sans date indiquée, 30 jours maximum garantie légale de conformité 2 ans pour un bien neuf cookies consentement préalable pour les cookies publicitaires ; refuser doit être aussi simple qu'accepter (cnil) prospection par e-mail particuliers : consentement préalable. professionnels : information et droit d'opposition droit à l'image, droit d'auteur autorisation de la personne photographiée ; images libres de droits ou achetées plateformes le règlement européen sur les services numériques (dsa) impose aux plateformes de lutter contre les contenus illicites"},{"t":"Diagnostiquer l'activité e-commerce","h":"<div class=\"row\" style=\"align-items:center;gap:14px\"><div class=\"fG\" style=\"width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#FFFFFF\"><span class=\"bign\">C3<\/span><\/div><div style=\"display:flex;flex-direction:column;gap:2px\"><p class=\"kick mut\">Développer la relation client en e-commerce · 3/3<\/p><h1 style=\"font-size:31px\">Diagnostiquer l'activité e-commerce<\/h1><\/div><\/div><p class=\"mut\">Exemple suivi : 20 000 visites, 400 commandes, 24 000 € de CA, 1 200 paniers créés.<\/p><table class=\"tb\"><tr><th style=\"width:30%\">Indicateur<\/th><th style=\"width:40%\">Calcul<\/th><th>Exemple<\/th><\/tr><tr><td>Taux de conversion<\/td><td>commandes / visites × 100<\/td><td>400 / 20 000 = 2 %<\/td><\/tr><tr><td>Panier moyen<\/td><td>CA / commandes<\/td><td>24 000 / 400 = 60 €<\/td><\/tr><tr><td>Taux d'abandon de panier<\/td><td>(paniers créés − commandes) / paniers créés × 100<\/td><td>(1 200 − 400) / 1 200 = 66,7 %<\/td><\/tr><tr><td>Taux de rebond<\/td><td>visites d'une seule page / visites × 100<\/td><td>Élevé : la page d'arrivée déçoit<\/td><\/tr><tr><td>Pages vues par visite, durée moyenne<\/td><td>pages vues / visites ; temps total / visites<\/td><td>L'intérêt pour le site<\/td><\/tr><tr><td>Coût d'acquisition client<\/td><td>dépenses marketing / nouveaux clients<\/td><td>3 000 / 150 = 20 €<\/td><\/tr><tr><td>Retour sur dépenses publicitaires<\/td><td>CA généré par la pub / coût de la pub<\/td><td>6 000 / 1 500 = 4<\/td><\/tr><tr><td>Taux de réachat<\/td><td>clients ayant acheté plusieurs fois / clients × 100<\/td><td>La fidélité<\/td><\/tr><\/table>\n<div class=\"g2\" style=\"align-items:start\">\n<div class=\"card cG\"><h3>Les sources de trafic<\/h3><div class=\"mini\"><div class=\"def\"><b>Direct<\/b> · le visiteur tape l'adresse : notoriété<\/div><div class=\"def\"><b>Organique<\/b> · moteur de recherche : SEO<\/div><div class=\"def\"><b>Payant<\/b> · annonces : SEA<\/div><div class=\"def\"><b>Référent<\/b> · lien depuis un autre site<\/div><div class=\"def\"><b>Social<\/b> · réseaux sociaux<\/div><div class=\"def\"><b>E-mail<\/b> · newsletters<\/div><\/div><\/div>\n<div class=\"card cG\"><h3>Les indicateurs de l'e-mailing<\/h3><div class=\"mini\"><div class=\"def\"><b>Taux de délivrabilité<\/b> · e-mails reçus / envoyés<\/div><div class=\"def\"><b>Taux d'ouverture<\/b> · ouvertures / e-mails reçus<\/div><div class=\"def\"><b>Taux de clic<\/b> · clics / e-mails reçus<\/div><div class=\"def\"><b>Taux de réactivité<\/b> · clics / ouvertures<\/div><div class=\"def\"><b>Taux de désinscription<\/b> · désinscrits / e-mails reçus<\/div><\/div><\/div>\n<\/div>\n<div class=\"card dark\"><h3>Toujours conclure par un diagnostic<\/h3><p class=\"sm\" style=\"color:#E4E5EE\">Calculer ne suffit pas : identifie l'étape du tunnel qui pose problème, explique la cause probable, puis propose une action précise. Ex. : 66,7 % d'abandon de panier → frais de livraison affichés trop tard ? → les annoncer dès la fiche produit et relancer les paniers abandonnés par e-mail.<\/p><\/div>","x":"c3 développer la relation client en e-commerce · 3/3 diagnostiquer l'activité e-commerce exemple suivi : 20 000 visites, 400 commandes, 24 000 € de ca, 1 200 paniers créés. indicateur calcul exemple taux de conversion commandes / visites × 100 400 / 20 000 = 2 % panier moyen ca / commandes 24 000 / 400 = 60 € taux d'abandon de panier (paniers créés − commandes) / paniers créés × 100 (1 200 − 400) / 1 200 = 66,7 % taux de rebond visites d'une seule page / visites × 100 élevé : la page d'arrivée déçoit pages vues par visite, durée moyenne pages vues / visites ; temps total / visites l'intérêt pour le site coût d'acquisition client dépenses marketing / nouveaux clients 3 000 / 150 = 20 € retour sur dépenses publicitaires ca généré par la pub / coût de la pub 6 000 / 1 500 = 4 taux de réachat clients ayant acheté plusieurs fois / clients × 100 la fidélité les sources de trafic direct · le visiteur tape l'adresse : notoriété organique · moteur de recherche : seo payant · annonces : sea référent · lien depuis un autre site social · réseaux sociaux e-mail · newsletters les indicateurs de l'e-mailing taux de délivrabilité · e-mails reçus / envoyés taux d'ouverture · ouvertures / e-mails reçus taux de clic · clics / e-mails reçus taux de réactivité · clics / ouvertures taux de désinscription · désinscrits / e-mails reçus toujours conclure par un diagnostic calculer ne suffit pas : identifie l'étape du tunnel qui pose problème, explique la cause probable, puis propose une action précise. ex. : 66,7 % d'abandon de panier → frais de livraison affichés trop tard ? → les annoncer dès la fiche produit et relancer les paniers abandonnés par e-mail."},{"t":"Les outils de la partie pratique","h":"<p class=\"kick tO\">Pratique<\/p>\n<h1>Les outils de la partie pratique<\/h1>\n<p class=\"mut\">Les sessions récentes utilisent des CMS (logiciels de gestion de contenu) comme WordPress pour un site ou un blog et PrestaShop pour un site e-commerce. Vérifie avec ton professeur les outils et le contexte de ta session.<\/p>\n<div class=\"g2\" style=\"align-items:start\"><div class=\"card cP\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fP\">Site, blog<\/span><h3>WordPress : savoir faire<\/h3><div class=\"mini\"><div class=\"def\"><b>Contenus<\/b> · créer un article (daté, pour le blog) ou une page (fixe, ex. « À propos »)<\/div><div class=\"def\"><b>Organisation<\/b> · catégories et étiquettes, menus<\/div><div class=\"def\"><b>Médias<\/b> · ajouter une image, remplir le texte alternatif<\/div><div class=\"def\"><b>Référencement<\/b> · titre SEO, meta description, URL (extension SEO)<\/div><div class=\"def\"><b>Interaction<\/b> · modérer les commentaires, ajouter un formulaire de contact<\/div><div class=\"def\"><b>Extensions<\/b> · ajouter des fonctions (ex. formulaire, SEO, partage)<\/div><\/div><\/div><div class=\"card cG\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fG\">E-commerce<\/span><h3>PrestaShop : savoir faire<\/h3><div class=\"mini\"><div class=\"def\"><b>Catalogue<\/b> · créer une catégorie, un produit, ses déclinaisons (taille, couleur), son prix et son stock<\/div><div class=\"def\"><b>Fiche produit<\/b> · description courte et longue, images, référencement<\/div><div class=\"def\"><b>Promotions<\/b> · prix spécifique, règle panier, code de réduction<\/div><div class=\"def\"><b>Clients<\/b> · consulter un compte, des groupes de clients<\/div><div class=\"def\"><b>Commandes<\/b> · suivre, changer un statut, gérer un retour<\/div><div class=\"def\"><b>Statistiques<\/b> · ventes, meilleures ventes, visites<\/div><\/div><\/div><\/div>\n<h2>Les outils autour<\/h2>\n<div class=\"g3\">\n<div class=\"card\"><h3>Analyse d'audience<\/h3><p class=\"sm\">Outils de statistiques web : visites, sources de trafic, pages vues, conversions.<\/p><\/div>\n<div class=\"card\"><h3>E-mailing<\/h3><p class=\"sm\">Créer une newsletter, segmenter la liste, programmer l'envoi, lire les statistiques.<\/p><\/div>\n<div class=\"card\"><h3>CRM et GRC<\/h3><p class=\"sm\">Fiche client, historique, segmentation, relances. Le module GRC d'un PGI partage ces données dans toute l'entreprise.<\/p><\/div>\n<div class=\"card\"><h3>Visuels<\/h3><p class=\"sm\">Retoucher, recadrer, alléger une image ; créer un visuel aux couleurs de la charte.<\/p><\/div>\n<div class=\"card\"><h3>Publication<\/h3><p class=\"sm\">Programmer des posts sur plusieurs réseaux, suivre les statistiques.<\/p><\/div>\n<div class=\"card\"><h3>Hébergement<\/h3><p class=\"sm\">Le site est stocké chez un hébergeur ; un nom de domaine permet de le trouver.<\/p><\/div>\n<\/div>\n<div class=\"card cY\"><h3>La méthode pour chaque tâche<\/h3><p class=\"sm\"><b>Je lis<\/b> la demande · <b>j'annonce<\/b> ce que je vais faire et pourquoi · <b>je le fais<\/b> · <b>je vérifie<\/b> côté visiteur · <b>je justifie<\/b> (cible, objectif, référencement, droit).<\/p><\/div>","x":"pratique les outils de la partie pratique les sessions récentes utilisent des cms (logiciels de gestion de contenu) comme wordpress pour un site ou un blog et prestashop pour un site e-commerce. vérifie avec ton professeur les outils et le contexte de ta session. site, blog wordpress : savoir faire contenus · créer un article (daté, pour le blog) ou une page (fixe, ex. « à propos ») organisation · catégories et étiquettes, menus médias · ajouter une image, remplir le texte alternatif référencement · titre
