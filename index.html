<\/b> · données exactes, complètes, à jour, sans doublon<\/div><div class=\"def\"><b>Segmentation<\/b> · grouper les clients selon leur comportement pour personnaliser (ex. méthode RFM : récence, fréquence, montant)<\/div><div class=\"def\"><b>Valeur client<\/b> · ce qu'un client rapporte sur toute la durée de la relation<\/div><\/div><\/div><div class=\"card cP\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fP\">RGPD<\/span><h3>Protéger les données<\/h3><div class=\"mini\"><div class=\"def\"><b>Finalité<\/b> · collecter pour un but précis et annoncé<\/div><div class=\"def\"><b>Minimisation<\/b> · ne demander que les données utiles<\/div><div class=\"def\"><b>Base légale<\/b> · consentement, contrat, intérêt légitime…<\/div><div class=\"def\"><b>Durée<\/b> · conservation limitée (en prospection, souvent 3 ans après le dernier contact, selon la CNIL)<\/div><div class=\"def\"><b>Droits<\/b> · accès, rectification, effacement, opposition, portabilité<\/div><div class=\"def\"><b>Sécurité<\/b> · protéger contre les fuites ; signaler une violation à la CNIL<\/div><div class=\"def\"><b>Sanction<\/b> · jusqu'à 20 M€ ou 4 % du CA mondial<\/div><\/div><\/div><\/div>\n<h2>Le lexique à maîtriser<\/h2>\n<div class=\"card\"><div class=\"mini\" style=\"columns:2;column-gap:24px\"><div class=\"def\"><b>Persona<\/b> · client type imaginé à partir de données réelles<\/div><div class=\"def\"><b>Lead<\/b> · contact qualifié, intéressé<\/div><div class=\"def\"><b>Landing page<\/b> · page d'atterrissage d'une campagne<\/div><div class=\"def\"><b>CTA<\/b> · appel à l'action<\/div><div class=\"def\"><b>UX<\/b> · expérience utilisateur sur le site<\/div><div class=\"def\"><b>Responsive<\/b> · site adapté à tous les écrans<\/div><div class=\"def\"><b>Retargeting<\/b> · publicité pour les visiteurs déjà venus<\/div><div class=\"def\"><b>Growth hacking<\/b> · techniques rapides et peu coûteuses pour croître<\/div><div class=\"def\"><b>Marketplace<\/b> · place de marché en ligne<\/div><div class=\"def\"><b>Drive-to-store<\/b> · attirer en magasin grâce au digital<\/div><div class=\"def\"><b>Phygital<\/b> · mélange physique et digital<\/div><div class=\"def\"><b>Social selling<\/b> · vendre en s'appuyant sur les réseaux sociaux<\/div><div class=\"def\"><b>Opt-in / opt-out<\/b> · accord préalable / droit de refuser ensuite<\/div><div class=\"def\"><b>Big data<\/b> · très grands volumes de données exploités<\/div><\/div><\/div>","x":"notions données client et lexique digital données connaître le client collecte · formulaires, achats, navigation (cookies), réseaux sociaux, service client, enquêtes types · identité, comportement d'achat, navigation, préférences, satisfaction qualification · données exactes, complètes, à jour, sans doublon segmentation · grouper les clients selon leur comportement pour personnaliser (ex. méthode rfm : récence, fréquence, montant) valeur client · ce qu'un client rapporte sur toute la durée de la relation rgpd protéger les données finalité · collecter pour un but précis et annoncé minimisation · ne demander que les données utiles base légale · consentement, contrat, intérêt légitime… durée · conservation limitée (en prospection, souvent 3 ans après le dernier contact, selon la cnil) droits · accès, rectification, effacement, opposition, portabilité sécurité · protéger contre les fuites ; signaler une violation à la cnil sanction · jusqu'à 20 m€ ou 4 % du ca mondial le lexique à maîtriser persona · client type imaginé à partir de données réelles lead · contact qualifié, intéressé landing page · page d'atterrissage d'une campagne cta · appel à l'action ux · expérience utilisateur sur le site responsive · site adapté à tous les écrans retargeting · publicité pour les visiteurs déjà venus growth hacking · techniques rapides et peu coûteuses pour croître marketplace · place de marché en ligne drive-to-store · attirer en magasin grâce au digital phygital · mélange physique et digital social selling · vendre en s'appuyant sur les réseaux sociaux opt-in / opt-out · accord préalable / droit de refuser ensuite big data · très grands volumes de données exploités"},{"t":"Ton kit minimum et le jour J","h":"<p class=\"kick tB\">Jour J<\/p>\n<h1>Ton kit minimum et le jour J<\/h1>\n<div class=\"g3\">\n<div class=\"card cB\"><span class=\"tag fB\">C1<\/span><p class=\"sm\">Multicanal, cross-canal, omnicanal · outils de la communication unifiée · taux de décroché, DMT, résolution au 1er contact · NPS · motiver et piloter une équipe · temps de travail.<\/p><\/div>\n<div class=\"card cP\"><span class=\"tag fP\">C2<\/span><p class=\"sm\">Inbound · persona · ligne et calendrier éditoriaux · community management · e-réputation et réponse aux avis · SEO, SEA · taux d'engagement.<\/p><\/div>\n<div class=\"card cG\"><span class=\"tag fG\">C3<\/span><p class=\"sm\">Tunnel de conversion · taux de conversion, panier moyen, abandon de panier · leviers pour dynamiser · droit de la vente en ligne · cookies · paiement sécurisé.<\/p><\/div>\n<\/div>\n<div class=\"g2\" style=\"align-items:start\">\n<div class=\"card cY\"><h3>Plan de révision<\/h3>\n<div class=\"sm\" style=\"display:flex;flex-direction:column;gap:7px\">\n<span>☐ Savoir calculer et interpréter tous les indicateurs (pages 05, 08, 12)<\/span>\n<span>☐ Rédiger un post, une réponse à un avis, un e-mail, un script d'appel<\/span>\n<span>☐ Faire 2 sujets d'écrit complets en 3 h (2024, 2025, 2026)<\/span>\n<span>☐ T'entraîner sur le contexte digital de ta session<\/span>\n<span>☐ Savoir créer un produit, une promo, une page, et optimiser le SEO<\/span>\n<span>☐ Connaître les règles RGPD, cookies et vente en ligne<\/span>\n<\/div><\/div>\n<div class=\"card dark\"><h3>Le jour J<\/h3>\n<ol class=\"sm\" style=\"color:#E4E5EE;display:flex;flex-direction:column;gap:5px\">\n<li><b>Écrit<\/b> : lis le contexte et les annexes, puis traite chaque dossier.<\/li>\n<li>Chaque calcul : formule, résultat, interprétation, action.<\/li>\n<li>Chaque production : adaptée au canal et à la cible.<\/li>\n<li><b>Pratique<\/b> : lis tout le sujet avant de commencer.<\/li>\n<li>Commente à voix haute ce que tu fais et pourquoi.<\/li>\n<li>Vérifie le résultat côté visiteur.<\/li>\n<\/ol><\/div>\n<\/div>\n<div class=\"card cP\" style=\"padding:18px 20px\"><p class=\"quote\" style=\"font-size:20px\">Derrière chaque outil, il y a un client : chaque action doit lui simplifier la vie ou lui donner envie d'acheter.<\/p><\/div>\n<div class=\"card\"><h3>Sources vérifiées<\/h3><p class=\"sm mut\">Référentiel du BTS NDRC (France Compétences, RNCP 38368) : définition de l'épreuve E5, compétences et savoirs du bloc 2 · sujets E5 de la session 2025 · circulaire nationale 2022 (CMS de la partie pratique) · CNIL (prospection, cookies) · loi n° 2023-451 du 9 juin 2023 (influence commerciale). Vérifié le 16 novembre 2026.<\/p><\/div>","x":"jour j ton kit minimum et le jour j c1 multicanal, cross-canal, omnicanal · outils de la communication unifiée · taux de décroché, dmt, résolution au 1er contact · nps · motiver et piloter une équipe · temps de travail. c2 inbound · persona · ligne et calendrier éditoriaux · community management · e-réputation et réponse aux avis · seo, sea · taux d'engagement. c3 tunnel de conversion · taux de conversion, panier moyen, abandon de panier · leviers pour dynamiser · droit de la vente en ligne · cookies · paiement sécurisé. plan de révision ☐ savoir calculer et interpréter tous les indicateurs (pages 05, 08, 12) ☐ rédiger un post, une réponse à un avis, un e-mail, un script d'appel ☐ faire 2 sujets d'écrit complets en 3 h (2024, 2025, 2026) ☐ t'entraîner sur le contexte digital de ta session ☐ savoir créer un produit, une promo, une page, et optimiser le seo ☐ connaître les règles rgpd, cookies et vente en ligne le jour j écrit : lis le contexte et les annexes, puis traite chaque dossier. chaque calcul : formule, résultat, interprétation, action. chaque production : adaptée au canal et à la cible. pratique : lis tout le sujet avant de commencer. commente à voix haute ce que tu fais et pourquoi. vérifie le résultat côté visiteur. derrière chaque outil, il y a un client : chaque action doit lui simplifier la vie ou lui donner envie d'acheter. sources vérifiées référentiel du bts ndrc (france compétences, rncp 38368) : définition de l'épreuve e5, compétences et savoirs du bloc 2 · sujets e5 de la session 2025 · circulaire nationale 2022 (cms de la partie pratique) · cnil (prospection, cookies) · loi n° 2023-451 du 9 juin 2023 (influence commerciale). vérifié le 16 novembre 2026."}],"g":[{"n":"Déroulement de l'épreuve","tag":"","e":true,"p":[0,1,2,12,14]},{"n":"La relation omnicanale","tag":"C1","e":false,"p":[3,4,5]},{"n":"La relation client digitale","tag":"C2","e":false,"p":[6,7,8]},{"n":"Le e-commerce","tag":"C3","e":false,"p":[9,10,11]},{"n":"Données client et lexique digital","tag":"","e":false,"p":[13]}],"q":[{"id":"e5q0","q":"La DMT (durée moyenne de traitement) comprend…","o":["seulement le temps d'appel","le temps de communication + le temps de traitement après l'appel","le temps d'attente du client","la durée de la formation"],"a":1,"e":"Elle mesure la productivité des conseillers."},{"id":"e5q1","q":"Le CTI permet…","o":["d'afficher la fiche client quand il appelle","d'envoyer des SMS","de créer un site","de calculer la TVA"],"a":0,"e":"Couplage téléphonie-informatique."},{"id":"e5q2","q":"Un taux de rebond élevé signifie que…","o":["les visiteurs achètent beaucoup","beaucoup de visiteurs quittent le site après une seule page","le site est rapide","les e-mails sont ouverts"],"a":1,"e":"La page d'arrivée déçoit ou ne correspond pas à l'attente."},{"id":"e5q3","q":"Le retargeting consiste à…","o":["recruter des clients en magasin","montrer une pub aux visiteurs partis sans acheter","baisser les prix","changer de cible"],"a":1,"e":"Avec leur consentement aux cookies."},{"id":"e5q4","q":"Un SVI, c'est…","o":["un serveur vocal interactif (« tapez 1… »)","un site de vente internationale","un service de livraison","un indicateur de satisfaction"],"a":0,"e":"Il oriente l'appel vers le bon service."},{"id":"e5q5","q":"Qu'est-ce que la relation omnicanale ?","o":["Un seul canal","Plusieurs canaux séparés","Tous les canaux partagent les données, sans rupture pour le client","Uniquement le téléphone"],"a":2,"e":"Le client passe d'un canal à l'autre sans rupture."},{"id":"e5q6","q":"300 appels reçus, 240 décrochés : taux de décroché ?","o":["60 %","75 %","80 %","90 %"],"a":2,"e":"240 / 300 = 80 %."},{"id":"e5q7","q":"Comment calcule-t-on le NPS ?","o":["% satisfaits","% promoteurs − % détracteurs","Note moyenne sur 10","Nombre d'avis"],"a":1,"e":"Promoteurs (9-10) moins détracteurs (0-6)."},{"id":"e5q8","q":"Que signifie SEO ?","o":["Référencement payant","Référencement naturel","Réseaux sociaux","E-mailing"],"a":1,"e":"Search Engine Optimisation : optimiser le site pour les moteurs."},{"id":"e5q9","q":"En SEA, on paie généralement…","o":["un forfait annuel","au clic","à la vente","rien"],"a":1,"e":"Coût par clic, selon des enchères sur des mots-clés."},{"id":"e5q10","q":"20 000 visites et 400 commandes : taux de conversion ?","o":["0,2 %","2 %","4 %","20 %"],"a":1,"e":"400 / 20 000 = 2 %."},{"id":"e5q11","q":"Taux d'abandon de panier =","o":["paniers / visites","(paniers créés − commandes) / paniers créés × 100","commandes / paniers","visites d'une page / visites"],"a":1,"e":"Ex. : (1 200 − 400) / 1 200 = 66,7 %."},{"id":"e5q12","q":"Quel élément est le titre bleu affiché dans les résultats d'un moteur ?","o":["La meta description","La balise title","Le H2","L'URL"],"a":1,"e":"La balise title, environ 60 caractères, mot-clé au début."},{"id":"e5q13","q":"Pour les cookies publicitaires, la CNIL exige…","o":["rien","un consentement préalable, refuser aussi simple qu'accepter","un simple bandeau d'information","un paiement"],"a":1,"e":"Consentement préalable et refus aussi simple que l'acceptation."},{"id":"e5q14","q":"Prospection par e-mail d'un particulier :","o":["libre","consentement préalable obligatoire","interdite","possible si on propose de se désinscrire"],"a":1,"e":"B2C : opt-in. B2B : information et droit d'opposition."},{"id":"e5q15","q":"Quelle est la durée légale du travail en France ?","o":["32 h","35 h","39 h","48 h"],"a":1,"e":"35 h par semaine ; maximum 10 h par jour et 48 h par semaine."},{"id":"e5q16","q":"L'inbound marketing consiste à…","o":["appeler des prospects","attirer le client avec des contenus utiles","acheter des fichiers","faire du porte-à-porte"],"a":1,"e":"Attirer, convertir, conclure, fidéliser."},{"id":"e5q17","q":"Un persona, c'est…","o":["un influenceur","un portrait fictif mais précis du client type","un logiciel","un avis client"],"a":1,"e":"Âge, besoins, freins, canaux préférés."},{"id":"e5q18","q":"Taux d'engagement =","o":["abonnés / publications","interactions / portée × 100","clics / ventes","portée / impressions"],"a":1,"e":"J'aime, commentaires, partages, clics divisés par la portée."},{"id":"e5q19","q":"Sans date de livraison indiquée, le vendeur en ligne doit livrer sous…","o":["7 jours","14 jours","30 jours","60 jours"],"a":2,"e":"30 jours maximum."},{"id":"e5q20","q":"Le taux de réitération mesure…","o":["les ventes répétées","les clients qui recontactent pour la même demande","les appels sortants","les avis positifs"],"a":1,"e":"Il révèle les problèmes mal réglés au premier contact."},{"id":"e5q21","q":"Le CSAT mesure…","o":["l'effort du client","la satisfaction après un contact","le chiffre d'affaires","le nombre d'abonnés"],"a":1,"e":"« Êtes-vous satisfait ? » noté de 1 à 5."},{"id":"e5q22","q":"Le CES mesure…","o":["l'effort du client pour régler sa demande","le coût d'un client","le taux d'ouverture","la satisfaction des salariés"],"a":0,"e":"Customer Effort Score."},{"id":"e5q23","q":"Le click and collect, c'est…","o":["acheter en magasin et se faire livrer","commander en ligne et retirer en magasin","payer par carte","un chatbot"],"a":1,"e":"Un exemple de parcours cross-canal."},{"id":"e5q24","q":"Le showrooming, c'est…","o":["voir le produit en magasin et l'acheter en ligne","acheter en ligne et retirer en magasin","un salon","une vitrine virtuelle"],"a":0,"e":"L'inverse du web-to-store."},{"id":"e5q25","q":"Longueur conseillée d'une meta description ?","o":["30 caractères","Environ 155 caractères","500 caractères","Sans limite"],"a":1,"e":"Au-delà, le texte est coupé dans les résultats."},{"id":"e5q26","q":"Les backlinks sont…","o":["les liens entre les pages de ton site","des liens d'autres sites vers le tien","des pubs","des cookies"],"a":1,"e":"Des liens entrants de qualité améliorent le SEO."},{"id":"e5q27","q":"À quoi sert le texte alternatif (alt) d'une image ?","o":["À la compresser","À la décrire pour les moteurs et les personnes malvoyantes","À la protéger","À la colorer"],"a":1,"e":"Utile pour le référencement et l'accessibilité."},{"id":"e5q28","q":"Le taux d'ouverture d'un e-mailing se calcule…","o":["clics / ouvertures","ouvertures / e-mails reçus × 100","désinscrits / envoyés","ventes / e-mails"],"a":1,"e":"Le taux de réactivité, lui, = clics / ouvertures."},{"id":"e5q29","q":"L'UGC, c'est…","o":["un logiciel de gestion","le contenu créé par les utilisateurs (avis, photos)","une agence de pub","un indicateur"],"a":1,"e":"Très crédible auprès des autres clients."},{"id":"e5q30","q":"La directive européenne DSP2 impose pour le paiement en ligne…","o":["un paiement en espèces","l'authentification forte du client","la gratuité","un délai de 30 jours"],"a":1,"e":"Ex. : 3D Secure."},{"id":"e5q31","q":"Quelle loi impose les mentions légales sur un site ?","o":["La loi pour la confiance dans l'économie numérique (2004)","Le RGPD","La loi EGalim","La loi Doubin"],"a":0,"e":"Identité de l'éditeur, coordonnées, hébergeur."},{"id":"e5q32","q":"Repos quotidien minimum d'un salarié ?","o":["8 heures","11 heures consécutives","12 heures","24 heures"],"a":1,"e":"Entre deux journées de travail."},{"id":"e5q33","q":"Quand la pause de 20 minutes est-elle obligatoire ?","o":["Dès 4 h de travail","Dès 6 h de travail","Dès 8 h","Jamais"],"a":1,"e":"Règle du Code du travail."},{"id":"e5q34","q":"Depuis la loi du 9 juin 2023, un influenceur payé doit…","o":["ne rien dire","indiquer « publicité » ou « collaboration commerciale »","avoir 1 million d'abonnés","vendre lui-même"],"a":1,"e":"Et signaler les images retouchées ou virtuelles."},{"id":"e5q35","q":"Quel logiciel sert à gérer une boutique e-commerce ?","o":["PrestaShop","Excel","Word","PowerPoint"],"a":0,"e":"WordPress sert plutôt pour un site vitrine ou un blog."}],"r":[{"id":"e5r0","q":"Rédige une réponse publique à cet avis : « Livrée avec 10 jours de retard et personne ne répond au téléphone ! »","p":[{"t":"Remercier pour le retour","k":["merci","remerci"]},{"t":"S'excuser, reconnaître le problème","k":["excus","desole","regret","comprenons"]},{"t":"Proposer une solution ou un contact privé","k":["solution","geste","rembours","code","message prive","contact","e-mail","email"]},{"t":"Inviter à revenir","k":["revenir","a bientot","esperons","prochaine"]}],"m":"« Bonjour Julie, merci d'avoir pris le temps de nous écrire. Nous sommes sincèrement désolés pour ce retard de livraison et pour l'attente au téléphone : ce n'est pas l'expérience que nous voulons vous offrir. Nous vous avons envoyé un message privé pour comprendre ce qui s'est passé et vous proposer un geste commercial. Nous espérons avoir l'occasion de vous satisfaire lors de votre prochaine commande. L'équipe X »"},{"id":"e5r1","q":"Quelle différence entre SEO et SEA ? Quand privilégier l'un ou l'autre ?","p":[{"t":"SEO : référencement naturel, gratuit","k":["naturel","gratuit","organique"]},{"t":"SEA : référencement payant, au clic","k":["payant","clic","annonce","cpc","sponsoris"]},{"t":"SEO pour le long terme","k":["long terme","lent","durable"]},{"t":"SEA pour un résultat rapide","k":["rapide","court terme","lancement","promotion","immediat"]}],"m":"Le SEO (référencement naturel) consiste à optimiser son site pour remonter gratuitement dans les résultats des moteurs : c'est lent mais durable. Le SEA (référencement payant) consiste à acheter des annonces, payées au clic : c'est rapide mais s'arrête dès qu'on ne paie plus. On privilégie le SEA pour un lancement ou une promotion, et on travaille le SEO en continu pour le long terme."},{"id":"e5r2","q":"Un site a reçu 25 000 visites et 500 commandes pour 30 000 € de CA. Calcule le taux de conversion et le panier moyen, puis interprète.","p":[{"t":"Taux de conversion = 2 %","k":["2 %","2%","2 pour"]},{"t":"Panier moyen = 60 €","k":["60"]},{"t":"Une interprétation ou une proposition","k":["ameliorer","augmenter","propos","moyen","faible","bon","correct"]}],"m":"Taux de conversion = 500 / 25 000 × 100 = 2 % : 2 visiteurs sur 100 achètent. Panier moyen = 30 000 / 500 = 60 €. Pour progresser, on peut travailler la conversion (rassurer, simplifier le paiement, relancer les paniers abandonnés) et le panier moyen (ventes complémentaires, livraison offerte dès 70 €)."},{"id":"e5r3","q":"Explique la différence entre multicanal, cross-canal et omnicanal.","p":[{"t":"Multicanal : canaux séparés","k":["separe","independ","isole","plusieurs canaux"]},{"t":"Cross-canal : canaux complémentaires","k":["complet","click and collect","retrait","combin"]},{"t":"Omnicanal : données partagées, sans rupture","k":["partag","donnees","sans rupture","fluide","meme information"]}],"m":"Multicanal : l'entreprise utilise plusieurs canaux (magasin, site, téléphone) qui fonctionnent séparément. Cross-canal : les canaux se complètent dans un même achat, par exemple commander en ligne et retirer en magasin. Omnicanal : tous les canaux partagent les mêmes données, le client passe de l'un à l'autre sans rupture et sans répéter sa demande."},{"id":"e5r4","q":"Propose trois actions pour réduire l'abandon de panier sur un site e-commerce.","p":[{"t":"Afficher tôt les frais et délais de livraison","k":["frais de port","livraison","frais"]},{"t":"Relancer les paniers abandonnés","k":["relance","e-mail","email","rappel"]},{"t":"Simplifier ou sécuriser le paiement","k":["paiement","securi","simplif","etape","compte invite"]},{"t":"Rassurer le client","k":["avis","rassur","retour","garantie","label"]}],"m":"1. Afficher les frais et délais de livraison dès la fiche produit, et proposer la livraison offerte à partir d'un montant. 2. Relancer par e-mail les clients qui ont laissé un panier, parfois avec un petit avantage. 3. Simplifier le paiement : peu d'étapes, achat sans créer de compte, paiement sécurisé et moyens variés, avec des avis clients et une politique de retour visibles pour rassurer."},{"id":"e5r5","q":"Quelles règles faut-il respecter pour envoyer une newsletter à des particuliers ?","p":[{"t":"Leur consentement préalable","k":["consentement","accord","opt-in","opt in"]},{"t":"Un lien de désinscription","k":["desinscri","desabonn","se retirer"]},{"t":"Le RGPD : données utiles et protégées","k":["rgpd","donnees"]},{"t":"Identifier l'expéditeur","k":["identifi","expediteur"]}],"m":"Il faut d'abord obtenir le consentement préalable des particuliers (case non pré-cochée), sauf pour des clients existants et des produits analogues. Chaque envoi doit identifier clairement l'expéditeur et proposer un lien simple de désinscription. Enfin, le RGPD impose de ne collecter que les données utiles, de les protéger et de les conserver pour une durée limitée."},{"id":"e5r6","q":"Comment motiver une équipe de téléconseillers ?","p":[{"t":"Leviers financiers : primes, challenges","k":["prime","challenge"]},{"t":"Reconnaissance","k":["reconnaiss","felicit","valoris"]},{"t":"Formation, coaching, évolution","k":["formation","coaching","evolution","form"]},{"t":"Objectifs clairs et suivi","k":["objectif","smart","suivi","tableau de bord"]}],"m":"On combine des leviers financiers (primes sur objectifs, challenges d'équipe) et non financiers : reconnaissance des réussites, formation et coaching après des écoutes d'appels, perspectives d'évolution, bonne ambiance. Selon Herzberg, la prime évite l'insatisfaction, mais ce sont la reconnaissance et les responsabilités qui motivent. Des objectifs SMART et un suivi régulier donnent du sens au travail."},{"id":"e5r7","q":"Tu dois optimiser le référencement d'une fiche produit. Que remplis-tu ?","p":[{"t":"La balise title","k":["title","titre"]},{"t":"La meta description","k":["meta","description"]},{"t":"Une URL courte avec le mot-clé","k":["url"]},{"t":"Le texte alternatif des images","k":["alt","texte alternatif"]},{"t":"Le mot-clé de la cible","k":["mot-cle","mot cle","mots-cles","mots cles"]}],"m":"Je choisis d'abord le mot-clé que tape la cible. Je remplis ensuite la balise title (mot-clé au début, environ 60 caractères), la meta description (environ 155 caractères, qui donne envie de cliquer), une URL courte avec le mot-clé, un titre H1 unique, une description utile et originale, et le texte alternatif de chaque image."}]},{"k":"e6","n":"Animation de réseaux","s":"E6 · Réseaux","c":"#11916F","p":[{"t":"Vue d'ensemble","h":"<div style=\"display:flex;flex-direction:column;gap:12px;padding-top:8px\">\n<span class=\"tag\" style=\"background:#16182B\">Fiche de révision · Bloc 3 · Épreuve E6<\/span>\n<div style=\"font-family:'Bricolage Grotesque',Inter,sans-serif;font-weight:800;font-size:clamp(34px,11vw,84px);line-height:.92;letter-spacing:-.03em\"><span style=\"color:#11916F\">Relation client<\/span><br><span style=\"color:#F25C2B\">&amp; animation de réseaux<\/span><\/div>\n<p style=\"font-size:17px;line-height:1.45;max-width:640px\">Faire vendre ton offre par d'autres : des distributeurs, des partenaires, des vendeurs à domicile. Tout pour réussir l'oral sur ton dossier.<\/p>\n<\/div>\n<div class=\"g4\">\n<div class=\"card dark\"><span class=\"bign\">Coef. 3<\/span><span class=\"sm\" style=\"color:#D6D8E6\">épreuve orale<\/span><\/div>\n<div class=\"card dark\"><span class=\"bign\">40 min<\/span><span class=\"sm\" style=\"color:#D6D8E6\">maximum, en 2 temps<\/span><\/div>\n<div class=\"card dark\"><span class=\"bign\">3 fiches<\/span><span class=\"sm\" style=\"color:#D6D8E6\">une par type de réseau<\/span><\/div>\n<div class=\"card dark\"><span class=\"bign\">+ 1<\/span><span class=\"sm\" style=\"color:#D6D8E6\">étude réflexive réseau<\/span><\/div>\n<\/div>\n<h2>Les 3 compétences, les 3 réseaux<\/h2>\n<div class=\"g3\">\n<div class=\"card cB\"><span class=\"tag fB\">C1 · Distributeurs<\/span><h3>Implanter et promouvoir l'offre chez des distributeurs<\/h3><p class=\"sm\">Se faire référencer, bien placer ses produits en rayon, animer les points de vente.<\/p><\/div>\n<div class=\"card cG\"><span class=\"tag fG\">C2 · Partenaires<\/span><h3>Développer et piloter un réseau de partenaires<\/h3><p class=\"sm\">Choisir des partenaires, prescripteurs ou apporteurs d'affaires, les animer, évaluer leurs résultats.<\/p><\/div>\n<div class=\"card cO\"><span class=\"tag fO\">C3 · Vente directe<\/span><h3>Créer et animer un réseau de vente directe<\/h3><p class=\"sm\">Vendre à domicile et en réunion, recruter et former des vendeurs indépendants.<\/p><\/div>\n<\/div>\n<div class=\"g2 sm\" style=\"gap:4px 20px\">\n<span><b>02<\/b> · Le déroulement de l'épreuve<\/span><span><b>08<\/b> · C2 : animer et évaluer<\/span>\n<span><b>03<\/b> · Le dossier E6<\/span><span><b>09<\/b> · C3 : la vente directe et son droit<\/span>\n<span><b>04<\/b> · Réseaux et distribution : les bases<\/span><span><b>10<\/b> · C3 : réunions et recrutement<\/span>\n<span><b>05<\/b> · C1 : référencement et négociation<\/span><span><b>11<\/b> · Manager un réseau<\/span>\n<span><b>06<\/b> · C1 : merchandising et animation<\/span><span><b>12<\/b> · Les indicateurs du réseau<\/span>\n<span><b>07<\/b> · C2 : choisir ses partenaires<\/span><span><b>13–14<\/b> · Étude réflexive, kit et jour J<\/span>\n<\/div>","x":"fiche de révision · bloc 3 · épreuve e6 relation client & animation de réseaux faire vendre ton offre par d'autres : des distributeurs, des partenaires, des vendeurs à domicile. tout pour réussir l'oral sur ton dossier. coef. 3 épreuve orale 40 min maximum, en 2 temps 3 fiches une par type de réseau + 1 étude réflexive réseau les 3 compétences, les 3 réseaux c1 · distributeurs implanter et promouvoir l'offre chez des distributeurs se faire référencer, bien placer ses produits en rayon, animer les points de vente. c2 · partenaires développer et piloter un réseau de partenaires choisir des partenaires, prescripteurs ou apporteurs d'affaires, les animer, évaluer leurs résultats. c3 · vente directe créer et animer un réseau de vente directe vendre à domicile et en réunion, recruter et former des vendeurs indépendants. 02 · le déroulement de l'épreuve 08 · c2 : animer et évaluer 03 · le dossier e6 09 · c3 : la vente directe et son droit 04 · réseaux et distribution : les bases 10 · c3 : réunions et recrutement 05 · c1 : référencement et négociation 11 · manager un réseau 06 · c1 : merchandising et animation 12 · les indicateurs du réseau 07 · c2 : choisir ses partenaires 13–14 · étude réflexive, kit et jour j"},{"t":"Comment se passe l'épreuve","h":"<p class=\"kick tO\">L'épreuve<\/p>\n<h1>Le déroulement de l'épreuve<\/h1>\n<p class=\"mut\">L'épreuve évalue ta capacité à analyser un contexte, diagnostiquer un réseau, l'animer et analyser les résultats. Elle donne une place importante aux dimensions juridique, économique et managériale.<\/p>\n<div class=\"card dark\" style=\"gap:10px\"><h3>40 minutes maximum, en 2 temps (même structure en ponctuel et en CCF)<\/h3>\n<div class=\"bar\" style=\"display:flex;height:50px;border-radius:12px;overflow:hidden;font-weight:700;font-size:12.5px\">\n<div class=\"fG\" style=\"flex:15;display:flex;align-items:center;padding-left:12px;color:#FFFFFF\">1 · Expérience réelle · 15 min<\/div>\n<div class=\"fO\" style=\"flex:25;display:flex;align-items:center;padding-left:12px;color:#16182B\">2 · Autres expériences et étude réflexive · 25 min<\/div>\n<\/div>\n<div class=\"g2 sm\" style=\"color:#E4E5EE\"><span><b>Temps 1<\/b> : tu présentes une expérience réelle vécue dans un réseau, de ton choix (10 min max), puis entretien avec le jury (5 min max).<\/span><span><b>Temps 2<\/b> : tu présentes brièvement tes autres expériences, le jury approfondit ; puis tu exposes ton étude réflexive (5 min), suivie de questions.<\/span><\/div>\n<\/div>\n<div class=\"g2\">\n<div class=\"card\"><h3>En ponctuel<\/h3><ul class=\"sm\"><li>Jury de 2 personnes : un professeur du bloc 3 et un professionnel.<\/li><li>Tu peux utiliser les supports de ton choix pour présenter (diaporama, documents, tablette).<\/li><\/ul><\/div>\n<div class=\"card\"><h3>En CCF<\/h3><ul class=\"sm\"><li>2 situations pendant la 2e année : <b>A<\/b> (expérience réelle, 15 min) et <b>B<\/b> (autres expériences et étude réflexive, 25 min).<\/li><li>Évalué par ton professeur du bloc 3.<\/li><\/ul><\/div>\n<\/div>\n<div class=\"card cY\"><h3>À retenir<\/h3><p class=\"sm\">Seule ta <b>prestation orale<\/b> est notée, pas le dossier. Mais un dossier non conforme (non déposé, en retard, stage trop court, attestation manquante) rend l'épreuve non valide.<\/p><\/div>\n<h2>Ce que le jury regarde<\/h2>\n<table class=\"tb\"><tr><th style=\"width:22%\">Réseau<\/th><th>Critères de la grille<\/th><\/tr><tr><td><span class='tB'>Distributeurs<\/span><\/td><td>Suivi rigoureux des accords de référencement, techniques d'implantation et de mise en valeur pertinentes, repérage des opportunités, qualité du diagnostic (rayon, réseau, zone), propositions pour développer la présence de la marque<\/td><\/tr><tr><td><span class='tG'>Partenaires<\/span><\/td><td>Sélection pertinente des partenaires, actions d'animation efficaces et rentables<\/td><\/tr><tr><td><span class='tO'>Vente directe<\/span><\/td><td>Développement du fichier de conseillers, professionnalisme en réunion, recrutement et formation efficaces, animation cohérente avec la stratégie, respect de la réglementation et de l'éthique<\/td><\/tr><\/table>","x":"l'épreuve le déroulement de l'épreuve l'épreuve évalue ta capacité à analyser un contexte, diagnostiquer un réseau, l'animer et analyser les résultats. elle donne une place importante aux dimensions juridique, économique et managériale. 40 minutes maximum, en 2 temps (même structure en ponctuel et en ccf) 1 · expérience réelle · 15 min 2 · autres expériences et étude réflexive · 25 min temps 1 : tu présentes une expérience réelle vécue dans un réseau, de ton choix (10 min max), puis entretien avec le jury (5 min max). temps 2 : tu présentes brièvement tes autres expériences, le jury approfondit ; puis tu exposes ton étude réflexive (5 min), suivie de questions. en ponctuel jury de 2 personnes : un professeur du bloc 3 et un professionnel. tu peux utiliser les supports de ton choix pour présenter (diaporama, documents, tablette). en ccf 2 situations pendant la 2e année : a (expérience réelle, 15 min) et b (autres expériences et étude réflexive, 25 min). évalué par ton professeur du bloc 3. à retenir seule ta prestation orale est notée, pas le dossier. mais un dossier non conforme (non déposé, en retard, stage trop court, attestation manquante) rend l'épreuve non valide. ce que le jury regarde réseau critères de la grille distributeurs suivi rigoureux des accords de référencement, techniques d'implantation et de mise en valeur pertinentes, repérage des opportunités, qualité du diagnostic (rayon, réseau, zone), propositions pour développer la présence de la marque partenaires sélection pertinente des partenaires, actions d'animation efficaces et rentables vente directe développement du fichier de conseillers, professionnalisme en réunion, recrutement et formation efficaces, animation cohérente avec la stratégie, respect de la réglementation et de l'éthique"},{"t":"Réussir son dossier E6","h":"<p class=\"kick tO\">L'épreuve<\/p>\n<h1>Réussir son dossier E6<\/h1>\n<div class=\"g4\">\n<div class=\"card cB\"><span class=\"tag fB\">Fiche 1<\/span><h3>Réseau de distributeurs<\/h3><\/div>\n<div class=\"card cG\"><span class=\"tag fG\">Fiche 2<\/span><h3>Réseau de partenaires<\/h3><\/div>\n<div class=\"card cO\"><span class=\"tag fO\">Fiche 3<\/span><h3>Réseau de vente directe<\/h3><\/div>\n<div class=\"card cP\"><span class=\"tag fP\">Étude<\/span><h3>Étude réflexive réseau<\/h3><\/div>\n<\/div>\n<div class=\"g2\" style=\"align-items:start\">\n<div class=\"card\"><h3>Les 3 fiches descriptives<\/h3><ul class=\"sm\"><li>Une par type de réseau, sur le modèle national, avec toutes les rubriques remplies.<\/li><li><b>Au moins une<\/b> décrit une expérience réelle que tu as vécue dans un réseau.<\/li><li>Chacune présente : le contexte, le diagnostic, les animations, les méthodes, les résultats et tes préconisations.<\/li><li>Plus les attestations de stage ou certificats de travail.<\/li><\/ul><\/div>\n<div class=\"card\"><h3>L'étude réflexive réseau<\/h3><ul class=\"sm\"><li>Un écrit de 2 pages recto-verso maximum.<\/li><li>Sur un thème qui concerne les réseaux en général (transversal au pôle 3).<\/li><li>Elle mobilise les dimensions <b>juridique, économique et managériale<\/b>.<\/li><li>Tu l'exposes en 5 minutes à l'oral. Méthode et thèmes : page 13.<\/li><\/ul><\/div>\n<\/div>\n<div class=\"card cY\"><h3>Ce qui ne rend pas le dossier non valide, mais coûte des points<\/h3><p class=\"sm\">Une fiche incomplète ou absente, pas d'étude réflexive, deux fiches du même type de réseau, une fiche hors sujet, une présentation non respectée. Le jury t'interroge quand même, mais te pénalise.<\/p><\/div>\n<p class=\"sm mut\">Vérifie avec ton professeur le modèle de fiche et les exigences de la circulaire de ta session (ex. Île-de-France 2026 : dépôt sur Cyclades début avril).<\/p>\n<h2>Les conseils qui font la différence<\/h2>\n<div class=\"g2\">\n<div class=\"card\"><ul class=\"sm\"><li><b>Chiffre tout<\/b> : CA, nombre de points de vente, taux de référencement, coût de l'animation, résultats.<\/li><li><b>Fais un vrai diagnostic<\/b> avant chaque action : où en était le réseau ?<\/li><li><b>Termine par des préconisations<\/b> concrètes et justifiées.<\/li><\/ul><\/div>\n<div class=\"card\"><ul class=\"sm\"><li><b>Maîtrise le droit<\/b> de chaque réseau : contrats, statuts, règles de la vente directe.<\/li><li><b>Prépare ton expérience réelle<\/b> comme une présentation de 10 min, avec un support.<\/li><li><b>Sois honnête<\/b> si une activité est simulée ou observée.<\/li><\/ul><\/div>\n<\/div>","x":"l'épreuve réussir son dossier e6 fiche 1 réseau de distributeurs fiche 2 réseau de partenaires fiche 3 réseau de vente directe étude étude réflexive réseau les 3 fiches descriptives une par type de réseau, sur le modèle national, avec toutes les rubriques remplies. au moins une décrit une expérience réelle que tu as vécue dans un réseau. chacune présente : le contexte, le diagnostic, les animations, les méthodes, les résultats et tes préconisations. plus les attestations de stage ou certificats de travail. l'étude réflexive réseau un écrit de 2 pages recto-verso maximum. sur un thème qui concerne les réseaux en général (transversal au pôle 3). elle mobilise les dimensions juridique, économique et managériale . tu l'exposes en 5 minutes à l'oral. méthode et thèmes : page 13. ce qui ne rend pas le dossier non valide, mais coûte des points une fiche incomplète ou absente, pas d'étude réflexive, deux fiches du même type de réseau, une fiche hors sujet, une présentation non respectée. le jury t'interroge quand même, mais te pénalise. vérifie avec ton professeur le modèle de fiche et les exigences de la circulaire de ta session (ex. île-de-france 2026 : dépôt sur cyclades début avril). les conseils qui font la différence chiffre tout : ca, nombre de points de vente, taux de référencement, coût de l'animation, résultats. fais un vrai diagnostic avant chaque action : où en était le réseau ? termine par des préconisations concrètes et justifiées. maîtrise le droit de chaque réseau : contrats, statuts, règles de la vente directe. prépare ton expérience réelle comme une présentation de 10 min, avec un support. sois honnête si une activité est simulée ou observée."},{"t":"Réseaux et distribution : les bases","h":"<p class=\"kick tO\">Les bases<\/p>\n<h1>Réseaux et distribution : les bases<\/h1>\n<div class=\"card\" style=\"gap:8px\"><h3>Les circuits de distribution<\/h3>\n<div class=\"g3\" style=\"gap:8px\"><div class=\"card cB\" style=\"padding:10px\"><b>Direct<\/b><span class=\"mini\">producteur → consommateur (vente à domicile, en ligne, au magasin d'usine)<\/span><\/div><div class=\"card cB\" style=\"padding:10px\"><b>Court<\/b><span class=\"mini\">producteur → détaillant → consommateur (grande distribution)<\/span><\/div><div class=\"card cB\" style=\"padding:10px\"><b>Long<\/b><span class=\"mini\">producteur → grossiste → détaillant → consommateur<\/span><\/div><\/div><\/div>\n<div class=\"g2\" style=\"align-items:start\"><div class=\"card cB\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fB\">Commerce<\/span><h3>Les formes de commerce<\/h3><div class=\"mini\"><div class=\"def\"><b>Intégré<\/b> · l'enseigne possède ses magasins et sa centrale d'achat (succursales)<\/div><div class=\"def\"><b>Associé<\/b> · des commerçants indépendants se regroupent (coopératives, groupements)<\/div><div class=\"def\"><b>Indépendant<\/b> · un commerçant seul, sans enseigne<\/div><div class=\"def\"><b>Franchise<\/b> · un indépendant utilise la marque et le savoir-faire d'un franchiseur<\/div><div class=\"def\"><b>Grande distribution<\/b> · hypermarchés, supermarchés, proximité, hard discount, drive ; des centrales d'achat négocient pour tous les magasins<\/div><\/div><\/div><div class=\"card cP\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fP\">Statuts<\/span><h3>Qui vend pour l'entreprise ?<\/h3><div class=\"mini\"><div class=\"def\"><b>Commercial salarié<\/b> · lien de subordination, salaire fixe et variable<\/div><div class=\"def\"><b>VRP<\/b> · salarié au statut particulier ; à la fin du contrat, il peut avoir droit à une indemnité de clientèle<\/div><div class=\"def\"><b>Agent commercial<\/b> · indépendant, mandataire : il négocie au nom de l'entreprise, payé à la commission ; indemnité en fin de contrat<\/div><div class=\"def\"><b>Apporteur d'affaires<\/b> · indépendant qui met en relation, payé à la commission<\/div><div class=\"def\"><b>VDI<\/b> · vendeur à domicile indépendant : page 09<\/div><\/div><\/div><\/div>\n<div class=\"card dark\"><h3>Pourquoi passer par un réseau ?<\/h3><div class=\"g3 sm\" style=\"color:#E4E5EE;gap:8px\"><span><b>Couverture<\/b> : être présent partout sans tout gérer soi-même.<\/span><span><b>Coûts<\/b> : partager les coûts de vente et de stockage.<\/span><span><b>Compétences<\/b> : profiter de la connaissance locale et de la relation client des partenaires.<\/span><\/div><\/div>\n<p class=\"sm\"><b>Le défi<\/b> : on ne commande pas un partenaire indépendant comme un salarié. Il faut le convaincre, le motiver et le fidéliser : c'est tout l'art de l'animation de réseau.<\/p>","x":"les bases réseaux et distribution : les bases les circuits de distribution direct producteur → consommateur (vente à domicile, en ligne, au magasin d'usine) court producteur → détaillant → consommateur (grande distribution) long producteur → grossiste → détaillant → consommateur commerce les formes de commerce intégré · l'enseigne possède ses magasins et sa centrale d'achat (succursales) associé · des commerçants indépendants se regroupent (coopératives, groupements) indépendant · un commerçant seul, sans enseigne franchise · un indépendant utilise la marque et le savoir-faire d'un franchiseur grande distribution · hypermarchés, supermarchés, proximité, hard discount, drive ; des centrales d'achat négocient pour tous les magasins statuts qui vend pour l'entreprise ? commercial salarié · lien de subordination, salaire fixe et variable vrp · salarié au statut particulier ; à la fin du contrat, il peut avoir droit à une indemnité de clientèle agent commercial · indépendant, mandataire : il négocie au nom de l'entreprise, payé à la commission ; indemnité en fin de contrat apporteur d'affaires · indépendant qui met en relation, payé à la commission vdi · vendeur à domicile indépendant : page 09 pourquoi passer par un réseau ? couverture : être présent partout sans tout gérer soi-même. coûts : partager les coûts de vente et de stockage. compétences : profiter de la connaissance locale et de la relation client des partenaires. le défi : on ne commande pas un partenaire indépendant comme un salarié. il faut le convaincre, le motiver et le fidéliser : c'est tout l'art de l'animation de réseau."},{"t":"Se faire référencer et négocier","h":"<div class=\"row\" style=\"align-items:center;gap:14px\"><div class=\"fB\" style=\"width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#FFFFFF\"><span class=\"bign\">C1<\/span><\/div><div style=\"display:flex;flex-direction:column;gap:2px\"><p class=\"kick mut\">Distributeurs · 1/2<\/p><h1 style=\"font-size:31px\">Se faire référencer et négocier<\/h1><\/div><\/div>\n<div class=\"card cB\" style=\"gap:8px\"><h3>Le référencement : entrer dans l'assortiment d'un distributeur<\/h3>\n<div style=\"display:flex;gap:6px;flex-wrap:wrap;font-size:12.5px;font-weight:700\"><span class=\"chip\">Prospecter la centrale d'achat ou le magasin<\/span><span>→<\/span><span class=\"chip\">Présenter l'offre<\/span><span>→<\/span><span class=\"chip\">Négocier les conditions<\/span><span>→<\/span><span class=\"chip\">Signer l'accord<\/span><span>→<\/span><span class=\"chip\">Suivre l'application en magasin<\/span><\/div>\n<p class=\"sm\">Référencé au niveau national ne veut pas dire présent partout : le commercial doit aller dans chaque magasin pour obtenir et vérifier l'implantation. À l'inverse, un produit qui ne se vend pas peut être <b>déréférencé<\/b>.<\/p><\/div>\n<div class=\"g2\" style=\"align-items:start\"><div class=\"card cB\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fB\">Négocier<\/span><h3>Avec un distributeur<\/h3><div class=\"mini\"><div class=\"def\"><b>Les acteurs<\/b> · acheteur de la centrale, chef de rayon, directeur de magasin : chacun a ses objectifs (marge, rotation, image)<\/div><div class=\"def\"><b>Ce qu'on négocie<\/b> · prix et remises, place et taille en rayon, promotions, animations, délais de livraison et de paiement<\/div><div class=\"def\"><b>Arguments<\/b> · rotation du produit, marge pour le distributeur, notoriété, publicité nationale, nouveauté, attentes des clients<\/div><div class=\"def\"><b>Trade marketing<\/b> · l'industriel et le distributeur travaillent ensemble pour vendre plus (données, promotions communes)<\/div><div class=\"def\"><b>Category management<\/b> · gérer un rayon comme une catégorie de produits qui répond à un besoin client<\/div><\/div><\/div><div class=\"card cP\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fP\">Droit<\/span><h3>La relation avec un distributeur<\/h3><div class=\"mini\"><div class=\"def\"><b>CGV<\/b> · le socle de la négociation commerciale<\/div><div class=\"def\"><b>Convention unique annuelle<\/b> · accord écrit entre fournisseur et distributeur, à signer avant le 1er mars<\/div><div class=\"def\"><b>Délais de paiement<\/b> · 60 jours après la facture, ou 45 jours fin de mois (cas général)<\/div><div class=\"def\"><b>Pratiques interdites<\/b> · déséquilibre significatif, avantage sans contrepartie, rupture brutale d'une relation établie, revente à perte<\/div><div class=\"def\"><b>Produits alimentaires<\/b> · les lois EGalim encadrent la négociation et les promotions<\/div><\/div><\/div><\/div>\n<div class=\"card cY\"><h3>Le diagnostic que le jury attend<\/h3><p class=\"sm\">Avant toute proposition : analyse du <b>rayon<\/b> (place, concurrents, prix, ruptures), du <b>réseau<\/b> (nombre de magasins où tu es référencé, taux de présence) et de la <b>zone<\/b> (potentiel, magasins non encore démarchés).<\/p><\/div>","x":"c1 distributeurs · 1/2 se faire référencer et négocier le référencement : entrer dans l'assortiment d'un distributeur prospecter la centrale d'achat ou le magasin → présenter l'offre → négocier les conditions → signer l'accord → suivre l'application en magasin référencé au niveau national ne veut pas dire présent partout : le commercial doit aller dans chaque magasin pour obtenir et vérifier l'implantation. à l'inverse, un produit qui ne se vend pas peut être déréférencé . négocier avec un distributeur les acteurs · acheteur de la centrale, chef de rayon, directeur de magasin : chacun a ses objectifs (marge, rotation, image) ce qu'on négocie · prix et remises, place et taille en rayon, promotions, animations, délais de livraison et de paiement arguments · rotation du produit, marge pour le distributeur, notoriété, publicité nationale, nouveauté, attentes des clients trade marketing · l'industriel et le distributeur travaillent ensemble pour vendre plus (données, promotions communes) category management · gérer un rayon comme une catégorie de produits qui répond à un besoin client droit la relation avec un distributeur cgv · le socle de la négociation commerciale convention unique annuelle · accord écrit entre fournisseur et distributeur, à signer avant le 1er mars délais de paiement · 60 jours après la facture, ou 45 jours fin de mois (cas général) pratiques interdites · déséquilibre significatif, avantage sans contrepartie, rupture brutale d'une relation établie, revente à perte produits alimentaires · les lois egalim encadrent la négociation et les promotions le diagnostic que le jury attend avant toute proposition : analyse du rayon (place, concurrents, prix, ruptures), du réseau (nombre de magasins où tu es référencé, taux de présence) et de la zone (potentiel, magasins non encore démarchés)."},{"t":"Merchandising et animation en magasin","h":"<div class=\"row\" style=\"align-items:center;gap:14px\"><div class=\"fB\" style=\"width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#FFFFFF\"><span class=\"bign\">C1<\/span><\/div><div style=\"display:flex;flex-direction:column;gap:2px\"><p class=\"kick mut\">Distributeurs · 2/2<\/p><h1 style=\"font-size:31px\">Merchandising et animation en magasin<\/h1><\/div><\/div>\n<div class=\"g3\">\n<div class=\"card cB\"><h3>D'organisation<\/h3><p class=\"sm\">Organiser le rayon pour que le client trouve facilement : par marque, par usage, par prix.<\/p><\/div>\n<div class=\"card cB\"><h3>De séduction<\/h3><p class=\"sm\">Rendre le rayon attractif : PLV (publicité sur le lieu de vente), éclairage, mise en scène, théâtralisation.<\/p><\/div>\n<div class=\"card cB\"><h3>De gestion<\/h3><p class=\"sm\">Rentabiliser chaque mètre de linéaire : donner plus de place à ce qui se vend.<\/p><\/div>\n<\/div>\n<div class=\"g2\" style=\"align-items:start\">\n<div class=\"card cB\" style=\"gap:8px\"><h3>Les niveaux de présentation<\/h3>\n<div style=\"display:flex;flex-direction:column;gap:4px;font-size:12.5px\">\n<div style=\"background:#C9D4FA;border-radius:8px;padding:6px 10px\"><b>Chapeau<\/b> · stock, produits peu demandés<\/div>\n<div style=\"background:#2F5BEA;color:#FFFFFF;border-radius:8px;padding:6px 10px\"><b>Yeux<\/b> · le meilleur niveau : produits à forte marge, nouveautés<\/div>\n<div style=\"background:#6F86E8;color:#FFFFFF;border-radius:8px;padding:6px 10px\"><b>Mains<\/b> · très bon niveau : produits d'achat courant<\/div>\n<div style=\"background:#C9D4FA;border-radius:8px;padding:6px 10px\"><b>Sol<\/b> · produits lourds, achats réfléchis<\/div>\n<\/div>\n<p class=\"sm\"><b>Présentation verticale<\/b> (une marque sur plusieurs niveaux) ou <b>horizontale<\/b> (une marque sur un niveau). Emplacements forts : tête de gondole, îlot, zone de caisse.<\/p><\/div>\n<div class=\"card cB\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fB\">Animer<\/span><h3>Les actions en point de vente<\/h3><div class=\"mini\"><div class=\"def\"><b>Animations<\/b> · démonstration, dégustation, jeu, animateur ou animatrice<\/div><div class=\"def\"><b>Promotions<\/b> · réduction immédiate, lot, produit en plus, offre de remboursement, carte de fidélité<\/div><div class=\"def\"><b>Supports<\/b> · PLV, stop-rayon, présentoir, affiche, écran<\/div><div class=\"def\"><b>Former le personnel<\/b> · expliquer le produit aux vendeurs du magasin<\/div><div class=\"def\"><b>Expérience de consommation<\/b> · conseiller le distributeur pour que l'achat soit agréable et facile<\/div><\/div><\/div><\/div>\n<h2>Les calculs du linéaire<\/h2>\n<table class=\"tb\"><tr><th style=\"width:26%\">Notion<\/th><th style=\"width:44%\">Calcul ou définition<\/th><th>Exemple<\/th><\/tr><tr><td>Linéaire au sol<\/td><td>longueur du rayon, mesurée au sol<\/td><td>4 m<\/td><\/tr><tr><td>Linéaire développé<\/td><td>linéaire au sol × nombre de niveaux<\/td><td>4 × 5 = 20 m<\/td><\/tr><tr><td>Facing<\/td><td>nombre de produits identiques visibles de face<\/td><td>3 facings<\/td><\/tr><tr><td>Part de linéaire<\/td><td>linéaire du produit / linéaire du rayon × 100<\/td><td>2 / 20 = 10 %<\/td><\/tr><tr><td>Rentabilité du linéaire<\/td><td>CA (ou marge) / mètres de linéaire<\/td><td>6 000 € / 2 m = 3 000 € par mètre<\/td><\/tr><tr><td>Règle d'équilibre<\/td><td>la part de linéaire devrait suivre la part de ventes<\/td><td>10 % des ventes → environ 10 % du linéaire<\/td><\/tr><\/table>","x":"c1 distributeurs · 2/2 merchandising et animation en magasin d'organisation organiser le rayon pour que le client trouve facilement : par marque, par usage, par prix. de séduction rendre le rayon attractif : plv (publicité sur le lieu de vente), éclairage, mise en scène, théâtralisation. de gestion rentabiliser chaque mètre de linéaire : donner plus de place à ce qui se vend. les niveaux de présentation chapeau · stock, produits peu demandés yeux · le meilleur niveau : produits à forte marge, nouveautés mains · très bon niveau : produits d'achat courant sol · produits lourds, achats réfléchis présentation verticale (une marque sur plusieurs niveaux) ou horizontale (une marque sur un niveau). emplacements forts : tête de gondole, îlot, zone de caisse. animer les actions en point de vente animations · démonstration, dégustation, jeu, animateur ou animatrice promotions · réduction immédiate, lot, produit en plus, offre de remboursement, carte de fidélité supports · plv, stop-rayon, présentoir, affiche, écran former le personnel · expliquer le produit aux vendeurs du magasin expérience de consommation · conseiller le distributeur pour que l'achat soit agréable et facile les calculs du linéaire notion calcul ou définition exemple linéaire au sol longueur du rayon, mesurée au sol 4 m linéaire développé linéaire au sol × nombre de niveaux 4 × 5 = 20 m facing nombre de produits identiques visibles de face 3 facings part de linéaire linéaire du produit / linéaire du rayon × 100 2 / 20 = 10 % rentabilité du linéaire ca (ou marge) / mètres de linéaire 6 000 € / 2 m = 3 000 € par mètre règle d'équilibre la part de linéaire devrait suivre la part de ventes 10 % des ventes → environ 10 % du linéaire"},{"t":"Choisir ses partenaires et ses contrats","h":"<div class=\"row\" style=\"align-items:center;gap:14px\"><div class=\"fG\" style=\"width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#FFFFFF\"><span class=\"bign\">C2<\/span><\/div><div style=\"display:flex;flex-direction:column;gap:2px\"><p class=\"kick mut\">Partenaires · 1/2<\/p><h1 style=\"font-size:31px\">Choisir ses partenaires et ses contrats<\/h1><\/div><\/div><p class=\"mut\">Partenaires, prescripteurs, apporteurs d'affaires : des acteurs indépendants qui recommandent ou vendent ton offre.<\/p>\n<div class=\"g2\" style=\"align-items:start\"><div class=\"card cG\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fG\">Qui ?<\/span><h3>Les types de partenaires<\/h3><div class=\"mini\"><div class=\"def\"><b>Prescripteur<\/b> · recommande sans vendre (architecte, médecin, influenceur, expert-comptable)<\/div><div class=\"def\"><b>Apporteur d'affaires<\/b> · met en relation contre une commission<\/div><div class=\"def\"><b>Revendeur, distributeur agréé<\/b> · vend tes produits<\/div><div class=\"def\"><b>Franchisé, concessionnaire<\/b> · vend sous ta marque, avec tes méthodes<\/div><div class=\"def\"><b>Partenaire de co-marquage<\/b> · une autre marque avec qui faire une offre commune<\/div><\/div><\/div><div class=\"card cG\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fG\">Sélectionner<\/span><h3>Les critères<\/h3><div class=\"mini\"><div class=\"def\"><b>Cohérence<\/b> · image, valeurs et clientèle compatibles avec ta marque<\/div><div class=\"def\"><b>Compétences<\/b> · savoir-faire technique et commercial<\/div><div class=\"def\"><b>Zone<\/b> · couverture géographique, potentiel de clientèle<\/div><div class=\"def\"><b>Solidité<\/b> · santé financière, réputation<\/div><div class=\"def\"><b>Motivation<\/b> · envie de s'engager, disponibilité<\/div><\/div><\/div><\/div>\n<h2>Les contrats à connaître<\/h2>\n<table class=\"tb\"><tr><th style=\"width:20%\">Contrat<\/th><th style=\"width:42%\">Principe<\/th><th>À retenir<\/th><\/tr><tr><td>Franchise<\/td><td>Le franchisé utilise la marque, le savoir-faire et reçoit l'assistance du franchiseur, contre un droit d'entrée et des redevances<\/td><td>Le franchiseur doit remettre un document d'information précontractuelle au moins 20 jours avant la signature (loi Doubin)<\/td><\/tr><tr><td>Concession<\/td><td>Le concessionnaire a l'exclusivité de la vente sur un territoire et s'engage à acheter au concédant<\/td><td>Fréquent dans l'automobile<\/td><\/tr><tr><td>Distribution sélective<\/td><td>Le fabricant choisit ses revendeurs selon des critères (qualité du magasin, conseil)<\/td><td>Luxe, parfumerie, électronique haut de gamme<\/td><\/tr><tr><td>Agent commercial<\/td><td>Mandataire indépendant qui négocie au nom de l'entreprise<\/td><td>Payé à la commission ; indemnité à la fin du contrat<\/td><\/tr><tr><td>Apport d'affaires<\/td><td>Mise en relation, sans pouvoir de signer<\/td><td>Commission prévue au contrat<\/td><\/tr><tr><td>Partenariat, co-marquage<\/td><td>Deux entreprises s'associent pour une offre ou une communication<\/td><td>Bien définir les apports et le partage des résultats<\/td><\/tr><\/table>\n<div class=\"card cY\"><h3>Les clauses utiles dans un contrat de partenariat<\/h3><p class=\"sm\">Objet et durée · territoire et exclusivité · objectifs · rémunération et commissions · obligations de chacun (formation, information, image) · confidentialité · non-concurrence · conditions de rupture.<\/p><\/div>","x":"c2 partenaires · 1/2 choisir ses partenaires et ses contrats partenaires, prescripteurs, apporteurs d'affaires : des acteurs indépendants qui recommandent ou vendent ton offre. qui ? les types de partenaires prescripteur · recommande sans vendre (architecte, médecin, influenceur, expert-comptable) apporteur d'affaires · met en relation contre une commission revendeur, distributeur agréé · vend tes produits franchisé, concessionnaire · vend sous ta marque, avec tes méthodes partenaire de co-marquage · une autre marque avec qui faire une offre commune sélectionner les critères cohérence · image, valeurs et clientèle compatibles avec ta marque compétences · savoir-faire technique et commercial zone · couverture géographique, potentiel de clientèle solidité · santé financière, réputation motivation · envie de s'engager, disponibilité les contrats à connaître contrat principe à retenir franchise le franchisé utilise la marque, le savoir-faire et reçoit l'assistance du franchiseur, contre un droit d'entrée et des redevances le franchiseur doit remettre un document d'information précontractuelle au moins 20 jours avant la signature (loi doubin) concession le concessionnaire a l'exclusivité de la vente sur un territoire et s'engage à acheter au concédant fréquent dans l'automobile distribution sélective le fabricant choisit ses revendeurs selon des critères (qualité du magasin, conseil) luxe, parfumerie, électronique haut de gamme agent commercial mandataire indépendant qui négocie au nom de l'entreprise payé à la commission ; indemnité à la fin du contrat apport d'affaires mise en relation, sans pouvoir de signer commission prévue au contrat partenariat, co-marquage deux entreprises s'associent pour une offre ou une communication bien définir les apports et le partage des résultats les clauses utiles dans un contrat de partenariat objet et durée · territoire et exclusivité · objectifs · rémunération et commissions · obligations de chacun (formation, information, image) · confidentialité · non-concurrence · conditions de rupture."},{"t":"Animer, stimuler, évaluer le réseau","h":"<div class=\"row\" style=\"align-items:center;gap:14px\"><div class=\"fG\" style=\"width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#FFFFFF\"><span class=\"bign\">C2<\/span><\/div><div style=\"display:flex;flex-direction:column;gap:2px\"><p class=\"kick mut\">Partenaires · 2/2<\/p><h1 style=\"font-size:31px\">Animer, stimuler, évaluer le réseau<\/h1><\/div><\/div><div class=\"g4\"><div class=\"step\"><span class=\"bign tG\" style=\"font-size:24px\">1<\/span><b>Informer<\/b><span>Nouveautés, argumentaires, prix, outils : extranet, newsletter, application.<\/span><\/div><div class=\"step\"><span class=\"bign tG\" style=\"font-size:24px\">2<\/span><b>Former<\/b><span>Sessions produits, techniques de vente, webinaires, visites.<\/span><\/div><div class=\"step\"><span class=\"bign tG\" style=\"font-size:24px\">3<\/span><b>Stimuler<\/b><span>Challenges, primes, commissions, cadeaux, voyages, classement.<\/span><\/div><div class=\"step\"><span class=\"bign tG\" style=\"font-size:24px\">4<\/span><b>Fédérer<\/b><span>Conventions, réunions, club partenaires, reconnaissance.<\/span><\/div><\/div>\n<div class=\"g2\" style=\"align-items:start\"><div class=\"card cG\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fG\">Outils<\/span><h3>Pour animer à distance<\/h3><div class=\"mini\"><div class=\"def\"><b>Extranet ou portail partenaires<\/b> · documents, commandes, suivi des affaires<\/div><div class=\"def\"><b>CRM partagé<\/b> · suivre les contacts apportés par chaque partenaire<\/div><div class=\"def\"><b>Réseaux sociaux, groupes privés<\/b> · échanger, partager les réussites<\/div><div class=\"def\"><b>Kits de vente<\/b> · argumentaires, PLV, échantillons, vidéos<\/div><\/div><\/div><div class=\"card cG\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fG\">Dynamiser<\/span><h3>Garder le réseau actif<\/h3><div class=\"mini\"><div class=\"def\"><b>Visites régulières<\/b> · entretenir la relation, faire remonter l'information<\/div><div class=\"def\"><b>Objectifs partagés<\/b> · chaque partenaire sait ce qu'on attend de lui<\/div><div class=\"def\"><b>Écoute<\/b> · traiter vite les problèmes et les réclamations<\/div><div class=\"def\"><b>Valoriser<\/b> · mettre en avant les meilleurs, partager les bonnes pratiques<\/div><\/div><\/div><\/div>\n<h2>Évaluer la performance du réseau<\/h2>\n<table class=\"tb\"><tr><th style=\"width:26%\">Indicateur<\/th><th style=\"width:44%\">Calcul<\/th><th>Ce qu'il mesure<\/th><\/tr><tr><td>CA par partenaire<\/td><td>CA généré / nombre de partenaires<\/td><td>La contribution moyenne<\/td><\/tr><tr><td>Taux de partenaires actifs<\/td><td>partenaires ayant apporté au moins une affaire / total × 100<\/td><td>La vitalité du réseau<\/td><\/tr><tr><td>Taux de transformation<\/td><td>affaires conclues / affaires apportées × 100<\/td><td>La qualité des contacts<\/td><\/tr><tr><td>Coût de l'animation<\/td><td>total des dépenses d'animation (challenges, formations, outils)<\/td><td>L'effort consenti<\/td><\/tr><tr><td>Rentabilité de l'animation<\/td><td>(marge supplémentaire − coût de l'animation) / coût × 100<\/td><td>Si l'action a rapporté plus qu'elle n'a coûté<\/td><\/tr><tr><td>Satisfaction des partenaires<\/td><td>enquête, taux de départ<\/td><td>La solidité du réseau<\/td><\/tr><\/table>\n<div class=\"card dark\"><h3>Le mot du jury : efficience<\/h3><p class=\"sm\" style=\"color:#E4E5EE\">Ce n'est pas seulement « ça a marché » : c'est « ça a rapporté plus que ça n'a coûté ». Présente toujours le coût de ton action à côté de ses résultats.<\/p><\/div>","x":"c2 partenaires · 2/2 animer, stimuler, évaluer le réseau 1 informer nouveautés, argumentaires, prix, outils : extranet, newsletter, application. 2 former sessions produits, techniques de vente, webinaires, visites. 3 stimuler challenges, primes, commissions, cadeaux, voyages, classement. 4 fédérer conventions, réunions, club partenaires, reconnaissance. outils pour animer à distance extranet ou portail partenaires · documents, commandes, suivi des affaires crm partagé · suivre les contacts apportés par chaque partenaire réseaux sociaux, groupes privés · échanger, partager les réussites kits de vente · argumentaires, plv, échantillons, vidéos dynamiser garder le réseau actif visites régulières · entretenir la relation, faire remonter l'information objectifs partagés · chaque partenaire sait ce qu'on attend de lui écoute · traiter vite les problèmes et les réclamations valoriser · mettre en avant les meilleurs, partager les bonnes pratiques évaluer la performance du réseau indicateur calcul ce qu'il mesure ca par partenaire ca généré / nombre de partenaires la contribution moyenne taux de partenaires actifs partenaires ayant apporté au moins une affaire / total × 100 la vitalité du réseau taux de transformation affaires conclues / affaires apportées × 100 la qualité des contacts coût de l'animation total des dépenses d'animation (challenges, formations, outils) l'effort consenti rentabilité de l'animation (marge supplémentaire − coût de l'animation) / coût × 100 si l'action a rapporté plus qu'elle n'a coûté satisfaction des partenaires enquête, taux de départ la solidité du réseau le mot du jury : efficience ce n'est pas seulement « ça a marché » : c'est « ça a rapporté plus que ça n'a coûté ». présente toujours le coût de ton action à côté de ses résultats."},{"t":"La vente directe et son cadre","h":"<div class=\"row\" style=\"align-items:center;gap:14px\"><div class=\"fO\" style=\"width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#FFFFFF\"><span class=\"bign\">C3<\/span><\/div><div style=\"display:flex;flex-direction:column;gap:2px\"><p class=\"kick mut\">Vente directe · 1/2<\/p><h1 style=\"font-size:31px\">La vente directe et son cadre<\/h1><\/div><\/div><p class=\"mut\">Vendre au consommateur sans magasin : à domicile, en réunion chez une hôtesse, en porte-à-porte, sur un salon ou en ligne.<\/p>\n<div class=\"g2\" style=\"align-items:start\"><div class=\"card cO\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fO\">Statut<\/span><h3>Le VDI (vendeur à domicile indépendant)<\/h3><div class=\"mini\"><div class=\"def\"><b>Indépendant<\/b> · pas de lien de subordination avec l'entreprise<\/div><div class=\"def\"><b>Deux formes<\/b> · mandataire (vend au nom de l'entreprise, touche une commission) ou acheteur-revendeur (achète puis revend, gagne la différence)<\/div><div class=\"def\"><b>Avantages<\/b> · horaires libres, complément de revenu, faible investissement<\/div><div class=\"def\"><b>Pour l'entreprise<\/b> · un réseau souple, payé à la performance ; mais du turnover et un besoin d'animation constant<\/div><\/div><\/div><div class=\"card cO\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fO\">Éthique<\/span><h3>Le code de la vente directe<\/h3><div class=\"mini\"><div class=\"def\"><b>Fédération de la vente directe<\/b> · code de conduite : informations honnêtes, respect du client, pas de pression<\/div><div class=\"def\"><b>Recrutement<\/b> · ne pas promettre des gains irréalistes, ne pas imposer l'achat de stocks importants<\/div><div class=\"def\"><b>Vente pyramidale<\/b> · interdite : un système où l'on gagne surtout en recrutant, pas en vendant. Le marketing de réseau est légal si la rémunération vient de vraies ventes<\/div><\/div><\/div><\/div>\n<h2>La réglementation de la vente hors établissement<\/h2>\n<table class=\"tb\"><tr><th style=\"width:26%\">Règle<\/th><th>À retenir<\/th><\/tr><tr><td>Contrat écrit<\/td><td>Remis au client, avec les informations obligatoires (vendeur, produit, prix, délais, rétractation) et un formulaire de rétractation<\/td><\/tr><tr><td>Rétractation<\/td><td>14 jours sans motif pour le consommateur<\/td><\/tr><tr><td>Paiement<\/td><td>Aucun paiement ne peut être exigé avant 7 jours après la signature (sauf exceptions prévues par la loi)<\/td><\/tr><tr><td>Abus de faiblesse<\/td><td>Profiter de la vulnérabilité d'une personne est un délit<\/td><\/tr><tr><td>Démarchage téléphonique<\/td><td>Depuis le 11 août 2026, consentement préalable du consommateur obligatoire<\/td><\/tr><tr><td>Données<\/td><td>Fichiers clients et prospects soumis au RGPD<\/td><\/tr><\/table>\n<div class=\"card cY\"><h3>Pourquoi le jury insiste<\/h3><p class=\"sm\">« Respect de la réglementation et de l'éthique » est un critère de la grille. Montre que ta vente en réunion respectait le contrat, la rétractation et l'interdiction de paiement immédiat.<\/p><\/div>","x":"c3 vente directe · 1/2 la vente directe et son cadre vendre au consommateur sans magasin : à domicile, en réunion chez une hôtesse, en porte-à-porte, sur un salon ou en ligne. statut le vdi (vendeur à domicile indépendant) indépendant · pas de lien de subordination avec l'entreprise deux formes · mandataire (vend au nom de l'entreprise, touche une commission) ou acheteur-revendeur (achète puis revend, gagne la différence) avantages · horaires libres, complément de revenu, faible investissement pour l'entreprise · un réseau souple, payé à la performance ; mais du turnover et un besoin d'animation constant éthique le code de la vente directe fédération de la vente directe · code de conduite : informations honnêtes, respect du client, pas de pression recrutement · ne pas promettre des gains irréalistes, ne pas imposer l'achat de stocks importants vente pyramidale · interdite : un système où l'on gagne surtout en recrutant, pas en vendant. le marketing de réseau est légal si la rémunération vient de vraies ventes la réglementation de la vente hors établissement règle à retenir contrat écrit remis au client, avec les informations obligatoires (vendeur, produit, prix, délais, rétractation) et un formulaire de rétractation rétractation 14 jours sans motif pour le consommateur paiement aucun paiement ne peut être exigé avant 7 jours après la signature (sauf exceptions prévues par la loi) abus de faiblesse profiter de la vulnérabilité d'une personne est un délit démarchage téléphonique depuis le 11 août 2026, consentement préalable du consommateur obligatoire données fichiers clients et prospects soumis au rgpd pourquoi le jury insiste « respect de la réglementation et de l'éthique » est un critère de la grille. montre que ta vente en réunion respectait le contrat, la rétractation et l'interdiction de paiement immédiat."},{"t":"Vendre en réunion et développer le réseau","h":"<div class=\"row\" style=\"align-items:center;gap:14px\"><div class=\"fO\" style=\"width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#FFFFFF\"><span class=\"bign\">C3<\/span><\/div><div style=\"display:flex;flex-direction:column;gap:2px\"><p class=\"kick mut\">Vente directe · 2/2<\/p><h1 style=\"font-size:31px\">Vendre en réunion et développer le réseau<\/h1><\/div><\/div>\n<div class=\"card cO\" style=\"gap:8px\"><h3>La vente en réunion, étape par étape<\/h3>\n<div style=\"display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px\">\n<div class=\"card\" style=\"background:#FFFFFF;padding:8px;gap:2px\"><span class=\"bign tO\" style=\"font-size:20px\">1<\/span><b class=\"sm\">Préparer<\/b><span class=\"mini\">avec l'hôtesse : invités, date, lieu, matériel<\/span><\/div>\n<div class=\"card\" style=\"background:#FFFFFF;padding:8px;gap:2px\"><span class=\"bign tO\" style=\"font-size:20px\">2<\/span><b class=\"sm\">Accueillir<\/b><span class=\"mini\">créer une ambiance, se présenter<\/span><\/div>\n<div class=\"card\" style=\"background:#FFFFFF;padding:8px;gap:2px\"><span class=\"bign tO\" style=\"font-size:20px\">3<\/span><b class=\"sm\">Démontrer<\/b><span class=\"mini\">faire essayer, ateliers, jeux<\/span><\/div>\n<div class=\"card\" style=\"background:#FFFFFF;padding:8px;gap:2px\"><span class=\"bign tO\" style=\"font-size:20px\">4<\/span><b class=\"sm\">Vendre<\/b><span class=\"mini\">conseil personnalisé, bons de commande<\/span><\/div>\n<div class=\"card\" style=\"background:#FFFFFF;padding:8px;gap:2px\"><span class=\"bign tO\" style=\"font-size:20px\">5<\/span><b class=\"sm\">Booker<\/b><span class=\"mini\">obtenir de nouvelles réunions<\/span><\/div>\n<div class=\"card\" style=\"background:#FFFFFF;padding:8px;gap:2px\"><span class=\"bign tO\" style=\"font-size:20px\">6<\/span><b class=\"sm\">Recruter<\/b><span class=\"mini\">repérer de futurs vendeurs<\/span><\/div>\n<\/div>\n<p class=\"sm\"><b>L'hôtesse<\/b> reçoit chez elle et invite ses proches ; elle est remerciée par des cadeaux selon les ventes. Le <b>fichier de conseillers<\/b> grandit grâce aux réunions : chaque réunion doit en préparer d'autres.<\/p><\/div>\n<div class=\"g2\" style=\"align-items:start\"><div class=\"card cO\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fO\">Recruter<\/span><h3>Trouver de nouveaux vendeurs<\/h3><div class=\"mini\"><div class=\"def\"><b>Sources<\/b> · clientes et hôtesses satisfaites, parrainage, réseaux sociaux, salons, annonces<\/div><div class=\"def\"><b>Profil<\/b> · goût pour le contact, disponibilité, motivation<\/div><div class=\"def\"><b>Présentation honnête<\/b> · revenus réalistes, statut VDI, e
