<\/div><div class=\"def\"><b>Segmentation<\/b> · marché primaire (emplois stables, bien payés) et secondaire (précaires, peu qualifiés) : Doeringer et Piore<\/div><div class=\"def\"><b>Déséquilibres<\/b> · chômage, emplois non pourvus (tensions de recrutement)<\/div><div class=\"def\"><b>Politiques de l'emploi<\/b> · passives (indemniser les chômeurs) et actives (formation, aides à l'embauche, accompagnement)<\/div><\/div><\/div><div class=\"card cG\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fG\">Management<\/span><h3>Emploi et conditions de travail<\/h3><div class=\"mini\"><div class=\"def\"><b>GPEC<\/b> · anticiper les besoins en emplois et compétences (aujourd'hui souvent appelée GEPP) : former, recruter, faire évoluer<\/div><div class=\"def\"><b>Motivation (Herzberg)<\/b> · facteurs d'hygiène (salaire, conditions : évitent l'insatisfaction) et facteurs moteurs (reconnaissance, responsabilité : motivent)<\/div><div class=\"def\"><b>Besoins (Maslow)<\/b> · physiologiques, sécurité, appartenance, estime, accomplissement<\/div><div class=\"def\"><b>Conditions de travail<\/b> · santé, sécurité, risques psychosociaux, qualité de vie au travail, télétravail<\/div><\/div><\/div><\/div>\n<div style=\"display:flex;flex-direction:column;gap:10px\"><div class=\"card cP\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fP\">Droit<\/span><h3>Le droit du travail<\/h3><div class=\"mini\"><div class=\"def\"><b>Sources<\/b> · Constitution, traités européens, Code du travail, conventions collectives, accords d'entreprise, contrat, usages. Depuis 2017, l'accord d'entreprise prime sur de nombreux sujets<\/div><div class=\"def\"><b>Salarié ou indépendant<\/b> · le salarié est lié par un lien de subordination (ordres, contrôle, sanction) ; l'indépendant non<\/div><div class=\"def\"><b>Contrats<\/b> · CDI (règle), CDD et intérim (exceptions, cas limités) ; temps partiel ; alternance<\/div><div class=\"def\"><b>Période d'essai CDI<\/b> · 2 mois (employés), 3 mois (agents de maîtrise, techniciens), 4 mois (cadres), renouvelable une fois si un accord de branche le prévoit<\/div><div class=\"def\"><b>Protection du salarié<\/b> · non-discrimination, santé et sécurité, vie privée, salaire minimum<\/div><div class=\"def\"><b>Modification du contrat<\/b> · un élément essentiel (salaire, qualification) exige l'accord du salarié ; un simple changement des conditions de travail, non<\/div><div class=\"def\"><b>Rupture<\/b> · démission ; licenciement pour motif personnel ou économique (cause réelle et sérieuse, procédure) ; rupture conventionnelle (15 jours calendaires de rétractation, puis homologation par la Dreets)<\/div><div class=\"def\"><b>Dialogue social<\/b> · syndicats, CSE, négociation d'accords<\/div><\/div><\/div><\/div>\n<\/div>","x":"5 thème 5 · 2e année les mutations du travail le marché du travail le droit du travail emploi et conditions de travail économie le marché du travail offre et demande de travail · l'offre vient des ménages (qui proposent leur travail), la demande des entreprises (qui embauchent) segmentation · marché primaire (emplois stables, bien payés) et secondaire (précaires, peu qualifiés) : doeringer et piore déséquilibres · chômage, emplois non pourvus (tensions de recrutement) politiques de l'emploi · passives (indemniser les chômeurs) et actives (formation, aides à l'embauche, accompagnement) management emploi et conditions de travail gpec · anticiper les besoins en emplois et compétences (aujourd'hui souvent appelée gepp) : former, recruter, faire évoluer motivation (herzberg) · facteurs d'hygiène (salaire, conditions : évitent l'insatisfaction) et facteurs moteurs (reconnaissance, responsabilité : motivent) besoins (maslow) · physiologiques, sécurité, appartenance, estime, accomplissement conditions de travail · santé, sécurité, risques psychosociaux, qualité de vie au travail, télétravail droit le droit du travail sources · constitution, traités européens, code du travail, conventions collectives, accords d'entreprise, contrat, usages. depuis 2017, l'accord d'entreprise prime sur de nombreux sujets salarié ou indépendant · le salarié est lié par un lien de subordination (ordres, contrôle, sanction) ; l'indépendant non contrats · cdi (règle), cdd et intérim (exceptions, cas limités) ; temps partiel ; alternance période d'essai cdi · 2 mois (employés), 3 mois (agents de maîtrise, techniciens), 4 mois (cadres), renouvelable une fois si un accord de branche le prévoit protection du salarié · non-discrimination, santé et sécurité, vie privée, salaire minimum modification du contrat · un élément essentiel (salaire, qualification) exige l'accord du salarié ; un simple changement des conditions de travail, non rupture · démission ; licenciement pour motif personnel ou économique (cause réelle et sérieuse, procédure) ; rupture conventionnelle (15 jours calendaires de rétractation, puis homologation par la dreets) dialogue social · syndicats, cse, négociation d'accords"},{"t":"Les choix stratégiques","h":"<div class=\"row\" style=\"align-items:center;gap:14px\"><div style=\"width:58px;height:58px;border-radius:16px;background:#16182B;display:flex;align-items:center;justify-content:center;color:#FFFFFF\"><span class=\"bign\">6<\/span><\/div><div style=\"display:flex;flex-direction:column;gap:2px\"><p class=\"kick mut\">Thème 6 · 2e année<\/p><h1 style=\"font-size:31px\">Les choix stratégiques<\/h1><\/div><\/div><div class=\"row\" style=\"flex-wrap:wrap;gap:6px\"><span class=\"chip\" style=\"font-size:12px\">Le diagnostic<\/span><span class=\"chip\" style=\"font-size:12px\">Les choix stratégiques<\/span><\/div>\n<h2>Le diagnostic stratégique<\/h2>\n<div class=\"g2\" style=\"align-items:start\"><div class=\"card cG\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fG\">Externe<\/span><h3>Analyser l'environnement<\/h3><div class=\"mini\"><div class=\"def\"><b>PESTEL<\/b> · le macro-environnement : opportunités et menaces<\/div><div class=\"def\"><b>Les 5 forces (Porter)<\/b> · intensité de la concurrence, menace de nouveaux entrants, menace des produits de substitution, pouvoir des clients, pouvoir des fournisseurs (+ rôle de l'État)<\/div><div class=\"def\"><b>Facteurs clés de succès<\/b> · ce qu'il faut maîtriser pour réussir sur un marché<\/div><\/div><\/div><div class=\"card cG\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fG\">Interne<\/span><h3>Analyser l'entreprise<\/h3><div class=\"mini\"><div class=\"def\"><b>Ressources et compétences<\/b> · ce que l'entreprise a et sait faire<\/div><div class=\"def\"><b>Ressources stratégiques (Barney)<\/b> · précieuses, rares, difficiles à imiter, bien organisées : sources d'avantage concurrentiel durable<\/div><div class=\"def\"><b>Chaîne de valeur<\/b> · où l'entreprise crée-t-elle le plus de valeur ?<\/div><\/div><\/div><\/div>\n<div class=\"card cY\"><h3>La synthèse : SWOT<\/h3><div class=\"g4 sm\" style=\"gap:8px\"><div class=\"card\" style=\"background:#FFFFFF;padding:10px\"><b>Forces<\/b>atouts internes<\/div><div class=\"card\" style=\"background:#FFFFFF;padding:10px\"><b>Faiblesses<\/b>limites internes<\/div><div class=\"card\" style=\"background:#FFFFFF;padding:10px\"><b>Opportunités<\/b>chances externes<\/div><div class=\"card\" style=\"background:#FFFFFF;padding:10px\"><b>Menaces<\/b>risques externes<\/div><\/div><\/div>\n<h2>Les choix stratégiques<\/h2>\n<div class=\"g2\" style=\"align-items:start\"><div class=\"card cG\" style=\"gap:4px;padding:12px 14px\"><h3>Par domaine d'activité<\/h3><div class=\"mini\"><div class=\"def\"><b>DAS<\/b> · domaine d'activité stratégique : un couple produits-marché avec ses clients, concurrents, technologies<\/div><div class=\"def\"><b>Domination par les coûts (Porter)<\/b> · être le moins cher (Lidl, Ryanair)<\/div><div class=\"def\"><b>Différenciation<\/b> · offrir un produit unique, perçu comme supérieur (Apple)<\/div><div class=\"def\"><b>Focalisation<\/b> · se concentrer sur une niche<\/div><div class=\"def\"><b>Matrice BCG<\/b> · classe les DAS selon la croissance du marché et la part de marché relative : vedettes, vaches à lait, dilemmes, poids morts<\/div><\/div><\/div><div class=\"card cG\" style=\"gap:4px;padding:12px 14px\"><h3>Globales et modes de croissance<\/h3><div class=\"mini\"><div class=\"def\"><b>Spécialisation<\/b> · un seul métier ; recentrage : revenir à son cœur de métier<\/div><div class=\"def\"><b>Diversification<\/b> · de nouveaux métiers, liés ou non<\/div><div class=\"def\"><b>Intégration verticale<\/b> · contrôler l'amont (fournisseurs) ou l'aval (distribution)<\/div><div class=\"def\"><b>Internationalisation<\/b> · exporter, s'implanter à l'étranger<\/div><div class=\"def\"><b>Croissance interne<\/b> · par ses propres moyens : lente mais maîtrisée<\/div><div class=\"def\"><b>Croissance externe<\/b> · fusion, acquisition : rapide mais coûteuse et risquée<\/div><div class=\"def\"><b>Croissance conjointe<\/b> · alliances, partenariats, franchise, joint-venture<\/div><\/div><\/div><\/div>","x":"6 thème 6 · 2e année les choix stratégiques le diagnostic les choix stratégiques le diagnostic stratégique externe analyser l'environnement pestel · le macro-environnement : opportunités et menaces les 5 forces (porter) · intensité de la concurrence, menace de nouveaux entrants, menace des produits de substitution, pouvoir des clients, pouvoir des fournisseurs (+ rôle de l'état) facteurs clés de succès · ce qu'il faut maîtriser pour réussir sur un marché interne analyser l'entreprise ressources et compétences · ce que l'entreprise a et sait faire ressources stratégiques (barney) · précieuses, rares, difficiles à imiter, bien organisées : sources d'avantage concurrentiel durable chaîne de valeur · où l'entreprise crée-t-elle le plus de valeur ? la synthèse : swot forces atouts internes faiblesses limites internes opportunités chances externes menaces risques externes les choix stratégiques par domaine d'activité das · domaine d'activité stratégique : un couple produits-marché avec ses clients, concurrents, technologies domination par les coûts (porter) · être le moins cher (lidl, ryanair) différenciation · offrir un produit unique, perçu comme supérieur (apple) focalisation · se concentrer sur une niche matrice bcg · classe les das selon la croissance du marché et la part de marché relative : vedettes, vaches à lait, dilemmes, poids morts globales et modes de croissance spécialisation · un seul métier ; recentrage : revenir à son cœur de métier diversification · de nouveaux métiers, liés ou non intégration verticale · contrôler l'amont (fournisseurs) ou l'aval (distribution) internationalisation · exporter, s'implanter à l'étranger croissance interne · par ses propres moyens : lente mais maîtrisée croissance externe · fusion, acquisition : rapide mais coûteuse et risquée croissance conjointe · alliances, partenariats, franchise, joint-venture"},{"t":"Les notions complémentaires","h":"<p class=\"kick tO\">Programme<\/p>\n<h1>Les notions complémentaires<\/h1>\n<p class=\"mut\">Ces notions du programme officiel complètent les pages des thèmes. Elles tombent moins souvent, mais elles peuvent tomber.<\/p>\n<div class=\"g2\" style=\"align-items:start\">\n<div style=\"display:flex;flex-direction:column;gap:10px\"><div class=\"card cB\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fB\">Thème 2 · Économie<\/span><h3>La régulation européenne<\/h3><div class=\"mini\"><div class=\"def\"><b>Marché unique<\/b> · libre circulation des biens, des services, des capitaux et des personnes entre les pays de l'UE<\/div><div class=\"def\"><b>Politique de concurrence de l'UE<\/b> · la Commission européenne sanctionne ententes et abus de position dominante, contrôle les concentrations et les aides d'État<\/div><div class=\"def\"><b>Zone euro<\/b> · une monnaie unique, une politique monétaire unique menée par la BCE<\/div><div class=\"def\"><b>Règles budgétaires<\/b> · déficit public limité à 3 % du PIB, dette publique à 60 % du PIB (règles assouplies et réformées en 2024)<\/div><div class=\"def\"><b>Règlement / directive<\/b> · le règlement s'applique directement dans tous les pays ; la directive doit être transposée dans le droit national<\/div><\/div><\/div><div class=\"card cP\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fP\">Thème 3 · Droit<\/span><h3>Les types de risques<\/h3><div class=\"mini\"><div class=\"def\"><b>Économiques<\/b> · perte de clients, arrivée d'un concurrent, baisse de la demande<\/div><div class=\"def\"><b>Financiers<\/b> · impayés, manque de trésorerie, endettement<\/div><div class=\"def\"><b>Juridiques<\/b> · litiges, non-respect d'une règle, contrefaçon<\/div><div class=\"def\"><b>Technologiques et numériques<\/b> · pannes, cyberattaques, fuite de données<\/div><div class=\"def\"><b>Humains et environnementaux<\/b> · accidents du travail, pollution, catastrophes<\/div><div class=\"def\"><b>Réponses<\/b> · prévention, assurance, clauses du contrat (limitative de responsabilité, pénale), choix d'une forme juridique à responsabilité limitée<\/div><\/div><\/div><\/div>\n<div style=\"display:flex;flex-direction:column;gap:10px\"><div class=\"card cG\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fG\">Thème 3 · Management<\/span><h3>Compétences et contrôle<\/h3><div class=\"mini\"><div class=\"def\"><b>Compétences<\/b> · individuelles (savoirs, savoir-faire, savoir-être) et collectives (ce que l'équipe sait faire ensemble) ; le cœur de métier réunit les compétences clés<\/div><div class=\"def\"><b>Mécanismes de contrôle<\/b> · contrôle par les règles et procédures, par les résultats (objectifs, budgets, tableaux de bord, analyse des écarts), par la culture d'entreprise<\/div><\/div><\/div><div class=\"card cB\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fB\">Thème 3 · Gestion<\/span><h3>L'équilibre financier en détail<\/h3><div class=\"mini\"><div class=\"def\"><b>FRNG<\/b> · fonds de roulement net global = ressources stables − emplois stables<\/div><div class=\"def\"><b>BFR<\/b> · besoin de financement du cycle d'exploitation = stocks + créances clients − dettes fournisseurs<\/div><div class=\"def\"><b>Trésorerie nette<\/b> · FRNG − BFR : positive, l'entreprise peut payer ; négative, elle dépend de la banque<\/div><div class=\"def\"><b>CAF<\/b> · capacité d'autofinancement : les ressources que l'activité dégage pour financer l'entreprise<\/div><\/div><\/div><div class=\"card cG\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fG\">Thème 4 · Management<\/span><h3>Numérique et organisation<\/h3><div class=\"mini\"><div class=\"def\"><b>Spécialisation<\/b> · le numérique permet de découper et confier les tâches à des spécialistes, en interne ou à l'extérieur<\/div><div class=\"def\"><b>Intégration<\/b> · relier les fonctions entre elles (un ERP partage les mêmes données dans toute l'entreprise)<\/div><div class=\"def\"><b>Action collective<\/b> · outils collaboratifs et plateformes facilitent le travail en équipe, même à distance ; organisation en réseau<\/div><div class=\"def\"><b>Flexibilité<\/b> · quantitative (ajuster les effectifs ou horaires) ou qualitative (polyvalence, adaptation des tâches) ; interne ou externe<\/div><\/div><\/div><div class=\"card cP\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fP\">Thème 4 · Droit<\/span><h3>Droits d'utilisation<\/h3><div class=\"mini\"><div class=\"def\"><b>Licence d'utilisation<\/b> · acheter un logiciel ou une application, c'est acheter un droit d'usage, pas l'œuvre elle-même<\/div><div class=\"def\"><b>CGU<\/b> · les conditions générales d'utilisation forment le contrat entre le service et l'utilisateur<\/div><div class=\"def\"><b>Logiciel libre / propriétaire<\/b> · libre : code ouvert, modifiable ; propriétaire : usage limité par la licence<\/div><\/div><\/div><\/div>\n<\/div>","x":"programme les notions complémentaires ces notions du programme officiel complètent les pages des thèmes. elles tombent moins souvent, mais elles peuvent tomber. thème 2 · économie la régulation européenne marché unique · libre circulation des biens, des services, des capitaux et des personnes entre les pays de l'ue politique de concurrence de l'ue · la commission européenne sanctionne ententes et abus de position dominante, contrôle les concentrations et les aides d'état zone euro · une monnaie unique, une politique monétaire unique menée par la bce règles budgétaires · déficit public limité à 3 % du pib, dette publique à 60 % du pib (règles assouplies et réformées en 2024) règlement / directive · le règlement s'applique directement dans tous les pays ; la directive doit être transposée dans le droit national thème 3 · droit les types de risques économiques · perte de clients, arrivée d'un concurrent, baisse de la demande financiers · impayés, manque de trésorerie, endettement juridiques · litiges, non-respect d'une règle, contrefaçon technologiques et numériques · pannes, cyberattaques, fuite de données humains et environnementaux · accidents du travail, pollution, catastrophes réponses · prévention, assurance, clauses du contrat (limitative de responsabilité, pénale), choix d'une forme juridique à responsabilité limitée thème 3 · management compétences et contrôle compétences · individuelles (savoirs, savoir-faire, savoir-être) et collectives (ce que l'équipe sait faire ensemble) ; le cœur de métier réunit les compétences clés mécanismes de contrôle · contrôle par les règles et procédures, par les résultats (objectifs, budgets, tableaux de bord, analyse des écarts), par la culture d'entreprise thème 3 · gestion l'équilibre financier en détail frng · fonds de roulement net global = ressources stables − emplois stables bfr · besoin de financement du cycle d'exploitation = stocks + créances clients − dettes fournisseurs trésorerie nette · frng − bfr : positive, l'entreprise peut payer ; négative, elle dépend de la banque caf · capacité d'autofinancement : les ressources que l'activité dégage pour financer l'entreprise thème 4 · management ":"Il consulte, mais décide seul."},{"id":"cejmq4","q":"Une fusion ou un rachat d'entreprise, c'est une croissance…","o":["interne","externe","conjointe","organique"],"a":1,"e":"La croissance externe est rapide mais coûteuse et risquée."},{"id":"cejmq5","q":"Que mesure le BFR ?","o":["Le bénéfice de l'année","Le besoin de financement du cycle d'exploitation","La valeur des machines","Les dettes à long terme"],"a":1,"e":"BFR = stocks + créances clients − dettes fournisseurs."},{"id":"cejmq6","q":"Quelle est la dernière étape du raisonnement juridique ?","o":["Rappeler les faits","Poser le problème","Énoncer la règle","Appliquer la règle et trancher"],"a":3,"e":"Faits, problème, règle, puis solution : une seule solution."},{"id":"cejmq7","q":"Selon l'article 1128 du Code civil, lesquelles sont des conditions de validité du contrat ?","o":["Consentement, capacité, contenu licite et certain","Écrit, signature, prix","Bonne foi, durée, prix","Offre, acceptation, livraison"],"a":0,"e":"Consentement des parties, capacité de contracter, contenu licite et certain."},{"id":"cejmq8","q":"Quelles sont les 3 fonctions de l'État selon Musgrave ?","o":["Produire, vendre, taxer","Allocation, redistribution, régulation","Législatif, exécutif, judiciaire","Croissance, emploi, prix"],"a":1,"e":"Allocation, redistribution et régulation (stabilisation)."},{"id":"cejmq9","q":"Quel est l'objectif d'inflation de la BCE ?","o":["0 %","1 %","2 % à moyen terme","5 %"],"a":2,"e":"La BCE vise une inflation de 2 % à moyen terme."},{"id":"cejmq10","q":"Combien de temps une marque est-elle protégée ?","o":["5 ans","10 ans, renouvelable sans limite","20 ans maximum","70 ans après la mort"],"a":1,"e":"10 ans, renouvelable indéfiniment."},{"id":"cejmq11","q":"Quelle forme de société exige un capital minimum de 37 000 € ?","o":["SARL","SAS","SA","EURL"],"a":2,"e":"La SA ; SARL et SAS ont un capital libre."},{"id":"cejmq12","q":"Depuis le 15 mai 2022, l'entrepreneur individuel…","o":["a un patrimoine unique","a un patrimoine professionnel séparé de son patrimoine personnel","doit créer une EIRL","doit avoir 2 associés"],"a":1,"e":"Séparation des patrimoines de plein droit ; l'EIRL ne peut plus être créée."},{"id":"cejmq13","q":"Quelles sont les 3 conditions de la responsabilité civile ?","o":["Faute, amende, prison","Fait générateur, dommage, lien de causalité","Contrat, signature, témoin","Infraction, élément moral, sanction"],"a":1,"e":"Il faut un fait générateur, un dommage et un lien de causalité."},{"id":"cejmq14","q":"Durée maximale de la période d'essai initiale d'un cadre en CDI ?","o":["2 mois","3 mois","4 mois","6 mois"],"a":2,"e":"2 mois (employés), 3 mois (agents de maîtrise), 4 mois (cadres)."},{"id":"cejmq15","q":"Délai de rétractation d'une rupture conventionnelle ?","o":["7 jours","14 jours","15 jours calendaires","1 mois"],"a":2,"e":"15 jours calendaires, puis homologation par la Dreets."},{"id":"cejmq16","q":"Selon Herzberg, le salaire est…","o":["un facteur moteur","un facteur d'hygiène","un besoin d'accomplissement","sans effet"],"a":1,"e":"Il évite l'insatisfaction mais ne suffit pas à motiver."},{"id":"cejmq17","q":"Qui est l'auteur des « 5 forces » de la concurrence ?","o":["Mintzberg","Porter","Likert","Barney"],"a":1,"e":"Michael Porter."},{"id":"cejmq18","q":"Trésorerie nette =","o":["CA − charges","FRNG − BFR","Actif − passif","Ressources stables + dettes"],"a":1,"e":"Trésorerie = fonds de roulement net global − besoin en fonds de roulement."},{"id":"cejmq19","q":"Amende maximale prévue par le RGPD ?","o":["1 M€","20 M€ ou 4 % du CA mondial","10 % du CA","100 000 €"],"a":1,"e":"Jusqu'à 20 M€ ou 4 % du chiffre d'affaires mondial."},{"id":"cejmq20","q":"Quels sont les vices du consentement ?","o":["Erreur, dol, violence","Retard, oubli, faute","Prix, délai, qualité","Fraude, vol, abus"],"a":0,"e":"Ils entraînent la nullité du contrat."},{"id":"cejmq21","q":"Le dol est…","o":["une erreur de calcul","une tromperie pour obtenir le consentement","un retard de paiement","une clause du contrat"],"a":1,"e":"C'est un vice du consentement."},{"id":"cejmq22","q":"Que dit l'article 1103 du Code civil ?","o":["Le contrat légalement formé tient lieu de loi à ceux qui l'ont fait","Tout contrat doit être écrit","Le prix est libre","Le contrat peut être rompu à tout moment"],"a":0,"e":"C'est la force obligatoire du contrat."},{"id":"cejmq23","q":"Une clause abusive est…","o":["valable","réputée non écrite","punie de prison","obligatoire"],"a":1,"e":"Elle crée un déséquilibre significatif entre les parties."},{"id":"cejmq24","q":"Quels sont les 3 éléments d'une infraction pénale ?","o":["Légal, matériel, moral","Faute, dommage, lien","Offre, acceptation, prix","Plainte, enquête, procès"],"a":0,"e":"Il faut un texte, un acte et une intention (ou une faute)."},{"id":"cejmq25","q":"La responsabilité civile vise à…, la responsabilité pénale vise à…","o":["punir / réparer","réparer / punir","informer / sanctionner","prévenir / réparer"],"a":1,"e":"Civil : réparer le dommage. Pénal : punir l'auteur."},{"id":"cejmq26","q":"Lequel est un exemple d'externalité négative ?","o":["Une abeille qui pollinise un verger voisin","La pollution d'une usine qui gêne les riverains","Une baisse de prix","Une prime aux salariés"],"a":1,"e":"Effet subi par un tiers sans compensation."},{"id":"cejmq27","q":"En concurrence pure et parfaite, l'« atomicité » signifie…","o":["des produits identiques","beaucoup d'acheteurs et de vendeurs, aucun ne pèse sur le prix","une information parfaite","la libre entrée"],"a":1,"e":"C'est l'une des 5 conditions du modèle."},{"id":"cejmq28","q":"Un oligopole, c'est un marché avec…","o":["un seul offreur","quelques offreurs","une infinité d'offreurs","un seul acheteur"],"a":1,"e":"Ex. : téléphonie mobile, compagnies aériennes."},{"id":"cejmq29","q":"Les externalités de réseau signifient qu'un service…","o":["coûte plus cher avec plus d'utilisateurs","vaut plus quand il a plus d'utilisateurs","est gratuit","est interdit"],"a":1,"e":"D'où des géants du numérique qui « raflent tout »."},{"id":"cejmq30","q":"Ce qui caractérise le salarié, c'est…","o":["un salaire élevé","un lien de subordination avec l'employeur","un CDI","un bureau"],"a":1,"e":"Ordres, contrôle et pouvoir de sanction de l'employeur."},{"id":"cejmq31","q":"Le CDD est…","o":["la règle","l'exception, réservé à des cas limités","interdit","toujours renouvelable sans limite"],"a":1,"e":"Le CDI reste la forme normale du contrat de travail."},{"id":"cejmq32","q":"Dans la matrice BCG, une « vache à lait » est un domaine…","o":["à forte croissance et faible part de marché","à faible croissance et forte part de marché","en déclin et sans part de marché","très innovant"],"a":1,"e":"Il rapporte de l'argent qui finance les autres activités."},{"id":"cejmq33","q":"Selon l'effet d'expérience, à chaque doublement de la production cumulée, le coût unitaire baisse de…","o":["5 %","20 à 30 %","50 %","rien"],"a":1,"e":"C'est l'effet d'expérience mis en évidence par le BCG."},{"id":"cejmq34","q":"Le droit d'auteur protège une œuvre…","o":["après dépôt à l'INPI","sans formalité, jusqu'à 70 ans après la mort de l'auteur","20 ans","10 ans renouvelables"],"a":1,"e":"Contrairement à la marque ou au brevet, aucun dépôt n'est nécessaire."},{"id":"cejmq35","q":"Quel auteur parle de « destruction créatrice » ?","o":["Keynes","Schumpeter","Solow","Musgrave"],"a":1,"e":"L'innovation détruit d'anciennes activités et en crée de nouvelles."},{"id":"cejmq36","q":"Selon Freeman, les parties prenantes sont…","o":["seulement les actionnaires","tous les acteurs concernés par l'activité de l'entreprise","les concurrents","l'État"],"a":1,"e":"Salariés, clients, fournisseurs, État, ONG, actionnaires…"}],"r":[{"id":"cejmr0","q":"Un cadre en CDI voit sa période d'essai de 4 mois renouvelée, alors qu'aucun accord de branche ne le prévoit. Est-ce légal ? Rédige un raisonnement juridique.","p":[{"t":"Les faits résumés juridiquement","k":["cadre","cdi","salarie"]},{"t":"Le problème juridique","k":["peut-il","peut il","renouvel","periode d'essai"]},{"t":"La règle : 4 mois, renouvelable seulement si un accord de branche le prévoit","k":["accord de branche","4 mois","code du travail","l1221"]},{"t":"Une solution claire","k":["illegal","pas legal","pas possible","ne peut pas","irregulier","non"]}],"m":"Faits : un salarié cadre en CDI a une période d'essai de 4 mois, que l'employeur renouvelle. Problème : un employeur peut-il renouveler la période d'essai d'un cadre sans accord de branche ? Règle : le Code du travail (art. L1221-19 et suivants) fixe la période d'essai d'un cadre à 4 mois maximum ; elle ne peut être renouvelée qu'une fois, et seulement si un accord de branche étendu le prévoit et si le contrat le stipule. Solution : ici, aucun accord de branche ne le prévoit, donc le renouvellement n'est pas légal."},{"id":"cejmr1","q":"Mme Durand a acheté une robe sur un site internet. Elle l'a reçue il y a 10 jours et veut la renvoyer sans donner de raison. Le peut-elle ?","p":[{"t":"Identifier le droit de rétractation","k":["retract"]},{"t":"Le délai de 14 jours","k":["14"]},{"t":"Vente à distance, depuis la réception du bien","k":["distance","en ligne","internet","reception"]},{"t":"Une solution claire","k":["oui","elle peut","dans le delai"]}],"m":"Faits : une consommatrice a acheté un bien à distance et l'a reçu il y a 10 jours. Problème : un consommateur peut-il renoncer à un achat à distance sans motif ? Règle : le Code de la consommation (art. L221-18) lui donne 14 jours pour se rétracter, sans motif ; pour un bien, le délai court à partir de la réception. Solution : Mme Durand est dans le délai (10 jours), elle peut renvoyer la robe et être remboursée."},{"id":"cejmr2","q":"Explique la différence entre politique budgétaire et politique monétaire.","p":[{"t":"Budgétaire : menée par l'État","k":["etat","gouvernement"]},{"t":"Elle joue sur les dépenses et les impôts","k":["depense","impot","recette","budget"]},{"t":"Monétaire : menée par la BCE","k":["bce","banque centrale"]},{"t":"Elle joue sur les taux d'intérêt","k":["taux"]}],"m":"La politique budgétaire est menée par l'État : il agit sur l'économie par ses dépenses publiques et ses recettes (impôts). La politique monétaire est menée, dans la zone euro, par la Banque centrale européenne : elle agit surtout sur les taux d'intérêt directeurs, avec pour objectif une inflation de 2 % à moyen terme."},{"id":"cejmr3","q":"Qu'est-ce qu'une asymétrie d'information ? Comment une entreprise peut-elle la réduire ?","p":[{"t":"Une partie en sait plus que l'autre","k":["en sait plus","plus d'information","information","une partie"]},{"t":"Un exemple ou Akerlof","k":["akerlof","occasion","voiture"]},{"t":"Des solutions : garantie, label, avis, transparence","k":["garantie","label","avis","transparen","certif"]}],"m":"Il y a asymétrie d'information quand une partie à l'échange en sait plus que l'autre : le vendeur d'une voiture d'occasion connaît ses défauts, pas l'acheteur (Akerlof, 1970). Le client se méfie et hésite à acheter. L'entreprise peut la réduire en donnant des garanties, en obtenant des labels ou certifications, en publiant des avis clients et en étant transparente sur ses produits."},{"id":"cejmr4","q":"Compare la SARL et la SAS sur trois critères.","p":[{"t":"Le nombre d'associés","k":["associe","100","eurl","sasu"]},{"t":"Le capital","k":["capital","libre"]},{"t":"La responsabilité limitée aux apports","k":["responsabilite","apports","limitee"]},{"t":"La liberté des statuts et la direction","k":["statut","liberte","gerant","president","souple"]}],"m":"Associés : la SARL accueille de 1 (EURL) à 100 associés ; la SAS, 1 (SASU) ou plus, sans maximum. Capital : libre dans les deux cas. Responsabilité : limitée aux apports dans les deux. La grande différence est la souplesse : la SAS permet de rédiger librement ses statuts et est dirigée par un président, alors que la SARL, dirigée par un gérant, est plus encadrée par la loi."},{"id":"cejmr5","q":"Explique la théorie de Herzberg et applique-la à une entreprise qui veut motiver ses salariés.","p":[{"t":"Les facteurs d'hygiène","k":["hygiene"]},{"t":"Les facteurs moteurs","k":["moteur","motiv"]},{"t":"Exemple d'hygiène : salaire, conditions","k":["salaire","condition","prime"]},{"t":"Exemple de moteur : reconnaissance, responsabilités","k":["reconnaiss","responsabilit","autonom","evolution"]}],"m":"Herzberg distingue les facteurs d'hygiène (salaire, conditions de travail), qui évitent l'insatisfaction sans motiver, et les facteurs moteurs (reconnaissance, responsabilités, autonomie), qui motivent vraiment. Une entreprise qui veut motiver ne doit donc pas seulement augmenter les salaires : elle doit aussi reconnaître le travail de ses salariés, leur confier des responsabilités et leur offrir des perspectives d'évolution."},{"id":"cejmr6","q":"Qu'est-ce que le RGPD ? Cite trois obligations pour une entreprise.","p":[{"t":"Protéger les données personnelles","k":["donnees personnelles","donnee","rgpd"]},{"t":"Une base légale, souvent le consentement","k":["consentement","base legale"]},{"t":"Finalité, minimisation, sécurité, durée","k":["finalite","minimis","securi","duree","conserv"]},{"t":"Les droits des personnes ou les sanctions","k":["droit d'acces","effacement","rectification","opposition","cnil","amende","4 %"]}],"m":"Le RGPD est le règlement européen sur la protection des données personnelles, appliqué depuis le 25 mai 2018. Une entreprise doit notamment : collecter les données pour un but précis avec une base légale (souvent le consentement) ; ne collecter que les données utiles et les sécuriser ; respecter les droits des personnes (accès, rectification, effacement). La CNIL contrôle et peut infliger une amende jusqu'à 20 M€ ou 4 % du CA mondial."},{"id":"cejmr7","q":"Présente les stratégies génériques de Porter avec un exemple pour chacune.","p":[{"t":"Domination par les coûts","k":["cout","domination","moins cher"]},{"t":"Différenciation","k":["differenciation","unique"]},{"t":"Focalisation (niche)","k":["focalisation","niche"]},{"t":"Des exemples d'entreprises","k":["lidl","ryanair","apple","aldi","rolex","easyjet"]}],"m":"Porter distingue trois stratégies : la domination par les coûts (être le moins cher, comme Lidl ou Ryanair) ; la différenciation (proposer une offre perçue comme unique, comme Apple) ; la focalisation (se concentrer sur une niche, par exemple une marque de matériel pour un seul sport)."}]},{"k":"e4","n":"Négociation-vente","s":"E4 · Relation client","c":"#2F5BEA","p":[{"t":"Vue d'ensemble","h":"<div style=\"display:flex;flex-direction:column;gap:12px;padding-top:8px\">\n<span class=\"tag\" style=\"background:#16182B\">Fiche de révision · Bloc 1 · Épreuve E4<\/span>\n<div style=\"font-family:'Bricolage Grotesque',Inter,sans-serif;font-weight:800;font-size:clamp(34px,11vw,82px);line-height:.92;letter-spacing:-.03em\"><span style=\"color:#2F5BEA\">Relation client<\/span><br><span style=\"color:#F25C2B\">&amp; négociation-vente<\/span><\/div>\n<p style=\"font-size:17px;line-height:1.45;max-width:640px\">L'épreuve la plus lourde de ton BTS. Tout pour la réussir : le déroulement, les fiches E4, les 4 compétences, les techniques de vente, les calculs et le droit utile.<\/p>\n<\/div>\n<div class=\"g4\">\n<div class=\"card dark\"><span class=\"bign\">Coef. 5<\/span><span class=\"sm\" style=\"color:#D6D8E6\">la plus forte du BTS<\/span><\/div>\n<div class=\"card dark\"><span class=\"bign\">Oral<\/span><span class=\"sm\" style=\"color:#D6D8E6\">sur tes 2 fiches E4<\/span><\/div>\n<div class=\"card dark\"><span class=\"bign\">1 h<\/span><span class=\"sm\" style=\"color:#D6D8E6\">en ponctuel, après 40 min de préparation<\/span><\/div>\n<div class=\"card dark\"><span class=\"bign\">20 min<\/span><span class=\"sm\" style=\"color:#D6D8E6\">de simulation de vente<\/span><\/div>\n<\/div>\n<h2>Les 4 compétences évaluées<\/h2>\n<div class=\"g2\">\n<div class=\"card cB\"><span class=\"tag fB\">C1<\/span><h3>Cibler et prospecter la clientèle<\/h3><p class=\"sm\">Analyser le portefeuille, choisir des cibles, prospecter, évaluer, développer ses réseaux.<\/p><\/div>\n<div class=\"card cO\"><span class=\"tag fO\">C2<\/span><h3>Négocier et accompagner la relation client<\/h3><p class=\"sm\">Découvrir le client, négocier, vendre une solution adaptée, construire une relation durable.<\/p><\/div>\n<div class=\"card cP\"><span class=\"tag fP\">C3<\/span><h3>Organiser et animer un évènement commercial<\/h3><p class=\"sm\">Salon, portes ouvertes, animation de point de vente : organiser, animer, faire le bilan.<\/p><\/div>\n<div class=\"card cG\"><span class=\"tag fG\">C4<\/span><h3>Exploiter et mutualiser l'information commerciale<\/h3><p class=\"sm\">Collecter, analyser, partager l'information ; faire des propositions.<\/p><\/div>\n<\/div>\n<div class=\"g2 sm\" style=\"gap:4px 20px\">\n<span><b>02<\/b> · Le déroulement de l'épreuve<\/span><span><b>09<\/b> · C2 : B2B, réclamations, fidélisation<\/span>\n<span><b>03<\/b> · Réussir ses fiches E4<\/span><span><b>10<\/b> · C3 : l'évènement commercial<\/span>\n<span><b>04–05<\/b> · C1 : portefeuille et prospection<\/span><span><b>11<\/b> · C4 : l'information commerciale<\/span>\n<span><b>06<\/b> · C2 : la communication<\/span><span><b>12<\/b> · Les calculs commerciaux<\/span>\n<span><b>07–08<\/b> · C2 : les étapes de la vente<\/span><span><b>13<\/b> · Le droit utile<\/span>\n<span><\/span><span><b>14–15<\/b> · La simulation, kit et jour J<\/span>\n<\/div>","x":"fiche de révision · bloc 1 · épreuve e4 relation client & négociation-vente l'épreuve la plus lourde de ton bts. tout pour la réussir : le déroulement, les fiches e4, les 4 compétences, les techniques de vente, les calculs et le droit utile. coef. 5 la plus forte du bts oral sur tes 2 fiches e4 1 h en ponctuel, après 40 min de préparation 20 min de simulation de vente les 4 compétences évaluées c1 cibler et prospecter la clientèle analyser le portefeuille, choisir des cibles, prospecter, évaluer, développer ses réseaux. c2 négocier et accompagner la relation client découvrir le client, négocier, vendre une solution adaptée, construire une relation durable. c3 organiser et animer un évènement commercial salon, portes ouvertes, animation de point de vente : organiser, animer, faire le bilan. c4 exploiter et mutualiser l'information commerciale collecter, analyser, partager l'information ; faire des propositions. 02 · le déroulement de l'épreuve 09 · c2 : b2b, réclamations, fidélisation 03 · réussir ses fiches e4 10 · c3 : l'évènement commercial 04–05 · c1 : portefeuille et prospection 11 · c4 : l'information commerciale 06 · c2 : la communication 12 · les calculs commerciaux 07–08 · c2 : les étapes de la vente 13 · le droit utile 14–15 · la simulation, kit et jour j"},{"t":"Comment se passe l'épreuve","h":"<p class=\"kick tO\">L'épreuve<\/p>\n<h1>Le déroulement de l'épreuve<\/h1>\n<p class=\"mut\">Ta forme dépend de ton statut : en lycée ou en CFA habilité, c'est en général le CCF ; en candidat libre ou dans certains centres, c'est l'épreuve ponctuelle. Vérifie auprès de ton établissement.<\/p>\n<div class=\"card dark\" style=\"gap:10px\"><h3>L'épreuve ponctuelle : 40 min de préparation, puis 1 h d'oral en 3 temps<\/h3>\n<div class=\"bar\" style=\"display:flex;height:50px;border-radius:12px;overflow:hidden;font-weight:700;font-size:12.5px\">\n<div class=\"fB\" style=\"flex:1;display:flex;align-items:center;padding-left:12px;color:#FFFFFF\">1 · Ciblage et prospection · 20 min<\/div>\n<div class=\"fO\" style=\"flex:1;display:flex;align-items:center;padding-left:12px;color:#16182B\">2 · Simulation · 20 min<\/div>\n<div class=\"fG\" style=\"flex:1;display:flex;align-items:center;padding-left:12px;color:#FFFFFF\">3 · Information · 20 min<\/div>\n<\/div>\n<div class=\"g3 sm\" style=\"color:#E4E5EE\"><span>Tu présentes ta démarche de ciblage et de prospection (10 min max), puis entretien avec le jury (10 min max).<\/span><span>À partir d'une « fiche-sujet » qui modifie une de tes deux fiches : une vente ou un échange sur un évènement, joué avec un membre du jury. Puis échange sur ta prestation.<\/span><span>Tu présentes comment tu as exploité et partagé l'information sur tes deux activités (10 min max), puis entretien (10 min max).<\/span><\/div>\n<\/div>\n<div class=\"g2\">\n<div class=\"card\"><h3>Le CCF : 2 situations<\/h3><ul class=\"sm\"><li><b>Situation A<\/b> : ciblage, prospection, exploitation et partage de l'information, à partir des activités de ton dossier, évalués pendant la formation.<\/li><li><b>Situation B<\/b> : une simulation de 20 min sur une fiche-sujet remise à l'avance, suivie d'un échange et d'une analyse de ta prestation.<\/li><\/ul><\/div>\n<div class=\"card\"><h3>Le jury<\/h3><ul class=\"sm\"><li>En ponctuel : un professeur du bloc 1 et un professionnel.<\/li><li>En CCF : tes professeurs du bloc 1, parfois avec des professionnels.<\/li><li>Seule ta <b>prestation<\/b> est notée, pas le dossier lui-même.<\/li><\/ul><\/div>\n<\/div>\n<div class=\"card cY\"><h3>La fiche-sujet de la simulation<\/h3><p class=\"sm\">Elle reprend une de tes deux activités en changeant des paramètres : un autre client, une objection nouvelle, un budget réduit, un délai plus court… Les changements sont importants mais réalistes. Pendant la préparation, tu peux utiliser ton dossier et tes propres outils numériques, chargés à l'avance.<\/p><\/div>\n<h2>Ce que le jury regarde<\/h2>\n<table class=\"tb\">\n<tr><th style=\"width:26%\">Compétence<\/th><th>Critères de la grille nationale<\/th><\/tr>\n<tr><td class=\"tB\">C1 · Cibler, prospecter<\/td><td>Analyse pertinente du portefeuille, prospects bien qualifiés, cohérence entre ciblage et prospection, efficacité des choix, usage pertinent des réseaux<\/td><\/tr>\n<tr><td class=\"tO\">C2 · Négocier<\/td><td>Qualité de la relation, efficacité de la négociation, solution adaptée et personnalisée, qualité du diagnostic, engagements respectés, relation enrichie<\/td><\/tr>\n<tr><td class=\"tP\">C3 · Évènement<\/td><td>Choix pertinent, organisation efficace malgré les contraintes, qualité de l'animation, bilan quantitatif et qualitatif juste, suivi rigoureux des contacts<\/td><\/tr>\n<tr><td class=\"tG\">C4 · Information<\/td><td>Information pertinente et de qualité, bien sélectionnée et hiérarchisée, analyses et propositions de qualité<\/td><\/tr>\n<\/table>","x":"l'épreuve le déroulement de l'épreuve ta forme dépend de ton statut : en lycée ou en cfa habilité, c'est en général le ccf ; en candidat libre ou dans certains centres, c'est l'épreuve ponctuelle. vérifie auprès de ton établissement. l'épreuve ponctuelle : 40 min de préparation, puis 1 h d'oral en 3 temps 1 · ciblage et prospection · 20 min 2 · simulation · 20 min 3 · information · 20 min tu présentes ta démarche de ciblage et de prospection (10 min max), puis entretien avec le jury (10 min max). à partir d'une « fiche-sujet » qui modifie une de tes deux fiches : une vente ou un échange sur un évènement, joué avec un membre du jury. puis échange sur ta prestation. tu présentes comment tu as exploité et partagé l'information sur tes deux activités (10 min max), puis entretien (10 min max). le ccf : 2 situations situation a : ciblage, prospection, exploitation et partage de l'information, à partir des activités de ton dossier, évalués pendant la formation. situation b : une simulation de 20 min sur une fiche-sujet remise à l'avance, suivie d'un échange et d'une analyse de ta prestation. le jury en ponctuel : un professeur du bloc 1 et un professionnel. en ccf : tes professeurs du bloc 1, parfois avec des professionnels. seule ta prestation est notée, pas le dossier lui-même. la fiche-sujet de la simulation elle reprend une de tes deux activités en changeant des paramètres : un autre client, une objection nouvelle, un budget réduit, un délai plus court… les changements sont importants mais réalistes. pendant la préparation, tu peux utiliser ton dossier et tes propres outils numériques, chargés à l'avance. ce que le jury regarde compétence critères de la grille nationale c1 · cibler, prospecter analyse pertinente du portefeuille, prospects bien qualifiés, cohérence entre ciblage et prospection, efficacité des choix, usage pertinent des réseaux c2 · négocier qualité de la relation, efficacité de la négociation, solution adaptée et personnalisée, qualité du diagnostic, engagements respectés, relation enrichie c3 · évènement choix pertinent, organisation efficace malgré les contraintes, qualité de l'animation, bilan quantitatif et qualitatif juste, suivi rigoureux des contacts c4 · information information pertinente et de qualité, bien sélectionnée et hiérarchisée, analyses et propositions de qualité"},{"t":"Réussir ses fiches E4","h":"<p class=\"kick tO\">L'épreuve<\/p>\n<h1>Réussir ses fiches E4<\/h1>\n<div class=\"card dark\" style=\"padding:16px 20px\"><p class=\"kick\" style=\"color:#FFB79A\">Attention<\/p><p style=\"font-size:15px;line-height:1.5\">Un dossier non conforme (non déposé, en retard, stage trop court, attestation manquante ou non signée) rend l'épreuve <b>non valide<\/b> : tu ne peux pas la passer, et donc pas obtenir le diplôme cette année-là.<\/p><\/div>\n<h2>Ce que contient le dossier<\/h2>\n<div class=\"g3\">\n<div class=\"card cO\"><span class=\"tag fO\">Fiche 1<\/span><h3>Négociation-vente et accompagnement de la relation client<\/h3><p class=\"sm\">Une vraie vente que tu as menée ou observée en entreprise.<\/p><\/div>\n<div class=\"card cP\"><span class=\"tag fP\">Fiche 2<\/span><h3>Organisation et animation d'un évènement commercial<\/h3><p class=\"sm\">Un vrai évènement : salon, portes ouvertes, animation en magasin…<\/p><\/div>\n<div class=\"card\"><span class=\"tag\" style=\"background:#16182B\">En plus<\/span><h3>Annexes et attestations<\/h3><p class=\"sm\">Une annexe recto-verso par fiche qui présente l'offre commerciale, et les attestations de stage ou de travail.<\/p><\/div>\n<\/div>\n<p class=\"sm mut\">Les fiches suivent le modèle national, avec toutes les rubriques remplies. Elles sont tapées à l'ordinateur et déposées dans les délais fixés par ton académie (ex. Île-de-France 2026 : dépôt sur Cyclades début avril).<\/p>\n<h2>Les 3 analyses que chaque fiche doit contenir<\/h2>\n<div class=\"g3\">\n<div class=\"card cB\"><h3>L'analyse en amont<\/h3><p class=\"sm\">Comment tu as ciblé et prospecté le client ou les visiteurs : portefeuille, cible, fichier, méthode, résultats.<\/p><\/div>\n<div class=\"card cG\"><h3>L'analyse de l'information<\/h3><p class=\"sm\">Le marché, le client, le secteur, la veille, et comment tu as partagé l'information (CRM, compte rendu, réunion).<\/p><\/div>\n<div class=\"card cY\"><h3>L'analyse réflexive<\/h3><p class=\"sm\">Ce qui a marché, ce qui n'a pas marché, ce que tu ferais autrement. Le jury y tient beaucoup.<\/p><\/div>\n<\/div>\n<h2>Les conseils qui font la différence<\/h2>\n<div class=\"g2\">\n<div class=\"card\"><ul class=\"sm\"><li><b>Chiffre tout<\/b> : nombre de contacts, taux de transformation, CA, marge, budget, coût par contact.<\/li><li><b>Choisis des activités riches<\/b> : une vente avec de vraies objections, une négociation de prix, un évènement que tu as vraiment organisé.<\/li><li><b>Sois honnête<\/b> : une activité observée est acceptée, mais dis-le.<\/li><\/ul><\/div>\n<div class=\"card\"><ul class=\"sm\"><li><b>Connais tes fiches par cœur<\/b> : le jury va modifier un paramètre pour la simulation.<\/li><li><b>Prépare l'offre<\/b> : prix, caractéristiques, concurrents, conditions de vente. C'est ta base pour argumenter.<\/li><li><b>Relis<\/b> : orthographe et présentation donnent la première impression.<\/li><\/ul><\/div>\n<\/div>","x":"l'épreuve réussir ses fiches e4 attention un dossier non conforme (non déposé, en retard, stage trop court, attestation manquante ou non signée) rend l'épreuve non valide : tu ne peux pas la passer, et donc pas obtenir le diplôme cette année-là. ce que contient le dossier fiche 1 négociation-vente et accompagnement de la relation client une vraie vente que tu as menée ou observée en entreprise. fiche 2 organisation et animation d'un évènement commercial un vrai évènement : salon, portes ouvertes, animation en magasin… en plus annexes et attestations une annexe recto-verso par fiche qui présente l'offre commerciale, et les attestations de stage ou de travail. les fiches suivent le modèle national, avec toutes les rubriques remplies. elles sont tapées à l'ordinateur et déposées dans les délais fixés par ton académie (ex. île-de-france 2026 : dépôt sur cyclades début avril). les 3 analyses que chaque fiche doit contenir l'analyse en amont comment tu as ciblé et prospecté le client ou les visiteurs : portefeuille, cible, fichier, méthode, résultats. l'analyse de l'information le marché, le client, le secteur, la veille, et comment tu as partagé l'information (crm, compte rendu, réunion). l'analyse réflexive ce qui a marché, ce qui n'a pas marché, ce que tu ferais autrement. le jury y tient beaucoup. les conseils qui font la différence chiffre tout : nombre de contacts, taux de transformation, ca, marge, budget, coût par contact. choisis des activités riches : une vente avec de vraies objections, une négociation de prix, un évènement que tu as vraiment organisé. sois honnête : une activité observée est acceptée, mais dis-le. connais tes fiches par cœur : le jury va modifier un paramètre pour la simulation. prépare l'offre : prix, caractéristiques, concurrents, conditions de vente. c'est ta base pour argumenter. relis : orthographe et présentation donnent la première impression."},{"t":"Analyser le portefeuille et cibler","h":"<div class=\"row\" style=\"align-items:center;gap:14px\"><div class=\"fB\" style=\"width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#FFFFFF\"><span class=\"bign\">C1<\/span><\/div><div style=\"display:flex;flex-direction:column;gap:2px\"><p class=\"kick mut\">Cibler et prospecter · 1/2<\/p><h1 style=\"font-size:31px\">Analyser le portefeuille et cibler<\/h1><\/div><\/div><p class=\"mut\">Avant de prospecter, il faut savoir qui sont tes clients, lesquels rapportent, et qui viser.<\/p>\n<div class=\"g2\" style=\"align-items:start\">\n<div style=\"display:flex;flex-direction:column;gap:10px\"><div class=\"card cB\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fB\">Politique commerciale<\/span><h3>Le cadre<\/h3><div class=\"mini\"><div class=\"def\"><b>Marketing stratégique<\/b> · choisir ses marchés : segmentation, ciblage, positionnement<\/div><div class=\"def\"><b>Marketing opérationnel<\/b> · le mix (4P) : produit, prix, distribution (place), communication (promotion)<\/div><div class=\"def\"><b>Positionnement<\/b> · la place que l'on veut occuper dans l'esprit du client face aux concurrents<\/div><div class=\"def\"><b>Marketing relationnel<\/b> · conquérir puis fidéliser : il coûte moins cher de garder un client que d'en trouver un nouveau<\/div><\/div><\/div><div class=\"card cB\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fB\">Segmenter<\/span><h3>Les critères<\/h3><div class=\"mini\"><div class=\"def\"><b>B2C<\/b> · géographiques, sociodémographiques (âge, revenu, CSP), psychographiques (style de vie), comportementaux (fréquence, fidélité)<\/div><div class=\"def\"><b>B2B<\/b> · secteur, taille (effectif, CA), localisation, potentiel, statut (client, ancien client, prospect)<\/div><div class=\"def\"><b>Cible<\/b> · le segment que l'on choisit de viser en priorité, selon son potentiel et sa rentabilité<\/div><\/div><\/div><\/div>\n<div style=\"display:flex;flex-direction:column;gap:10px\"><div class=\"card cB\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fB\">Analyser le portefeuille<\/span><h3>Les indicateurs<\/h3><div class=\"mini\"><div class=\"def\"><b>CA et marge par client<\/b> · qui rapporte vraiment ?<\/div><div class=\"def\"><b>Fréquence d'achat, panier moyen<\/b> · comment achète-t-il ?<\/div><div class=\"def\"><b>Taux de fidélité, taux d'attrition<\/b> · qui reste, qui part ?<\/div><div class=\"def\"><b>Taux de recrutement<\/b> · part de nouveaux clients sur la période<\/div><div class=\"def\"><b>Valeur client<\/b> · ce qu'un client rapporte sur toute la durée de la relation<\/div><div class=\"def\"><b>Potentiel<\/b> · ce qu'il pourrait acheter de plus<\/div><\/div><\/div>\n<div class=\"card cY\" style=\"gap:6px\"><h3>La méthode ABC (loi de Pareto)<\/h3><p class=\"sm\">On classe les clients par CA décroissant. Souvent, environ <b>20 % des clients font 80 % du CA<\/b> (règle empirique, à vérifier sur tes chiffres).<\/p>\n<div class=\"bar\" style=\"display:flex;height:34px;border-radius:10px;overflow:hidden;font-weight:700;font-size:12px;color:#FFFFFF\"><div class=\"fB\" style=\"flex:20;display:flex;align-items:center;justify-content:center\">A · à choyer<\/div><div style=\"flex:30;display:flex;align-items:center;justify-content:center;background:#6F86E8\">B · à développer<\/div><div style=\"flex:50;display:flex;align-items:center;justify-content:center;background:#9AA3C7;color:#16182B\">C · à rentabiliser<\/div><\/div><\/div>\n<\/div>\n<\/div>\n<div class=\"card dark\"><h3>Le réflexe jury<\/h3><p class=\"sm\" style=\"color:#E4E5EE\">« Pourquoi avez-vous choisi ce client ou cette cible ? » Réponds avec des chiffres : sa part du CA, son potentiel, son ancienneté, son segment.<\/p><\/div>","x":"c1 cibler et prospecter · 1/2 analyser le portefeuille et cibler avant de prospecter, il faut savoir qui sont tes clients, lesquels rapportent, et qui viser. politique commerciale le cadre marketing stratégique · choisir ses marchés : segmentation, ciblage, positionnement marketing opérationnel · le mix (4p) : produit, prix, distribution (place), communication (promotion) positionnement · la place que l'on veut occuper dans l'esprit du client face aux concurrents marketing relationnel · conquérir puis fidéliser : il coûte moins cher de garder un client que d'en trouver un nouveau segmenter les critères b2c · géographiques, sociodémographiques (âge, revenu, csp), psychographiques (style de vie), comportementaux (fréquence, fidélité) b2b · secteur, taille (effectif, ca), localisation, potentiel, statut (client, ancien client, prospect) cible · le segment que l'on choisit de viser en priorité, selon son potentiel et sa rentabilité analyser le portefeuille les indicateurs ca et marge par client · qui rapporte vraiment ? fréquence d'achat, panier moyen · comment achète-t-il ? taux de fidélité, taux d'attrition · qui reste, qui part ? taux de recrutement · part de nouveaux clients sur la période valeur client · ce qu'un client rapporte sur toute la durée de la relation potentiel · ce qu'il pourrait acheter de plus la méthode abc (loi de pareto) on classe les clients par ca décroissant. souvent, environ 20 % des clients font 80 % du ca (règle empirique, à vérifier sur tes chiffres). a · à choyer b · à développer c · à rentabiliser le réflexe jury « pourquoi avez-vous choisi ce client ou cette cible ? » réponds avec des chiffres : sa part du ca, son potentiel, son ancienneté, son segment."},{"t":"Prospecter et évaluer","h":"<div class=\"row\" style=\"align-items:center;gap:14px\"><div class=\"fB\" style=\"width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#FFFFFF\"><span class=\"bign\">C1<\/span><\/div><div style=\"display:flex;flex-direction:column;gap:2px\"><p class=\"kick mut\">Cibler et prospecter · 2/2<\/p><h1 style=\"font-size:31px\">Prospecter et évaluer<\/h1><\/div><\/div><div class=\"g4\"><div class=\"step\"><span class=\"bign tB\" style=\"font-size:24px\">1<\/span><b>Fixer l'objectif<\/b><span>SMART : spécifique, mesurable, atteignable, réaliste, temporel. Ex. 10 rendez-vous en 3 semaines.<\/span><\/div><div class=\"step\"><span class=\"bign tB\" style=\"font-size:24px\">2<\/span><b>Construire le fichier<\/b><span>Fichier interne, achat ou location, annuaires, LinkedIn, salons. Puis le qualifier.<\/span><\/div><div class=\"step\"><span class=\"bign tB\" style=\"font-size:24px\">3<\/span><b>Choisir les outils<\/b><span>Téléphone, e-mailing, réseaux sociaux, visites, salons, recommandation.<\/span><\/div><div class=\"step\"><span class=\"bign tB\" style=\"font-size:24px\">4<\/span><b>Évaluer<\/b><span>Taux de réponse, de rendez-vous, de transformation, coût par contact, retour sur investissement.<\/span><\/div><\/div>\n<div class=\"g2\" style=\"align-items:start\"><div class=\"card cB\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fB\">Téléphone<\/span><h3>Le plan d'appel CROC<\/h3><div class=\"mini\"><div class=\"def\"><b>Contact<\/b> · se présenter, vérifier qu'on parle à la bonne personne<\/div><div class=\"def\"><b>Raison<\/b> · pourquoi on appelle, avec une accroche centrée sur le client<\/div><div class=\"def\"><b>Objectif<\/b> · obtenir le rendez-vous en proposant deux créneaux (alternative)<\/div><div class=\"def\"><b>Conclusion<\/b> · reformuler l'accord, remercier, confirmer par écrit<\/div><div class=\"def\"><b>Barrage de l'assistant<\/b> · rester courtois, être précis, demander le meilleur moment pour rappeler<\/div><\/div><\/div><div class=\"card cB\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fB\">Qualifier<\/span><h3>Un prospect qualifié<\/h3><div class=\"mini\"><div class=\"def\"><b>Besoin<\/b> · a-t-il un besoin réel ?<\/div><div class=\"def\"><b>Budget<\/b> · a-t-il les moyens ?<\/div><div class=\"def\"><b>Décideur<\/b> · parle-t-on à celui qui décide ?<\/div><div class=\"def\"><b>Délai<\/b> · quand compte-t-il acheter ?<\/div><div class=\"def\"><b>Réseaux professionnels<\/b> · CCI, clubs d'entreprises, LinkedIn, salons, parrainage : ils apportent des recommandations, la source de prospects la plus efficace<\/div><\/div><\/div><\/div>\n<h2>Les indicateurs d'évaluation<\/h2>\n<table class=\"tb\">\n<tr><th style=\"width:30%\">Indicateur<\/th><th style=\"width:40%\">Calcul<\/th><th>Ce qu'il mesure<\/th><\/tr>\n<tr><td>Taux de joignabilité<\/td><td>contacts joints / appels passés × 100<\/td><td>La qualité du fichier<\/td><\/tr>\n<tr><td>Taux de rendez-vous<\/td><td>rendez-vous obtenus / contacts joints × 100<\/td><td>L'efficacité de ton discours<\/td><\/tr>\n<tr><td>Taux de transformation<\/td><td>ventes / rendez-vous × 100<\/td><td>L'efficacité en entretien<\/td><\/tr>\n<tr><td>Coût par contact<\/td><td>coût total de l'action / nombre de contacts<\/td><td>La rentabilité de la méthode<\/td><\/tr>\n<tr><td>Retour sur investissement<\/td><td>(marge générée − coût) / coût × 100<\/td><td>Si l'action a rapporté plus qu'elle n'a coûté<\/td><\/tr>\n<\/table>\n<div class=\"card cY\"><h3>Attention au droit<\/h3><p class=\"sm\">Depuis le 11 août 2026, appeler un particulier pour le prospecter exige son <b>consentement préalable<\/b> (Bloctel a disparu). En e-mail aussi, il faut l'accord préalable des particuliers. Les règles B2B sont plus souples : vois la page 13.<\/p><\/div>","x":"c1 cibler et prospecter · 2/2 prospecter et évaluer 1 fixer l'objectif smart : spécifique, mesurable, atteignable, réaliste, temporel. ex. 10 rendez-vous en 3 semaines. 2 construire le fichier fichier interne, achat ou location, annuaires, linkedin, salons. puis le qualifier. 3 choisir les outils téléphone, e-mailing, réseaux sociaux, visites, salons, recommandation. 4 évaluer taux de réponse, de rendez-vous, de transformation, coût par contact, retour sur investissement. téléphone le plan d'appel croc contact · se présenter, vérifier qu'on parle à la bonne personne raison · pourquoi on appelle, avec une accroche centrée sur le client objectif · obtenir le rendez-vous en proposant deux créneaux (alternative) conclusion · reformuler l'accord, remercier, confirmer par écrit barrage de l'assistant · rester courtois, être précis, demander le meilleur moment pour rappeler qualifier un prospect qualifié besoin · a-t-il un besoin réel ? budget · a-t-il les moyens ? décideur · parle-t-on à celui qui décide ? délai · quand compte-t-il acheter ? réseaux professionnels · cci, clubs d'entreprises, linkedin, salons, parrainage : ils apportent des recommandations, la source de prospects la plus efficace les indicateurs d'évaluation indicateur calcul ce qu'il mesure taux de joignabilité contacts joints / appels passés × 100 la qualité du fichier taux de rendez-vous rendez-vous obtenus / contacts joints × 100 l'efficacité de ton discours taux de transformation ventes / rendez-vous × 100 l'efficacité en entretien coût par contact coût total de l'action / nombre de contacts la rentabilité de la méthode retour sur investissement (marge générée − coût) / coût × 100 si l'action a rapporté plus qu'elle n'a coûté attention au droit depuis le 11 août 2026, appeler un particulier pour le prospecter exige son consentement préalable (bloctel a disparu). en e-mail aussi, il faut l'accord préalable des particuliers. les règles b2b sont plus souples : vois la page 13."},{"t":"La communication interpersonnelle","h":"<div class=\"row\" style=\"align-items:center;gap:14px\"><div class=\"fO\" style=\"width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#FFFFFF\"><span class=\"bign\">C2<\/span><\/div><div style=\"display:flex;flex-direction:column;gap:2px\"><p class=\"kick mut\">Négocier · 1/4<\/p><h1 style=\"font-size:31px\">La communication interpersonnelle<\/h1><\/div><\/div><p class=\"mut\">Avant les techniques de vente, il y a la relation. C'est le premier critère du jury : la qualité de la relation interpersonnelle.<\/p>\n<div class=\"card cO\" style=\"gap:8px\"><h3>Le schéma de la communication<\/h3>\n<div style=\"display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;flex-wrap:wrap\"><span class=\"chip\">Émetteur<\/span><span>→<\/span><span class=\"chip\">Message (code)<\/span><span>→<\/span><span class=\"chip\">Canal<\/span><span>→<\/span><span class=\"chip\">Récepteur<\/span><span>→<\/span><span class=\"chip\">Feedback<\/span><\/div>\n<p class=\"sm\">Les « bruits » (fatigue, vocabulaire technique, environnement bruyant) déforment le message : d'où l'importance de reformuler et de vérifier la compréhension.<\/p><\/div>\n<div class=\"g2\" style=\"align-items:start\">\n<div style=\"display:flex;flex-direction:column;gap:10px\"><div class=\"card cO\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fO\">Les 3 canaux<\/span><h3>Verbal, paraverbal, non verbal<\/h3><div class=\"mini\"><div class=\"def\"><b>Verbal<\/b> · les mots choisis : positifs, précis, adaptés au client<\/div><div class=\"def\"><b>Paraverbal<\/b> · la voix : ton, débit, volume, silences<\/div><div class=\"def\"><b>Non verbal<\/b> · posture, regard, sourire, gestes, distance<\/div><div class=\"def\"><b>Mehrabian (7 %, 38 %, 55 %)<\/b> · souvent cité, mais seulement valable pour exprimer des émotions : à citer avec prudence<\/div><\/div><\/div><div class=\"card cO\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fO\">Écouter<\/span><h3>L'écoute active<\/h3><div class=\"mini\"><div class=\"def\"><b>Attitude<\/b> · regarder, acquiescer, ne pas couper, prendre des notes<\/div><div class=\"def\"><b>Reformulation écho<\/b> · reprendre les mots du client<\/div><div class=\"def\"><b>Reformulation résumé<\/b> · « Si je comprends bien, vous cherchez… »<\/div><div class=\"def\"><b>Empathie<\/b> · comprendre le point de vue du client sans forcément l'approuver<\/div><\/div><\/div><\/div>\n<div style=\"display:flex;flex-direction:column;gap:10px\"><div class=\"card cO\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fO\">Questionner<\/span><h3>Les types de questions<\/h3><div class=\"mini\"><div class=\"def\"><b>Ouverte<\/b> · fait parler : « Comment utilisez-vous… ? »<\/div><div class=\"def\"><b>Fermée<\/b> · oui ou non : pour valider<\/div><div class=\"def\"><b>Alternative<\/b> · deux choix : « mardi ou jeudi ? »<\/div><div class=\"def\"><b>Relais<\/b> · relance : « C'est-à-dire ? »<\/div><div class=\"def\"><b>Entonnoir<\/b> · aller du général au précis<\/div><\/div><\/div><div class=\"card cO\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fO\">Les relations<\/span><h3>Repères psychologiques<\/h3><div class=\"mini\"><div class=\"def\"><b>Analyse transactionnelle (Berne)<\/b> · trois états du moi : Parent, Adulte, Enfant. Le vendeur vise l'Adulte-Adulte : calme, factuel<\/div><div class=\"def\"><b>Positions de vie<\/b> · « je suis OK, tu es OK » : la relation gagnant-gagnant<\/div><div class=\"def\"><b>Rapport de force<\/b> · savoir qui a le pouvoir (taille, urgence, alternatives) pour adapter sa stratégie<\/div><\/div><\/div><\/div>\n<\/div>","x":"c2 négocier · 1/4 la communication interpersonnelle avant les techniques de vente, il y a la relation. c'est le premier critère du jury : la qualité de la relation interpersonnelle. le schéma de la communication émetteur → message (code) → canal → récepteur → feedback les « bruits » (fatigue, vocabulaire technique, environnement bruyant) déforment le message : d'où l'importance de reformuler et de vérifier la compréhension. les 3 canaux verbal, paraverbal, non verbal verbal · les mots choisis : positifs, précis, adaptés au client paraverbal · la voix : ton, débit, volume, silences non verbal · posture, regard, sourire, gestes, distance mehrabian (7 %, 38 %, 55 %) · souvent cité, mais seulement valable pour exprimer des émotions : à citer avec prudence écouter l'écoute active attitude · regarder, acquiescer, ne pas couper, prendre des notes reformulation écho · reprendre les mots du client reformulation résumé · « si je comprends bien, vous cherchez… » empathie · comprendre le point de vue du client sans forcément l'approuver questionner les types de questions ouverte · fait parler : « comment utilisez-vous… ? » fermée · oui ou non : pour valider alternative · deux choix : « mardi ou jeudi ? » relais · relance : « c'est-à-dire ? » entonnoir · aller du général au précis les relations repères psychologiques analyse transactionnelle (berne) · trois états du moi : parent, adulte, enfant. le vendeur vise l'adulte-adulte : calme, factuel positions de vie · « je suis ok, tu es ok » : la relation gagnant-gagnant rapport de force · savoir qui a le pouvoir (taille, urgence, alternatives) pour adapter sa stratégie"},{"t":"Les étapes de la vente (1/2)","h":"<div class=\"row\" style=\"align-items:center;gap:14px\"><div class=\"fO\" style=\"width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#FFFFFF\"><span class=\"bign\">C2<\/span><\/div><div style=\"display:flex;flex-direction:column;gap:2px\"><p class=\"kick mut\">Négocier · 2/4<\/p><h1 style=\"font-size:31px\">Les étapes de la vente (1/2)<\/h1><\/div><\/div>\n<div style=\"display:flex;gap:6px;flex-wrap:wrap\"><span class=\"tag fO\">1 Préparer<\/span><span class=\"tag fO\">2 Prendre contact<\/span><span class=\"tag fO\">3 Découvrir<\/span><span class=\"tag\" style=\"background:#9AA3C7;color:#16182B\">4 Argumenter<\/span><span class=\"tag\" style=\"background:#9AA3C7;color:#16182B\">5 Traiter les objections<\/span><span class=\"tag\" style=\"background:#9AA3C7;color:#16182B\">6 Négocier le prix<\/span><span class=\"tag\" style=\"background:#9AA3C7;color:#16182B\">7 Conclure<\/span><span class=\"tag\" style=\"background:#9AA3C7;color:#16182B\">8 Prendre congé<\/span><\/div>\n<div class=\"card cO\"><h3>1 · Préparer l'entretien<\/h3>\n<div class=\"g2 sm\" style=\"gap:6px 18px\"><span><b>Objectifs<\/b> : un objectif idéal et un objectif minimum (ce qu'on accepte au pire).<\/span><span><b>Fiche client<\/b> : historique, besoins connus, interlocuteurs, CA, litiges passés.<\/span><span><b>Argumentaire<\/b> : 3 ou 4 arguments forts, avec preuves.<\/span><span><b>Marges de manœuvre<\/b> : prix plancher, remises possibles, concessions et contreparties.<\/span><span><b>Objections probables<\/b> et réponses prêtes.<\/span><span><b>Outils<\/b> : catalogue, tablette, échantillons, simulateur, bon de commande.<\/span><\/div><\/div>\n<div class=\"card cO\"><h3>2 · Prendre contact : la règle des 4 × 20<\/h3>\n<div class=\"g4 sm\" style=\"gap:8px\"><div class=\"card\" style=\"background:#FFFFFF;padding:10px\"><b>20 secondes<\/b>la première impression se joue tout de suite<\/div><div class=\"card\" style=\"background:#FFFFFF;padding:10px\"><b>20 premiers mots<\/b>bonjour, présentation, objet de la visite<\/div><div class=\"card\" style=\"background:#FFFFFF;padding:10px\"><b>20 premiers gestes<\/b>poignée de main, posture ouverte<\/div><div class=\"card\" style=\"background:#FFFFFF;padding:10px\"><b>20 cm du visage<\/b>le sourire et le regard<\/div><\/div><\/div>\n<div class=\"card cO\" style=\"gap:8px\"><h3>3 · Découvrir les besoins : l'étape la plus importante<\/h3>\n<p class=\"sm\">Le client doit parler 70 % du temps. Utilise <b>QQOQCCP<\/b> (qui, quoi, où, quand, comment, combien, pourquoi) et repère ses motivations avec <b>SONCAS<\/b> :<\/p>\n<div style=\"display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px\">\n<div class=\"card\" style=\"background:#FFFFFF;padding:8px;gap:2px\"><span class=\"bign tO\" style=\"font-size:22px\">S<\/span><b class=\"sm\">Sécurité<\/b><span class=\"mini\">garantie, fiabilité<\/span><\/div>\n<div class=\"card\" style=\"background:#FFFFFF;padding:8px;gap:2px\"><span class=\"bign tO\" style=\"font-size:22px\">O<\/span><b class=\"sm\">Orgueil<\/b><span class=\"mini\">prestige, image<\/span><\/div>\n<div class=\"card\" style=\"background:#FFFFFF;padding:8px;gap:2px\"><span class=\"bign tO\" style=\"font-size:22px\">N<\/span><b class=\"sm\">Nouveauté<\/b><span class=\"mini\">innovation, mode<\/span><\/div>\n<div class=\"card\" style=\"background:#FFFFFF;padding:8px;gap:2px\"><span class=\"bign tO\" style=\"font-size:22px\">C<\/span><b class=\"sm\">Confort<\/b><span class=\"mini\">simplicité, gain de temps<\/span><\/div>\n<div class=\"card\" style=\"background:#FFFFFF;padding:8px;gap:2px\"><span class=\"bign tO\" style=\"font-size:22px\">A<\/span><b class=\"sm\">Argent<\/b><span class=\"mini\">prix, économies<\/span><\/div>\n<div class=\"card\" style=\"background:#FFFFFF;padding:8px;gap:2px\"><span class=\"bign tO\" style=\"font-size:22px\">S<\/span><b class=\"sm\">Sympathie<\/b><span class=\"mini\">relation, confiance<\/span><\/div>\n<\/div>\n<p class=\"sm\">On ajoute souvent un <b>E<\/b> (SONCASE) pour l'<b>Environnement<\/b> : produits durables, éthiques.<\/p>\n<p class=\"sm\"><b>Finir par une reformulation<\/b> : « Si je résume, vous cherchez… est-ce bien cela ? » Le client dit « oui » : tu peux argumenter.<\/p><\/div>","x":"c2 négocier · 2/4 les étapes de la vente (1/2) 1 préparer 2 prendre contact 3 découvrir 4 argumenter 5 traiter les objections 6 négocier le prix 7 conclure 8 prendre congé 1 · préparer l'entretien objectifs : un objectif idéal et un objectif minimum (ce qu'on accepte au pire). fiche client : historique, besoins connus, interlocuteurs, ca, litiges passés. argumentaire : 3 ou 4 arguments forts, avec preuves. marges de manœuvre : prix plancher, remises possibles, concessions et contreparties. objections probables et réponses prêtes. outils : catalogue, tablette, échantillons, simulateur, bon de commande. 2 · prendre contact : la règle des 4 × 20 20 secondes la première impression se joue tout de suite 20 premiers mots bonjour, présentation, objet de la visite 20 premiers gestes poignée de main, posture ouverte 20 cm du visage le sourire et le regard 3 · découvrir les besoins : l'étape la plus importante le client doit parler 70 % du temps. utilise qqoqccp (qui, quoi, où, quand, comment, combien, pourquoi) et repère ses motivations avec soncas : s sécurité garantie, fiabilité o orgueil prestige, image n nouveauté innovation, mode c confort simplicité, gain de temps a argent prix, économies s sympathie relation, confiance on ajoute souvent un e (soncase) pour l' environnement : produits durables, éthiques. finir par une reformulation : « si je résume, vous cherchez… est-ce bien cela ? » le client dit « oui » : tu peux argumenter."},{"t":"Les étapes de la vente (2/2)","h":"<div class=\"row\" style=\"align-items:center;gap:14px\"><div class=\"fO\" style=\"width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#FFFFFF\"><span class=\"bign\">C2<\/span><\/div><div style=\"display:flex;flex-direction:column;gap:2px\"><p class=\"kick mut\">Négocier · 3/4<\/p><h1 style=\"font-size:31px\">Les étapes de la vente (2/2)<\/h1><\/div><\/div>\n<div class=\"g2\" style=\"align-items:start\">\n<div class=\"card cO\" style=\"gap:6px\"><h3>4 · Argumenter avec la méthode CAP<\/h3>\n<div class=\"g3\" style=\"gap:6px\"><div class=\"card\" style=\"background:#FFFFFF;padding:8px\"><b>Caractéristique<\/b><span class=\"mini\">ce qu'est le produit<\/span><\/div><div class=\"card\" style=\"background:#FFFFFF;padding:8px\"><b>Avantage<\/b><span class=\"mini\">ce que ça apporte au client<\/span><\/div><div class=\"card\" style=\"background:#FFFFFF;padding:8px\"><b>Preuve<\/b><span class=\"mini\">démonstration, chiffre, avis, label<\/span><\/div><\/div>\n<p class=\"sm\"><i>« Ce fauteuil a une mousse haute densité (C) : il garde sa forme pendant des années (A). Il est garanti 10 ans, et je vous laisse l'essayer (P). »<\/i> Choisis les arguments qui répondent à son mobile SONCAS.<\/p><\/div>\n<div class=\"card cO\" style=\"gap:6px\"><h3>5 · Traiter les objections<\/h3><p class=\"sm\">Une objection est un signe d'intérêt. Méthode : <b>écouter<\/b> sans couper, <b>reformuler<\/b> ou questionner, <b>répondre<\/b>, <b>valider<\/b> (« Cela répond-il à votre question ? »).<\/p>\n<div class=\"mini\"><div class=\"def\"><b>Oui, mais<\/b> · accepter puis nuancer<\/div><div class=\"def\"><b>Boomerang<\/b> · retourner l'objection en argument (« C'est justement pour ça que… »)<\/div><div class=\"def\"><b>Compensation<\/b> · reconnaître un défaut, mettre en avant un avantage plus fort<\/div><div class=\"def\"><b>Preuve<\/b> · démonstration, témoignage, chiffre<\/div><div class=\"def\"><b>Questionnement<\/b> · « Qu'entendez-vous par trop cher ? »<\/div><div class=\"def\"><b>Report<\/b> · « J'y reviens dans un instant » (si le prix arrive trop tôt)<\/div><\/div><\/div>\n<\/div>\n<div class=\"g2\" style=\"align-items:start\">\n<div class=\"card cO\" style=\"gap:6px\"><h3>6 · Présenter et défendre le prix<\/h3><ul class=\"sm\"><li>Annoncer le prix <b>après<\/b> les avantages, sans hésiter ni s'excuser.<\/li><li><b>Sandwich<\/b> : un avantage, le prix, un autre avantage.<\/li><li><b>Division<\/b> : « soit 1,20 € par jour ».<\/li><li><b>Comparaison<\/b> avec le coût de ne rien faire.<\/li><li>Toute concession contre une <b>contrepartie<\/b> : « Si vous commandez aujourd'hui, alors… »<\/li><li>Des concessions de plus en plus petites, jamais sous le prix plancher.<\/li><\/ul><\/div>\n<div class=\"card cO\" style=\"gap:6px\"><h3>7 · Conclure<\/h3><p class=\"sm\">Repérer les <b>signaux d'achat<\/b> : questions sur la livraison, le paiement, le client qui reprend le produit en main.<\/p><div class=\"mini\"><div class=\"def\"><b>Alternative<\/b> · « En noir ou en gris ? »<\/div><div class=\"def\"><b>Récapitulative<\/b> · résumer les avantages acceptés, puis demander l'accord<\/div><div class=\"def\"><b>Implicite<\/b> · faire comme si c'était décidé : « Je vous la livre mardi ? »<\/div><div class=\"def\"><b>Dernier argument<\/b> · garder un petit avantage pour la fin<\/div><\/div><\/div>\n<\/div>\n<div class=\"card cO\" style=\"gap:6px\"><h3>8 · Prendre congé et préparer la suite<\/h3><div class=\"g3 sm\" style=\"gap:8px\"><span><b>Rassurer<\/b> : féliciter le client pour son choix, rappeler la suite (livraison, installation).<\/span><span><b>Vente additionnelle<\/b> : montée en gamme (<i>up-selling<\/i>) ou produit complémentaire (<i>cross-selling<\/i>).<\/span><span><b>Fidéliser<\/b> : demander une recommandation, programmer un suivi, saisir l'entretien dans le CRM.<\/span><\/div><\/div>","x":"c2 négocier · 3/4 les étapes de la vente (2/2) 4 · argumenter avec la méthode cap caractéristique ce qu'est le produit avantage ce que ça apporte au client preuve démonstration, chiffre, avis, label « ce fauteuil a une mousse haute densité (c) : il garde sa forme pendant des années (a). il est garanti 10 ans, et je vous laisse l'essayer (p). » choisis les arguments qui répondent à son mobile soncas. 5 · traiter les objections une objection est un signe d'intérêt. méthode : écouter sans couper, reformuler ou questionner, répondre , valider (« cela répond-il à votre question ? »). oui, mais · accepter puis nuancer boomerang · retourner l'objection en argument (« c'est justement pour ça que… ») compensation · reconnaître un défaut, mettre en avant un avantage plus fort preuve · démonstration, témoignage, chiffre questionnement · « qu'entendez-vous par trop cher ? » report · « j'y reviens dans un instant » (si le prix arrive trop tôt) 6 · présenter et défendre le prix annoncer le prix après les avantages, sans hésiter ni s'excuser. sandwich : un avantage, le prix, un autre avantage. division : « soit 1,20 € par jour ». comparaison avec le coût de ne rien faire. toute concession contre une contrepartie : « si vous commandez aujourd'hui, alors… » des concessions de plus en plus petites, jamais sous le prix plancher. 7 · conclure repérer les signaux d'achat : questions sur la livraison, le paiement, le client qui reprend le produit en main. alternative · « en noir ou en gris ? » récapitulative · résumer les avantages acceptés, puis demander l'accord implicite · faire comme si c'était décidé : « je vous la livre mardi ? » dernier argument · garder un petit avantage pour la fin 8 · prendre congé et préparer la suite rassurer : féliciter le client pour son choix, rappeler la suite (livraison, installation). vente additionnelle : montée en gamme ( up-selling ) ou produit complémentaire ( cross-selling ). fidéliser : demander une recommandation, programmer un suivi, saisir l'entretien dans le crm."},{"t":"B2B, réclamations et fidélisation","h":"<div class=\"row\" style=\"align-items:center;gap:14px\"><div class=\"fO\" style=\"width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#FFFFFF\"><span class=\"bign\">C2<\/span><\/div><div style=\"display:flex;flex-direction:column;gap:2px\"><p class=\"kick mut\">Négocier · 4/4<\/p><h1 style=\"font-size:31px\">B2B, réclamations et fidélisation<\/h1><\/div><\/div>\n<div class=\"g2\" style=\"align-items:start\">\n<div style=\"display:flex;flex-direction:column;gap:10px\"><div class=\"card cO\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fO\">B2B<\/span><h3>Le centre d'achat<\/h3><div class=\"mini\"><div class=\"def\"><b>Principe<\/b> · en entreprise, plusieurs personnes participent à la décision (Webster et Wind)<\/div><div class=\"def\"><b>Utilisateur<\/b> · celui qui utilisera le produit<\/div><div class=\"def\"><b>Prescripteur<\/b> · celui qui recommande (technicien, consultant)<\/div><div class=\"def\"><b>Acheteur<\/b> · celui qui négocie et passe commande<\/div><div class=\"def\"><b>Décideur<\/b> · celui qui signe<\/div><div class=\"def\"><b>Filtre<\/b> · celui qui contrôle l'accès (assistant)<\/div><div class=\"def\"><b>B2G (vendre au public)<\/b> · marchés publics : appel d'offres, égalité de traitement des candidats, transparence, choix selon des critères annoncés<\/div><\/div><\/div><div class=\"card cO\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fO\">Négocier<\/span><h3>Deux logiques<\/h3><div class=\"mini\"><div class=\"def\"><b>Négociation distributive<\/b> · gagnant-perdant : on se partage un gâteau fixe, rapport de force<\/div><div class=\"def\"><b>Négociation intégrative<\/b> · gagnant-gagnant : on cherche à agrandir le gâteau<\/div><div class=\"def\"><b>Négociation raisonnée (Harvard, Fisher et Ury)<\/b> · traiter séparément les personnes et le problème, se concentrer sur les intérêts plutôt que les positions, imaginer plusieurs options, utiliser des critères objectifs<\/div><div class=\"def\"><b>MESORE<\/b> · meilleure solution de rechange : ce que tu feras si l'accord échoue. Plus elle est bonne, plus tu es fort<\/div><\/div><\/div><\/div>\n<div style=\"display:flex;flex-direction:column;gap:10px\"><div class=\"card cO\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fO\">Litiges<\/span><h3>Traiter une réclamation<\/h3><div class=\"mini\"><div class=\"def\"><b>1 · Écouter<\/b> · laisser le client s'exprimer, sans se justifier<\/div><div class=\"def\"><b>2 · Montrer de l'empathie<\/b> · « Je comprends votre mécontentement »<\/div><div class=\"def\"><b>3 · Comprendre<\/b> · questionner, vérifier les faits<\/div><div class=\"def\"><b>4 · Proposer une solution<\/b> · échange, geste commercial, réparation<\/div><div class=\"def\"><b>5 · Suivre<\/b> · rappeler le client : la réclamation devient une occasion de fidéliser<\/div><\/div><\/div><div class=\"card cO\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fO\">Accompagner<\/span><h3>Fidéliser<\/h3><div class=\"mini\"><div class=\"def\"><b>Suivi après-vente<\/b> · appel de satisfaction, installation, formation, SAV<\/div><div class=\"def\"><b>Mesurer la satisfaction<\/b> · enquêtes, avis, NPS (pourcentage de promoteurs moins pourcentage de détracteurs)<\/div><div class=\"def\"><b>Outils<\/b> · programmes de fidélité, offres personnalisées, newsletters, invitations à des évènements<\/div><div class=\"def\"><b>CRM<\/b> · garder l'historique de chaque client pour personnaliser la relation<\/div><div class=\"def\"><b>Valeur client<\/b> · plus un client reste longtemps, plus il rapporte : c'est l'objectif de la fidélisation<\/div><\/div><\/div><\/div>\n<\/div>","x":"c2 négocier · 4/4 b2b, réclamations et fidélisation b2b le centre d'achat principe · en entreprise, plusieurs personnes participent à la décision (webster et wind) utilisateur · celui qui utilisera le produit prescripteur · celui qui recommande (te
