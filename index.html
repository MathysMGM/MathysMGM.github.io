","Son auteur"],"a":1,"e":"L'aura, c'est-à-dire son caractère unique."},{"id":"cgeq4","q":"Que montre le film Rashōmon de Kurosawa ?","o":["Que la vérité dépend du point de vue","Que la justice est toujours juste","Que la guerre est inutile","Que la magie existe"],"a":0,"e":"Quatre témoignages contradictoires d'un même crime."},{"id":"cgeq5","q":"Que fait Don Quichotte face aux moulins à vent ?","o":["Il les achète","Il les prend pour des géants","Il les peint","Il les ignore"],"a":1,"e":"Il confond la fiction des romans de chevalerie avec la réalité."},{"id":"cgeq6","q":"Qui a parlé du « mentir-vrai » ?","o":["Balzac","Aragon","Orwell","Gide"],"a":1,"e":"Louis Aragon, Le Mentir-vrai : la fiction ment pour dire une vérité."},{"id":"cgeq7","q":"Seahaven est la ville factice de quel film cité par le BO ?","o":["Inception","The Truman Show","Le Prestige","Her"],"a":1,"e":"Dans The Truman Show (Peter Weir, 1998), Truman vit sans le savoir dans le décor de Seahaven."},{"id":"cgeq8","q":"Quel auteur parle d'« hyperréalité » dans La Guerre du faux ?","o":["Umberto Eco","Walter Benjamin","Edgar Morin","Jorge Luis Borges"],"a":0,"e":"Umberto Eco décrit l'hyperréalité américaine, où la copie paraît plus vraie que l'original."},{"id":"cgeq9","q":"Selon Pline l'Ancien, que firent les oiseaux devant les raisins peints par Zeuxis ?","o":["Ils s'enfuirent","Ils vinrent les picorer","Ils les ignorèrent","Ils chantèrent"],"a":1,"e":"Les raisins étaient si réalistes que les oiseaux venaient les picorer : le trompe-l'œil parfait."},{"id":"cgeq10","q":"Qui a théorisé la « suspension volontaire de l'incrédulité » ?","o":["Aristote","Coleridge","Diderot","Platon"],"a":1,"e":"Samuel Taylor Coleridge : on fait semblant d'y croire en sachant que c'est faux."},{"id":"cgeq11","q":"Dans 1984 d'Orwell, quel ministère réécrit le passé ?","o":["Le ministère de la Paix","Le ministère de l'Amour","Le ministère de la Vérité","Le ministère de l'Abondance"],"a":2,"e":"Le « ministère de la Vérité » falsifie les archives."},{"id":"cgeq12","q":"Que raconte L'Adversaire d'Emmanuel Carrère ?","o":["Un faussaire de tableaux","Un homme qui se fait passer pour médecin pendant 18 ans","Une rumeur à Orléans","Une dictature religieuse"],"a":1,"e":"Jean-Claude Romand s'est fait passer pour un médecin de l'OMS pendant 18 ans."},{"id":"cgeq13","q":"Quelle leçon tirer de « La Dent d'or » de Fontenelle ?","o":["L'or est un faux métal","Il faut vérifier les faits avant de les expliquer","Les enfants mentent","La science a toujours raison"],"a":1,"e":"Des savants expliquaient une dent en or… qui n'était qu'une feuille d'or collée."},{"id":"cgeq14","q":"Quelle différence entre désinformation et mésinformation ?","o":["Aucune","La désinformation est volontaire, la mésinformation est de bonne foi","La mésinformation est volontaire","La désinformation ne concerne que la presse"],"a":1,"e":"Désinformation : faux diffusé volontairement. Mésinformation : faux partagé de bonne foi."},{"id":"cgeq15","q":"Selon l'étude du MIT (2018), une fausse info atteint 1 500 personnes environ…","o":["2 fois plus vite","6 fois plus vite","10 fois plus vite","aussi vite qu'une vraie"],"a":1,"e":"Environ 6 fois plus vite qu'une vraie information sur Twitter."},{"id":"cgeq16","q":"Que désigne un « village Potemkine » ?","o":["Un village de vacances","Une façade trompeuse qui cache une réalité misérable","Un village détruit","Un décor de cinéma russe"],"a":1,"e":"D'après la légende des faux villages montrés à Catherine II en 1787."},{"id":"cgeq17","q":"Pour une question fermée (« Le faux est-il toujours condamnable ? »), quel plan est conseillé ?","o":["Thématique","Chronologique","Dialectique","Analytique"],"a":2,"e":"Plan dialectique : oui, mais, dépassement."},{"id":"cgeq18","q":"Qui a réalisé le faux documentaire Opération lune ?","o":["Orson Welles","William Karel","Agnès Varda","Peter Weir"],"a":1,"e":"William Karel (2002) « prouve » que Kubrick a filmé les premiers pas sur la Lune en studio."},{"id":"cgeq19","q":"Qui a écrit Illusions perdues ?","o":["Zola","Balzac","Flaubert","Hugo"],"a":1,"e":"Honoré de Balzac, 1837-1843."},{"id":"cgeq20","q":"Dans Illusions perdues, que découvre Lucien de Rubempré ?","o":["Un trésor caché","Un journalisme corrompu, où les critiques s'achètent","Une dictature","La magie"],"a":1,"e":"Réputations faites et défaites : très actuel avec les faux avis et l'influence."},{"id":"cgeq21","q":"Qu'étudie Edgar Morin dans La Rumeur d'Orléans ?","o":["Une épidémie","La naissance et la diffusion d'une fausse rumeur","Un procès célèbre","Une élection"],"a":1,"e":"Une rumeur accusait à tort des commerçants juifs d'enlever des jeunes femmes."},{"id":"cgeq22","q":"Que dénonce Molière dans Le Tartuffe ?","o":["L'avarice","L'hypocrisie d'un faux dévot","La médecine","La jalousie"],"a":1,"e":"Tartuffe joue le dévot pour s'emparer des biens d'Orgon."},{"id":"cgeq23","q":"Sur quoi repose L'Illusion comique de Corneille ?","o":["Le théâtre dans le théâtre","Un roman par lettres","Une tragédie antique","Un monologue"],"a":0,"e":"Le père croit voir mourir son fils… qui jouait une pièce."},{"id":"cgeq24","q":"Qui a écrit Les Faux-monnayeurs ?","o":["André Gide","Albert Camus","Marcel Proust","Émile Zola"],"a":0,"e":"1925 : la fausse monnaie symbolise les êtres inauthentiques."},{"id":"cgeq25","q":"Que se passe-t-il dans Le Véritable Saint-Genest de Rotrou ?","o":["Un roi est trompé","Un comédien qui joue un martyr se convertit vraiment","Un peintre entre dans son tableau","Un faussaire est arrêté"],"a":1,"e":"Le faux devient vrai sur scène."},{"id":"cgeq26","q":"Qui a réalisé F for Fake (Vérités et mensonges) ?","o":["Orson Welles","Steven Spielberg","Christopher Nolan","Agnès Varda"],"a":0,"e":"1973, autour du faussaire Elmyr de Hory."},{"id":"cgeq27","q":"Arrête-moi si tu peux raconte l'histoire de…","o":["Jean-Claude Romand","Frank Abagnale, faux pilote et faussaire","Elmyr de Hory","Howard Hughes"],"a":1,"e":"Film de Spielberg (2002)."},{"id":"cgeq28","q":"Que désigne la « post-vérité » ?","o":["Une vérité prouvée après coup","Une époque où l'émotion pèse plus que les faits","Un journal","Une loi"],"a":1,"e":"Contexte central de la problématique du BO."},{"id":"cgeq29","q":"Un deepfake est…","o":["un faux billet","une vidéo ou une voix fabriquée par IA","un virus","un faux avis"],"a":1,"e":"On dit aussi hypertrucage."},{"id":"cgeq30","q":"Que signifie l'expression « le roi est nu » ?","o":["Le roi est pauvre","Dire tout haut une vérité que tous font semblant de ne pas voir","Le pouvoir est fragile","Il faut se méfier des tailleurs"],"a":1,"e":"D'après Les Habits neufs de l'empereur d'Andersen (1837)."},{"id":"cgeq31","q":"Qui a écrit « Le vrai peut quelquefois n'être pas vraisemblable » ?","o":["Molière","Boileau","Racine","La Fontaine"],"a":1,"e":"L'Art poétique, 1674."},{"id":"cgeq32","q":"Dans La Ferme des animaux, qui fait la propagande ?","o":["Les chevaux","Le cochon Brille-Babil","Les moutons","Le fermier"],"a":1,"e":"Les cochons réécrivent les règles en douce."},{"id":"cgeq33","q":"Qui a peint le faux oculus de la Chambre des époux à Mantoue ?","o":["Mantegna","Vélasquez","Magritte","Arcimboldo"],"a":0,"e":"Un faux ciel en trompe-l'œil (1465-1474)."},{"id":"cgeq34","q":"La vraisemblance, c'est…","o":["la vérité prouvée","ce qui paraît vrai, même si c'est inventé","un mensonge","une copie"],"a":1,"e":"Une notion clé de la fiction."},{"id":"cgeq35","q":"La citation « un mensonge fait le tour de la Terre pendant que la vérité met ses chaussures »…","o":["est de Mark Twain","est attribuée à Mark Twain sans aucune preuve","est de Victor Hugo","vient de la Bible"],"a":1,"e":"Une fausse attribution… sur le faux : l'amorce idéale."}],"r":[{"id":"cger0","q":"Explique ce qu'est le « mentir-vrai » et donne une œuvre qui l'illustre.","p":[{"t":"Citer Aragon","k":["aragon"]},{"t":"La fiction invente ou « ment »","k":["fiction","mens","ment ","invent","roman"]},{"t":"…pour dire une vérité sur le monde","k":["verite","vrai","reel","revel","denonc"]},{"t":"Un exemple d'œuvre","k":["truman","1984","orwell","illusion comique","illusions perdues","rashomon","operation lune","faux-monnayeurs","quichotte","borges","indes fourbes","corneille","balzac"]}],"m":"Le « mentir-vrai » est une idée de Louis Aragon : le romancier invente, il « ment », mais cette fiction permet de dire une vérité plus profonde sur l'homme et la société. Par exemple, The Truman Show (Peter Weir, 1998) raconte une histoire impossible, mais elle dénonce une vérité bien réelle : la télé-réalité et la manipulation par les écrans."},{"id":"cger1","q":"Le faux est-il toujours condamnable ? Propose un plan en 3 parties avec un exemple par partie.","p":[{"t":"I. Oui, quand il manipule","k":["manipul","tromp","propagande","infox","deepfake","mensonge"]},{"t":"II. Non, quand il révèle ou divertit","k":["revel","divert","fiction","art","plaisir","magie"]},{"t":"III. Tout dépend du contrat avec le public","k":["contrat","assum","consent","transparen","cache","depend"]},{"t":"Des exemples précis","k":["orwell","1984","truman","aragon","prestige","avis","zeuxis","magritte","tartuffe"]}],"m":"I. Oui, le faux est condamnable quand il manipule : la propagande de 1984 d'Orwell, les infox ou les faux avis clients trompent les gens. II. Mais le faux peut révéler une vérité ou divertir : la fiction dit vrai (le « mentir-vrai » d'Aragon, The Truman Show), et la magie ou le trompe-l'œil sont des plaisirs acceptés. III. Tout dépend donc du contrat avec le public : le faux assumé est légitime, le faux caché est condamnable, d'où l'importance de la transparence et de l'esprit critique."},{"id":"cger2","q":"Pourquoi les fausses informations circulent-elles si vite ? Appuie-toi sur un exemple.","p":[{"t":"L'émotion et la nouveauté","k":["emotion","nouveau","surpr","choqu","peur","colere"]},{"t":"Le partage sur les réseaux sociaux","k":["reseau","partag","viral","algorithm"]},{"t":"Un exemple ou une étude","k":["mit","six fois","6 fois","pape","brad pitt","deepfake","rumeur"]},{"t":"Le biais de confirmation","k":["biais","confirm","ce qu'on pense","ce que l'on pense","croire"]}],"m":"Les fausses informations surprennent et provoquent des émotions fortes (peur, colère), ce qui pousse à les partager sans vérifier. Les réseaux sociaux accélèrent ce partage. Une étude du MIT parue en 2018 dans Science montre qu'une fausse information atteint 1 500 personnes environ six fois plus vite qu'une vraie. Enfin, le biais de confirmation nous fait croire plus facilement ce qui confirme ce que nous pensons déjà."},{"id":"cger3","q":"Rédige une introduction d'essai pour le sujet : « Une copie vaut-elle moins que l'original ? »","p":[{"t":"Une amorce (fait, exemple)","k":["lascaux","faussaire","contrefa","musee","beltracchi","ribes","welles","replique","en 20"]},{"t":"Définir les termes","k":["copie","original","authentique","unique"]},{"t":"Une problématique (une question)","k":["?"]},{"t":"L'annonce du plan","k":["nous verrons","d'abord","dans un premier","ensuite","puis","enfin"]}],"m":"La grotte de Lascaux est fermée au public depuis 1963 : les visiteurs découvrent aujourd'hui une réplique. Une copie reproduit un objet ou une œuvre ; l'original est l'œuvre unique, authentique, créée par son auteur. Faut-il alors considérer la copie comme une imitation sans valeur, ou peut-elle avoir un intérêt propre ? Nous verrons d'abord que l'original garde une valeur unique, puis que la copie peut être utile, voire nécessaire, avant de montrer que tout dépend de l'honnêteté de la démarche."},{"id":"cger4","q":"Explique la notion d'hyperréalité et cite l'auteur qui l'a décrite.","p":[{"t":"Citer Umberto Eco","k":["eco"]},{"t":"La copie paraît plus vraie que le réel","k":["plus vrai","plus reel","copie","imitation","reel"]},{"t":"Un exemple","k":["disney","musee de cire","chateau","factice","las vegas","etats-unis","amerique","seahaven","truman"]}],"m":"L'hyperréalité désigne une situation où la copie paraît plus vraie, plus parfaite que la réalité elle-même. Umberto Eco la décrit dans La Guerre du faux, à propos de l'Amérique des années 1970 : musées de cire, châteaux reconstitués, villes factices comme Disneyland. Seahaven, la ville parfaite et fausse de The Truman Show, en est une bonne illustration."},{"id":"cger5","q":"Comment la loi encadre-t-elle le faux dans le commerce ? Donne deux exemples.","p":[{"t":"Les faux avis clients interdits","k":["faux avis","avis"]},{"t":"La transparence des influenceurs","k":["influenc","collaboration commerciale","publicite","retouch","virtuel"]},{"t":"La notion de pratique commerciale trompeuse","k":["trompeu","pratique commerciale"]},{"t":"Des dates ou des lois","k":["2022","2023","loi","omnibus"]}],"m":"La loi protège la confiance du consommateur. Depuis le 28 mai 2022, diffuser ou faire diffuser de faux avis clients est une pratique commerciale réputée trompeuse. Depuis la loi du 9 juin 2023, les influenceurs doivent signaler les publicités (« collaboration commerciale ») et indiquer les images retouchées ou virtuelles. Le droit ne supprime pas le faux : il oblige à le rendre visible."},{"id":"cger6","q":"Pourquoi aimons-nous être trompés ? Donne deux arguments.","p":[{"t":"Le plaisir de l'imitation","k":["plaisir","aristote","mimesis","imitation","zeuxis","trompe"]},{"t":"L'évasion, l'imaginaire","k":["evad","evasion","rever","imaginaire","divert","echapp"]},{"t":"On sait que c'est faux : on y consent","k":["consent","sait que","coleridge","suspension","accept","pas dupe"]},{"t":"Un exemple","k":["magie","prestige","cinema","theatre","roman","serie","jeu"]}],"m":"D'abord, l'imitation procure du plaisir : Aristote l'expliquait déjà, et les raisins de Zeuxis trompaient même les oiseaux. Ensuite, l'illusion nous permet de nous évader : au cinéma ou devant un tour de magie (Le Prestige), nous acceptons d'être trompés. C'est la « suspension volontaire de l'incrédulité » de Coleridge : nous savons que c'est faux, et c'est justement ce qui rend le plaisir possible."},{"id":"cger7","q":"Dans une question sur corpus, comment construire un bon paragraphe ? Donne un exemple.","p":[{"t":"Une idée qui répond à la question","k":["idee"]},{"t":"Une preuve : citation courte avec la ligne","k":["preuve","citation","ligne","l."]},{"t":"L'analyse de la preuve","k":["analys","procede","effet","montre"]},{"t":"Un exemple rédigé","k":["«","\""]}],"m":"Un bon paragraphe suit le schéma idée, preuve, analyse. Exemple : « L'auteur souligne d'abord la vitesse du faux (idée). Il écrit qu'une fausse information « se répand six fois plus vite » (l. 14) (preuve). Ce chiffre, tiré d'une étude, donne du poids à son propos et montre que le faux a un avantage sur le vrai (analyse). »"}]},{"k":"e2","n":"Anglais","s":"E2 · LV1","c":"#D6336C","p":[{"t":"Vue d'ensemble","h":"<div style=\"display:flex;flex-direction:column;gap:12px;padding-top:8px\">\n<span class=\"tag\" style=\"background:#16182B\">Fiche de révision · Épreuve E2 · LV1<\/span>\n<div style=\"font-family:'Bricolage Grotesque',Inter,sans-serif;font-weight:800;font-size:clamp(34px,11vw,104px);line-height:.9;letter-spacing:-.03em\"><span style=\"color:#2F5BEA\" lang=\"en\">Let's talk<\/span><br><span style=\"color:#F25C2B\" lang=\"en\">business.<\/span><\/div>\n<p style=\"font-size:17px;line-height:1.45;max-width:640px\">L'oral d'anglais du BTS NDRC : le déroulement, une méthode pour chaque partie, des phrases toutes prêtes, le vocabulaire commercial et les erreurs à éviter.<\/p>\n<\/div>\n<div class=\"g4\">\n<div class=\"card dark\"><span class=\"bign\">Coef. 3<\/span><span class=\"sm\" style=\"color:#D6D8E6\">autant que la CEJM<\/span><\/div>\n<div class=\"card dark\"><span class=\"bign\">30 min<\/span><span class=\"sm\" style=\"color:#D6D8E6\">de préparation<\/span><\/div>\n<div class=\"card dark\"><span class=\"bign\">30 min<\/span><span class=\"sm\" style=\"color:#D6D8E6\">d'oral maximum<\/span><\/div>\n<div class=\"card dark\"><span class=\"bign\">B2<\/span><span class=\"sm\" style=\"color:#D6D8E6\">niveau attendu<\/span><\/div>\n<\/div>\n<div class=\"g2\">\n<div class=\"card cB\"><span class=\"tag fB\">Partie a · 10 min · en français<\/span><h3>Compréhension de l'écrit<\/h3><p class=\"sm\">Tu rends compte, en français, des idées essentielles d'un article en anglais sur un sujet commercial.<\/p><\/div>\n<div class=\"card cO\"><span class=\"tag fO\">Partie b · 20 min · en anglais<\/span><h3>Expression orale en interaction<\/h3><p class=\"sm\">À partir d'un document commercial et d'une mise en situation, tu présentes, analyses et proposes une démarche, en dialogue avec l'examinateur.<\/p><\/div>\n<\/div>\n<div class=\"g2 sm\" style=\"gap:4px 20px\">\n<span><b>02<\/b> · Le déroulement de l'épreuve<\/span><span><b>08<\/b> · Vocabulaire : digital, réseaux, emploi<\/span>\n<span><b>03<\/b> · Partie a : le compte rendu<\/span><span><b>09<\/b> · Lire un document commercial<\/span>\n<span><b>04<\/b> · Partie b : la méthode<\/span><span><b>10<\/b> · La grammaire utile<\/span>\n<span><b>05<\/b> · Les phrases toutes prêtes<\/span><span><b>11<\/b> · Erreurs, faux amis, prononciation<\/span>\n<span><b>06–07<\/b> · Vocabulaire commercial<\/span><span><b>12<\/b> · Kit minimum et jour J<\/span>\n<\/div>","x":"fiche de révision · épreuve e2 · lv1 let's talk business. l'oral d'anglais du bts ndrc : le déroulement, une méthode pour chaque partie, des phrases toutes prêtes, le vocabulaire commercial et les erreurs à éviter. coef. 3 autant que la cejm 30 min de préparation 30 min d'oral maximum b2 niveau attendu partie a · 10 min · en français compréhension de l'écrit tu rends compte, en français, des idées essentielles d'un article en anglais sur un sujet commercial. partie b · 20 min · en anglais expression orale en interaction à partir d'un document commercial et d'une mise en situation, tu présentes, analyses et proposes une démarche, en dialogue avec l'examinateur. 02 · le déroulement de l'épreuve 08 · vocabulaire : digital, réseaux, emploi 03 · partie a : le compte rendu 09 · lire un document commercial 04 · partie b : la méthode 10 · la grammaire utile 05 · les phrases toutes prêtes 11 · erreurs, faux amis, prononciation 06–07 · vocabulaire commercial 12 · kit minimum et jour j"},{"t":"Comment se passe l'épreuve","h":"<p class=\"kick tO\">L'épreuve<\/p>\n<h1>Le déroulement de l'épreuve<\/h1>\n<div class=\"card dark\" style=\"gap:10px\"><h3>En ponctuel : 30 min de préparation, puis 30 min d'oral maximum<\/h3>\n<div class=\"bar\" style=\"display:flex;height:50px;border-radius:12px;overflow:hidden;font-weight:700;font-size:12.5px\">\n<div style=\"flex:30;display:flex;align-items:center;justify-content:center;background:#4A4E68;color:#FFFFFF\">Préparation · 30 min<\/div>\n<div class=\"fB\" style=\"flex:10;display:flex;align-items:center;justify-content:center;color:#FFFFFF\">a · 10 min<\/div>\n<div class=\"fO\" style=\"flex:20;display:flex;align-items:center;justify-content:center;color:#16182B\">b · 20 min<\/div>\n<\/div>\n<p class=\"sm\" style=\"color:#E4E5EE\">En CCF : deux situations, A (compréhension de l'écrit, 10 min) et B (expression orale, 20 min), chacune avec 15 min de préparation, et le même déroulement.<\/p><\/div>\n<h2>Les deux documents remis au début de la préparation<\/h2>\n<div class=\"g2\">\n<div class=\"card cB\"><h3>Un texte en anglais<\/h3><p class=\"sm\">Un article de presse (ou autre) sur un sujet commercial, de 50 lignes maximum. Il sert à la partie a.<\/p><\/div>\n<div class=\"card cO\"><h3>Un document commercial + une mise en situation<\/h3><p class=\"sm\">Fiche produit, page de site, plaquette de salon, offre d'emploi… avec 3 ou 4 questions ou consignes. Il sert à la partie b.<\/p><\/div>\n<\/div>\n<h2>Ce que fait le candidat<\/h2>\n<div class=\"g2\" style=\"align-items:start\">\n<div class=\"card cB\"><span class=\"tag fB\">Partie a · en français<\/span><p class=\"sm\">Tu restitues de façon structurée les idées essentielles du texte. L'examinateur peut ensuite te demander des précisions.<\/p><\/div>\n<div class=\"card cO\"><span class=\"tag fO\">Partie b · en anglais<\/span><p class=\"sm\">Tu présentes la situation et le contexte, tu analyses les besoins (cible, contexte culturel, lieu), puis tu proposes une démarche commerciale argumentée. Tu dois réagir, décrire, reformuler, argumenter, justifier, expliquer.<\/p><\/div>\n<\/div>\n<h2>Les critères de la grille nationale<\/h2>\n<table class=\"tb\"><tr><th style=\"width:22%\">Critère<\/th><th>Ce qui est évalué<\/th><\/tr><tr><td>Fond<\/td><td>Décrire et analyser le document, prendre part à un dialogue professionnel<\/td><\/tr><tr><td>Forme<\/td><td>Correction de la langue et de la prononciation, être compris, aisance<\/td><\/tr><tr><td>Communication<\/td><td>Interagir, s'adapter aux questions de l'examinateur<\/td><\/tr><\/table>\n<div class=\"card cY\"><h3>Bon à savoir<\/h3><p class=\"sm\">L'examinateur ne doit pas te poser de questions de grammaire ou de théorie, ni évaluer tes compétences techniques : il évalue ta communication. Il doit être bienveillant et relancer si tu bloques. Il n'attend pas un anglais parfait, mais <b>« une langue grammaticalement acceptable »<\/b> et une prononciation claire.<\/p><\/div>","x":"l'épreuve le déroulement de l'épreuve en ponctuel : 30 min de préparation, puis 30 min d'oral maximum préparation · 30 min a · 10 min b · 20 min en ccf : deux situations, a (compréhension de l'écrit, 10 min) et b (expression orale, 20 min), chacune avec 15 min de préparation, et le même déroulement. les deux documents remis au début de la préparation un texte en anglais un article de presse (ou autre) sur un sujet commercial, de 50 lignes maximum. il sert à la partie a. un document commercial + une mise en situation fiche produit, page de site, plaquette de salon, offre d'emploi… avec 3 ou 4 questions ou consignes. il sert à la partie b. ce que fait le candidat partie a · en français tu restitues de façon structurée les idées essentielles du texte. l'examinateur peut ensuite te demander des précisions. partie b · en anglais tu présentes la situation et le contexte, tu analyses les besoins (cible, contexte culturel, lieu), puis tu proposes une démarche commerciale argumentée. tu dois réagir, décrire, reformuler, argumenter, justifier, expliquer. les critères de la grille nationale critère ce qui est évalué fond décrire et analyser le document, prendre part à un dialogue professionnel forme correction de la langue et de la prononciation, être compris, aisance communication interagir, s'adapter aux questions de l'examinateur bon à savoir l'examinateur ne doit pas te poser de questions de grammaire ou de théorie, ni évaluer tes compétences techniques : il évalue ta communication. il doit être bienveillant et relancer si tu bloques. il n'attend pas un anglais parfait, mais « une langue grammaticalement acceptable » et une prononciation claire."},{"t":"Le compte rendu de l'article","h":"<div class=\"row\" style=\"align-items:center;gap:14px\"><div class=\"fB\" style=\"width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#FFFFFF\"><span class=\"bign\">a<\/span><\/div><div style=\"display:flex;flex-direction:column;gap:2px\"><p class=\"kick mut\">Partie a · 10 minutes · en français<\/p><h1 style=\"font-size:31px\">Le compte rendu de l'article<\/h1><\/div><\/div>\n<div class=\"card cB\" style=\"gap:8px\"><h3>En préparation : environ 12 minutes pour le texte<\/h3>\n<ol class=\"sm\"><li><b>Paratexte<\/b> : titre, source, date, auteur. Il annonce souvent le sujet.<\/li><li><b>Première lecture<\/b> pour le sens général, sans dictionnaire mental : ne bloque pas sur un mot.<\/li><li><b>Deuxième lecture<\/b> : souligne les idées clés, les chiffres, les noms, les exemples.<\/li><li><b>Regroupe<\/b> les idées en 2 ou 3 parties. Note des mots-clés, pas des phrases.<\/li><\/ol><\/div>\n<h2>Le plan du compte rendu<\/h2>\n<div class=\"g4\">\n<div class=\"step\"><span class=\"bign tB\" style=\"font-size:24px\">1<\/span><b>Présenter<\/b><span>« Il s'agit d'un article de [source], publié le [date], qui traite de… »<\/span><\/div>\n<div class=\"step\"><span class=\"bign tB\" style=\"font-size:24px\">2<\/span><b>L'idée principale<\/b><span>« L'auteur montre que… »<\/span><\/div>\n<div class=\"step\"><span class=\"bign tB\" style=\"font-size:24px\">3<\/span><b>Le détail<\/b><span>2 ou 3 idées, avec les chiffres et exemples importants.<\/span><\/div>\n<div class=\"step\"><span class=\"bign tB\" style=\"font-size:24px\">4<\/span><b>Conclure<\/b><span>La conclusion de l'article ; éventuellement le lien avec le commerce.<\/span><\/div>\n<\/div>\n<div class=\"g2\" style=\"align-items:start\">\n<div class=\"card cB\"><h3>Les mots qui structurent (en français)<\/h3><p class=\"sm\">Tout d'abord · ensuite · par ailleurs · en revanche · cependant · par conséquent · par exemple · selon l'auteur · enfin · en conclusion.<\/p><\/div>\n<div class=\"card cB\"><h3>Les mots pour comprendre (en anglais)<\/h3><div class=\"mini\"><div class=\"def\"><b lang=\"en\">however, yet<\/b> · cependant<\/div><div class=\"def\"><b lang=\"en\">whereas, while<\/b> · alors que<\/div><div class=\"def\"><b lang=\"en\">therefore, thus<\/b> · donc<\/div><div class=\"def\"><b lang=\"en\">although<\/b> · bien que<\/div><div class=\"def\"><b lang=\"en\">according to<\/b> · selon<\/div><div class=\"def\"><b lang=\"en\">unless<\/b> · à moins que<\/div><\/div><\/div>\n<\/div>\n<div class=\"card cO\"><h3>Les pièges<\/h3><ul class=\"sm\"><li>Traduire le texte ligne par ligne : on te demande de <b>résumer<\/b>, pas de traduire.<\/li><li>Donner ton avis : ce n'est pas demandé ici.<\/li><li>Oublier les chiffres : ils montrent que tu as compris le détail.<\/li><li>Lire tes notes : regarde l'examinateur et parle naturellement.<\/li><\/ul><\/div>\n<div class=\"card cY\"><h3>Les chiffres en anglais<\/h3><p class=\"sm\"><span lang=\"en\"><b>1,500<\/b><\/span> = 1 500 (virgule pour les milliers) · <span lang=\"en\"><b>2.5<\/b><\/span> = 2,5 (point pour les décimales) · <span lang=\"en\"><b>a billion<\/b><\/span> = un milliard · <span lang=\"en\"><b>a 10% increase<\/b><\/span> = une hausse de 10 % · <span lang=\"en\"><b>to double<\/b><\/span> = doubler.<\/p><\/div>","x":"a partie a · 10 minutes · en français le compte rendu de l'article en préparation : environ 12 minutes pour le texte paratexte : titre, source, date, auteur. il annonce souvent le sujet. première lecture pour le sens général, sans dictionnaire mental : ne bloque pas sur un mot. deuxième lecture : souligne les idées clés, les chiffres, les noms, les exemples. regroupe les idées en 2 ou 3 parties. note des mots-clés, pas des phrases. le plan du compte rendu 1 présenter « il s'agit d'un article de [source], publié le [date], qui traite de… » 2 l'idée principale « l'auteur montre que… » 3 le détail 2 ou 3 idées, avec les chiffres et exemples importants. 4 conclure la conclusion de l'article ; éventuellement le lien avec le commerce. les mots qui structurent (en français) tout d'abord · ensuite · par ailleurs · en revanche · cependant · par conséquent · par exemple · selon l'auteur · enfin · en conclusion. les mots pour comprendre (en anglais) however, yet · cependant whereas, while · alors que therefore, thus · donc although · bien que according to · selon unless · à moins que les pièges traduire le texte ligne par ligne : on te demande de résumer , pas de traduire. donner ton avis : ce n'est pas demandé ici. oublier les chiffres : ils montrent que tu as compris le détail. lire tes notes : regarde l'examinateur et parle naturellement. les chiffres en anglais 1,500 = 1 500 (virgule pour les milliers) · 2.5 = 2,5 (point pour les décimales) · a billion = un milliard · a 10% increase = une hausse de 10 % · to double = doubler."},{"t":"Présenter, analyser, proposer","h":"<div class=\"row\" style=\"align-items:center;gap:14px\"><div class=\"fO\" style=\"width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#FFFFFF\"><span class=\"bign\">b<\/span><\/div><div style=\"display:flex;flex-direction:column;gap:2px\"><p class=\"kick mut\">Partie b · 20 minutes · en anglais<\/p><h1 style=\"font-size:31px\">Présenter, analyser, proposer<\/h1><\/div><\/div>\n<div class=\"g3\">\n<div class=\"card cO\"><span class=\"bign tO\" style=\"font-size:24px\">1<\/span><h3>Présenter<\/h3><p class=\"sm\">La situation : qui tu es (stagiaire, commercial), l'entreprise, le produit, le document.<\/p><\/div>\n<div class=\"card cO\"><span class=\"bign tO\" style=\"font-size:24px\">2<\/span><h3>Analyser les besoins<\/h3><p class=\"sm\">La cible, le contexte culturel du pays, le lieu (salon, magasin, site), les besoins du client.<\/p><\/div>\n<div class=\"card cO\"><span class=\"bign tO\" style=\"font-size:24px\">3<\/span><h3>Proposer<\/h3><p class=\"sm\">Une démarche commerciale argumentée : quelle offre, quels arguments, quelle action, quel suivi.<\/p><\/div>\n<\/div>\n<div class=\"card cB\" style=\"gap:6px\"><h3>En préparation : environ 18 minutes<\/h3><ul class=\"sm\"><li>Réponds aux 3 ou 4 consignes avec des mots-clés, pas des phrases entières.<\/li><li>Prépare une introduction de 2 ou 3 phrases que tu sais dire sans hésiter.<\/li><li>Prévois 3 arguments, avec les avantages pour le client.<\/li><li>Anticipe les questions : prix, délai, concurrence, objections.<\/li><\/ul><\/div>\n<div class=\"ex\"><p class=\"lab\">Exemple (situation fictive)<\/p><p class=\"sm\"><i>Situation : stagiaire chez une marque française de cosmétiques bio, tu rencontres un distributeur britannique sur un salon à Londres. Document : la fiche produit d'une crème.<\/i><\/p>\n<p class=\"sm\" lang=\"en\" style=\"margin-top:6px\"><b>Present.<\/b> “I'm doing an internship at a French organic cosmetics brand. Today, I'm meeting a British retailer at a trade fair in London to present our new face cream.”<\/p>\n<p class=\"sm\" lang=\"en\"><b>Analyse.<\/b> “British consumers are increasingly interested in natural and vegan products. The retailer's customers are mostly women aged 25 to 45 who care about ingredients.”<\/p>\n<p class=\"sm\" lang=\"en\"><b>Propose.<\/b> “I would suggest a trial order with a display stand and free samples. We could also offer a 10% discount on the first order and train their staff.”<\/p><\/div>\n<div class=\"card cY\"><h3>Dans le dialogue<\/h3><div class=\"g2 sm\" style=\"gap:4px 18px\"><span>L'examinateur peut jouer le client : réponds-lui comme à un vrai client.<\/span><span>Pose-lui aussi des questions : c'est une <b>interaction<\/b>.<\/span><span>Tu ne comprends pas ? Demande de répéter : c'est valorisé.<\/span><span>Tu cherches un mot ? Contourne-le avec une explication simple.<\/span><\/div><\/div>","x":"b partie b · 20 minutes · en anglais présenter, analyser, proposer 1 présenter la situation : qui tu es (stagiaire, commercial), l'entreprise, le produit, le document. 2 analyser les besoins la cible, le contexte culturel du pays, le lieu (salon, magasin, site), les besoins du client. 3 proposer une démarche commerciale argumentée : quelle offre, quels arguments, quelle action, quel suivi. en préparation : environ 18 minutes réponds aux 3 ou 4 consignes avec des mots-clés, pas des phrases entières. prépare une introduction de 2 ou 3 phrases que tu sais dire sans hésiter. prévois 3 arguments, avec les avantages pour le client. anticipe les questions : prix, délai, concurrence, objections. exemple (situation fictive) situation : stagiaire chez une marque française de cosmétiques bio, tu rencontres un distributeur britannique sur un salon à londres. document : la fiche produit d'une crème. present. “i'm doing an internship at a french organic cosmetics brand. today, i'm meeting a british retailer at a trade fair in london to present our new face cream.” analyse. “british consumers are increasingly interested in natural and vegan products. the retailer's customers are mostly women aged 25 to 45 who care about ingredients.” propose. “i would suggest a trial order with a display stand and free samples. we could also offer a 10% discount on the first order and train their staff.” dans le dialogue l'examinateur peut jouer le client : réponds-lui comme à un vrai client. pose-lui aussi des questions : c'est une interaction . tu ne comprends pas ? demande de répéter : c'est valorisé. tu cherches un mot ? contourne-le avec une explication simple."},{"t":"Les phrases qui sauvent","h":"<p class=\"kick tO\">Phrases toutes prêtes<\/p>\n<h1>Les phrases qui sauvent<\/h1>\n<div class=\"g2\" style=\"align-items:start\">\n<div style=\"display:flex;flex-direction:column;gap:10px\"><div class=\"card cB\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fB\">Présenter<\/span><div class=\"mini\"><div class=\"def\"><b lang=\"en\">I'm going to present…<\/b><br><span class=\"mut\">Je vais présenter…<\/span><\/div><div class=\"def\"><b lang=\"en\">This document is a product leaflet / a web page / a job ad.<\/b><br><span class=\"mut\">Ce document est une fiche produit / une page web / une offre d'emploi.<\/span><\/div><div class=\"def\"><b lang=\"en\">I'm a sales intern at… / I work for…<\/b><br><span class=\"mut\">Je suis stagiaire commercial chez… / Je travaille pour…<\/span><\/div><div class=\"def\"><b lang=\"en\">The aim of this meeting is to…<\/b><br><span class=\"mut\">L'objectif de cet entretien est de…<\/span><\/div><\/div><\/div><div class=\"card cB\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fB\">Structurer<\/span><div class=\"mini\"><div class=\"def\"><b lang=\"en\">First of all… Then… Finally…<\/b><br><span class=\"mut\">Tout d'abord… Ensuite… Enfin…<\/span><\/div><div class=\"def\"><b lang=\"en\">On the one hand… on the other hand…<\/b><br><span class=\"mut\">D'un côté… de l'autre…<\/span><\/div><div class=\"def\"><b lang=\"en\">To sum up… / All in all…<\/b><br><span class=\"mut\">Pour résumer… / En somme…<\/span><\/div><\/div><\/div><div class=\"card cB\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fB\">Gagner du temps, demander<\/span><div class=\"mini\"><div class=\"def\"><b lang=\"en\">Could you repeat that, please?<\/b><br><span class=\"mut\">Pouvez-vous répéter, s'il vous plaît ?<\/span><\/div><div class=\"def\"><b lang=\"en\">Sorry, I didn't catch that.<\/b><br><span class=\"mut\">Pardon, je n'ai pas compris.<\/span><\/div><div class=\"def\"><b lang=\"en\">What do you mean by…?<\/b><br><span class=\"mut\">Qu'entendez-vous par… ?<\/span><\/div><div class=\"def\"><b lang=\"en\">Let me think for a second.<\/b><br><span class=\"mut\">Laissez-moi réfléchir un instant.<\/span><\/div><div class=\"def\"><b lang=\"en\">I don't know the exact word, but it's a kind of…<\/b><br><span class=\"mut\">Je ne connais pas le mot exact, mais c'est une sorte de…<\/span><\/div><\/div><\/div><\/div>\n<div style=\"display:flex;flex-direction:column;gap:10px\"><div class=\"card cO\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fO\">Argumenter, proposer<\/span><div class=\"mini\"><div class=\"def\"><b lang=\"en\">I would suggest… / I would recommend…<\/b><br><span class=\"mut\">Je suggérerais… / Je recommanderais…<\/span><\/div><div class=\"def\"><b lang=\"en\">The main advantage is that…<\/b><br><span class=\"mut\">Le principal avantage est que…<\/span><\/div><div class=\"def\"><b lang=\"en\">This product meets your needs because…<\/b><br><span class=\"mut\">Ce produit répond à vos besoins car…<\/span><\/div><div class=\"def\"><b lang=\"en\">We could offer you…<\/b><br><span class=\"mut\">Nous pourrions vous proposer…<\/span><\/div><div class=\"def\"><b lang=\"en\">What's more… / Besides…<\/b><br><span class=\"mut\">De plus… / En outre…<\/span><\/div><\/div><\/div><div class=\"card cO\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fO\">Répondre à une objection<\/span><div class=\"mini\"><div class=\"def\"><b lang=\"en\">I understand your point, but…<\/b><br><span class=\"mut\">Je comprends votre point de vue, mais…<\/span><\/div><div class=\"def\"><b lang=\"en\">That's a good question.<\/b><br><span class=\"mut\">C'est une bonne question.<\/span><\/div><div class=\"def\"><b lang=\"en\">It may seem expensive, however…<\/b><br><span class=\"mut\">Cela peut paraître cher, cependant…<\/span><\/div><div class=\"def\"><b lang=\"en\">In fact, it will save you money in the long run.<\/b><br><span class=\"mut\">En fait, cela vous fera économiser à long terme.<\/span><\/div><\/div><\/div><div class=\"card cO\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fO\">Donner son avis, conclure<\/span><div class=\"mini\"><div class=\"def\"><b lang=\"en\">In my opinion… / I think that…<\/b><br><span class=\"mut\">À mon avis… / Je pense que…<\/span><\/div><div class=\"def\"><b lang=\"en\">I agree / I don't agree with you.<\/b><br><span class=\"mut\">Je suis d'accord / pas d'accord avec vous.<\/span><\/div><div class=\"def\"><b lang=\"en\">Shall we arrange a meeting next week?<\/b><br><span class=\"mut\">Pouvons-nous prévoir un rendez-vous la semaine prochaine ?<\/span><\/div><div class=\"def\"><b lang=\"en\">I'll send you a quote by email.<\/b><br><span class=\"mut\">Je vous enverrai un devis par e-mail.<\/span><\/div><\/div><\/div><\/div>\n<\/div>","x":"phrases toutes prêtes les phrases qui sauvent présenter i'm going to present… je vais présenter… this document is a product leaflet / a web page / a job ad. ce document est une fiche produit / une page web / une offre d'emploi. i'm a sales intern at… / i work for… je suis stagiaire commercial chez… / je travaille pour… the aim of this meeting is to… l'objectif de cet entretien est de… structurer first of all… then… finally… tout d'abord… ensuite… enfin… on the one hand… on the other hand… d'un côté… de l'autre… to sum up… / all in all… pour résumer… / en somme… gagner du temps, demander could you repeat that, please? pouvez-vous répéter, s'il vous plaît ? sorry, i didn't catch that. pardon, je n'ai pas compris. what do you mean by…? qu'entendez-vous par… ? let me think for a second. laissez-moi réfléchir un instant. i don't know the exact word, but it's a kind of… je ne connais pas le mot exact, mais c'est une sorte de… argumenter, proposer i would suggest… / i would recommend… je suggérerais… / je recommanderais… the main advantage is that… le principal avantage est que… this product meets your needs because… ce produit répond à vos besoins car… we could offer you… nous pourrions vous proposer… what's more… / besides… de plus… / en outre… répondre à une objection i understand your point, but… je comprends votre point de vue, mais… that's a good question. c'est une bonne question. it may seem expensive, however… cela peut paraître cher, cependant… in fact, it will save you money in the long run. en fait, cela vous fera économiser à long terme. donner son avis, conclure in my opinion… / i think that… à mon avis… / je pense que… i agree / i don't agree with you. je suis d'accord / pas d'accord avec vous. shall we arrange a meeting next week? pouvons-nous prévoir un rendez-vous la semaine prochaine ? i'll send you a quote by email. je vous enverrai un devis par e-mail."},{"t":"Le vocabulaire commercial (1/2)","h":"<p class=\"kick tO\">Vocabulaire<\/p>\n<h1>Le vocabulaire commercial (1/2)<\/h1>\n<div class=\"g2\" style=\"align-items:start\">\n<div style=\"display:flex;flex-direction:column;gap:10px\"><div class=\"card cB\" style=\"gap:6px;padding:12px 14px\"><span class=\"tag fB\">L'entreprise et le marché<\/span><table class=\"tb\" style=\"font-size:12.5px\"><tr><td lang=\"en\">a company, a firm<\/td><td>une entreprise<\/td><\/tr><tr><td lang=\"en\">a head office<\/td><td>un siège social<\/td><\/tr><tr><td lang=\"en\">a branch<\/td><td>une succursale, une agence<\/td><\/tr><tr><td lang=\"en\">a market share<\/td><td>une part de marché<\/td><\/tr><tr><td lang=\"en\">a competitor<\/td><td>un concurrent<\/td><\/tr><tr><td lang=\"en\">a target, to target<\/td><td>une cible, cibler<\/td><\/tr><tr><td lang=\"en\">a customer, a client<\/td><td>un clie
