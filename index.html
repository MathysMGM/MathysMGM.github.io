<style>
:root{--ink:#16182B;--mut:#4A4E68;--line:#D9DBE7;--bg:#F4F5FA;--card:#FFFFFF;--accent:#2F5BEA;
--display:"Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;--body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
.top{padding-top:calc(10px + env(safe-area-inset-top)) !important;position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:56px}
.top h1{font-family:var(--display);font-size:17px;margin:0;font-weight:800;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{background:rgba(255,255,255,.12);border:0;border-radius:12px;min-width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff}
.iconbtn:focus-visible,.btn:focus-visible,.tile:focus-visible,.opt:focus-visible,.item:focus-visible{outline:3px solid #FFB79A;outline-offset:2px}
main{max-width:860px;margin:0 auto;padding:16px 14px 90px}
.hero{background:var(--ink);color:#fff;border-radius:22px;padding:22px 20px;margin-bottom:16px}
.hero .big{font-family:var(--display);font-weight:800;font-size:32px;line-height:1.05;letter-spacing:-.02em;margin:0 0 8px}
.hero p{margin:0;color:#D6D8E6;font-size:15px;line-height:1.45}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left;border:0;border-radius:20px;padding:18px 16px;cursor:pointer;color:#fff;min-height:132px}
.tile .tt{font-family:var(--display);font-weight:800;font-size:24px}
.tile .ts{font-size:13.5px;opacity:.92;line-height:1.35}
.sec{font-family:var(--display);font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:18px 2px 10px}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer;min-height:60px}
.dot{width:40px;height:40px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--display);font-weight:800;font-size:12px}
.item .it{font-weight:700;font-size:15.5px;line-height:1.25}
.item .is{font-size:13px;color:var(--mut);margin-top:2px}
.item .grow{flex:1;min-width:0}
.badge{font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;background:#EAF0FF;color:#2346C4;white-space:nowrap}
.search{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px 14px;font:inherit;font-size:16px;background:#fff;margin-bottom:12px}
.empty{color:var(--mut);font-size:14px;padding:10px 4px}
.fiche{background:#fff;border-radius:20px;padding:20px 18px;border:1px solid var(--line);display:flex;flex-direction:column;gap:14px;font-size:14.5px;line-height:1.5;overflow:hidden}
.pager{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);display:flex;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));justify-content:center;z-index:5}
.pager[hidden]{display:none}
.grid6{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:18px}
.grid6 .tile{min-height:120px}
.clock{font-family:var(--display);font-weight:800;font-size:22px;color:#16182B}
.clock.hot{color:#C2410C}
.flashcard{display:flex;flex-direction:column;gap:12px;justify-content:center;width:100%;min-height:300px;border:0;border-radius:22px;padding:24px 20px;background:var(--c);color:#fff;text-align:left;cursor:pointer;box-shadow:0 6px 20px rgba(22,24,43,.15)}
.flashcard.flipped{background:#fff;color:#16182B;border:3px solid var(--c);cursor:default}
.fside{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.ftext{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.3}
.fhint{font-size:13px;opacity:.85}
.fexp{font-size:15px;line-height:1.45;color:#4A4E68}
.srow{display:flex;flex-direction:column;gap:6px;padding:8px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow-h{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.srow-h span:last-child{color:var(--mut);font-size:13px;text-align:right}
.linkbtn{background:none;border:0;padding:6px 0;color:#2346C4;font-weight:700;text-align:left;cursor:pointer;font-size:14px;min-height:36px}
.rank{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);font-size:15px}
.rank:last-child{border-bottom:0}
.rank.me{background:#FFF6D6;border-radius:10px;padding:10px 8px}
.rk{width:32px;height:32px;border-radius:10px;background:#E6E8F2;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.rk.r1{background:#FFD34D}.rk.r2{background:#D6D8E6}.rk.r3{background:#F2B48A}
@media (max-width:700px){.grid6{grid-template-columns:repeat(2,minmax(0,1fr))}.grid6 .tile{min-height:112px;padding:14px}.grid6 .tile .tt{font-size:20px}}

.btn{border:0;border-radius:14px;min-height:48px;padding:0 18px;font-weight:700;cursor:pointer;background:var(--ink);color:#fff;font-size:15px}
.btn.ghost{background:#E6E8F2;color:var(--ink)}
.btn[disabled]{opacity:.35;cursor:default}
.pager .btn{flex:1;max-width:260px}
.qcard{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 16px;display:flex;flex-direction:column;gap:12px}
.qmeta{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;color:var(--mut)}
.prog{height:8px;background:#E6E8F2;border-radius:99px;overflow:hidden}
.prog>div{height:100%;border-radius:99px}
.qq{font-family:var(--display);font-weight:800;font-size:20px;line-height:1.3;margin:0}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:14px;padding:13px 14px;font-size:15.5px;cursor:pointer;min-height:52px;line-height:1.35}
.opt.ok{border-color:#11916F;background:#E5F5EE}
.opt.ko{border-color:#C2410C;background:#FFEFE7}
.opt[disabled]{cursor:default}
.expl{border-radius:14px;padding:12px 14px;font-size:14.5px;line-height:1.45}
.expl.ok{background:#E5F5EE}
.expl.ko{background:#FFEFE7}
.score{font-family:var(--display);font-weight:800;font-size:56px;line-height:1;margin:6px 0}
.rev{border-top:1px solid var(--line);padding:10px 0;font-size:14px;line-height:1.45}
.row2{display:flex;gap:10px;flex-wrap:wrap}
.row2 .btn{flex:1;min-width:150px}
.ptsbox{display:flex;align-items:baseline;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.18);color:#D6D8E6;font-size:14px}
.ptsnum{font-family:var(--display);font-weight:800;font-size:34px;color:#FFB79A}
.ptschip{font-weight:800;color:#16182B;background:#FFE48A;border-radius:999px;padding:3px 10px}
.ans{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;font-size:16px;line-height:1.45;resize:vertical;min-height:150px}
.ans:focus{outline:none;border-color:#7B4FD6}
.pt{display:flex;gap:10px;align-items:flex-start;background:#F4F5FA;border-radius:12px;padding:11px 12px;font-size:14.5px;line-height:1.35;cursor:pointer}
.pt input{width:20px;height:20px;margin:0;flex:none;accent-color:#11916F}
.note{font-size:13px;color:var(--mut);line-height:1.45;margin-top:18px}
@media (max-width:700px){
 .duo{grid-template-columns:1fr}
 .tile{min-height:104px}
 .fiche{padding:16px 14px}

 .fiche [style*="repeat(6"]{grid-template-columns:repeat(2,minmax(0,1fr)) !important}
 .fiche .bar{flex-direction:column;height:auto !important}
 .fiche .bar>div{flex:none !important;padding:9px 12px !important;justify-content:flex-start !important}
 .fiche [style*="columns:2"]{columns:1 !important}
 .fiche table{display:block;overflow-x:auto}
 .fiche h1{font-size:28px !important}
}

.fiche .dark{background:#16182B;color:#FFFFFF}
.fiche .cO{background:#FFEFE7}
.fiche .cB{background:#EAF0FF}
.fiche .cP{background:#F2ECFF}

.fiche .mini{font-size:12.5px;line-height:1.38}

<script>window.__SUPA_URL__="https://aychipxyiebtmknwskmb.supabase.co";window.__SUPA_KEY__="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF5Y2hpcHh5aWVidG1rbndza21iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ5MTcxMTcsImV4cCI6MjExMDQ5MzExN30.DrSs5Rme7cNcltZ5StDnXoDT25g0mUgX-iF52t7R3D0";window.__DATA__=[{"k":"cge","n":"Culture générale","s":"E1 · Le vrai du faux","c":"#F25C2B","p":[{"t":"Vue d'ensemble","h":"<div style=\"display:flex;flex-direction:column;gap:14px;padding-top:10px;position:relative\">\n<span class=\"tag\" style=\"background:#16182B\">Fiche de révision · Culture générale et expression<\/span>\n<div style=\"position:relative;height:auto\">\n<div style=\"font-family:'Bricolage Grotesque',Inter,sans-serif;font-weight:800;font-size:clamp(34px,11vw,118px);line-height:.92;letter-spacing:-.03em;color:#2F5BEA\">Le vrai<\/div>\n<div style=\"font-family:'Bricolage Grotesque',Inter,sans-serif;font-weight:800;font-size:clamp(34px,11vw,118px);line-height:.92;letter-spacing:-.03em;color:#F25C2B\">du faux<\/div>\n\n\n<\/div>\n<p style=\"font-size:17px;line-height:1.45;max-width:600px\">Le thème unique de CGE pour la session 2027, commun à tous les BTS. Tout ce qu'il faut pour réviser : l'épreuve, la méthode, les notions, les références et des exemples NDRC.<\/p>\n<\/div>\n<h2 style=\"margin-top:6px\">L'épreuve en un coup d'œil<\/h2>\n<div class=\"row\" style=\"gap:10px\">\n<div class=\"card dark\" style=\"flex:1;align-items:flex-start\"><span class=\"bign\">3 h<\/span><span class=\"sm\" style=\"color:#D6D8E6\">épreuve écrite<\/span><\/div>\n<div class=\"card dark\" style=\"flex:1\"><span class=\"bign\">20 pts<\/span><span class=\"sm\" style=\"color:#D6D8E6\">deux parties sur 10<\/span><\/div>\n<div class=\"card dark\" style=\"flex:1\"><span class=\"bign\">1 thème<\/span><span class=\"sm\" style=\"color:#D6D8E6\">« Le vrai du faux »<\/span><\/div>\n<\/div>\n<div class=\"g2\">\n<div class=\"card cB\"><span class=\"tag fB\">Partie 1 · 10 pts<\/span><h3>Questions sur corpus<\/h3><p class=\"sm\">2 à 3 documents : des textes et souvent une image. 2 à 4 questions, le plus souvent 3 (session 2025 : 3 + 3 + 4 points). Réponses rédigées et argumentées.<\/p><\/div>\n<div class=\"card cO\"><span class=\"tag fO\">Partie 2 · 10 pts<\/span><h3>Essai<\/h3><p class=\"sm\">2 sujets au choix. Une réflexion personnelle et nuancée, appuyée sur le corpus, le cours et ta culture.<\/p><\/div>\n<\/div>\n<div style=\"display:flex;flex-direction:column;gap:6px\">\n<p class=\"kick mut\">Le minutage conseillé<\/p>\n<div class=\"bar\" style=\"display:flex;height:44px;border-radius:12px;overflow:hidden;font-weight:700;font-size:13px;color:#FFFFFF\">\n<div class=\"fB\" style=\"flex:80;display:flex;align-items:center;padding-left:14px\">Corpus · 1 h 20<\/div>\n<div class=\"fO\" style=\"flex:85;display:flex;align-items:center;padding-left:14px;color:#16182B\">Essai · 1 h 25<\/div>\n<div style=\"flex:22;display:flex;align-items:center;justify-content:center;background:#16182B\">Relecture<\/div>\n<\/div>\n<\/div>\n<div class=\"card cY\"><h3>Ce qui a changé depuis 2025<\/h3><p class=\"sm\">Fini la synthèse et l'« écriture personnelle » : l'épreuve dure 3 h au lieu de 4 h et ne porte plus que sur un thème. L'orthographe et l'expression comptent dans les deux parties. Pas de style télégraphique, pas de tirets.<\/p><\/div>\n<div class=\"g2 sm\" style=\"gap:4px 20px\">\n<span><b>02<\/b> · Le thème en 1 minute<\/span><span><b>09<\/b> · Expressions et citations<\/span>\n<span><b>03<\/b> · Ce que dit le BO<\/span><span><b>10–13<\/b> · Les références, axe par axe<\/span>\n<span><b>04–05<\/b> · Méthode du corpus<\/span><span><b>14<\/b> · Actualité et exemples NDRC<\/span>\n<span><b>06–07<\/b> · Méthode de l'essai<\/span><span><b>15<\/b> · Sujets probables<\/span>\n<span><b>08<\/b> · Vocabulaire clé<\/span><span><b>16<\/b> · Kit minimum et jour J<\/span>\n<\/div>","x":"fiche de révision · culture générale et expression le vrai du faux le thème unique de cge pour la session 2027, commun à tous les bts. tout ce qu'il faut pour réviser : l'épreuve, la méthode, les notions, les références et des exemples ndrc. l'épreuve en un coup d'œil 3 h épreuve écrite 20 pts deux parties sur 10 1 thème « le vrai du faux » partie 1 · 10 pts questions sur corpus 2 à 3 documents : des textes et souvent une image. 2 à 4 questions, le plus souvent 3 (session 2025 : 3 + 3 + 4 points). réponses rédigées et argumentées. partie 2 · 10 pts essai 2 sujets au choix. une réflexion personnelle et nuancée, appuyée sur le corpus, le cours et ta culture. le minutage conseillé corpus · 1 h 20 essai · 1 h 25 relecture ce qui a changé depuis 2025 fini la synthèse et l'« écriture personnelle » : l'épreuve dure 3 h au lieu de 4 h et ne porte plus que sur un thème. l'orthographe et l'expression comptent dans les deux parties. pas de style télégraphique, pas de tirets. 02 · le thème en 1 minute 09 · expressions et citations 03 · ce que dit le bo 10–13 · les références, axe par axe 04–05 · méthode du corpus 14 · actualité et exemples ndrc 06–07 · méthode de l'essai 15 · sujets probables 08 · vocabulaire clé 16 · kit minimum et jour j"},{"t":"Le thème en 1 minute","h":"<p class=\"kick tO\">Le thème<\/p>\n<h1>Le thème en 1 minute<\/h1>\n<div class=\"card dark\" style=\"padding:20px 22px\"><p class=\"quote\">Le faux ne fait pas que tromper : il peut aussi révéler une vérité. Il y a un « vrai du faux », et il faut savoir le démêler.<\/p><\/div>\n<p>Le contexte, c'est une époque dite de <b>« post-vérité »<\/b> : infox, images retouchées, deepfakes et IA génératives brouillent la frontière entre le réel et l'artificiel. Le thème te demande d'exercer ton <b>esprit critique<\/b>, sans tomber dans le « tout est faux ».<\/p>\n<h2>Les 4 axes : chacun peut devenir une partie d'essai<\/h2>\n<div class=\"g2\">\n<div class=\"card cO\"><span class=\"tag fO\">Axe 1<\/span><h3>Le faux trompe<\/h3><p class=\"sm\">Mensonge, propagande, publicité mensongère, infox, deepfakes, arnaques. Le faux comme arme de manipulation.<\/p><p class=\"sm tO\"><b>Ex. :<\/b> <i>1984<\/i>, <i>Le Tartuffe<\/i>, <i>L'Adversaire<\/i><\/p><\/div>\n<div class=\"card cB\"><span class=\"tag fB\">Axe 2<\/span><h3>Le faux révèle<\/h3><p class=\"sm\">La fiction invente pour dire des vérités sur l'homme et la société : c'est le « mentir-vrai » d'Aragon.<\/p><p class=\"sm tB\"><b>Ex. :<\/b> <i>L'Illusion comique<\/i>, <i>Rashōmon<\/i>, <i>Opération lune<\/i><\/p><\/div>\n<div class=\"card cP\"><span class=\"tag fP\">Axe 3<\/span><h3>Le faux séduit<\/h3><p class=\"sm\">Trompe-l'œil, magie, effets spéciaux, séries, jeux vidéo : on accepte volontiers d'être trompé pour le plaisir.<\/p><p class=\"sm tP\"><b>Ex. :<\/b> <i>The Truman Show<\/i>, <i>Le Prestige<\/i>, Magritte<\/p><\/div>\n<div class=\"card cG\"><span class=\"tag fG\">Axe 4<\/span><h3>Le faux a une valeur<\/h3><p class=\"sm\">Contrefaçon, copies, faux tableaux, faux avis clients, greenwashing : l'authenticité devient un argument de vente.<\/p><p class=\"sm tG\"><b>Ex. :<\/b> <i>F for Fake<\/i>, <i>Arrête-moi si tu peux<\/i><\/p><\/div>\n<\/div>\n<div class=\"card cY\" style=\"padding:16px 18px\"><p class=\"kick\" style=\"color:#7A5B00\">À savoir par cœur<\/p><p class=\"quote\" style=\"font-size:19px\">Le faux est-il seulement l'ennemi du vrai, ou peut-il aussi, quand il est assumé, nous conduire vers la vérité ?<\/p><\/div>\n<div class=\"card\" style=\"background:#16182B;color:#FFFFFF\"><h3>Ton atout NDRC<\/h3><p class=\"sm\" style=\"color:#E4E5EE\">La relation client repose sur la confiance. Faux avis, influenceurs non transparents, promesses exagérées, storytelling de marque, arnaques par deepfake : ce sont des exemples précis que peu de candidats d'autres BTS auront. Utilise-les dans l'essai.<\/p><\/div>","x":"le thème le thème en 1 minute le faux ne fait pas que tromper : il peut aussi révéler une vérité. il y a un « vrai du faux », et il faut savoir le démêler. le contexte, c'est une époque dite de « post-vérité » : infox, images retouchées, deepfakes et ia génératives brouillent la frontière entre le réel et l'artificiel. le thème te demande d'exercer ton esprit critique , sans tomber dans le « tout est faux ». les 4 axes : chacun peut devenir une partie d'essai axe 1 le faux trompe mensonge, propagande, publicité mensongère, infox, deepfakes, arnaques. le faux comme arme de manipulation. ex. : 1984 , le tartuffe , l'adversaire axe 2 le faux révèle la fiction invente pour dire des vérités sur l'homme et la société : c'est le « mentir-vrai » d'aragon. ex. : l'illusion comique , rashōmon , opération lune axe 3 le faux séduit trompe-l'œil, magie, effets spéciaux, séries, jeux vidéo : on accepte volontiers d'être trompé pour le plaisir. ex. : the truman show , le prestige , magritte axe 4 le faux a une valeur contrefaçon, copies, faux tableaux, faux avis clients, greenwashing : l'authenticité devient un argument de vente. ex. : f for fake , arrête-moi si tu peux à savoir par cœur le faux est-il seulement l'ennemi du vrai, ou peut-il aussi, quand il est assumé, nous conduire vers la vérité ? ton atout ndrc la relation client repose sur la confiance. faux avis, influenceurs non transparents, promesses exagérées, storytelling de marque, arnaques par deepfake : ce sont des exemples précis que peu de candidats d'autres bts auront. utilise-les dans l'essai."},{"t":"Ce que dit le BO","h":"<p class=\"kick tO\">Le texte officiel<\/p>\n<h1>Ce que dit le BO<\/h1>\n<p class=\"mut\">La problématique officielle (BO n° 17 du 23 avril 2026) cite ces repères. Chaque nom est une référence que le jury reconnaîtra tout de suite.<\/p>\n<div class=\"g2\" style=\"gap:10px\"><div class=\"card cO\" style=\"padding:11px 14px;gap:4px\"><h3 style=\"font-size:15px\">Le constat<\/h3><p class=\"sm\">Les manipulations du langage et, plus encore, des images fabriquent faux documents, faux témoignages, jusqu'à des univers entièrement artificiels.<\/p><\/div><div class=\"card cP\" style=\"padding:11px 14px;gap:4px\"><h3 style=\"font-size:15px\">Umberto Eco, <i>La Guerre du faux<\/i><\/h3><p class=\"sm\">Dans les années 1970, il décrit l'« hyperréalité » américaine : villes factices, châteaux reconstitués, musées de cire.<\/p><\/div><div class=\"card cP\" style=\"padding:11px 14px;gap:4px\"><h3 style=\"font-size:15px\">Seahaven<\/h3><p class=\"sm\">La ville parfaite et entièrement fausse de <i>The Truman Show<\/i> (Peter Weir, 1998).<\/p><\/div><div class=\"card cO\" style=\"padding:11px 14px;gap:4px\"><h3 style=\"font-size:15px\">Post-vérité et IA<\/h3><p class=\"sm\">Les IA génératives produisent textes et images selon des probabilités, sans garantie de vérité. Comment distinguer propagande, infox et information ?<\/p><\/div><div class=\"card cP\" style=\"padding:11px 14px;gap:4px\"><h3 style=\"font-size:15px\">Zeuxis<\/h3><p class=\"sm\">Selon Pline l'Ancien (<i>Histoire naturelle<\/i>, livre XXXV), ce peintre grec peint des raisins si réalistes que des oiseaux viennent les picorer.<\/p><\/div><div class=\"card cB\" style=\"padding:11px 14px;gap:4px\"><h3 style=\"font-size:15px\">Aristote et la mimésis<\/h3><p class=\"sm\">L'être humain éprouve du plaisir devant l'imitation.<\/p><\/div><div class=\"card cB\" style=\"padding:11px 14px;gap:4px\"><h3 style=\"font-size:15px\">Trompe-l'œil, fiction, baroque<\/h3><p class=\"sm\">L'illusion peut révéler ce qu'elle imite.<\/p><\/div><div class=\"card cB\" style=\"padding:11px 14px;gap:4px\"><h3 style=\"font-size:15px\">Aragon, le « mentir-vrai »<\/h3><p class=\"sm\">Le roman dévoile la vérité du monde.<\/p><\/div><div class=\"card cB\" style=\"padding:11px 14px;gap:4px\"><h3 style=\"font-size:15px\">Coleridge<\/h3><p class=\"sm\">La « suspension volontaire de l'incrédulité » : on fait semblant d'y croire en sachant que c'est faux. Le spectateur n'est pas dupe.<\/p><\/div><div class=\"card cG\" style=\"padding:11px 14px;gap:4px\"><h3 style=\"font-size:15px\">La consommation<\/h3><p class=\"sm\">Simili-cuir, bijoux en toc, fausse monnaie, contrefaçons : la question de l'authenticité.<\/p><\/div><div class=\"card cG\" style=\"padding:11px 14px;gap:4px\"><h3 style=\"font-size:15px\">L'art<\/h3><p class=\"sm\">Hommage, plagiat, mystification. Une copie a de la valeur quand elle remplace un original fragile ou disparu (ex. les répliques de la grotte de Lascaux).<\/p><\/div><\/div>\n<div class=\"card dark\" style=\"padding:16px 20px\"><p class=\"kick\" style=\"color:#FFB79A\">La question finale du BO<\/p><p style=\"font-size:15px;line-height:1.5\">Il faut distinguer les usages utiles et nuisibles du faux, sans confondre exigence de vérité et besoin d'imaginaire. Et se demander si la fiction et l'art ne peuvent pas nous aider à combattre la médiocrité du faux.<\/p><\/div>\n<div class=\"row\" style=\"gap:8px;flex-wrap:wrap\"><span class=\"chip\">Bleu = le faux qui révèle<\/span><span class=\"chip\">Violet = le faux qui séduit<\/span><span class=\"chip\">Orange = le faux qui trompe<\/span><span class=\"chip\">Vert = le faux qui a une valeur<\/span><\/div>","x":"le texte officiel ce que dit le bo la problématique officielle (bo n° 17 du 23 avril 2026) cite ces repères. chaque nom est une référence que le jury reconnaîtra tout de suite. le constat les manipulations du langage et, plus encore, des images fabriquent faux documents, faux témoignages, jusqu'à des univers entièrement artificiels. umberto eco, la guerre du faux dans les années 1970, il décrit l'« hyperréalité » américaine : villes factices, châteaux reconstitués, musées de cire. seahaven la ville parfaite et entièrement fausse de the truman show (peter weir, 1998). post-vérité et ia les ia génératives produisent textes et images selon des probabilités, sans garantie de vérité. comment distinguer propagande, infox et information ? zeuxis selon pline l'ancien ( histoire naturelle , livre xxxv), ce peintre grec peint des raisins si réalistes que des oiseaux viennent les picorer. aristote et la mimésis l'être humain éprouve du plaisir devant l'imitation. trompe-l'œil, fiction, baroque l'illusion peut révéler ce qu'elle imite. aragon, le « mentir-vrai » le roman dévoile la vérité du monde. coleridge la « suspension volontaire de l'incrédulité » : on fait semblant d'y croire en sachant que c'est faux. le spectateur n'est pas dupe. la consommation simili-cuir, bijoux en toc, fausse monnaie, contrefaçons : la question de l'authenticité. l'art hommage, plagiat, mystification. une copie a de la valeur quand elle remplace un original fragile ou disparu (ex. les répliques de la grotte de lascaux). la question finale du bo il faut distinguer les usages utiles et nuisibles du faux, sans confondre exigence de vérité et besoin d'imaginaire. et se demander si la fiction et l'art ne peuvent pas nous aider à combattre la médiocrité du faux. bleu = le faux qui révèle violet = le faux qui séduit orange = le faux qui trompe vert = le faux qui a une valeur"},{"t":"Les questions sur corpus","h":"<p class=\"kick tB\">Partie 1 · 10 points · 1 h 20<\/p>\n<h1>Les questions sur corpus<\/h1>\n<div class=\"card cB\"><p style=\"font-size:15px\"><b>La règle d'or :<\/b> répondre précisément à la question posée, en analysant les documents, jamais en les résumant. En général : une question sur un document, une qui en compare deux, une sur tout le corpus.<\/p><\/div>\n<div class=\"g4\">\n<div class=\"step\"><span class=\"bign tB\">1<\/span><b>Lire le sujet<\/b><span class=\"mut sm\">5 min<\/span><span>Toutes les questions d'abord : elles disent quoi chercher. Entoure les mots-clés et le verbe.<\/span><\/div>\n<div class=\"step\"><span class=\"bign tB\">2<\/span><b>Lire le corpus<\/b><span class=\"mut sm\">20 min<\/span><span>Paratexte (auteur, date, genre, source), une couleur de surligneur par question.<\/span><\/div>\n<div class=\"step\"><span class=\"bign tB\">3<\/span><b>Brouillon<\/b><span class=\"mut sm\">15 min<\/span><span>Pour chaque question, 2 ou 3 idées, chacune avec une preuve tirée du document.<\/span><\/div>\n<div class=\"step\"><span class=\"bign tB\">4<\/span><b>Rédiger<\/b><span class=\"mut sm\">40 min<\/span><span>Un paragraphe par idée. Plus de lignes pour la question qui vaut le plus de points.<\/span><\/div>\n<\/div>\n<h2>Décoder le verbe de consigne<\/h2>\n<table class=\"tb\">\n<tr><th style=\"width:34%\">La consigne<\/th><th>Ce qu'il faut faire<\/th><\/tr>\n<tr><td>Analysez, montrez<\/td><td>Expliquer comment le document produit son sens : procédés, exemples, effets.<\/td><\/tr>\n<tr><td>Comparez, rapprochez et distinguez<\/td><td>Points communs ET différences, en croisant les documents dans chaque paragraphe.<\/td><\/tr>\n<tr><td>En quoi… ? Comment… ?<\/td><td>Démontrer un lien, expliquer un fonctionnement.<\/td><\/tr>\n<tr><td>Selon vous… ? Pensez-vous que… ?<\/td><td>Donner un avis argumenté et nuancé, toujours appuyé sur le corpus.<\/td><\/tr>\n<tr><td>Une citation (« … », l. 12)<\/td><td>Expliquer la citation, puis la relier au reste du document.<\/td><\/tr>\n<\/table>\n<h2>Lire une image<\/h2>\n<div class=\"row\" style=\"flex-wrap:wrap;gap:8px\"><span class=\"chip\">Nature : photo, affiche, dessin de presse, pub<\/span><span class=\"chip\">Composition et cadrage<\/span><span class=\"chip\">Couleurs<\/span><span class=\"chip\">Texte présent<\/span><span class=\"chip\">Message<\/span><span class=\"chip\">Public visé<\/span><\/div>\n<h2>Le paragraphe parfait<\/h2>\n<div class=\"g3\">\n<div class=\"card cB\" style=\"gap:4px\"><span class=\"bign tB\">Idée<\/span><p class=\"sm\">Une phrase qui répond directement à la question.<\/p><\/div>\n<div class=\"card cB\" style=\"gap:4px\"><span class=\"bign tB\">Preuve<\/span><p class=\"sm\">Une citation courte entre guillemets avec sa ligne (l. 8), ou un détail précis de l'image.<\/p><\/div>\n<div class=\"card cB\" style=\"gap:4px\"><span class=\"bign tB\">Analyse<\/span><p class=\"sm\">Ce que la preuve montre : le procédé, son effet, son sens. C'est là que sont les points.<\/p><\/div>\n<\/div>","x":"partie 1 · 10 points · 1 h 20 les questions sur corpus la règle d'or : répondre précisément à la question posée, en analysant les documents, jamais en les résumant. en général : une question sur un document, une qui en compare deux, une sur tout le corpus. 1 lire le sujet 5 min toutes les questions d'abord : elles disent quoi chercher. entoure les mots-clés et le verbe. 2 lire le corpus 20 min paratexte (auteur, date, genre, source), une couleur de surligneur par question. 3 brouillon 15 min pour chaque question, 2 ou 3 idées, chacune avec une preuve tirée du document. 4 rédiger 40 min un paragraphe par idée. plus de lignes pour la question qui vaut le plus de points. décoder le verbe de consigne la consigne ce qu'il faut faire analysez, montrez expliquer comment le document produit son sens : procédés, exemples, effets. comparez, rapprochez et distinguez points communs et différences, en croisant les documents dans chaque paragraphe. en quoi… ? comment… ? démontrer un lien, expliquer un fonctionnement. selon vous… ? pensez-vous que… ? donner un avis argumenté et nuancé, toujours appuyé sur le corpus. une citation (« … », l. 12) expliquer la citation, puis la relier au reste du document. lire une image nature : photo, affiche, dessin de presse, pub composition et cadrage couleurs texte présent message public visé le paragraphe parfait idée une phrase qui répond directement à la question. preuve une citation courte entre guillemets avec sa ligne (l. 8), ou un détail précis de l'image. analyse ce que la preuve montre : le procédé, son effet, son sens. c'est là que sont les points."},{"t":"Le corpus : exemples et pièges","h":"<p class=\"kick tB\">Partie 1 · suite<\/p>\n<h1>Le corpus : exemples et pièges<\/h1>\n<div class=\"ex\"><p class=\"lab\">Exemple rédigé · question sur un document (sujet fictif)<\/p><p><i>Question : « Comment le document 2 dénonce-t-il les infox ? »<\/i><\/p><p style=\"margin-top:6px\"><span class=\"hl\">Idée<\/span> L'auteur souligne d'abord la vitesse de propagation du faux. <span class=\"hl\">Preuve<\/span> Il rappelle qu'une fausse information « se répand six fois plus vite » qu'une vraie (l. 14). <span class=\"hl\">Analyse<\/span> Ce chiffre, tiré d'une étude scientifique, donne du poids à son propos : il montre que le faux a un avantage sur le vrai, parce qu'il surprend et fait réagir.<\/p><\/div>\n<div class=\"ex\"><p class=\"lab\">Exemple rédigé · question de comparaison (sujet fictif)<\/p><p><i>Question : « Rapprochez et distinguez la vision du faux dans le document 1 (extrait de <\/i>1984<i>) et le document 3 (affiche contre les deepfakes). »<\/i><\/p><p style=\"margin-top:6px\">Les deux documents montrent un faux qui menace la liberté de penser. Chez Orwell, c'est l'État qui réécrit les archives pour imposer sa vérité ; sur l'affiche, le danger vient de vidéos truquées que n'importe qui peut fabriquer. Mais le roman décrit un faux subi, sans issue, alors que l'affiche invite le lecteur à agir : vérifier la source avant de partager.<\/p><\/div>\n<div class=\"g2\">\n<div class=\"card cG\"><h3>Les consignes officielles<\/h3>\n<ul class=\"sm\"><li>Pas d'introduction ni de conclusion exigées : commence directement par la réponse.<\/li><li>Présente un document en une phrase la première fois que tu le cites.<\/li><li>Longueur libre : vise 15 à 25 lignes par question.<\/li><li>Citations brèves, toujours commentées.<\/li><li>Ta culture peut prolonger l'analyse, jamais la remplacer.<\/li><li>Comparaison : croise les documents dans chaque paragraphe.<\/li><\/ul><\/div>\n<div class=\"card cO\"><h3>Les pièges classiques<\/h3>\n<ul class=\"sm\"><li>Paraphraser ou résumer le texte.<\/li><li>Oublier l'image.<\/li><li>Répondre à côté de la question.<\/li><li>Donner son avis quand on demande d'analyser.<\/li><li>Traiter le doc 1, puis le doc 2, sans les croiser.<\/li><li>Passer trop de temps ici et bâcler l'essai.<\/li><\/ul><\/div>\n<\/div>\n<div class=\"card dark\"><h3>Check-list avant de passer à l'essai<\/h3>\n<div class=\"g2 sm\" style=\"color:#E4E5EE;gap:4px 18px\"><span>Réponses numérotées, dans l'ordre<\/span><span>Une ligne sautée entre chaque réponse<\/span><span>Chaque idée a sa preuve<\/span><span>Chaque preuve a son analyse<\/span><span>L'image est exploitée<\/span><span>Pas plus de 1 h 20 passée<\/span><\/div><\/div>","x":"partie 1 · suite le corpus : exemples et pièges exemple rédigé · question sur un document (sujet fictif) question : « comment le document 2 dénonce-t-il les infox ? » idée l'auteur souligne d'abord la vitesse de propagation du faux. preuve il rappelle qu'une fausse information « se répand six fois plus vite » qu'une vraie (l. 14). analyse ce chiffre, tiré d'une étude scientifique, donne du poids à son propos : il montre que le faux a un avantage sur le vrai, parce qu'il surprend et fait réagir. exemple rédigé · question de comparaison (sujet fictif) question : « rapprochez et distinguez la vision du faux dans le document 1 (extrait de 1984 ) et le document 3 (affiche contre les deepfakes). » les deux documents montrent un faux qui menace la liberté de penser. chez orwell, c'est l'état qui réécrit les archives pour imposer sa vérité ; sur l'affiche, le danger vient de vidéos truquées que n'importe qui peut fabriquer. mais le roman décrit un faux subi, sans issue, alors que l'affiche invite le lecteur à agir : vérifier la source avant de partager. les consignes officielles pas d'introduction ni de conclusion exigées : commence directement par la réponse. présente un document en une phrase la première fois que tu le cites. longueur libre : vise 15 à 25 lignes par question. citations brèves, toujours commentées. ta culture peut prolonger l'analyse, jamais la remplacer. comparaison : croise les documents dans chaque paragraphe. les pièges classiques paraphraser ou résumer le texte. oublier l'image. répondre à côté de la question. donner son avis quand on demande d'analyser. traiter le doc 1, puis le doc 2, sans les croiser. passer trop de temps ici et bâcler l'essai. check-list avant de passer à l'essai réponses numérotées, dans l'ordre une ligne sautée entre chaque réponse chaque idée a sa preuve chaque preuve a son analyse l'image est exploitée pas plus de 1 h 20 passée"},{"t":"L'essai","h":"<p class=\"kick tO\">Partie 2 · 10 points · 1 h 25<\/p>\n<h1>L'essai<\/h1>\n<div class=\"card cO\"><p style=\"font-size:15px\">Ta réponse <b>personnelle, argumentée et nuancée<\/b> à une question ouverte, appuyée sur des exemples précis : corpus, œuvres du cours, actualité, expérience. Le jury attend surtout un vrai point de vue. Vise 2 à 3 pages.<\/p><\/div>\n<div class=\"g3\">\n<div class=\"step\"><span class=\"bign tO\">1<\/span><b>Choisir<\/b><span class=\"mut sm\">5 min<\/span><span>Le sujet pour lequel tu as le plus d'exemples, pas celui qui « a l'air facile ».<\/span><\/div>\n<div class=\"step\"><span class=\"bign tO\">2<\/span><b>Analyser<\/b><span class=\"mut sm\">10 min<\/span><span>Définis chaque mot-clé (le « faux » : mensonge ? fiction ? copie ?). Trouve la tension : c'est ta problématique.<\/span><\/div>\n<div class=\"step\"><span class=\"bign tO\">3<\/span><b>Plan<\/b><span class=\"mut sm\">15 min<\/span><span>2 ou 3 parties, 2 ou 3 arguments chacune, un exemple par argument.<\/span><\/div>\n<\/div>\n<h2>Choisir son plan<\/h2>\n<table class=\"tb\">\n<tr><th style=\"width:26%\">Type de sujet<\/th><th style=\"width:38%\">Plan conseillé<\/th><th>Exemple<\/th><\/tr>\n<tr><td>Question fermée (oui / non)<\/td><td>Dialectique : I. Oui · II. Mais · III. Dépassement<\/td><td>Le faux est-il toujours condamnable ?<\/td><\/tr>\n<tr><td>Question ouverte<\/td><td>Thématique : 2 ou 3 raisons, aspects ou causes<\/td><td>Pourquoi aimons-nous être trompés ?<\/td><\/tr>\n<tr><td>Citation à discuter<\/td><td>Expliquer la citation, la nuancer, conclure<\/td><td>« Le roman est un mensonge qui dit la vérité » : qu'en pensez-vous ?<\/td><\/tr>\n<\/table>\n<h2>L'introduction en 4 briques<\/h2>\n<div class=\"g4\">\n<div class=\"step cO\"><b>1 · Amorce<\/b><span>Un fait ou une référence qui accroche.<\/span><\/div>\n<div class=\"step cO\"><b>2 · Sujet<\/b><span>Le reformuler et définir ses termes.<\/span><\/div>\n<div class=\"step cO\"><b>3 · Problématique<\/b><span>Une vraie question, qui pose la tension.<\/span><\/div>\n<div class=\"step cO\"><b>4 · Annonce<\/b><span>Le plan, en une phrase claire.<\/span><\/div>\n<\/div>\n<div class=\"ex\"><p class=\"lab\">Exemple d'introduction · « Le faux est-il toujours condamnable ? »<\/p><p>En mars 2023, une photo du pape François en doudoune blanche fait le tour des réseaux sociaux : elle a été créée par une IA. Le faux est partout, et il inquiète. Mais tout ce qui est faux n'est pas forcément un mensonge : un roman, un film ou un tour de magie sont faux eux aussi. Faut-il alors condamner tout ce qui s'éloigne du vrai ? Nous verrons que le faux est condamnable quand il manipule, qu'il peut au contraire révéler une vérité ou divertir, et que tout dépend en fait du contrat passé avec le public.<\/p><\/div>","x":"partie 2 · 10 points · 1 h 25 l'essai ta réponse personnelle, argumentée et nuancée à une question ouverte, appuyée sur des exemples précis : corpus, œuvres du cours, actualité, expérience. le jury attend surtout un vrai point de vue. vise 2 à 3 pages. 1 choisir 5 min le sujet pour lequel tu as le plus d'exemples, pas celui qui « a l'air facile ». 2 analyser 10 min définis chaque mot-clé (le « faux » : mensonge ? fiction ? copie ?). trouve la tension : c'est ta problématique. 3 plan 15 min 2 ou 3 parties, 2 ou 3 arguments chacune, un exemple par argument. choisir son plan type de sujet plan conseillé exemple question fermée (oui / non) dialectique : i. oui · ii. mais · iii. dépassement le faux est-il toujours condamnable ? question ouverte thématique : 2 ou 3 raisons, aspects ou causes pourquoi aimons-nous être trompés ? citation à discuter expliquer la citation, la nuancer, conclure « le roman est un mensonge qui dit la vérité » : qu'en pensez-vous ? l'introduction en 4 briques 1 · amorce un fait ou une référence qui accroche. 2 · sujet le reformuler et définir ses termes. 3 · problématique une vraie question, qui pose la tension. 4 · annonce le plan, en une phrase claire. exemple d'introduction · « le faux est-il toujours condamnable ? » en mars 2023, une photo du pape françois en doudoune blanche fait le tour des réseaux sociaux : elle a été créée par une ia. le faux est partout, et il inquiète. mais tout ce qui est faux n'est pas forcément un mensonge : un roman, un film ou un tour de magie sont faux eux aussi. faut-il alors condamner tout ce qui s'éloigne du vrai ? nous verrons que le faux est condamnable quand il manipule, qu'il peut au contraire révéler une vérité ou divertir, et que tout dépend en fait du contrat passé avec le public."},{"t":"Développer, conclure, éviter les pièges","h":"<p class=\"kick tO\">Partie 2 · suite<\/p>\n<h1>Développer, conclure, éviter les pièges<\/h1>\n<div class=\"g3\">\n<div class=\"card cO\" style=\"gap:4px\"><span class=\"bign tO\">A<\/span><b>Argument<\/b><p class=\"sm\">Une idée claire, en une phrase.<\/p><\/div>\n<div class=\"card cO\" style=\"gap:4px\"><span class=\"bign tO\">E<\/span><b>Exemple<\/b><p class=\"sm\">Précis : auteur, titre, date si possible.<\/p><\/div>\n<div class=\"card cO\" style=\"gap:4px\"><span class=\"bign tO\">I<\/span><b>Interprétation<\/b><p class=\"sm\">En quoi l'exemple prouve l'argument. C'est là que tu gagnes les points.<\/p><\/div>\n<\/div>\n<div class=\"ex\"><p class=\"lab\">Exemple de paragraphe A.E.I.<\/p><p><span class=\"hl\">A<\/span> La fiction peut dénoncer une manipulation mieux qu'un discours direct. <span class=\"hl\">E<\/span> Dans <i>The Truman Show<\/i> (Peter Weir, 1998), Truman vit sans le savoir dans Seahaven, une ville-décor filmée en permanence pour une émission de télévision. <span class=\"hl\">I<\/span> En nous faisant découvrir le mensonge en même temps que lui, le film nous oblige à nous demander si nos propres écrans ne nous montrent pas, eux aussi, un monde arrangé. Le faux devient ici un outil de lucidité.<\/p><\/div>\n<div class=\"g2\">\n<div class=\"card\"><h3>Varie tes sources<\/h3><div class=\"row\" style=\"flex-wrap:wrap;gap:6px\"><span class=\"chip\">Un document du corpus<\/span><span class=\"chip\">Un roman ou une pièce<\/span><span class=\"chip\">Un film, une série, une BD<\/span><span class=\"chip\">Un fait d'actualité daté<\/span><span class=\"chip\">Ton expérience en entreprise<\/span><\/div><\/div>\n<div class=\"card\"><h3>Transitions types<\/h3><p class=\"sm\">« Si le faux sert d'abord à tromper, il peut aussi… »<br>« Pourtant, cette condamnation mérite d'être nuancée. »<br>« Dès lors, la question n'est plus… mais… »<\/p><\/div>\n<\/div>\n<div class=\"card cY\"><h3>La conclusion (5 à 6 lignes)<\/h3><p class=\"sm\">Réponds clairement à la problématique, en reprenant le chemin parcouru en une ou deux phrases. Puis ouvre sur une question voisine : l'IA, l'avenir de l'information, l'éducation aux médias.<\/p><\/div>\n<h2>Plan détaillé · « Le faux est-il toujours condamnable ? »<\/h2>\n<div class=\"g3\">\n<div class=\"card cO\"><span class=\"tag fO\">I<\/span><h3>Oui, quand il manipule<\/h3><p class=\"sm\">La propagande dans <i>1984<\/i> d'Orwell ; infox et deepfakes ; les faux avis clients qui trompent le consommateur.<\/p><\/div>\n<div class=\"card cB\"><span class=\"tag fB\">II<\/span><h3>Non, quand il révèle ou divertit<\/h3><p class=\"sm\">Le « mentir-vrai » d'Aragon ; <i>The Truman Show<\/i> ; le trompe-l'œil et la magie, plaisirs consentis.<\/p><\/div>\n<div class=\"card cG\"><span class=\"tag fG\">III<\/span><h3>Tout dépend du contrat<\/h3><p class=\"sm\">Le faux assumé (roman, pub annoncée, magie) est légitime ; le faux caché est condamnable. D'où l'esprit critique et la transparence.<\/p><\/div>\n<\/div>\n<div class=\"card dark\"><h3>Les pièges classiques<\/h3><p class=\"sm\" style=\"color:#E4E5EE\">Réciter son cours sans répondre au sujet · empiler les exemples sans les expliquer · rester vague (« dans un film, on voit que… ») · ne citer que le corpus · oublier de donner son avis en conclusion.<\/p><\/div>","x":"partie 2 · suite développer, conclure, éviter les pièges a argument une idée claire, en une phrase. e exemple précis : auteur, titre, date si possible. i interprétation en quoi l'exemple prouve l'argument. c'est là que tu gagnes les points. exemple de paragraphe a.e.i. a la fiction peut dénoncer une manipulation mieux qu'un discours direct. e dans the truman show (peter weir, 1998), truman vit sans le savoir dans seahaven, une ville-décor filmée en permanence pour une émission de télévision. i en nous faisant découvrir le mensonge en même temps que lui, le film nous oblige à nous demander si nos propres écrans ne nous montrent pas, eux aussi, un monde arrangé. le faux devient ici un outil de lucidité. varie tes sources un document du corpus un roman ou une pièce un film, une série, une bd un fait d'actualité daté ton expérience en entreprise transitions types « si le faux sert d'abord à tromper, il peut aussi… » « pourtant, cette condamnation mérite d'être nuancée. » « dès lors, la question n'est plus… mais… » la conclusion (5 à 6 lignes) réponds clairement à la problématique, en reprenant le chemin parcouru en une ou deux phrases. puis ouvre sur une question voisine : l'ia, l'avenir de l'information, l'éducation aux médias. plan détaillé · « le faux est-il toujours condamnable ? » i oui, quand il manipule la propagande dans 1984 d'orwell ; infox et deepfakes ; les faux avis clients qui trompent le consommateur. ii non, quand il révèle ou divertit le « mentir-vrai » d'aragon ; the truman show ; le trompe-l'œil et la magie, plaisirs consentis. iii tout dépend du contrat le faux assumé (roman, pub annoncée, magie) est légitime ; le faux caché est condamnable. d'où l'esprit critique et la transparence. les pièges classiques réciter son cours sans répondre au sujet · empiler les exemples sans les expliquer · rester vague (« dans un film, on voit que… ») · ne citer que le corpus · oublier de donner son avis en conclusion."},{"t":"Le vocabulaire qui rapporte des points","h":"<p class=\"kick tP\">Notions<\/p>\n<h1>Le vocabulaire qui rapporte des points<\/h1>\n<p class=\"mut\">Un mot précis, bien défini, vaut mieux qu'une longue phrase vague. Glisse-les dans tes deux parties.<\/p>\n<div class=\"g2\" style=\"align-items:start\">\n<div style=\"display:flex;flex-direction:column;gap:12px\"><div class=\"card cB\" style=\"gap:2px;padding:12px 14px\"><span class=\"tag fB\" style=\"margin-bottom:4px\">Vérité et mensonge<\/span><div class=\"sm\"><div style=\"padding:4px 0;border-bottom:1px solid #D9DBE7\"><b>Vérité<\/b> · <span>ce qui est conforme à la réalité<\/span><\/div><div style=\"padding:4px 0;border-bottom:1px solid #D9DBE7\"><b>Véracité<\/b> · <span>qualité de celui qui dit vrai, de bonne foi<\/span><\/div><div style=\"padding:4px 0;border-bottom:1px solid #D9DBE7\"><b>Mensonge<\/b> · <span>affirmer ce qu'on sait faux, pour tromper<\/span><\/div><div style=\"padding:4px 0;border-bottom:1px solid #D9DBE7\"><b>Erreur<\/b> · <span>dire faux sans le savoir : pas d'intention<\/span><\/div><div style=\"padding:4px 0;border-bottom:1px solid #D9DBE7\"><b>Crédulité / incrédulité<\/b> · <span>tout croire / ne rien croire<\/span><\/div><div style=\"padding:4px 0;border-bottom:1px solid #D9DBE7\"><b>Biais de confirmation<\/b> · <span>croire plus vite ce qui confirme ce qu'on pense déjà<\/span><\/div><\/div><\/div><div class=\"card cP\" style=\"gap:2px;padding:12px 14px\"><span class=\"tag fP\" style=\"margin-bottom:4px\">Fiction et art<\/span><div class=\"sm\"><div style=\"padding:4px 0;border-bottom:1px solid #D9DBE7\"><b>Fiction<\/b> · <span>récit inventé, qui ne prétend pas être vrai<\/span><\/div><div style=\"padding:4px 0;border-bottom:1px solid #D9DBE7\"><b>Mimésis<\/b> · <span>imitation du réel par l'art (Aristote)<\/span><\/div><div style=\"padding:4px 0;border-bottom:1px solid #D9DBE7\"><b>Vraisembla P\"><b>Boileau, <i>L'Art poétique<\/i>, 1674<\/b><\/p><p class=\"sm mut\">Pour : la réalité dépasse parfois la fiction.<\/p><\/div><div class=\"card cP\" style=\"gap:3px;padding:11px 14px\"><p style=\"font-family:'Bricolage Grotesque',Inter,sans-serif;font-weight:700;font-size:16px;line-height:1.3\">« L'art est un mensonge qui nous fait réaliser la vérité. »<\/p><p class=\"sm tP\"><b>Pablo Picasso<\/b><\/p><p class=\"sm mut\">Pour : l'axe 2, le faux qui révèle.<\/p><\/div><div class=\"card cP\" style=\"gap:3px;padding:11px 14px\"><p style=\"font-family:'Bricolage Grotesque',Inter,sans-serif;font-weight:700;font-size:16px;line-height:1.3\">« La guerre, c'est la paix. La liberté, c'est l'esclavage. L'ignorance, c'est la force. »<\/p><p class=\"sm tP\"><b>George Orwell, <i>1984<\/i>, 1949<\/b><\/p><p class=\"sm mut\">Pour : la propagande qui inverse le sens des mots.<\/p><\/div><div class=\"card cP\" style=\"gap:3px;padding:11px 14px\"><p style=\"font-family:'Bricolage Grotesque',Inter,sans-serif;font-weight:700;font-size:16px;line-height:1.3\">« Le monde entier est une scène. »<\/p><p class=\"sm tP\"><b>Shakespeare, <i>Comme il vous plaira<\/i><\/b><\/p><p class=\"sm mut\">Pour : le <i>theatrum mundi<\/i>, la vie comme théâtre.<\/p><\/div><div class=\"card cP\" style=\"gap:3px;padding:11px 14px\"><p style=\"font-family:'Bricolage Grotesque',Inter,sans-serif;font-weight:700;font-size:16px;line-height:1.3\">« Un mensonge peut faire le tour de la Terre pendant que la vérité met ses chaussures. »<\/p><p class=\"sm tP\"><b>Attribuée à Mark Twain, sans aucune preuve ; une idée proche existe chez Jonathan Swift en 1710<\/b><\/p><p class=\"sm mut\">Pour : une amorce piège. Une fausse attribution… sur le faux !<\/p><\/div><\/div>","x":"notions expressions et citations les autres mots-clés du bo faussaire : celui qui fabrique des faux · factice : artificiel, imité · métavers : univers virtuel partagé · illusionniste : artiste qui crée des illusions, comme un magicien · hyperréa ex;flex-direction:column;gap:2px\"><p class=\"kick mut\">Références · Axe 1<\/p><h1 style=\"font-size:34px\">Le faux qui trompe<\/h1><\/div><\/div><p class=\"mut\">Mensonge, propagande, manipulation, imposture. Toutes ces œuvres sont dans la bibliographie officielle.<\/p>\n<div class=\"g2\" style=\"gap:0 22px;align-items:start\"><div><div class=\"ref\"><span class=\"t\"><i>1984<\/i><\/span><span class=\"m\">George Orwell · roman · 1949<\/span><span class=\"d\">Le « ministère de la Vérité » réécrit le passé ; la novlangue appauvrit la langue pour empêcher de penser. « 2 + 2 = 5 ».<\/span><\/div><div class=\"ref\"><span class=\"t\"><i>La Ferme des animaux<\/i><\/span><span class=\"m\">George Orwell · 1945<\/span><span class=\"d\">Les cochons réécrivent les règles en douce ; le cochon Brille-Babil fait la propagande.<\/span><\/div><div class=\"ref\"><span class=\"t\"><i>La Servante écarlate<\/i><\/span><span class=\"m\">Margaret Atwood · roman · 1985<\/span><span class=\"d\">Dictature religieuse de Gilead : langage contrôlé, vérité officielle imposée.<\/span><\/div><div class=\"ref\"><span class=\"t\"><i>Le Tartuffe<\/i><\/span><span class=\"m\">Molière · comédie · 1664-1669<\/span><span class=\"d\">Un hypocrite joue le dévot pour s'emparer des biens d'Orgon. Le masque finit par tomber.<\/span><\/div><div class=\"ref\"><span class=\"t\"><i>Les Liaisons dangereuses<\/i><\/span><span class=\"m\">Choderlos de Laclos · roman par lettres · 1782<\/span><span class=\"d\">Merteuil et Valmont manipulent par le mensonge et la séduction calculée.<\/span><\/div><div class=\"ref\"><span class=\"t\">« Le Corbeau et le Renard », <i>Fables<\/i><\/span><span class=\"m\">La Fontaine · 1668<\/span><span class=\"d\">« Tout flatteur vit aux dépens de celui qui l'écoute » : la flatterie, mensonge intéressé.<\/span><\/div><div class=\"ref\"><span class=\"t\"><i>Illusions perdues<\/i><\/span><span class=\"m\">Balzac · roman · 1837-1843<\/span><span class=\"d\">Lucien de Rubempré découvre un journalisme corrompu : critiques achetées, réputations faites et défaites.<\/span><\/div><div class=\"ref\"><span class=\"t\"><i>L'Adversaire<\/i><\/span><span class=\"m\">Emmanuel Carrère · récit · 2000<\/span><span class=\"d\">Jean-Claude Romand se fait passer 18 ans pour un médecin de l'OMS, puis tue sa famille en 1993.<\/span><\/div><\/div><div><div class=\"ref\"><span class=\"t\"><i>La Rumeur d'Orléans<\/i><\/span><span class=\"m\">Edgar Morin · essai · 1969<\/span><span class=\"d\">Une fausse rumeur accuse des commerçants juifs d'enlever des jeunes femmes : comment naît une infox.<\/span><\/div><div class=\"ref\"><span class=\"t\">« La Dent d'or », <i>Histoire des oracles<\/i><\/span><span class=\"m\">Fontenelle · 1687<\/span><span class=\"d\">Des savants expliquent une dent en or… qui n'était qu'une feuille d'or collée. Vérifier avant d'expliquer.<\/span><\/div><div class=\"ref\"><span class=\"t\"><i>Propagande<\/i><\/span><span class=\"m\">David Colon · essai · 2019<\/span><span class=\"d\">Histoire de la manipulation de masse, de la publicité aux réseaux sociaux.<\/span><\/div><div class=\"ref\"><span class=\"t\"><i>Désinformation : les armes du faux<\/i><\/span><span class=\"m\">François-Bernard Huyghe · essai<\/span><span class=\"d\">La désinformation comme arme politique et numérique.<\/span><\/div><div class=\"ref\"><span class=\"t\"><i>Le Dictateur<\/i><\/span><span class=\"m\">Charlie Chaplin · film · 1940<\/span><span class=\"d\">Le rire démasque la propagande hitlérienne.<\/span><\/div><div class=\"ref\"><span class=\"t\"><i>Des hommes d'influence<\/i> (<i>Wag the Dog<\/i>)<\/span><span class=\"m\">Barry Levinson · film · 1997<\/span><span class=\"d\">Des conseillers inventent une fausse guerre télévisée pour faire oublier un scandale.<\/span><\/div><div class=\"ref\"><span class=\"t\"><i>Le Mage du Kremlin<\/i><\/span><span class=\"m\">Olivier Assayas · film · 2025<\/span><span class=\"d\">Un conseiller fictif de Poutine fabrique des récits : la politique comme mise en scène.<\/span><\/div><div class=\"ref\"><span class=\"t\"><i>Le Bureau des légendes<\/i>, saison 1<\/span><span class=\"m\">Éric Rochant · série · 2015<\/span><span class=\"d\">Des agents de la DGSE vivent sous une fausse identité, une « légende ».<\/span><\/div><\/div><\/div>","x":"1 références · axe 1 le faux qui trompe mensonge, propagande, manipulation, imposture. toutes ces œuvres sont dans la bibliographie officielle. 1984 george orwell · roman · 1949 le « ministère de la vérité » réécrit le passé ; la novlangue appauvrit la langue pour empêcher de penser. « 2 + 2 = 5 ». la ferme des animaux george orwell · 1945 les cochons réécrivent les règles en douce ; le cochon brille-babil fait la propagande. la servante écarlate margaret atwood · roman · 1985 dictature religieuse de gilead : langage contrôlé, vérité officielle imposée. le tartuffe molière · comédie · 1664-1669 un hypocrite joue le dévot pour s'emparer des biens d'orgon. le masque finit par tomber. les liaisons dangereuses choderlos de laclos · roman par lettres · 1782 merteuil et valmont manipulent par le mensonge et la séduction calculée. « le corbeau et le renard », fables la fontaine · 1668 « tout flatteur vit aux dépens de celui qui l'écoute » : la flatterie, mensonge intéressé. illusions perdues balzac · roman · 1837-1843 lucien de rubempré découvre un journalisme corrompu : critiques achetées, réputations faites et défaites. l'adversaire emmanuel carrère · récit · 2000 jean-claude romand se fait passer 18 ans pour un médecin de l'oms, puis tue sa famille en 1993. la rumeur d'orléans edgar morin · essai · 1969 une fausse rumeur accuse des commerçants juifs d'enlever des jeunes femmes : comment naît une infox. « la dent d'or », histoire des oracles fontenelle · 1687 des savants expliquent une dent en or… qui n'était qu'une feuille d'or collée. vérifier avant d'expliquer. propagande david colon · essai · 2019 histoire de la manipulation de masse, de la publicité aux réseaux sociaux. désinformation : les armes du faux françois-bernard huyghe · essai la désinformation comme arme politique et numérique. le dictateur charlie chaplin · film · 1940 le rire démasque la propagande hitlérienne. des hommes d'influence ( wag the dog ) barry levinson · film · 1997 des conseillers inventent une fausse guerre télévisée pour faire oublier un scandale. le mage du kremlin olivier assayas · film · 2025 un conseiller fictif de poutine fabrique des récits : la politique comme mise en scène. le bureau des légendes , saison 1 éric rochant · série · 2015 des agents de la dgse vivent sous une fausse identité, une « légende »."},{"t":"Le faux qui révèle","h":"<div class=\"row\" style=\"align-items:center;gap:14px\"><div class=\"fB\" style=\"width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#FFFFFF\" ><span class=\"bign\">2<\/span><\/div><div style=\"display:flex;flex-direction:column;gap:2px\"><p class=\"kick mut\">Références · Axe 2<\/p><h1 style=\"font-size:34px\">Le faux qui révèle<\/h1><\/div><\/div><p class=\"mut\">La fiction invente pour dire vrai. Toutes ces œuvres sont dans la bibliographie officielle.<\/p>\n<div class=\"g2\" style=\"gap:0 22px;align-items:start\"><div><div class=\"ref\"><span class=\"t\"><i>Le Mentir-vrai<\/i><\/span><span class=\"m\">Louis Aragon · nouvelle · 1980<\/span><span class=\"d\">Aragon mêle souvenirs et invention : le romancier « ment » pour dire une vérité plus profonde.<\/span><\/div><div class=\"ref\"><span class=\"t\"><i>L'Illusion comique<\/i><\/span><span class=\"m\">Pierre Corneille · comédie · 1636<\/span><span class=\"d\">Théâtre dans le théâtre : un père croit voir mourir son fils… qui jouait une pièce. Un éloge du théâtre.<\/span><\/div><div class=\"ref\"><span class=\"t\"><i>Le Menteur<\/i><\/span><span class=\"m\">Pierre Corneille · comédie · 1644<\/span><span class=\"d\">Dorante invente sans cesse des histoires : le mensonge comme jeu et talent de conteur.<\/span ie officielle savoir les situer suffit. littérature : octavia butler, la parabole du semeur · jean cocteau, le menteur · diderot, jacques le fataliste · georges perec, un cabinet d'amateur · nathalie sarraute, le mensonge . essais : pierre bayard, comment parler des faits qui ne se sont pas produits ? · jean-jacques breton, le faux dans l'art · bourdin et le bras (dir.), les fausses nouvelles · cadiou et gilou, la peinture en trompe-l'œil · paul eudel, le truquage · werner herzog, l'avenir de la vérité · annie le brun, du trop de réalité · todorov (dir.), littérature et réalité . films : chabrol, masques · fellini, la dolce vita , huit et demi · lubitsch, to be or not to be · verhoeven, elle . bd : moore et lloyd, v for vendetta . arts : botticelli, la calomnie d'apelle · arcimboldo · dalí · gysbrechts · luigi ghirri · véronèse."},{"t":"L'actualité et tes exemples NDRC","h":"<p class=\"kick tG\">Exemples<\/p>\n<h1>L'actualité et tes exemples NDRC<\/h1>\n<h2>5 faits datés et vérifiés<\/h2>\n<table class=\"tb\"><tr><th style=\"width:15%\">Date<\/th><th style=\"width:47%\">Le fait<\/th><th>Ce qu'il illustre<\/th><\/tr><tr><td style=\"white-space:nowrap\">Mars 2018<\/td><td>Étude du MIT (revue <i>Science<\/i>) : sur Twitter, une fausse info atteint 1 500 personnes environ 6 fois plus vite qu'une vraie.<\/td><td>Le faux circule mieux, à cause des humains plus que des robots : la nouveauté et l'émotion font partager.<\/td><\/tr><tr><td style=\"white-space:nowrap\">28 mai 2022<\/td><td>Directive européenne Omnibus : diffuser ou faire diffuser de faux avis clients devient une pratique « réputée trompeuse ».<\/td><td>La loi protège la confiance du consommateur.<\/td><\/tr><tr><td style=\"white-space:nowrap\">Mars 2023<\/td><td>Le pape François en doudoune blanche : une image créée par IA (Midjourney), devenue virale.<\/td><td>On ne peut plus croire une image sur parole.<\/td><\/tr><tr><td style=\"white-space:nowrap\">9 juin 2023<\/td><td>Loi sur les influenceurs : mentions « publicité », « images retouchées », « images virtuelles » obligatoires.<\/td><td>Rendre le faux visible : la transparence plutôt que l'interdiction.<\/td><\/tr><tr><td style=\"white-space:nowrap\">Janvier 2025<\/td><td>Arnaque au « faux Brad Pitt » : une Française perd 830 000 € face à un escroc utilisant des images truquées ou générées par IA.<\/td><td>Le faux exploite les émotions ; l'IA au service de l'imposture.<\/td><\/tr><\/table>\n<h2>Ton atout : le monde commercial<\/h2>\n<div class=\"g2\">\n<div class=\"card cG\"><h3>Faux avis et e-réputation<\/h3><p class=\"sm\">Le client se fie aux avis ; un faux avis trahit la confiance et est sanctionné par la loi.<\/p><\/div>\n<div class=\"card cG\"><h3>Influence commerciale<\/h3><p class=\"sm\">Promouvoir un produit sans dire qu'on est payé, c'est tromper. La loi de 2023 impose la transparence.<\/p><\/div>\n<div class=\"card cG\"><h3>Storytelling et argumentaire<\/h3><p class=\"sm\">Embellir est accepté tant que le client n'est pas trompé sur l'essentiel : c'est le « vrai du faux » commercial.<\/p><\/div>\n<div class=\"card cG\"><h3>Fausses promotions<\/h3><p class=\"sm\">Depuis 2022, le prix barré de référence doit être le plus bas pratiqué dans les 30 jours précédents.<\/p><\/div>\n<div class=\"card cG\"><h3>Contrefaçon<\/h3><p class=\"sm\">Sacs, parfums, baskets : le faux vendu moins cher interroge la valeur de la marque.<\/p><\/div>\n<div class=\"card cG\"><h3>Chatbots et IA<\/h3><p class=\"sm\">Le client doit-il savoir qu'il parle à une machine ?<\/p><\/div>\n<\/div>\n<div class=\"card dark\"><h3>L'exemple que personne d'autre n'aura<\/h3><p class=\"sm\" style=\"color:#E4E5EE\">Une situation de ton stage ou de ton alternance où tu as dû choisir entre dire la vérité au client et « arranger » la réalité. Rédigée avec précision, c'est un excellent exemple personnel.<\/p><\/div>","x":"exemples l'actualité et tes exemples ndrc 5 faits datés et vérifiés date le fait ce qu'il illustre mars 2018 étude du mit (revue science ) : sur twitter, une fausse info atteint 1 500 personnes environ 6 fois plus vite qu'une vraie. le faux circule mieux, à cause des humains plus que des robots : la nouveauté et l'émotion font partager. 28 mai 2022 directive européenne omnibus : diffuser ou faire diffuser de faux avis clients devient une pratique « réputée trompeuse ». la loi protège la confiance du consommateur. mars 2023 le pape françois en doudoune blanche : une image créée par ia (midjourney), devenue virale. on ne peut plus croire une image sur parole. 9 juin 2023 loi sur les influenceurs : mentions « publicité », « images retouchées », « images virtuelles » obligatoires. rendre le faux visible : la transparence plutôt que l'interdiction. janvier 2025 arnaque au « faux brad pitt » : une française perd 830 000 € face à un escroc utilisant des images truquées ou générées par ia. le faux exploite les émotions ; l'ia au service de l'imposture. ton atout : le monde commercial faux avis et e-réputation le client se fie aux avis ; un faux avis trahit la confiance et est sanctionné par la loi. influence commerciale promouvoir un produit sans dire qu'on est payé, c'est tromper. la loi de 2023 impose la transparence. storytelling et argumentaire embellir est accepté tant que le client n'est pas trompé sur l'essentiel : c'est le « vrai du faux » commercial. fausses promotions depuis 2022, le prix barré de référence doit être le plus bas pratiqué dans les 30 jours précédents. contrefaçon sacs, parfums, baskets : le faux vendu moins cher interroge la valeur de la marque. chatbots et ia le client doit-il savoir qu'il parle à une machine ? l'exemple que personne d'autre n'aura une situation de ton stage ou de ton alternance où tu as dû choisir entre dire la vérité au client et « arranger » la réalité. rédigée avec précision, c'est un excellent exemple personnel."},{"t":"7 sujets d'essai probables","h":"<p class=\"kick tO\">Entraînement<\/p>\n<h1>7 sujets d'essai probables<\/h1>\n<p class=\"mut\">Pour chacun : des pistes de plan et les références qui vont avec. Entraîne-toi à faire le plan détaillé en 15 minutes.<\/p>\n<div style=\"display:flex;flex-direction:column;gap:10px\"><div class=\"card cO\" style=\"padding:12px 15px\"><h3 style=\"font-size:17px\">Le faux est-il toujours condamnable ?<\/h3><p class=\"sm\">Plan détaillé page 07 : il manipule / il révèle ou divertit / tout dépend du contrat avec le public.<\/p><\/div><div class=\"card cB\" style=\"padding:12px 15px\"><h3 style=\"font-size:17px\">Peut-on encore distinguer le vrai du faux aujourd'hui ?<\/h3><p class=\"sm\">I. De plus en plus difficile : IA, deepfakes, étude du MIT. II. Des outils existent : fact-checking, lois, Fontenelle et la « dent d'or ». III. L'esprit critique reste la meilleure arme.<\/p><\/div><div class=\"card cP\" style=\"padding:12px 15px\"><h3 style=\"font-size:17px\">Pourquoi aimons-nous être trompés ?<\/h3><p class=\"sm\">Le plaisir de l'illusion (Aristote, Zeuxis, <i>Le Prestige<\/i>) ; l'évasion (Yourcenar, le cinéma) ; la fiction nous apprend sur nous (Aragon, Corneille). Limite : le faux non consenti.<\/p><\/div><div class=\"card cB\" style=\"padding:12px 15px\"><h3 style=\"font-size:17px\">La fiction peut-elle dire la vérité ?<\/h3><p class=\"sm\">Oui : <i>1984<\/i>, <i>Illusions perdues<\/i>, <i>The Truman Show<\/i> dénoncent le réel. Mais elle peut aussi égarer : Don Quichotte.<\/p><\/div><div class=\"card cO\" style=\"padding:12px 15px\"><h3 style=\"font-size:17px\">Faut-il toujours dire la vérité ?<\/h3><p class=\"sm\">Les mensonges bienveillants (<i>Les Fausses Confidences<\/i>, la politesse, le « noble mensonge ») contre les mensonges destructeurs (<i>L'Adversaire<\/i>, <i>Le Tartuffe<\/i>).<\/p><\/div><div class=\"card cG\" style=\"padding:12px 15px\"><h3 style=\"font-size:17px\">Une copie vaut-elle moins que l'original ?<\/h3><p class=\"sm\">Benjamin et l'« aura » ; les faussaires (Welles, Guy Ribes) ; mais les copies utiles (Lascaux) face aux contrefaçons nuisibles.<\/p><\/div><div class=\"card cP\" style=\"padding:12px 15px\"><h3 style=\"font-size:17px\">Les images disent-elles la vérité ?<\/h3><p class=\"sm\">Magritte (« Ceci n'est pas une pipe »), les retouches, l'IA et la loi sur les influenceurs ; mais la photo reste une preuve en journalisme.<\/p><\/div><\/div>","x":"entraînement 7 sujets d'essai probables pour chacun : des pistes de plan et les références qui vont avec. entraîne-toi à faire le plan détaillé en 15 minutes. le faux est-il toujours condamnable ? plan détaillé page 07 : il manipule / il révèle ou divertit / tout dépend du contrat avec le public. peut-on encore distinguer le vrai du faux aujourd'hui ? i. de plus en plus difficile : ia, deepfakes, étude du mit. ii. des outils existent : fact-checking, lois, fontenelle et la « dent d'or ». iii. l'esprit critique reste la meilleure arme. pourquoi aimons-nous être trompés ? le plaisir de l'illusion (aristote, zeuxis, le prestige ) ; l'évasion (yourcenar, le cinéma) ; la fiction nous apprend sur nous (aragon, corneille). limite : le faux non consenti. la fiction peut-elle dire la vérité ? oui : 1984 , illusions perdues , the truman show dénoncent le réel. mais elle peut aussi égarer : don quichotte. faut-il toujours dire la vérité ? les mensonges bienveillants ( les fausses confidences , la politesse, le « noble mensonge ») contre les mensonges destructeurs ( l'adversaire , le tartuffe ). une copie vaut-elle moins que l'original ? benjamin et l'« aura » ; les faussaires (welles, guy ribes) ; mais les copies utiles (lascaux) face aux contrefaçons nuisibles. les images disent-elles la vérité ? magritte (« ceci n'est pas une pipe »), les retouches, l'ia et la loi sur les influenceurs ; mais la photo reste une preuve en journalisme."},{"t":"Ton kit minimum et le jour J","h":"<p class=\"kick tB\">Jour J<\/p>\n<h1>Ton kit minimum et le jour J<\/h1>\n<div class=\"card\"><h3>Le kit minimum : les 9 références à maîtriser à fond<\/h3><p class=\"sm mut\">Pour chacune : titre, au preuve, analyse. Citations courtes avec la ligne.<\/li>\n<li>Essai : introduction complète, plan visible, exemples interprétés, conclusion qui répond.<\/li>\n<li>Relis : accords, conjugaisons, titres d'œuvres soulignés, noms d'auteurs bien écrits.<\/li>\n<\/ol><\/div>\n<\/div>\n<div class=\"card cB\" style=\"padding:18px 20px\"><p class=\"quote\" style=\"font-size:20px\">Au fond, le jury attend une seule chose : que tu saches démêler le vrai du faux, et dire pourquoi c'est important.<\/p><\/div>\n<div class=\"card\"><h3>Sources vérifiées<\/h3><p class=\"sm mut\">Bulletin officiel n° 17 du 23 avril 2026 (thème, problématique, bibliographie) · FAQ de l'académie de Bordeaux sur la nouvelle épreuve · académies de Paris, Nice et Rennes (corrigé 2025) · Assemblée nationale (faux avis, Omnibus) · loi n° 2023-451 du 9 juin 2023 · MIT / <i>Science<\/i>, 2018 · Quote Investigator. Vérifié le 11 novembre 2026.<\/p><\/div>","x":"jour j ton kit minimum et le jour j le kit minimum : les 9 références à maîtriser à fond pour chacune : titre, auteur, date, résumé en 2 phrases, l'idée qu'elle prouve. axe 1 1984 · l'adversaire axe 2 le mentir-vrai · l'illusion comique · opération lune axe 3 the truman show · la guerre du faux axe 4 f for fake · arrête-moi si tu peux + 3 faits d'actualité datés (page 14) et 2 exemples ndrc, dont un tiré de ton stage. plan de révision ☐ réciter la problématique et les 4 axes ☐ maîtriser les 9 références du kit ☐ connaître 3 faits datés et 2 exemples ndrc ☐ apprendre 15 mots de vocabulaire et 3 citations ☐ faire 2 sujets complets en 3 h, chronomètre en main ☐ faire le plan des 7 sujets probables le jour j, dans l'ordre lis tout le sujet (questions et 2 sujets d'essai) avant les documents. tiens le minutage : 1 h 20, 1 h 25, 15 min. corpus : idée, preuve, analyse. citations courtes avec la ligne. essai : introduction complète, plan visible, exemples interprétés, conclusion qui répond. relis : accords, conjugaisons, titres d'œuvres soulignés, noms d'auteur
