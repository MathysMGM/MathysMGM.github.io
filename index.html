ges, plan de carrière (animateur, manager) fédérer · réunions d'équipe, conventions, groupes en ligne le digital dans la vente directe réunions en ligne ou en direct sur les réseaux, boutique en ligne personnelle du vendeur, applications de commande et de suivi : la vente directe se digitalise, mais reste fondée sur la relation personnelle."},{"t":"Manager et animer un réseau","h":"<div class=\"row\" style=\"align-items:center;gap:14px\"><div class=\"fP\" style=\"width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#FFFFFF\"><span class=\"bign\">M<\/span><\/div><div style=\"display:flex;flex-direction:column;gap:2px\"><p class=\"kick mut\">Commun aux 3 réseaux<\/p><h1 style=\"font-size:31px\">Manager et animer un réseau<\/h1><\/div><\/div><p class=\"mut\">Le référentiel donne une grande place au management : recrutement, formation, objectifs, rémunération, animation, évaluation.<\/p>\n<div class=\"g2\" style=\"align-items:start\"><div class=\"card cP\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fP\">Rémunérer<\/span><h3>Les composantes<\/h3><div class=\"mini\"><div class=\"def\"><b>Fixe<\/b> · sécurise ; pour les salariés<\/div><div class=\"def\"><b>Commission<\/b> · un pourcentage du CA ou de la marge : motive à vendre<\/div><div class=\"def\"><b>Prime<\/b> · récompense un objectif atteint<\/div><div class=\"def\"><b>Avantages<\/b> · cadeaux, voyages, reconnaissance<\/div><div class=\"def\"><b>Équilibre<\/b> · assez de variable pour motiver, assez de sécurité pour fidéliser<\/div><\/div><\/div><div class=\"card cP\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fP\">Motiver<\/span><h3>Les leviers<\/h3><div class=\"mini\"><div class=\"def\"><b>Herzberg<\/b> · la rémunération évite l'insatisfaction ; la reconnaissance et l'autonomie motivent vraiment<\/div><div class=\"def\"><b>Maslow<\/b> · besoin d'appartenance (esprit d'équipe), d'estime (reconnaissance), d'accomplissement (progression)<\/div><div class=\"def\"><b>Objectifs SMART<\/b> · clairs, mesurables, atteignables<\/div><div class=\"def\"><b>Communication managériale<\/b> · informer, écouter, féliciter, faire des retours réguliers<\/div><\/div><\/div><\/div>\n<div class=\"g2\" style=\"align-items:start\"><div class=\"card cP\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fP\">Piloter<\/span><h3>L'activité du réseau<\/h3><div class=\"mini\"><div class=\"def\"><b>Gestion de projet<\/b> · objectifs, étapes, planning, budget, responsables<\/div><div class=\"def\"><b>Tableau de bord<\/b> · quelques indicateurs suivis régulièrement (page 12)<\/div><div class=\"def\"><b>Outils<\/b> · CRM, PGI, logiciels de réseau, applications mobiles, agendas partagés<\/div><div class=\"def\"><b>Veille<\/b> · concurrents, nouveaux partenaires possibles, tendances<\/div><\/div><\/div><div class=\"card cP\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fP\">Conflits<\/span><h3>Gérer les tensions<\/h3><div class=\"mini\"><div class=\"def\"><b>Sources<\/b> · objectifs jugés irréalistes, conflit de territoire, manque d'information, rémunération<\/div><div class=\"def\"><b>Méthode<\/b> · écouter chaque partie, identifier le vrai problème, chercher une solution gagnant-gagnant, suivre<\/div><div class=\"def\"><b>Prévenir<\/b> · règles claires dans le contrat, communication régulière<\/div><\/div><\/div><\/div>\n<div class=\"card cY\"><h3>Les trois dimensions de l'épreuve<\/h3><div class=\"g3 sm\" style=\"gap:8px\"><span><b>Juridique<\/b> : contrats, statuts, droit de la distribution et de la consommation, éthique.<\/span><span><b>Économique<\/b> : coûts, marges, rentabilité des actions, prix.<\/span><span><b>Managériale<\/b> : recruter, former, motiver, évaluer, gérer les conflits.<\/span><\/div><\/div>","x":"m commun aux 3 réseaux manager et animer un réseau le référentiel donne une grande place au management : recrutement, formation, objectifs, rémunération, animation, évaluation. rémunérer les composantes fixe · sécurise ; pour les salariés commission · un pourcentage du ca ou de la marge : motive à vendre prime · récompense un objectif atteint avantages · cadeaux, voyages, reconnaissance équilibre · assez de variable pour motiver, assez de sécurité pour fidéliser motiver les leviers herzberg · la rémunération évite l'insatisfaction ; la reconnaissance et l'autonomie motivent vraiment maslow · besoin d'appartenance (esprit d'équipe), d'estime (reconnaissance), d'accomplissement (progression) objectifs smart · clairs, mesurables, atteignables communication managériale · informer, écouter, féliciter, faire des retours réguliers piloter l'activité du réseau gestion de projet · objectifs, étapes, planning, budget, responsables tableau de bord · quelques indicateurs suivis régulièrement (page 12) outils · crm, pgi, logiciels de réseau, applications mobiles, agendas partagés veille · concurrents, nouveaux partenaires possibles, tendances conflits gérer les tensions sources · objectifs jugés irréalistes, conflit de territoire, manque d'information, rémunération méthode · écouter chaque partie, identifier le vrai problème, chercher une solution gagnant-gagnant, suivre prévenir · règles claires dans le contrat, communication régulière les trois dimensions de l'épreuve juridique : contrats, statuts, droit de la distribution et de la consommation, éthique. économique : coûts, marges, rentabilité des actions, prix. managériale : recruter, former, motiver, évaluer, gérer les conflits."},{"t":"Les indicateurs du réseau","h":"<p class=\"kick tO\">Calculs<\/p>\n<h1>Les indicateurs du réseau<\/h1>\n<p class=\"mut\">Présente toujours un résultat avec son calcul, sa comparaison à l'objectif et ton interprétation.<\/p>\n<h2 class=\"tB\">Distributeurs<\/h2>\n<table class=\"tb\"><tr><th style=\"width:42%\">Indicateur<\/th><th>Calcul<\/th><\/tr><tr><td>Taux de référencement (distribution numérique)<\/td><td>points de vente qui proposent le produit / points de vente visés × 100<\/td><\/tr><tr><td>Distribution valeur<\/td><td>part du CA de la catégorie réalisée par les magasins qui vendent le produit<\/td><\/tr><tr><td>Part de marché<\/td><td>ventes du produit / ventes de la catégorie × 100<\/td><\/tr><tr><td>Taux de rupture<\/td><td>jours (ou relevés) en rupture / total × 100<\/td><\/tr><tr><td>Effet d'une animation<\/td><td>(ventes pendant − ventes habituelles) / ventes habituelles × 100<\/td><\/tr><\/table>\n<h2 class=\"tG\">Partenaires<\/h2>\n<table class=\"tb\"><tr><th style=\"width:42%\">Indicateur<\/th><th>Calcul<\/th><\/tr><tr><td>Taux de partenaires actifs<\/td><td>partenaires actifs / partenaires × 100<\/td><\/tr><tr><td>CA moyen par partenaire<\/td><td>CA du réseau / nombre de partenaires<\/td><\/tr><tr><td>Rentabilité d'une action<\/td><td>(marge supplémentaire − coût) / coût × 100<\/td><\/tr><\/table>\n<h2 class=\"tO\">Vente directe<\/h2>\n<table class=\"tb\"><tr><th style=\"width:42%\">Indicateur<\/th><th>Calcul<\/th><\/tr><tr><td>CA moyen par réunion<\/td><td>CA total / nombre de réunions<\/td><\/tr><tr><td>Panier moyen<\/td><td>CA / nombre d'acheteurs<\/td><\/tr><tr><td>Taux d'achat en réunion<\/td><td>acheteurs / participants × 100<\/td><\/tr><tr><td>Taux de booking<\/td><td>nouvelles réunions obtenues / réunions × 100<\/td><\/tr><tr><td>Taux de recrutement<\/td><td>nouveaux vendeurs / réunions (ou contacts) × 100<\/td><\/tr><tr><td>Taux de rétention des vendeurs<\/td><td>vendeurs encore actifs / vendeurs au début de la période × 100<\/td><\/tr><\/table>\n<div class=\"card cY\"><h3>Exemple<\/h3><p class=\"sm\">12 réunions, 96 participants, 60 acheteurs, 3 600 € de CA : CA par réunion = 300 € ; panier moyen = 60 € ; taux d'achat = 62,5 %. Si l'objectif était 350 € par réunion, il manque 14 % : proposer une démonstration plus courte et un produit d'appel pour augmenter le panier.<\/p><\/div>","x":"calculs les indicateurs du réseau présente toujours un résultat avec son calcul, sa comparaison à l'objectif et ton interprétation. distributeurs indicateur calcul taux de référencement (distribution numérique) points de vente qui proposent le produit / points de vente visés × 100 distribution valeur part du ca de la catégorie réalisée par les magasins qui vendent le produit part de marché ventes du produit / ventes de la catégorie × 100 taux de rupture jours (ou relevés) en rupture / total × 100 effet d'une animation (ventes pendant − ventes habituelles) / ventes habituelles × 100 partenaires indicateur calcul taux de partenaires actifs partenaires actifs / partenaires × 100 ca moyen par partenaire ca du réseau / nombre de partenaires rentabilité d'une action (marge supplémentaire − coût) / coût × 100 vente directe indicateur calcul ca moyen par réunion ca total / nombre de réunions panier moyen ca / nombre d'acheteurs taux d'achat en réunion acheteurs / participants × 100 taux de booking nouvelles réunions obtenues / réunions × 100 taux de recrutement nouveaux vendeurs / réunions (ou contacts) × 100 taux de rétention des vendeurs vendeurs encore actifs / vendeurs au début de la période × 100 exemple 12 réunions, 96 participants, 60 acheteurs, 3 600 € de ca : ca par réunion = 300 € ; panier moyen = 60 € ; taux d'achat = 62,5 %. si l'objectif était 350 € par réunion, il manque 14 % : proposer une démonstration plus courte et un produit d'appel pour augmenter le panier."},{"t":"Réussir l'étude réflexive réseau","h":"<p class=\"kick tP\">L'étude réflexive<\/p>\n<h1>Réussir l'étude réflexive réseau<\/h1>\n<div class=\"card dark\" style=\"padding:16px 20px\"><p style=\"font-size:15px;line-height:1.5\">Un écrit de <b>2 pages recto-verso maximum<\/b>, sur un thème qui concerne les réseaux en général, avec les trois dimensions <b>juridique, économique et managériale<\/b>. Tu l'exposes en <b>5 minutes<\/b> à l'oral, puis le jury te questionne.<\/p><\/div>\n<h2>Exemples de thèmes<\/h2>\n<div class=\"g2\">\n<div class=\"card cP\"><ul class=\"sm\"><li>La motivation des acteurs des différents réseaux.<\/li><li>La transmission des valeurs de l'entreprise grâce aux réseaux.<\/li><li>La prospection au sein des réseaux.<\/li><\/ul><\/div>\n<div class=\"card cP\"><ul class=\"sm\"><li>L'utilité des réseaux sociaux dans l'animation d'un réseau.<\/li><li>Le recrutement dans les réseaux de vente.<\/li><li>Comment fidéliser un partenaire indépendant ?<\/li><\/ul><\/div>\n<\/div>\n<p class=\"sm mut\">Le choix du thème peut te permettre de couvrir une compétence que tes fiches n'ont pas montrée (par exemple le recrutement).<\/p>\n<h2>Un plan qui fonctionne<\/h2>\n<div class=\"g4\">\n<div class=\"step\"><span class=\"bign tP\" style=\"font-size:24px\">1<\/span><b>Introduction<\/b><span>Le thème, pourquoi il compte, ta problématique en une question.<\/span><\/div>\n<div class=\"step\"><span class=\"bign tP\" style=\"font-size:24px\">2<\/span><b>Analyse<\/b><span>Juridique, économique, managériale : une partie ou un angle chacune.<\/span><\/div>\n<div class=\"step\"><span class=\"bign tP\" style=\"font-size:24px\">3<\/span><b>Exemples<\/b><span>Tes expériences en entreprise et des exemples d'actualité ou de marques.<\/span><\/div>\n<div class=\"step\"><span class=\"bign tP\" style=\"font-size:24px\">4<\/span><b>Préconisations<\/b><span>Ce que tu recommandes, de façon concrète.<\/span><\/div>\n<\/div>\n<div class=\"ex\"><p class=\"lab\">Exemple de problématique et d'angles<\/p><p class=\"sm\"><b>Thème :<\/b> la motivation des acteurs des réseaux. <b>Problématique :<\/b> comment motiver des acteurs indépendants que l'on ne peut pas commander ? <b>Juridique :<\/b> le statut d'indépendant (agent, VDI, franchisé) interdit le lien de subordination ; on ne peut qu'inciter, par le contrat. <b>Économique :<\/b> commissions, primes, coût et rentabilité des challenges. <b>Managérial :<\/b> reconnaissance, formation, appartenance (Herzberg, Maslow). <b>Préconisation :<\/b> un programme qui combine rémunération variable, formation et reconnaissance publique des meilleurs.<\/p><\/div>\n<div class=\"card cY\"><h3>À l'oral<\/h3><p class=\"sm\">5 minutes, c'est court : problématique, 3 idées fortes, 1 préconisation. Ne lis pas ton texte. Prépare-toi aux questions sur les limites de ton analyse.<\/p><\/div>","x":"l'étude réflexive réussir l'étude réflexive réseau un écrit de 2 pages recto-verso maximum , sur un thème qui concerne les réseaux en général, avec les trois dimensions juridique, économique et managériale . tu l'exposes en 5 minutes à l'oral, puis le jury te questionne. exemples de thèmes la motivation des acteurs des différents réseaux. la transmission des valeurs de l'entreprise grâce aux réseaux. la prospection au sein des réseaux. l'utilité des réseaux sociaux dans l'animation d'un réseau. le recrutement dans les réseaux de vente. comment fidéliser un partenaire indépendant ? le choix du thème peut te permettre de couvrir une compétence que tes fiches n'ont pas montrée (par exemple le recrutement). un plan qui fonctionne 1 introduction le thème, pourquoi il compte, ta problématique en une question. 2 analyse juridique, économique, managériale : une partie ou un angle chacune. 3 exemples tes expériences en entreprise et des exemples d'actualité ou de marques. 4 préconisations ce que tu recommandes, de façon concrète. exemple de problématique et d'angles thème : la motivation des acteurs des réseaux. problématique : comment motiver des acteurs indépendants que l'on ne peut pas commander ? juridique : le statut d'indépendant (agent, vdi, franchisé) interdit le lien de subordination ; on ne peut qu'inciter, par le contrat. économique : commissions, primes, coût et rentabilité des challenges. managérial : reconnaissance, formation, appartenance (herzberg, maslow). préconisation : un programme qui combine rémunération variable, formation et reconnaissance publique des meilleurs. à l'oral 5 minutes, c'est court : problématique, 3 idées fortes, 1 préconisation. ne lis pas ton texte. prépare-toi aux questions sur les limites de ton analyse."},{"t":"Ton kit minimum et le jour J","h":"<p class=\"kick tB\">Jour J<\/p>\n<h1>Ton kit minimum et le jour J<\/h1>\n<div class=\"g3\">\n<div class=\"card cB\"><span class=\"tag fB\">Distributeurs<\/span><p class=\"sm\">Référencement et déréférencement · diagnostic rayon, réseau, zone · niveaux de présentation · linéaire développé, facing · convention annuelle · promotions et animations.<\/p><\/div>\n<div class=\"card cG\"><span class=\"tag fG\">Partenaires<\/span><p class=\"sm\">Types de partenaires · critères de sélection · franchise, concession, agent, apporteur · informer, former, stimuler, fédérer · rentabilité de l'animation.<\/p><\/div>\n<div class=\"card cO\"><span class=\"tag fO\">Vente directe<\/span><p class=\"sm\">Statut VDI · rétractation 14 jours, pas de paiement avant 7 jours · éthique, vente pyramidale interdite · étapes de la réunion · recruter, former, motiver.<\/p><\/div>\n<\/div>\n<div class=\"g2\" style=\"align-items:start\">\n<div class=\"card cY\"><h3>Plan de révision<\/h3>\n<div class=\"sm\" style=\"display:flex;flex-direction:column;gap:7px\">\n<span>☐ Connaître tes 3 fiches par cœur, chiffres compris<\/span>\n<span>☐ Préparer la présentation de 10 min de ton expérience réelle<\/span>\n<span>☐ Préparer l'exposé de 5 min de ton étude réflexive<\/span>\n<span>☐ Savoir expliquer le droit de chaque réseau<\/span>\n<span>☐ Savoir calculer les indicateurs de la page 12<\/span>\n<span>☐ Préparer les réponses aux questions « et si c'était à refaire ? »<\/span>\n<\/div><\/div>\n<div class=\"card dark\"><h3>Le jour J<\/h3>\n<ol class=\"sm\" style=\"color:#E4E5EE;display:flex;flex-direction:column;gap:5px\">\n<li>Apporte ton dossier et tes supports de présentation.<\/li>\n<li>Tenue professionnelle.<\/li>\n<li>Temps 1 : contexte, diagnostic, actions, résultats chiffrés, préconisations.<\/li>\n<li>Temps 2 : présente brièvement les autres fiches, puis ton étude réflexive en 5 min.<\/li>\n<li>Réponds avec les 3 dimensions : juridique, économique, managériale.<\/li>\n<li>Remercie le jury.<\/li>\n<\/ol><\/div>\n<\/div>\n<div class=\"card cG\" style=\"padding:18px 20px\"><p class=\"quote\" style=\"font-size:20px\">Animer un réseau, c'est donner envie à des gens indépendants de vendre ton offre : convaincre, outiller, motiver, mesurer.<\/p><\/div>\n<div class=\"card\"><h3>Sources vérifiées<\/h3><p class=\"sm mut\">Référentiel du BTS NDRC (France Compétences, RNCP 38368) : définition de l'épreuve E6, compétences et savoirs du bloc 3 · guide du dossier E6, SIEC session 2026 · présentation des épreuves certificatives (académie de Versailles) · Code de commerce et Code de la consommation · loi n° 2025-594 du 30 juin 2025 (démarchage téléphonique). Vérifié le 16 novembre 2026.<\/p><\/div>","x":"jour j ton kit minimum et le jour j distributeurs référencement et déréférencement · diagnostic rayon, réseau, zone · niveaux de présentation · linéaire développé, facing · convention annuelle · promotions et animations. partenaires types de partenaires · critères de sélection · franchise, concession, agent, apporteur · informer, former, stimuler, fédérer · rentabilité de l'animation. vente directe statut vdi · rétractation 14 jours, pas de paiement avant 7 jours · éthique, vente pyramidale interdite · étapes de la réunion · recruter, former, motiver. plan de révision ☐ connaître tes 3 fiches par cœur, chiffres compris ☐ préparer la présentation de 10 min de ton expérience réelle ☐ préparer l'exposé de 5 min de ton étude réflexive ☐ savoir expliquer le droit de chaque réseau ☐ savoir calculer les indicateurs de la page 12 ☐ préparer les réponses aux questions « et si c'était à refaire ? » le jour j apporte ton dossier et tes supports de présentation. tenue professionnelle. temps 1 : contexte, diagnostic, actions, résultats chiffrés, préconisations. temps 2 : présente brièvement les autres fiches, puis ton étude réflexive en 5 min. réponds avec les 3 dimensions : juridique, économique, managériale. remercie le jury. animer un réseau, c'est donner envie à des gens indépendants de vendre ton offre : convaincre, outiller, motiver, mesurer. sources vérifiées référentiel du bts ndrc (france compétences, rncp 38368) : définition de l'épreuve e6, compétences et savoirs du bloc 3 · guide du dossier e6, siec session 2026 · présentation des épreuves certificatives (académie de versailles) · code de commerce et code de la consommation · loi n° 2025-594 du 30 juin 2025 (démarchage téléphonique). vérifié le 16 novembre 2026."}],"g":[{"n":"Déroulement de l'épreuve","tag":"","e":true,"p":[0,1,2,12,13]},{"n":"Réseaux et distribution : les bases","tag":"","e":false,"p":[3]},{"n":"Réseau de distributeurs","tag":"C1","e":false,"p":[4,5]},{"n":"Réseau de partenaires","tag":"C2","e":false,"p":[6,7]},{"n":"Réseau de vente directe","tag":"C3","e":false,"p":[8,9]},{"n":"Manager le réseau et ses indicateurs","tag":"","e":false,"p":[10,11]}],"q":[{"id":"e6q0","q":"Une présentation verticale en rayon, c'est…","o":["une marque sur plusieurs niveaux","une marque sur un seul niveau","des produits au sol","une tête de gondole"],"a":0,"e":"La présentation horizontale place une marque sur un seul niveau."},{"id":"e6q1","q":"Un « facing », c'est…","o":["le nombre de produits identiques visibles de face","la hauteur du rayon","le prix affiché","une animation"],"a":0,"e":"Plus de facings = plus de visibilité."},{"id":"e6q2","q":"La distribution sélective concerne surtout…","o":["les produits de grande consommation","le luxe, la parfumerie, l'électronique haut de gamme","les produits frais","les fournitures de bureau"],"a":1,"e":"Le fabricant choisit ses revendeurs selon des critères."},{"id":"e6q3","q":"En vente en réunion, le « booking » c'est…","o":["réserver une salle","obtenir de nouvelles réunions","encaisser les commandes","livrer les produits"],"a":1,"e":"Chaque réunion doit en préparer d'autres."},{"id":"e6q4","q":"La PLV relève du merchandising…","o":["d'organisation","de séduction","de gestion","juridique"],"a":1,"e":"Rendre le rayon attractif : PLV, éclairage, mise en scène."},{"id":"e6q5","q":"Quel est le meilleur niveau de présentation en rayon ?","o":["Le sol","Les mains","Les yeux","Le chapeau"],"a":2,"e":"Le niveau des yeux : produits à forte marge, nouveautés."},{"id":"e6q6","q":"Rayon de 4 m au sol avec 5 niveaux : linéaire développé ?","o":["9 m","20 m","4 m","1,25 m"],"a":1,"e":"4 × 5 = 20 m."},{"id":"e6q7","q":"Combien de jours avant la signature le franchiseur doit-il remettre le document d'information précontractuelle ?","o":["7 jours","14 jours","20 jours","30 jours"],"a":2,"e":"Au moins 20 jours avant (loi Doubin)."},{"id":"e6q8","q":"Le VDI (vendeur à domicile indépendant) est…","o":["un salarié","un indépendant sans lien de subordination","un fonctionnaire","un VRP"],"a":1,"e":"Mandataire ou acheteur-revendeur, indépendant."},{"id":"e6q9","q":"Vente hors établissement : quand peut-on exiger un paiement ?","o":["Immédiatement","Pas avant 7 jours après la signature","Après 14 jours","Après 30 jours"],"a":1,"e":"Aucun paiement avant 7 jours (sauf exceptions)."},{"id":"e6q10","q":"La vente pyramidale est…","o":["légale","interdite","réservée aux VDI","encouragée"],"a":1,"e":"Gagner surtout en recrutant est interdit ; le marketing de réseau est légal s'il repose sur de vraies ventes."},{"id":"e6q11","q":"La convention unique annuelle fournisseur-distributeur doit être signée avant…","o":["le 1er janvier","le 1er mars","le 30 juin","le 31 décembre"],"a":1,"e":"Avant le 1er mars."},{"id":"e6q12","q":"Quel contrat donne une exclusivité de vente sur un territoire ?","o":["Franchise","Concession","Apport d'affaires","Co-marquage"],"a":1,"e":"Le concessionnaire a l'exclusivité territoriale."},{"id":"e6q13","q":"Un prescripteur…","o":["vend tes produits","recommande sans vendre","achète en gros","signe les contrats"],"a":1,"e":"Ex. : architecte, médecin, influenceur, expert-comptable."},{"id":"e6q14","q":"12 réunions pour 3 600 € de CA : CA moyen par réunion ?","o":["200 €","300 €","360 €","450 €"],"a":1,"e":"3 600 / 12 = 300 €."},{"id":"e6q15","q":"L'agent commercial est…","o":["un salarié","un mandataire indépendant payé à la commission","un grossiste","un franchisé"],"a":1,"e":"Il négocie au nom de l'entreprise ; indemnité en fin de contrat."},{"id":"e6q16","q":"La distribution numérique mesure…","o":["les ventes en ligne","le % de points de vente qui proposent le produit","le CA du site","le nombre d'abonnés"],"a":1,"e":"Points de vente qui proposent le produit / points de vente visés."},{"id":"e6q17","q":"Un circuit court, c'est…","o":["producteur → consommateur","producteur → détaillant → consommateur","producteur → grossiste → détaillant → consommateur","un circuit de course"],"a":1,"e":"Le circuit direct n'a aucun intermédiaire."},{"id":"e6q18","q":"Le commerce associé, c'est…","o":["des magasins appartenant à une même enseigne","des commerçants indépendants qui se regroupent","un commerçant seul","une boutique en ligne"],"a":1,"e":"Coopératives, groupements."},{"id":"e6q19","q":"Le rôle d'une centrale d'achat est de…","o":["livrer les clients","négocier les achats pour tous les magasins","faire la publicité","recruter"],"a":1,"e":"C'est l'interlocuteur clé pour se faire référencer."},{"id":"e6q20","q":"Le déréférencement, c'est…","o":["l'entrée d'un produit en rayon","le retrait d'un produit de l'assortiment","une promotion","une rupture de stock"],"a":1,"e":"Un produit qui se vend mal peut être déréférencé."},{"id":"e6q21","q":"Le merchandising de gestion vise à…","o":["rendre le rayon beau","rentabiliser chaque mètre de linéaire","organiser par marque","former les vendeurs"],"a":1,"e":"Donner plus de place à ce qui se vend."},{"id":"e6q22","q":"Une tête de gondole, c'est…","o":["le haut du rayon","l'emplacement en bout de rayon, très visible","la caisse","l'entrepôt"],"a":1,"e":"Un emplacement fort pour les promotions."},{"id":"e6q23","q":"Le trade marketing, c'est…","o":["le marketing international","la collaboration entre l'industriel et le distributeur pour vendre plus","la publicité télé","la vente en ligne"],"a":1,"e":"Données partagées, promotions communes."},{"id":"e6q24","q":"À la fin de son contrat, un VRP peut avoir droit à…","o":["une prime de Noël","une indemnité de clientèle","une voiture","rien"],"a":1,"e":"Le VRP est un salarié au statut particulier."},{"id":"e6q25","q":"Un apporteur d'affaires…","o":["signe les contrats","met en relation contre une commission","est salarié","achète les produits"],"a":1,"e":"Il n'a pas le pouvoir de signer."},{"id":"e6q26","q":"Rentabilité d'une animation =","o":["CA / coût","(marge supplémentaire − coût) / coût × 100","coût / nombre de partenaires","ventes / visiteurs"],"a":1,"e":"Elle dit si l'action a rapporté plus qu'elle n'a coûté."},{"id":"e6q27","q":"Le taux de partenaires actifs =","o":["partenaires actifs / partenaires × 100","CA / partenaires","nouveaux / anciens","commissions / CA"],"a":0,"e":"Il mesure la vitalité du réseau."},{"id":"e6q28","q":"60 acheteurs pour 3 600 € de CA : panier moyen ?","o":["36 €","60 €","600 €","6 €"],"a":1,"e":"3 600 / 60 = 60 €."},{"id":"e6q29","q":"96 participants, 60 acheteurs : taux d'achat ?","o":["37,5 %","60 %","62,5 %","96 %"],"a":2,"e":"60 / 96 × 100 = 62,5 %."},{"id":"e6q30","q":"Rompre brutalement une relation commerciale établie est…","o":["libre","interdit","obligatoire après un an","réservé aux distributeurs"],"a":1,"e":"Il faut un préavis raisonnable."},{"id":"e6q31","q":"Comment l'hôtesse d'une vente en réunion est-elle remerciée ?","o":["Par un salaire","Par des cadeaux selon les ventes","Par une commission de 50 %","Elle n'est pas remerciée"],"a":1,"e":"Elle reçoit chez elle et invite ses proches."},{"id":"e6q32","q":"Selon la règle d'équilibre, la part de linéaire d'un produit devrait suivre…","o":["son prix","sa part des ventes","sa couleur","son poids"],"a":1,"e":"10 % des ventes → environ 10 % du linéaire."}],"r":[{"id":"e6r0","q":"Explique comment un fournisseur se fait référencer chez un distributeur.","p":[{"t":"Contacter la centrale d'achat ou l'acheteur","k":["centrale","acheteur"]},{"t":"Présenter l'offre et négocier","k":["negoci","present","argument"]},{"t":"Signer un accord","k":["accord","contrat","convention"]},{"t":"Vérifier l'implantation en magasin","k":["magasin","implant","verifi","rayon"]}],"m":"Le fournisseur prospecte la centrale d'achat (ou le magasin), présente son offre avec des arguments adaptés au distributeur (rotation, marge, notoriété), puis négocie les conditions : prix, remises, promotions, place en rayon. L'accord est formalisé, par exemple dans la convention annuelle signée avant le 1er mars. Ensuite, le commercial vérifie dans chaque magasin que le produit est bien implanté."},{"id":"e6r1","q":"Quelles différences entre la franchise et la concession ?","p":[{"t":"Franchise : marque et savoir-faire","k":["marque","savoir-faire","savoir faire","assistance"]},{"t":"Franchise : droit d'entrée et redevances","k":["redevance","droit d'entree"]},{"t":"Concession : exclusivité sur un territoire","k":["exclusivit","territoire"]},{"t":"Le document d'information 20 jours avant","k":["dip","20 jours","information precontractuelle","doubin"]}],"m":"Dans la franchise, le franchisé utilise la marque et le savoir-faire du franchiseur, qui l'assiste ; il paie un droit d'entrée et des redevances. Le franchiseur doit lui remettre un document d'information précontractuelle au moins 20 jours avant la signature (loi Doubin). Dans la concession, le concessionnaire obtient l'exclusivité de la vente sur un territoire et s'engage à acheter au concédant, comme dans l'automobile."},{"id":"e6r2","q":"Quelles règles protègent le consommateur dans la vente à domicile ?","p":[{"t":"Un contrat écrit","k":["contrat","ecrit"]},{"t":"14 jours de rétractation","k":["14","retract"]},{"t":"Aucun paiement avant 7 jours","k":["7 jours","paiement"]},{"t":"L'abus de faiblesse sanctionné","k":["abus","faiblesse"]}],"m":"La vente hors établissement exige un contrat écrit remis au client, avec les informations obligatoires et un formulaire de rétractation. Le consommateur dispose de 14 jours pour se rétracter sans motif. Aucun paiement ne peut être exigé avant 7 jours après la signature. Enfin, abuser de la faiblesse d'une personne est un délit."},{"id":"e6r3","q":"Comment animer un réseau de partenaires ? Donne quatre actions.","p":[{"t":"Informer","k":["inform","newsletter","extranet","nouveaut"]},{"t":"Former","k":["form"]},{"t":"Stimuler : challenges, primes, commissions","k":["challenge","prime","commission","stimul"]},{"t":"Fédérer : conventions, réunions","k":["convention","reunion","club","feder"]}],"m":"1. Informer : nouveautés, argumentaires, prix, via un extranet ou une newsletter. 2. Former : sessions produits et techniques de vente. 3. Stimuler : challenges, primes, commissions, classements. 4. Fédérer : réunions, conventions, club partenaires, reconnaissance des meilleurs. On mesure ensuite la rentabilité de ces actions."},{"id":"e6r4","q":"Un rayon de 4 m fait 12 000 € de CA. Le produit X occupe 1 m et réalise 4 500 € de CA. Analyse la situation.","p":[{"t":"Part de linéaire = 25 %","k":["25"]},{"t":"Part des ventes = 37,5 %","k":["37,5","37.5"]},{"t":"Conclusion : le produit mérite plus de place","k":["plus de place","augmenter","agrandir","plus de lineaire","davantage"]},{"t":"Comparer la rentabilité au mètre","k":["4 500","4500","3 000","3000","par metre","rentab"]}],"m":"Part de linéaire du produit X : 1 / 4 = 25 %. Part des ventes : 4 500 / 12 000 = 37,5 %. Le produit fait plus de ventes que sa place en rayon : 4 500 € par mètre contre 3 000 € en moyenne pour le rayon. Il faut donc lui donner plus de linéaire (plus de facings), en le prenant aux produits les moins rentables."},{"id":"e6r5","q":"Décris le déroulement d'une vente en réunion.","p":[{"t":"Préparer avec l'hôtesse","k":["hotesse"]},{"t":"Démontrer, faire essayer","k":["demonstr","essai","essay","atelier"]},{"t":"Vendre : bons de commande","k":["commande","vente","vend"]},{"t":"Booker de nouvelles réunions et recruter","k":["booking","nouvelle","recrut"]}],"m":"On prépare la réunion avec l'hôtesse, qui invite ses proches. Le jour J, on accueille, on présente les produits et on les fait essayer (démonstrations, ateliers). On conseille chaque participant et on prend les commandes. Enfin, on obtient de nouvelles réunions (booking) et on repère de futurs vendeurs. L'hôtesse est remerciée par des cadeaux."},{"id":"e6r6","q":"Qu'est-ce qu'un VDI et quels sont ses avantages et inconvénients pour l'entreprise ?","p":[{"t":"Vendeur à domicile indépendant","k":["independant","vendeur a domicile"]},{"t":"Pas de lien de subordination","k":["subordination"]},{"t":"Mandataire ou acheteur-revendeur","k":["mandataire","acheteur","revendeur","commission"]},{"t":"Avantages et limites pour l'entreprise","k":["souple","performance","turnover","animation","motiv"]}],"m":"Le VDI est un vendeur à domicile indépendant : il n'a pas de lien de subordination avec l'entreprise. Il est soit mandataire (il vend au nom de l'entreprise contre une commission), soit acheteur-revendeur (il achète puis revend). Pour l'entreprise, c'est un réseau souple et payé à la performance, mais avec beaucoup de turnover et un besoin d'animation constant."},{"id":"e6r7","q":"Comment motiver des partenaires indépendants qu'on ne peut pas commander ?","p":[{"t":"Le contrat ne permet que d'inciter","k":["contrat","incit","independant","subordination"]},{"t":"Une rémunération incitative","k":["commission","prime","remuner"]},{"t":"La reconnaissance","k":["reconnaiss","valoris","felicit"]},{"t":"Former et outiller","k":["formation","outil","inform","former"]}],"m":"Un partenaire indépendant n'a pas de lien de subordination : on ne peut pas lui donner d'ordres, seulement l'inciter. On combine une rémunération motivante (commissions, primes, challenges), de la reconnaissance (valoriser les meilleurs, conventions), et un accompagnement (formations, outils de vente, informations régulières). Selon Herzberg, la reconnaissance motive davantage que l'argent seul."}]}];</script>
<script>// ---------- Configuration du classement (Supabase) ----------
const SUPA_URL = window.__SUPA_URL__ || '';
const SUPA_KEY = window.__SUPA_KEY__ || '';
const RANK_ON = !!(SUPA_URL && SUPA_KEY);

const D = window.__DATA__;
const $ = s => document.querySelector(s);
const app = $('#app'), title = $('#title'), back = $('#back'), pager = $('#pager');
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[’`]/g, "'").toLowerCase();
const subj = k => D.find(s => s.k === k);
const PTS_QCM = 10, PTS_STREAK = 5, PTS_POINT = 5, EXPRESS_SEC = 300;
const DAY = 86400000, BOX_DAYS = [0, 1, 3, 7, 14, 30];
let quiz = null, timer = null;

function go(h){ if(location.hash === '#' + h) render(); else location.hash = h; }
function setTop(t, backTo){ title.textContent = t; back.style.visibility = backTo ? 'visible' : 'hidden'; back.onclick = () => go(backTo); }
function noPager(){ pager.hidden = true; pager.innerHTML = ''; }
function stopTimer(){ if(timer){ clearInterval(timer); timer = null; } }
function best(){ const b = store.get('best2', {}); b.qcm = b.qcm || {}; b.redac = b.redac || {}; b.express = b.express || {}; return b; }
function totalPts(){ return store.get('pts', 0); }
function badge(v){ return v != null ? v + ' pts' : 'À tenter'; }
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const qById = (() => { const m = {}; D.forEach(s => s.q.forEach(q => { m[q.id] = {...q, k: s.k, from: s.n}; })); return id => m[id]; })();
const dot = s => `<span class="dot" style="background:${s.c}">${esc(s.k.toUpperCase())}</span>`;

// ---------- Statistiques ----------
function record(id, ok){
  const st = store.get('stats', {});
  const r = st[id] || {ok: 0, ko: 0};
  ok ? r.ok++ : r.ko++;
  st[id] = r; store.set('stats', st);
}
function recordRedac(k, got, max){
  const st = store.get('statsR', {});
  const r = st[k] || {got: 0, max: 0};
  r.got += got; r.max += max; st[k] = r; store.set('statsR', st);
}

// ---------- Accueil ----------
function home(){
  stopTimer(); setTop('Révisions BTS NDRC', null); noPager();
  const user = store.get('user', null);
  app.innerHTML = `
  <section class="hero"><p class="big">Tout ton BTS NDRC dans ta poche.</p>
  <p>${D.reduce((a,s)=>a+s.p.length,0)} pages de fiches, ${D.reduce((a,s)=>a+s.q.length,0)} QCM et ${D.reduce((a,s)=>a+s.r.length,0)} questions rédigées.</p>
  <div class="ptsbox"><span class="ptsnum">${totalPts()}</span><span>points gagnés${user ? ' · connecté en tant que <b style="color:#fff">' + esc(user.pseudo) + '</b>' : ''}</span></div></section>
  <div class="grid6">
    <button class="tile" style="background:#2F5BEA" data-go="fiches"><span class="tt">Fiches</span><span class="ts">Le cours, avec une recherche.</span></button>
    <button class="tile" style="background:#F25C2B;color:#16182B" data-go="quiz"><span class="tt">Quiz</span><span class="ts">QCM et questions rédigées.</span></button>
    <button class="tile" style="background:#11916F" data-go="flash"><span class="tt">Flashcards</span><span class="ts">Mémorise avec la révision espacée.</span></button>
    <button class="tile" style="background:#FFD34D;color:#16182B" data-go="express"><span class="tt">Express</span><span class="ts">5 minutes chrono, un max de points.</span></button>
    <button class="tile" style="background:#7B4FD6" data-go="stats"><span class="tt">Mes stats</span><span class="ts">Tes points forts et tes points faibles.</span></button>
    <button class="tile" style="background:#16182B" data-go="rank"><span class="tt">Classement</span><span class="ts">${user ? 'Ta place parmi les joueurs.' : 'Crée ton compte et affronte tes amis.'}</span></button>
  </div>
  <p class="note">Tes points et tes stats restent enregistrés sur cet appareil. Avec un compte, tes points comptent aussi dans le classement.</p>`;
}

// ---------- Fiches ----------
function fichesMenu(){
  stopTimer(); setTop('Fiches', 'home'); noPager();
  app.innerHTML = `<input class="search" id="q" type="search" placeholder="Rechercher une notion (ex. SONCAS, RGPD, Aragon)" aria-label="Rechercher dans les fiches">
  <div id="res"></div>
  <div id="subs"><p class="sec">Choisis une matière</p><div class="list">${D.map(s => `<button class="item" data-go="fiches-${s.k}">${dot(s)}<span class="grow"><span class="it">${esc(s.n)}</span><div class="is">${esc(s.s)} · ${s.p.length} pages</div></span></button>`).join('')}</div></div>`;
  const q = $('#q'), res = $('#res'), subs = $('#subs');
  q.addEventListener('input', () => {
    const v = norm(q.value.trim());
    if(v.length < 2){ res.innerHTML = ''; subs.hidden = false; return; }
    subs.hidden = true;
    const hits = [];
    D.forEach(s => s.p.forEach((p, i) => { if(norm(p.x).includes(v) || norm(p.t).includes(v)) hits.push([s, p, i]); }));
    res.innerHTML = hits.length ? `<p class="sec">${hits.length} résultat${hits.length>1?'s':''}</p><div class="list">${hits.slice(0,40).map(([s,p,i]) => `<button class="item" data-go="fiche-${s.k}-${i+1}"><span class="dot" style="background:${s.c}">${i+1}</span><span class="grow"><span class="it">${esc(p.t)}</span><div class="is">${esc(s.n)}</div></span></button>`).join('')}</div>` : '<p class="empty">Aucun résultat. Essaie un autre mot.</p>';
  });
}
function groupOf(s, i){ return s.g.findIndex(g => g.p.includes(i)); }
function pageItem(s, i, num){ return `<button class="item" data-go="fiche-${s.k}-${i+1}"><span class="dot" style="background:${s.c}">${num}</span><span class="grow"><span class="it">${esc(s.p[i].t)}</span></span></button>`; }
function fichesSubject(k){
  const s = subj(k); if(!s) return go('fiches');
  stopTimer(); setTop(s.n, 'fiches'); noPager();
  const ep = s.g.find(g => g.e), th = s.g.map((g, gi) => [g, gi]).filter(([g]) => !g.e);
  app.innerHTML = `<p class="sec">Comprendre l'épreuve</p>
  <p class="note" style="margin:-4px 2px 10px">Comment ça se passe, la méthode et le jour J.</p>
  <div class="list">${ep.p.map((i, n) => pageItem(s, i, n+1)).join('')}</div>
  <p class="sec">Réviser le cours</p>
  <p class="note" style="margin:-4px 2px 10px">Thème par thème, dans l'ordre du programme.</p>
  <div class="list">${th.map(([g, gi], n) => `<button class="item" data-go="${g.p.length===1?`fiche-${k}-${g.p[0]+1}`:`theme-${k}-${gi}`}"><span class="dot" style="background:${s.c}">${n+1}</span><span class="grow"><span class="it">${esc(g.n)}</span><div class="is">${g.tag ? esc(g.tag) + ' · ' : ''}${g.p.length} page${g.p.length>1?'s':''}</div></span></button>`).join('')}</div>`;
}
function themePages(k, gi){
  const s = subj(k); if(!s || !s.g[gi]) return go('fiches');
  const g = s.g[gi];
  stopTimer(); setTop(g.n, 'fiches-' + k); noPager();
  app.innerHTML = `<p class="sec">${esc(s.n)}${g.tag ? ' · ' + esc(g.tag) : ''} · ${g.p.length} pages</p><div class="list">${g.p.map((i, n) => pageItem(s, i, n+1)).join('')}</div>`;
}
function fichePage(k, n){
  const s = subj(k); if(!s) return go('fiches');
  stopTimer();
  const i = Math.min(Math.max(n, 1), s.p.length) - 1;
  const gi = groupOf(s, i), g = s.g[gi], pos = g.p.indexOf(i);
  const backTo = (g.e || g.p.length === 1) ? 'fiches-' + k : `theme-${k}-${gi}`;
  setTop(g.p.length > 1 ? `${g.e ? "L'épreuve" : s.n} · ${pos+1}/${g.p.length}` : s.n, backTo);
  app.innerHTML = `<p class="sec" style="margin-top:4px">${g.e ? "Comprendre l'épreuve" : (g.tag ? esc(g.tag) + ' · ' : '') + esc(g.n)}</p><article class="fiche">${s.p[i].h}</article>`;
  const prev = g.p[pos-1], next = g.p[pos+1];
  if(g.p.length > 1){
    pager.hidden = false;
    pager.innerHTML = `<button class="btn ghost" ${prev===undefined?'disabled':''} data-go="fiche-${k}-${(prev??i)+1}">← Précédente</button><button class="btn" ${next===undefined?'disabled':''} data-go="fiche-${k}-${(next??i)+1}">Suivante →</button>`;
  } else noPager();
  window.scrollTo(0, 0);
}

// ---------- Quiz (QCM + rédigé) ----------
function quizHome(){
  stopTimer(); setTop('Quiz', 'home'); noPager();
  app.innerHTML = `<div class="duo">
    <button class="tile" style="background:#16182B" data-go="qcm"><span class="tt">QCM</span><span class="ts">${PTS_QCM} pts par bonne réponse, +${PTS_STREAK} en série de 3.</span></button>
    <button class="tile" style="background:#7B4FD6" data-go="redac"><span class="tt">Questions rédigées</span><span class="ts">Tu écris, tu compares au corrigé. ${PTS_POINT} pts par point attendu.</span></button>
  </div>
  <p class="note">Les questions que tu n'as pas encore vues passent en priorité.</p>`;
}
function subjectMenu(mode){
  stopTimer();
  const isQ = mode === 'qcm';
  setTop(isQ ? 'QCM' : 'Questions rédigées', 'quiz'); noPager();
  const b = best()[mode], seen = store.get('seen', {});
  const left = s => (isQ ? s.q : s.r).filter(q => !seen[q.id]).length;
  app.innerHTML = (isQ ? `<button class="item" style="background:#16182B;color:#fff;border:0" data-go="qcm-mix"><span class="dot" style="background:#F25C2B;color:#16182B">MIX</span><span class="grow"><span class="it">Toutes les matières</span><div class="is" style="color:#D6D8E6">15 questions au hasard</div></span><span class="badge">${badge(b.mix)}</span></button>` : '') +
  `<p class="sec">Par matière</p><div class="list">${D.map(s => `<button class="item" data-go="${mode}-${s.k}">${dot(s)}<span class="grow"><span class="it">${esc(s.n)}</span><div class="is">${(isQ?s.q:s.r).length} questions · ${left(s)} jamais vues</div></span><span class="badge">${badge(b[s.k])}</span></button>`).join('')}</div>`;
}
function pick(pool, n){
  const seen = store.get('seen', {});
  let fresh = shuffle(pool.filter(q => !seen[q.id]));
  if(fresh.length < n){
    pool.forEach(q => { delete seen[q.id]; });
    store.set('seen', seen);
    const ids = new Set(fresh.map(q => q.id));
    fresh = fresh.concat(shuffle(pool.filter(q => !ids.has(q.id))));
  }
  return fresh.slice(0, n);
}
function unseenFirst(pool){ const seen = store.get('seen', {}); return shuffle(pool.filter(q => !seen[q.id])).concat(shuffle(pool.filter(q => seen[q.id]))); }
function markSeen(id){ const seen = store.get('seen', {}); seen[id] = 1; store.set('seen', seen); }
function mixOptions(q){ const idx = shuffle(q.o.map((_, i) => i)); return {...q, o: idx.map(i => q.o[i]), a: idx.indexOf(q.a)}; }
function poolFor(k, key){
  if(k === 'mix') return D.flatMap(s => s[key].map(q => ({...q, from: s.n, k: s.k})));
  const s = subj(k); return s ? s[key].map(q => ({...q, from: s.n, k: s.k})) : null;
}

function startQuiz(mode, k){
  stopTimer();
  const key = mode === 'qcm' ? 'q' : 'r';
  const pool = poolFor(k === 'mix' && mode !== 'qcm' ? '' : k, key);
  if(!pool) return go(mode);
  const s = subj(k);
  const name = k === 'mix' ? 'Toutes les matières' : s.n, color = k === 'mix' ? '#16182B' : s.c;
  const n = mode === 'qcm' ? (k === 'mix' ? 15 : 10) : 5;
  let qs = pick(pool, n);
  if(mode === 'qcm') qs = qs.map(mixOptions);
  quiz = {mode, k, name, color, qs, i: 0, good: 0, pts: 0, max: 0, streak: 0, wrong: []};
  mode === 'qcm' ? showQ() : showR();
}
function head(z){
  return `<div class="qmeta"><span>Question ${z.i+1} / ${z.qs.length}</span><span class="ptschip">${z.pts} pts</span></div>
    <div class="prog" aria-hidden="true"><div style="width:${z.i/z.qs.length*100}%;background:${z.color}"></div></div>
    ${z.k==='mix'?`<div class="qmeta"><span>${esc(z.qs[z.i].from)}</span></div>`:''}`;
}
function showQ(){
  const z = quiz, q = z.qs[z.i];
  setTop(z.name, 'qcm'); noPager();
  app.innerHTML = `<div class="qcard">${head(z)}
    <p class="qq">${esc(q.q)}</p>
    <div class="list">${q.o.map((o, i) => `<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div>
    <div id="fb"></div></div>`;
  document.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(+b.dataset.i));
}
function scoreAnswer(z, q, ok){
  markSeen(q.id); record(q.id, ok);
  z.max += PTS_QCM;
  let gain = 0;
  if(ok){ z.good++; z.streak++; gain = PTS_QCM + (z.streak >= 3 ? PTS_STREAK : 0); }
  else { z.streak = 0; z.wrong.push(q); }
  z.pts += gain;
  return gain;
}
function answer(i){
  const z = quiz, q = z.qs[z.i], ok = i === q.a;
  const gain = scoreAnswer(z, q, ok);
  document.querySelectorAll('.opt').forEach((b, j) => { b.disabled = true; if(j === q.a) b.classList.add('ok'); else if(j === i) b.classList.add('ko'); });
  const last = z.i === z.qs.length - 1;
  $('#fb').innerHTML = `<div class="expl ${ok?'ok':'ko'}"><b>${ok?`Bonne réponse ! +${gain} pts${z.streak>=3?' (série de '+z.streak+')':''}`:'Pas tout à fait.'}</b> ${esc(q.e)}</div>
  <button class="btn" id="next" style="width:100%;margin-top:12px">${last?'Voir mon score':'Question suivante'}</button>`;
  document.querySelector('.ptschip').textContent = z.pts + ' pts';
  $('#next').onclick = () => { if(last) endQuiz(); else { z.i++; showQ(); } };
  $('#next').focus();
}
function showR(){
  const z = quiz, q = z.qs[z.i];
  setTop(z.name, 'redac'); noPager();

    <div id="fb"></div></div>`;

}
function correctR(){
  const z = quiz, q = z.qs[z.i];
  const txt = norm($('#ans').value);
  markSeen(q.id);
  $('#ans').readOnly = true; $('#check').remove();
  const auto = q.p.map(p => p.k.some(k => txt.includes(norm(k))));
  const last = z.i === z.qs.length - 1;
  $('#fb').innerHTML = `<p class="sec" style="margin-top:4px">Les points attendus</p>
    <p class="is" style="margin:-4px 0 8px">Cochés automatiquement si ta réponse contient les mots-clés. Vérifie et corrige honnêtement.</p>
    <div class="list">${q.p.map((p, i) => `<label class="pt"><input type="checkbox" data-i="${i}" ${auto[i]?'checked':''}><span>${esc(p.t)}</span></label>`).join('')}</div>
    <div class="expl ok" style="margin-top:12px"><b>Réponse modèle.</b> ${esc(q.m)}</div>
    <div class="qmeta" style="margin-top:12px"><span>Cette question</span><span id="qp" class="ptschip"></span></div>
    <button class="btn" id="next" style="width:100%;margin-top:8px">${last?'Voir mon score':'Question suivante'}</button>`;
  const boxes = [...document.querySelectorAll('.pt input')];

    if(last) endQuiz(); else { z.i++; showR(); }

function finishPoints(z){
  store.set('pts', totalPts() + z.pts);
  if(z.pts > 0) queuePoints(z.pts);
  const b = best();
  const rec = b[z.mode][z.k] == null || z.pts > b[z.mode][z.k];
  if(rec){ b[z.mode][z.k] = z.pts; store.set('best2', b); }
  return rec;
}
function endQuiz(){
  const z = quiz; stopTimer();
  const rec = finishPoints(z);
  const ratio = z.max ? z.pts / z.max : 0;
  const msg = ratio >= 0.8 ? 'Excellent, tu maîtrises !' : ratio >= 0.5 ? 'Pas mal ! Revois les points ratés.' : 'Courage : relis la fiche et retente.';
  const backTo = z.mode === 'express' ? 'express' : z.mode;

function startExpress(k){
  stopTimer();
  const pool = poolFor(k, 'q'); if(!pool) return go('express');
  const s = subj(k);
  quiz = {mode: 'express', k, name: k === 'mix' ? 'Express · Mix' : 'Express · ' + s.n, color: k === 'mix' ? '#16182B' : s.c,
          qs: unseenFirst(pool).map(mixOptions), i: 0, done: 0, good: 0, pts: 0, max: 0, streak: 0, wrong: [], end: Date.now() + EXPRESS_SEC * 1000};
  timer = setInterval(tick, 250);
  showE();
}
function tick(){
  const z = quiz; if(!z || z.mode !== 'express'){ stopTimer(); return; }
  const left = Math.max(0, Math.ceil((z.end - Date.now()) / 1000));
  const el = $('#clock'); if(el){ el.textContent = Math.floor(left/60) + ':' + String(left%60).padStart(2, '0'); el.classList.toggle('hot', left <= 30); }
  const bar = $('#tbar'); if(bar) bar.style.width = (left / EXPRESS_SEC * 100) + '%';
  if(left <= 0){ stopTimer(); endQuiz(); }
}
function showE(){
  const z = quiz;
  if(z.i >= z.qs.length){ z.qs = z.qs.concat(shuffle(z.qs).map(mixOptions)); }
  const q = z.qs[z.i];
  setTop(z.name, 'express'); noPager();
  app.innerHTML = `<div class="qcard">
    <div class="qmeta"><span id="clock" class="clock">5:00</span><span class="ptschip">${z.pts} pts</span></div>

    <div class="qmeta"><span>${z.good} bonne${z.good>1?'s':''} réponse${z.good>1?'s':''}${z.streak>=3?' · série de '+z.streak:''}</span>${z.k==='mix'?`<span>${esc(q.from)}</span>`:''}</div>
    <p class="qq">${esc(q.q)}</p>
    <div class="list">${q.o.map((o, i) => `<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div></div>`;
  tick();
  document.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    const i = +b.dataset.i, ok = i === q.a;
    scoreAnswer(z, q, ok); z.done++;
    document.querySelectorAll('.opt').forEach((x, j) => { x.disabled = true; if(j === q.a) x.classList.add('ok'); else if(j === i) x.classList.add('ko'); });
    setTimeout(() => { if(quiz === z && timer){ z.i++; showE(); } }, ok ? 450 : 1100);

}

function rate(ok){
  const z = quiz, q = z.qs[z.i], all = cards();

// ---------- Statistiques ----------
function stats(){
  stopTimer(); setTop('Mes stats', 'home'); noPager();
  const st = store.get('stats', {}), sr = store.get('statsR', {});
  const rows = D.map(s => {
    let ok = 0, ko = 0;
    s.q.forEach(q => { const r = st[q.id]; if(r){ ok += r.ok; ko += r.ko; } });
    const tot = ok + ko, pct = tot ? Math.round(ok / tot * 100) : null;
    const r = sr[s.k], rp = r && r.max ? Math.round(r.got / r.max * 100) : null;
    return {s, ok, tot, pct, rp};
  });
  const played = rows.filter(r => r.tot >= 5);
  const strong = played.filter(r => r.pct >= 70).sort((a, b) => b.pct - a.pct);
  const weak = played.filter(r => r.pct < 50).sort((a, b) => a.pct - b.pct);
  const missed = Object.entries(st).filter(([, r]) => r.ko > 0).map(([id, r]) => ({q: qById(id), r})).filter(x => x.q)
    .sort((a, b) => (b.r.ko - b.r.ok) - (a.r.ko - a.r.ok) || b.r.ko - a.r.ko).slice(0, 8);
  const color = p => p == null ? '#C9CCDB' : p >= 70 ? '#11916F' : p >= 50 ? '#E0A800' : '#C2410C';
  if(!Object.keys(st).length && !Object.keys(sr).length){
    app.innerHTML = `<div class="qcard"><p class="qq">Pas encore de stats</p><p class="is">Fais quelques QCM, une partie Express ou des flashcards : tes points forts et tes points faibles s'afficheront ici.</p><button class="btn" data-go="quiz" style="margin-top:8px">Faire un quiz</button></div>`;
    return;
  }
  app.innerHTML = `<div class="duo" style="margin-bottom:6px">
    <div class="qcard"><p class="sec" style="margin:0;color:#0A6A52">Points forts</p>${strong.length ? strong.map(r => `<div class="is"><b style="color:#16182B">${esc(r.s.n)}</b> · ${r.pct} %</div>`).join('') : '<div class="is">Joue encore un peu : il faut au moins 5 réponses par matière.</div>'}</div>
    <div class="qcard"><p class="sec" style="margin:0;color:#C2410C">À travailler</p>${weak.length ? weak.map(r => `<button class="linkbtn" data-go="fiches-${r.s.k}"><b>${esc(r.s.n)}</b> · ${r.pct} % → revoir la fiche</button>`).join('') : '<div class="is">Rien d\'alarmant pour l\'instant.</div>'}</div>
  </div>
  <p class="sec">Taux de réussite aux QCM, par matière</p>
  <div class="qcard">${rows.map(r => `<div class="srow"><div class="srow-h"><span><b>${esc(r.s.n)}</b></span><span>${r.pct == null ? 'pas encore joué' : r.pct + ' % · ' + r.tot + ' réponses'}</span></div>
    <div class="prog"><div style="width:${r.pct || 0}%;background:${color(r.pct)}"></div></div>
    ${r.rp != null ? `<div class="is">Questions rédigées : ${r.rp} % des points attendus</div>` : ''}</div>`).join('')}</div>
  ${missed.length ? `<p class="sec">Les questions que tu rates le plus</p><div class="qcard">${missed.map(x => `<div class="rev"><b>${esc(x.q.q)}</b><br>Réponse : ${esc(x.q.o[x.q.a])} <span class="is">· ratée ${x.r.ko} fois sur ${x.r.ok + x.r.ko}</span><br><button class="linkbtn" data-go="fiches-${x.q.k}">Revoir la fiche ${esc(x.q.from)} →</button></div>`).join('')}</div>` : ''}`;
}

// ---------- Compte et classement (Supabase) ----------
function slug(p){ return norm(p).replace(/[^a-z0-9_.-]/g, ''); }
async function api(path, opts = {}, token){
  const res = await fetch(SUPA_URL + path, {...opts, headers: {'apikey': SUPA_KEY, 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (token || SUPA_KEY), ...(opts.headers || {})}});
  const txt = await res.text(); let data = null; try{ data = txt ? JSON.parse(txt) : null; }catch(e){}
  if(!res.ok) throw new Error((data && (data.msg || data.message || data.error_description || data.error)) || ('Erreur ' + res.status));
  return data;
}
async function session(){
  const u = store.get('user', null); if(!u) return null;
  if(u.exp && Date.now() < u.exp - 60000) return u;
  try{
    const d = await api('/auth/v1/token?grant_type=refresh_token', {method: 'POST', body: JSON.stringify({refresh_token: u.refresh})});
    const nu = {...u, token: d.access_token, refresh: d.refresh_token, exp: Date.now() + d.expires_in * 1000};
    store.set('user', nu); return nu;
  }catch(e){ return null; }
}
function queuePoints(n){ if(!RANK_ON || !store.get('user', null)) return; store.set('pending', store.get('pending', 0) + n); flushPoints(); }
async function flushPoints(){
  if(!RANK_ON) return;
  let left = store.get('pending', 0); if(!left) return;
  const u = await session(); if(!u) return;
  try{
    while(left > 0){
      const n = Math.min(left, 300);
      await api('/rest/v1/rpc/add_points', {method: 'POST', body: JSON.stringify({n})}, u.token);
      left -= n; store.set('pending', left);
    }
  }catch(e){}
}
function friendly(msg){
  const m = norm(msg);
  if(m.includes('already') || m.includes('duplicate') || m.includes('registered')) return 'Ce pseudo est déjà pris. Choisis-en un autre.';
  if(m.includes('invalid login') || m.includes('invalid credentials')) return 'Pseudo ou mot de passe incorrect.';
  if(m.includes('password')) return 'Le mot de passe doit faire au moins 6 caractères.';
  if(m.includes('failed to fetch') || m.includes('network')) return 'Pas de connexion internet.';
  return msg;
}

  stopTimer(); setTop('Mon compte', 'rank'); noPager();

  app.innerHTML = `<div class="qcard"><p class="qq">Rejoins le classement</p>

  $('#signup').onclick = async () => {
    const f = read(); if(!f) return; msg('Création du compte…');
    try{
      const d = await api('/auth/v1/signup', {method: 'POST', body: JSON.stringify({email: f.email, password: f.pw})});
      if(!d.access_token) throw new Error('Compte créé, mais la confirmation par e-mail est encore activée dans Supabase.');
      await api('/rest/v1/profiles', {method: 'POST', headers: {'Prefer': 'return=minimal'}, body: JSON.stringify({id: d.user.id, pseudo: f.p})}, d.access_token);
      save(d, f.p); store.set('pending', 0); go('rank');
    }catch(e){ msg(friendly(e.message)); }
  };
  $('#signin').onclick = async () => {
    const f = read(); if(!f) return; msg('Connexion…');
    try{
      const d = await api('/auth/v1/token?grant_type=password', {method: 'POST', body: JSON.stringify({email: f.email, password: f.pw})});
      const rows = await api('/rest/v1/profiles?select=pseudo&id=eq.' + d.user.id, {}, d.access_token);
      if(!rows || !rows[0]) await api('/rest/v1/profiles', {method: 'POST', headers: {'Prefer': 'return=minimal'}, body: JSON.stringify({id: d.user.id, pseudo: f.p})}, d.access_token);
      save(d, rows && rows[0] ? rows[0].pseudo : f.p); store.set('pending', 0); go('rank');
    }catch(e){ msg(friendly(e.message)); }
  };
}

// ---------- Navigation ----------
function render(){
  const h = location.hash.replace('#', '') || 'home';
  let m;
  if(h !== 'express' && !h.startsWith('express-')) stopTimer();
  if(h === 'home') home();
  else if(h === 'fiches') fichesMenu();
  else if((m = h.match(/^fiches-([a-z0-9]+)$/))) fichesSubject(m[1]);
  else if((m = h.match(/^fiche-([a-z0-9]+)-(\d+)$/))) fichePage(m[1], +m[2]);
  else if((m = h.match(/^theme-([a-z0-9]+)-(\d+)$/))) themePages(m[1], +m[2]);
  else if(h === 'quiz') quizHome();
  else if(h === 'qcm' || h === 'redac') subjectMenu(h);
  else if((m = h.match(/^(qcm|redac)-([a-z0-9]+)$/))) startQuiz(m[1], m[2]);
  else if((m = h.match(/^quiz-([a-z0-9]+)$/))) go('qcm-' + m[1]);
  else if(h === 'express') expressMenu();
  else if((m = h.match(/^express-([a-z0-9]+)$/))) startExpress(m[1]);
  else if(h === 'flash') flashMenu();
  else if((m = h.match(/^flash-([a-z0-9]+)$/))) startFlash(m[1]);
  else if(h === 'stats') stats();
  else if(h === 'rank') rank();
  else if(h === 'login') login();
  else home();
}
document.addEventListener('click', e => { const t = e.target.closest('[data-go]'); if(t && !t.disabled) go(t.dataset.go); });
window.addEventListener('hashchange', render);
window.addEventListener('online', flushPoints);
render();
flushPoints();

if('serviceWorker' in navigator && location.protocol === 'https:'){ let reloaded = false; navigator.serviceWorker.addEventListener('controllerchange', () => { if(!reloaded){ reloaded = true; location.reload(); } }); window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js', {updateViaCache: 'none'}).then(r => r.update()).catch(() => {}); }); document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') navigator.serviceWorker.getRegistration().then(r => r && r.update()).catch(() => {}); }); }
</script>
