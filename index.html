chnicien, consultant) acheteur · celui qui négocie et passe commande décideur · celui qui signe filtre · celui qui contrôle l'accès (assistant) b2g (vendre au public) · marchés publics : appel d'offres, égalité de traitement des candidats, transparence, choix selon des critères annoncés négocier deux logiques négociation distributive · gagnant-perdant : on se partage un gâteau fixe, rapport de force négociation intégrative · gagnant-gagnant : on cherche à agrandir le gâteau négociation raisonnée (harvard, fisher et ury) · traiter séparément les personnes et le problème, se concentrer sur les intérêts plutôt que les positions, imaginer plusieurs options, utiliser des critères objectifs mesore · meilleure solution de rechange : ce que tu feras si l'accord échoue. plus elle est bonne, plus tu es fort litiges traiter une réclamation 1 · écouter · laisser le client s'exprimer, sans se justifier 2 · montrer de l'empathie · « je comprends votre mécontentement » 3 · comprendre · questionner, vérifier les faits 4 · proposer une solution · échange, geste commercial, réparation 5 · suivre · rappeler le client : la réclamation devient une occasion de fidéliser accompagner fidéliser suivi après-vente · appel de satisfaction, installation, formation, sav mesurer la satisfaction · enquêtes, avis, nps (pourcentage de promoteurs moins pourcentage de détracteurs) outils · programmes de fidélité, offres personnalisées, newsletters, invitations à des évènements crm · garder l'historique de chaque client pour personnaliser la relation valeur client · plus un client reste longtemps, plus il rapporte : c'est l'objectif de la fidélisation"},{"t":"L'évènement commercial","h":"<div class=\"row\" style=\"align-items:center;gap:14px\"><div class=\"fP\" style=\"width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#FFFFFF\"><span class=\"bign\">C3<\/span><\/div><div style=\"display:flex;flex-direction:column;gap:2px\"><p class=\"kick mut\">Organiser et animer<\/p><h1 style=\"font-size:31px\">L'évènement commercial<\/h1><\/div><\/div><p class=\"mut\">Salon, foire, portes ouvertes, démonstration, lancement de produit, animation de point de vente, webinaire…<\/p><div class=\"g4\"><div class=\"step\"><span class=\"bign tP\" style=\"font-size:24px\">1<\/span><b>Objectifs et cible<\/b><span>Objectifs SMART : notoriété, prospection, ventes, fidélisation. Qui veut-on attirer ?<\/span><\/div><div class=\"step\"><span class=\"bign tP\" style=\"font-size:24px\">2<\/span><b>Budget<\/b><span>Location, stand, matériel, communication, personnel, cadeaux, déplacements. Comparer avec les gains attendus.<\/span><\/div><div class=\"step\"><span class=\"bign tP\" style=\"font-size:24px\">3<\/span><b>Rétroplanning<\/b><span>Toutes les tâches, du jour J vers aujourd'hui, avec un responsable et une date.<\/span><\/div><div class=\"step\"><span class=\"bign tP\" style=\"font-size:24px\">4<\/span><b>Logistique<\/b><span>Lieu, matériel, autorisations, sécurité, stocks, équipe et briefing.<\/span><\/div><\/div>\n<div class=\"g2\" style=\"align-items:start\"><div class=\"card cP\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fP\">Communication<\/span><h3>Avant, pendant, après<\/h3><div class=\"mini\"><div class=\"def\"><b>Avant<\/b> · invitations ciblées, e-mailing aux clients qui ont donné leur accord, réseaux sociaux, affichage, presse locale<\/div><div class=\"def\"><b>Pendant<\/b> · accueil, démonstrations, animations (jeu, dégustation), collecte des coordonnées avec consentement<\/div><div class=\"def\"><b>Après<\/b> · remerciements, relance des contacts, offres de suivi, publication sur les réseaux<\/div><\/div><\/div><div class=\"card cP\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fP\">Animer<\/span><h3>Le jour J<\/h3><div class=\"mini\"><div class=\"def\"><b>Accueil<\/b> · aller vers les visiteurs, accrocher par une question ouverte<\/div><div class=\"def\"><b>Démonstration<\/b> · faire essayer, montrer l'avantage concret<\/div><div class=\"def\"><b>Qualifier les contacts<\/b> · noter besoin, potentiel, délai sur une fiche contact ou une tablette<\/div><div class=\"def\"><b>Équipe<\/b> · rôles clairs, horaires, objectifs par personne<\/div><\/div><\/div><\/div>\n<h2>Le bilan : quantitatif et qualitatif<\/h2>\n<div class=\"g2\">\n<div class=\"card cP\"><h3>Quantitatif<\/h3><ul class=\"sm\"><li>Nombre de visiteurs, de contacts, de contacts qualifiés.<\/li><li>Nombre de ventes, CA, panier moyen, marge.<\/li><li>Coût total, coût par contact, retour sur investissement.<\/li><li>Comparaison objectifs / résultats, en %.<\/li><\/ul><\/div>\n<div class=\"card cP\"><h3>Qualitatif<\/h3><ul class=\"sm\"><li>Satisfaction des visiteurs et de l'équipe.<\/li><li>Image, retombées sur les réseaux.<\/li><li>Remarques des clients, informations sur les concurrents.<\/li><li>Ce qui a marché, ce qu'on changera la prochaine fois.<\/li><\/ul><\/div>\n<\/div>\n<div class=\"card dark\"><h3>Le suivi, c'est là que se joue la note<\/h3><p class=\"sm\" style=\"color:#E4E5EE\">Le jury évalue la rigueur du suivi des contacts : saisie dans le CRM, relance rapide, rendez-vous fixés, ventes conclues après l'évènement. Prépare ces chiffres.<\/p><\/div>","x":"c3 organiser et animer l'évènement commercial salon, foire, portes ouvertes, démonstration, lancement de produit, animation de point de vente, webinaire… 1 objectifs et cible objectifs smart : notoriété, prospection, ventes, fidélisation. qui veut-on attirer ? 2 budget location, stand, matériel, communication, personnel, cadeaux, déplacements. comparer avec les gains attendus. 3 rétroplanning toutes les tâches, du jour j vers aujourd'hui, avec un responsable et une date. 4 logistique lieu, matériel, autorisations, sécurité, stocks, équipe et briefing. communication avant, pendant, après avant · invitations ciblées, e-mailing aux clients qui ont donné leur accord, réseaux sociaux, affichage, presse locale pendant · accueil, démonstrations, animations (jeu, dégustation), collecte des coordonnées avec consentement après · remerciements, relance des contacts, offres de suivi, publication sur les réseaux animer le jour j accueil · aller vers les visiteurs, accrocher par une question ouverte démonstration · faire essayer, montrer l'avantage concret qualifier les contacts · noter besoin, potentiel, délai sur une fiche contact ou une tablette équipe · rôles clairs, horaires, objectifs par personne le bilan : quantitatif et qualitatif quantitatif nombre de visiteurs, de contacts, de contacts qualifiés. nombre de ventes, ca, panier moyen, marge. coût total, coût par contact, retour sur investissement. comparaison objectifs / résultats, en %. qualitatif satisfaction des visiteurs et de l'équipe. image, retombées sur les réseaux. remarques des clients, informations sur les concurrents. ce qui a marché, ce qu'on changera la prochaine fois. le suivi, c'est là que se joue la note le jury évalue la rigueur du suivi des contacts : saisie dans le crm, relance rapide, rendez-vous fixés, ventes conclues après l'évènement. prépare ces chiffres."},{"t":"L'information commerciale","h":"<div class=\"row\" style=\"align-items:center;gap:14px\"><div class=\"fG\" style=\"width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#FFFFFF\"><span class=\"bign\">C4<\/span><\/div><div style=\"display:flex;flex-direction:column;gap:2px\"><p class=\"kick mut\">Exploiter et mutualiser<\/p><h1 style=\"font-size:31px\">L'information commerciale<\/h1><\/div><\/div><p class=\"mut\">Collecter, analyser, partager, puis proposer : c'est la 3e partie de l'oral en ponctuel.<\/p>\n<div class=\"bar\" style=\"display:flex;height:46px;border-radius:12px;overflow:hidden;font-weight:700;font-size:13px;color:#FFFFFF\">\n<div class=\"fG\" style=\"flex:1;display:flex;align-items:center;justify-content:center\">Collecter<\/div>\n<div style=\"flex:1;display:flex;align-items:center;justify-content:center;background:#0E7A5E\">Sélectionner<\/div>\n<div style=\"flex:1;display:flex;align-items:center;justify-content:center;background:#0B6A52\">Analyser<\/div>\n<div style=\"flex:1;display:flex;align-items:center;justify-content:center;background:#0A5A46\">Partager<\/div>\n<div style=\"flex:1;display:flex;align-items:center;justify-content:center;background:#16182B\">Proposer<\/div>\n<\/div>\n<div class=\"g2\" style=\"align-items:start\">\n<div style=\"display:flex;flex-direction:column;gap:10px\"><div class=\"card cG\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fG\">Collecter<\/span><h3>La veille et les sources<\/h3><div class=\"mini\"><div class=\"def\"><b>Veille<\/b> · commerciale (clients), concurrentielle (prix, offres), technologique, juridique<\/div><div class=\"def\"><b>Sources internes<\/b> · CRM, ventes, comptes rendus de visite, SAV, réclamations<\/div><div class=\"def\"><b>Sources externes<\/b> · salons, presse, sites des concurrents, réseaux sociaux, études, avis clients<\/div><div class=\"def\"><b>Qualifier les données<\/b> · vérifier, compléter, supprimer les doublons, mettre à jour ; respecter le RGPD<\/div><\/div><\/div><div class=\"card cG\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fG\">Outils<\/span><h3>Le système d'information commerciale<\/h3><div class=\"mini\"><div class=\"def\"><b>CRM<\/b> · la base de la relation client : historique, contacts, opportunités, relances<\/div><div class=\"def\"><b>PGI (ERP)<\/b> · logiciel qui partage les mêmes données dans toute l'entreprise<\/div><div class=\"def\"><b>Outils mobiles<\/b> · tablette, application de tournées, géolocalisation, agenda partagé<\/div><\/div><\/div><\/div>\n<div style=\"display:flex;flex-direction:column;gap:10px\"><div class=\"card cG\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fG\">Partager<\/span><h3>Faire remonter l'information<\/h3><div class=\"mini\"><div class=\"def\"><b>Compte rendu de visite<\/b> · faits, informations nouvelles, suite à donner<\/div><div class=\"def\"><b>Reporting<\/b> · tableaux de bord réguliers pour le manager<\/div><div class=\"def\"><b>Supports<\/b> · réunions, intranet, réseau social d'entreprise, outils collaboratifs<\/div><div class=\"def\"><b>Sélectionner et hiérarchiser<\/b> · ne transmettre que l'utile, au bon destinataire, dans le bon ordre<\/div><\/div><\/div><div class=\"card cG\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fG\">Analyser<\/span><h3>Statistiques utiles<\/h3><div class=\"mini\"><div class=\"def\"><b>Tendance<\/b> · l'évolution dans le temps (en %)<\/div><div class=\"def\"><b>Position<\/b> · moyenne, médiane<\/div><div class=\"def\"><b>Dispersion<\/b> · écart-type : les valeurs sont-elles proches ou éloignées de la moyenne ?<\/div><div class=\"def\"><b>Prévision<\/b> · moyenne mobile, ajustement linéaire (droite de tendance), coefficients saisonniers<\/div><div class=\"def\"><b>Graphiques<\/b> · courbe pour une évolution, barres pour comparer, secteurs pour une répartition<\/div><\/div><\/div><\/div>\n<\/div>\n<div class=\"card dark\"><h3>Ce que le jury attend en partie 3<\/h3><p class=\"sm\" style=\"color:#E4E5EE\">Quelles informations as-tu recueillies pendant tes deux activités ? Comment les as-tu sélectionnées et partagées ? Qu'as-tu proposé à ton entreprise à partir de ces informations ? Une proposition concrète et chiffrée fait la différence.<\/p><\/div>","x":"c4 exploiter et mutualiser l'information commerciale collecter, analyser, partager, puis proposer : c'est la 3e partie de l'oral en ponctuel. collecter sélectionner analyser partager proposer collecter la veille et les sources veille · commerciale (clients), concurrentielle (prix, offres), technologique, juridique sources internes · crm, ventes, comptes rendus de visite, sav, réclamations sources externes · salons, presse, sites des concurrents, réseaux sociaux, études, avis clients qualifier les données · vérifier, compléter, supprimer les doublons, mettre à jour ; respecter le rgpd outils le système d'information commerciale crm · la base de la relation client : historique, contacts, opportunités, relances pgi (erp) · logiciel qui partage les mêmes données dans toute l'entreprise outils mobiles · tablette, application de tournées, géolocalisation, agenda partagé partager faire remonter l'information compte rendu de visite · faits, informations nouvelles, suite à donner reporting · tableaux de bord réguliers pour le manager supports · réunions, intranet, réseau social d'entreprise, outils collaboratifs sélectionner et hiérarchiser · ne transmettre que l'utile, au bon destinataire, dans le bon ordre analyser statistiques utiles tendance · l'évolution dans le temps (en %) position · moyenne, médiane dispersion · écart-type : les valeurs sont-elles proches ou éloignées de la moyenne ? prévision · moyenne mobile, ajustement linéaire (droite de tendance), coefficients saisonniers graphiques · courbe pour une évolution, barres pour comparer, secteurs pour une répartition ce que le jury attend en partie 3 quelles informations as-tu recueillies pendant tes deux activités ? comment les as-tu sélectionnées et partagées ? qu'as-tu proposé à ton entreprise à partir de ces informations ? une proposition concrète et chiffrée fait la différence."},{"t":"Les calculs commerciaux à maîtriser","h":"<p class=\"kick tO\">Calculs<\/p>\n<h1>Les calculs commerciaux à maîtriser<\/h1>\n<p class=\"mut\">Le jury te demandera souvent de chiffrer : marge, remise maximale, rentabilité d'une action. Exemple suivi : un produit acheté 40 € HT, vendu 60 € HT.<\/p>\n<table class=\"tb\"><tr><th style=\"width:26%\">Calcul<\/th><th>Formule<\/th><th style=\"width:28%\">Exemple<\/th><\/tr><tr><td>Marge brute unitaire<\/td><td>PV HT − coût d'achat HT<\/td><td class=\"tO\" style=\"font-weight:600;white-space:nowrap\">60 − 40 = 20 €<\/td><\/tr><tr><td>Taux de marge<\/td><td>marge / coût d'achat HT × 100<\/td><td class=\"tO\" style=\"font-weight:600;white-space:nowrap\">20 / 40 = 50 %<\/td><\/tr><tr><td>Taux de marque<\/td><td>marge / PV HT × 100<\/td><td class=\"tO\" style=\"font-weight:600;white-space:nowrap\">20 / 60 = 33,3 %<\/td><\/tr><tr><td>Prix TTC (TVA 20 %)<\/td><td>PV HT × 1,20<\/td><td class=\"tO\" style=\"font-weight:600;white-space:nowrap\">60 × 1,20 = 72 €<\/td><\/tr><tr><td>Prix HT depuis le TTC<\/td><td>PV TTC / 1,20<\/td><td class=\"tO\" style=\"font-weight:600;white-space:nowrap\">72 / 1,20 = 60 €<\/td><\/tr><tr><td>Coefficient multiplicateur<\/td><td>PV TTC / coût d'achat HT<\/td><td class=\"tO\" style=\"font-weight:600;white-space:nowrap\">72 / 40 = 1,8<\/td><\/tr><tr><td>Évolution<\/td><td>(valeur finale − valeur initiale) / valeur initiale × 100<\/td><td class=\"tO\" style=\"font-weight:600;white-space:nowrap\">de 200 à 230 : + 15 %<\/td><\/tr><tr><td>Panier moyen<\/td><td>CA / nombre de ventes<\/td><td class=\"tO\" style=\"font-weight:600;white-space:nowrap\">4 500 / 150 = 30 €<\/td><\/tr><tr><td>Taux de transformation<\/td><td>acheteurs / visiteurs × 100<\/td><td class=\"tO\" style=\"font-weight:600;white-space:nowrap\">45 / 300 = 15 %<\/td><\/tr><tr><td>Part de marché<\/td><td>CA de l'entreprise / CA du marché × 100<\/td><td class=\"tO\" style=\"font-weight:600;white-space:nowrap\">2 M / 20 M = 10 %<\/td><\/tr><tr><td>Marge sur coût variable<\/td><td>CA − charges variables<\/td><td class=\"tO\" style=\"font-weight:600;white-space:nowrap\">100 000 − 60 000 = 40 000 €<\/td><\/tr><tr><td>Seuil de rentabilité<\/td><td>charges fixes / taux de marge sur coût variable<\/td><td class=\"tO\" style=\"font-weight:600;white-space:nowrap\">30 000 / 0,40 = 75 000 € de CA<\/td><\/tr><tr><td>Retour sur investissement<\/td><td>(marge générée − coût) / coût × 100<\/td><td class=\"tO\" style=\"font-weight:600;white-space:nowrap\">(6 000 − 4 000) / 4 000 = 50 %<\/td><\/tr><tr><td>Coût par contact<\/td><td>coût de l'action / nombre de contacts<\/td><td class=\"tO\" style=\"font-weight:600;white-space:nowrap\">4 000 / 200 = 20 €<\/td><\/tr><\/table>\n<div class=\"g2\">\n<div class=\"card cO\"><h3>Les réductions<\/h3><div class=\"mini\"><div class=\"def\"><b>Rabais<\/b> · pour un défaut de qualité ou de conformité<\/div><div class=\"def\"><b>Remise<\/b> · pour une quantité ou un client fidèle, sur la facture<\/div><div class=\"def\"><b>Ristourne<\/b> · en fin de période, sur le CA cumulé<\/div><div class=\"def\"><b>Escompte<\/b> · pour un paiement anticipé<\/div><\/div><\/div>\n<div class=\"card cY\"><h3>Le piège classique<\/h3><p class=\"sm\">Deux remises successives de 10 % ne font <b>pas<\/b> 20 % : la seconde s'applique au prix déjà réduit. 100 € − 10 % = 90 €, puis − 10 % = 81 €, soit 19 % au total.<\/p><\/div>\n<\/div>","x":"calculs les calculs commerciaux à maîtriser le jury te demandera souvent de chiffrer : marge, remise maximale, rentabilité d'une action. exemple suivi : un produit acheté 40 € ht, vendu 60 € ht. calcul formule exemple marge brute unitaire pv ht − coût d'achat ht 60 − 40 = 20 € taux de marge marge / coût d'achat ht × 100 20 / 40 = 50 % taux de marque marge / pv ht × 100 20 / 60 = 33,3 % prix ttc (tva 20 %) pv ht × 1,20 60 × 1,20 = 72 € prix ht depuis le ttc pv ttc / 1,20 72 / 1,20 = 60 € coefficient multiplicateur pv ttc / coût d'achat ht 72 / 40 = 1,8 évolution (valeur finale − valeur initiale) / valeur initiale × 100 de 200 à 230 : + 15 % panier moyen ca / nombre de ventes 4 500 / 150 = 30 € taux de transformation acheteurs / visiteurs × 100 45 / 300 = 15 % part de marché ca de l'entreprise / ca du marché × 100 2 m / 20 m = 10 % marge sur coût variable ca − charges variables 100 000 − 60 000 = 40 000 € seuil de rentabilité charges fixes / taux de marge sur coût variable 30 000 / 0,40 = 75 000 € de ca retour sur investissement (marge générée − coût) / coût × 100 (6 000 − 4 000) / 4 000 = 50 % coût par contact coût de l'action / nombre de contacts 4 000 / 200 = 20 € les réductions rabais · pour un défaut de qualité ou de conformité remise · pour une quantité ou un client fidèle, sur la facture ristourne · en fin de période, sur le ca cumulé escompte · pour un paiement anticipé le piège classique deux remises successives de 10 % ne font pas 20 % : la seconde s'applique au prix déjà réduit. 100 € − 10 % = 90 €, puis − 10 % = 81 €, soit 19 % au total."},{"t":"Le droit utile pour vendre","h":"<p class=\"kick tP\">Droit<\/p>\n<h1>Le droit utile pour vendre<\/h1>\n<h2>Prospecter dans les règles<\/h2>\n<table class=\"tb\">\n<tr><th style=\"width:24%\">Canal<\/th><th style=\"width:38%\">Vers un particulier (B2C)<\/th><th>Vers un professionnel (B2B)<\/th><\/tr>\n<tr><td>E-mail, SMS<\/td><td>Consentement préalable obligatoire (case non pré-cochée). Exception : un client déjà existant, pour des produits analogues<\/td><td>Possible sans accord préalable si le message concerne sa profession ; il doit être informé et pouvoir s'opposer<\/td><\/tr>\n<tr><td>Téléphone<\/td><td><b>Depuis le 11 août 2026<\/b> : consentement préalable obligatoire. Bloctel a disparu<\/td><td>Possible, avec droit d'opposition<\/td><\/tr>\n<tr><td>Dans tous les cas<\/td><td colspan=\"2\">Identifier l'émetteur, offrir un moyen simple de se désinscrire, collecter le minimum de données (RGPD)<\/td><\/tr>\n<\/table>\n<div class=\"g2\" style=\"align-items:start\"><div class=\"card cP\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fP\">Contrat de vente<\/span><h3>Les bases<\/h3><div class=\"mini\"><div class=\"def\"><b>Formation<\/b> · la vente est conclue dès l'accord sur la chose et sur le prix (art. 1583 C. civ.)<\/div><div class=\"def\"><b>CGV<\/b> · conditions générales de vente : à communiquer à tout acheteur professionnel qui les demande ; elles sont le socle de la négociation<\/div><div class=\"def\"><b>Délais de paiement B2B<\/b> · 60 jours après la date de la facture, ou 45 jours fin de mois<\/div><div class=\"def\"><b>Retard de paiement B2B<\/b> · pénalités de retard et indemnité forfaitaire de 40 € pour frais de recouvrement<\/div><\/div><\/div><div class=\"card cP\" style=\"gap:4px;paddi
