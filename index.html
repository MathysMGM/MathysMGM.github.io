umour ; éviter d'être trop insistant ponctualité · importante en rendez-vous états-unis les codes ton · direct, enthousiaste, orienté résultats relation · prénoms utilisés vite, mais affaires traitées efficacement arguments · chiffres, bénéfices concrets, service penser « adaptation » pour un marché étranger, montre que tu adaptes l'offre : langue des supports, unités ( pounds, miles, inches ), devise (£, $), habitudes d'achat, réglementation, jours fériés et saisons, moyens de paiement préférés."},{"t":"La grammaire vraiment utile","h":"<p class=\"kick tO\">Grammaire<\/p>\n<h1>La grammaire vraiment utile<\/h1>\n<p class=\"mut\">Pas besoin de tout savoir : maîtrise ces points et ton anglais sera « grammaticalement acceptable ».<\/p>\n<table class=\"tb\"><tr><th style=\"width:22%\">Pour…<\/th><th style=\"width:30%\">Structure<\/th><th>Exemple<\/th><\/tr><tr><td>Une habitude, un fait<\/td><td>présent simple (-s à la 3e personne)<\/td><td><span lang='en'>The company sells organic products.<\/span><\/td><\/tr><tr><td>Une action en cours<\/td><td>be + -ing<\/td><td><span lang='en'>We are launching a new range.<\/span><\/td><\/tr><tr><td>Une action passée, datée<\/td><td>prétérit<\/td><td><span lang='en'>Last year, sales increased by 10%.<\/span><\/td><\/tr><tr><td>Un bilan jusqu'à maintenant<\/td><td>have + participe passé<\/td><td><span lang='en'>We have opened three new shops since 2024.<\/span><\/td><\/tr><tr><td>Une durée<\/td><td>for (durée) / since (point de départ)<\/td><td><span lang='en'>I have worked here for two months.<\/span><\/td><\/tr><tr><td>Proposer, conseiller<\/td><td>could, should, would<\/td><td><span lang='en'>You should try our new model.<\/span><\/td><\/tr><tr><td>Une condition<\/td><td>if + présent, will<\/td><td><span lang='en'>If you order today, you will get a discount.<\/span><\/td><\/tr><tr><td>Une hypothèse polie<\/td><td>if + prétérit, would<\/td><td><span lang='en'>If we lowered the price, would you order more?<\/span><\/td><\/tr><tr><td>Comparer<\/td><td>-er than / more … than<\/td><td><span lang='en'>It's cheaper and more efficient than the competition.<\/span><\/td><\/tr><tr><td>Le meilleur<\/td><td>the -est / the most<\/td><td><span lang='en'>It's our best-selling product.<\/span><\/td><\/tr><tr><td>Une demande polie<\/td><td>Could you…? Would you like…?<\/td><td><span lang='en'>Would you like a sample?<\/span><\/td><\/tr><\/table>\n<div class=\"g2\" style=\"align-items:start\">\n<div class=\"card cB\"><h3>Les questions<\/h3><div class=\"mini\"><div class=\"def\"><b lang=\"en\">What are your needs?<\/b> · Quels sont vos besoins ?<\/div><div class=\"def\"><b lang=\"en\">How many units do you need?<\/b> · Combien d'unités ?<\/div><div class=\"def\"><b lang=\"en\">When do you need it?<\/b> · Pour quand ?<\/div><div class=\"def\"><b lang=\"en\">What is your budget?<\/b> · Quel est votre budget ?<\/div><div class=\"def\"><b lang=\"en\">Who are your customers?<\/b> · Qui sont vos clients ?<\/div><\/div><\/div>\n<div class=\"card cO\"><h3>Les mots invariables<\/h3><p class=\"sm\">Pas de « s » au pluriel : <b lang=\"en\">information, advice, equipment, furniture, feedback, research, news<\/b> (verbe au singulier). Dis <span lang=\"en\">“a piece of advice”<\/span> pour « un conseil ».<\/p><\/div>\n<\/div>","x":"grammaire la grammaire vraiment utile pas besoin de tout savoir : maîtrise ces points et ton anglais sera « grammaticalement acceptable ». pour… structure exemple une habitude, un fait présent simple (-s à la 3e personne) the company sells organic products. une action en cours be + -ing we are launching a new range. une action passée, datée prétérit last year, sales increased by 10%. un bilan jusqu'à maintenant have + participe passé we have opened three new shops since 2024. une durée for (durée) / since (point de départ) i have worked here for two months. proposer, conseiller could, should, would you should try our new model. une condition if + présent, will if you order today, you will get a discount. une hypothèse polie if + prétérit, would if we lowered the price, would you order more? comparer -er than / more … than it's cheaper and more efficient than the competition. le meilleur the -est / the most it's our best-selling product. une demande polie could you…? would you like…? would you like a sample? les questions what are your needs? · quels sont vos besoins ? how many units do you need? · combien d'unités ? when do you need it? · pour quand ? what is your budget? · quel est votre budget ? who are your customers? · qui sont vos clients ? les mots invariables pas de « s » au pluriel : information, advice, equipment, furniture, feedback, research, news (verbe au singulier). dis “a piece of advice” pour « un conseil »."},{"t":"Erreurs, faux amis et prononciation","h":"<p class=\"kick tO\">Pièges<\/p>\n<h1>Erreurs, faux amis et prononciation<\/h1>\n<h2>Les erreurs typiques des francophones<\/h2>\n<table class=\"tb\"><tr><th style=\"width:50%\">À ne pas dire<\/th><th>À dire<\/th><\/tr><tr><td><span lang='en'>I am agree.<\/span><\/td><td><span lang='en'>I agree.<\/span><\/td><\/tr><tr><td><span lang='en'>I work here since two months.<\/span><\/td><td><span lang='en'>I have worked here for two months.<\/span><\/td><\/tr><tr><td><span lang='en'>It depends of the price.<\/span><\/td><td><span lang='en'>It depends on the price.<\/span><\/td><\/tr><tr><td><span lang='en'>Explain me the product.<\/span><\/td><td><span lang='en'>Explain the product to me.<\/span><\/td><\/tr><tr><td><span lang='en'>The people is happy.<\/span><\/td><td><span lang='en'>The people are happy.<\/span><\/td><\/tr><tr><td><span lang='en'>Some informations.<\/span><\/td><td><span lang='en'>Some information.<\/span><\/td><\/tr><tr><td><span lang='en'>He make a good job.<\/span><\/td><td><span lang='en'>He does a good job.<\/span><\/td><\/tr><\/table>\n<h2>Les faux amis<\/h2>\n<div class=\"card\"><div class=\"mini\" style=\"columns:2;column-gap:24px\">\n<div class=\"def\"><b lang=\"en\">actually<\/b> · en fait (pas « actuellement » = <span lang=\"en\">currently<\/span>)<\/div>\n<div class=\"def\"><b lang=\"en\">eventually<\/b> · finalement (pas « éventuellement » = <span lang=\"en\">possibly<\/span>)<\/div>\n<div class=\"def\"><b lang=\"en\">to attend<\/b> · assister à (une réunion)<\/div>\n<div class=\"def\"><b lang=\"en\">to assist<\/b> · aider<\/div>\n<div class=\"def\"><b lang=\"en\">a commercial<\/b> · une publicité télé (un commercial = <span lang=\"en\">a sales rep<\/span>)<\/div>\n<div class=\"def\"><b lang=\"en\">a location<\/b> · un emplacement (une location = <span lang=\"en\">a rental<\/span>)<\/div>\n<div class=\"def\"><b lang=\"en\">sensible<\/b> · raisonnable (sensible = <span lang=\"en\">sensitive<\/span>)<\/div>\n<div class=\"def\"><b lang=\"en\">to control<\/b> · maîtriser (contrôler = <span lang=\"en\">to check<\/span>)<\/div>\n<div class=\"def\"><b lang=\"en\">an agenda<\/b> · un ordre du jour (un agenda = <span lang=\"en\">a diary, a planner<\/span>)<\/div>\n<div class=\"def\"><b lang=\"en\">a formation<\/b> · une formation… militaire ! (= <span lang=\"en\">training<\/span>)<\/div>\n<div class=\"def\"><b lang=\"en\">a stage<\/b> · une étape, une scène (un stage = <span lang=\"en\">an internship<\/span>)<\/div>\n<div class=\"def\"><b lang=\"en\">to achieve<\/b> · réussir, atteindre (achever = <span lang=\"en\">to finish<\/span>)<\/div>\n<\/div><\/div>\n<h2>La prononciation<\/h2>\n<div class=\"g3\">\n<div class=\"card cB\"><h3>Le « th »<\/h3><p class=\"sm\">La langue entre les dents : <span lang=\"en\"><b>think, three, the, this<\/b><\/span>. Pas « sink » ni « ze ».<\/p><\/div>\n<div class=\"card cB\"><h3>Le « h »<\/h3><p class=\"sm\">Il se souffle : <span lang=\"en\"><b>happy, hotel, help, how<\/b><\/span>.<\/p><\/div>\n<div class=\"card cB\"><h3>Le « -ed »<\/h3><p class=\"sm\">[t] <span lang=\"en\">worked<\/span> · [d] <span lang=\"en\">opened<\/span> · [id] seulement après t ou d : <span lang=\"en\">wanted, needed<\/span>.<\/p><\/div>\n<\/div>\n<div class=\"card cY\"><h3>L'accent tonique<\/h3><p class=\"sm\">Appuie sur la bonne syllabe : <span lang=\"en\"><b>MAR<\/b>keting, <b>CUS<\/b>tomer, <b>PRO<\/b>duct, de<b>VE<\/b>lop, <b>CA<\/b>talogue<\/span>. Nom et verbe changent parfois : <span lang=\"en\">an <b>IN<\/b>crease / to in<b>CREASE<\/b><\/span>.<\/p><\/div>","x":"pièges erreurs, faux amis et prononciation les erreurs typiques des francophones à ne pas dire à dire i am agree. i agree. i work here since two months. i have worked here for two months. it depends of the price. it depends on the price. explain me the product. explain the product to me. the people is happy. the people are happy. some informations. some information. he make a good job. he does a good job. les faux amis actually · en fait (pas « actuellement » = currently ) eventually · finalement (pas « éventuellement » = possibly ) to attend · assister à (une réunion) to assist · aider a commercial · une publicité télé (un commercial = a sales rep ) a location · un emplacement (une location = a rental ) sensible · raisonnable (sensible = sensitive ) to control · maîtriser (contrôler = to check ) an agenda · un ordre du jour (un agenda = a diary, a planner ) a formation · une formation… militaire ! (= training ) a stage · une étape, une scène (un stage = an internship ) to achieve · réussir, atteindre (achever = to finish ) la prononciation le « th » la langue entre les dents : think, three, the, this . pas « sink » ni « ze ». le « h » il se souffle : happy, hotel, help, how . le « -ed » [t] worked · [d] opened · [id] seulement après t ou d : wanted, needed . l'accent tonique appuie sur la bonne syllabe : mar keting, cus tomer, pro duct, de ve lop, ca talogue . nom et verbe changent parfois : an in crease / to in crease ."},{"t":"Ton kit minimum et le jour J","h":"<p class=\"kick tB\">Jour J<\/p>\n<h1>Ton kit minimum et le jour J<\/h1>\n<div class=\"g2\">\n<div class=\"card cB\"><span class=\"tag fB\">Partie a<\/span><p class=\"sm\">Plan en 4 temps · les connecteurs anglais pour comprendre · les chiffres · résumer, pas traduire.<\/p><\/div>\n<div class=\"card cO\"><span class=\"tag fO\">Partie b<\/span><p class=\"sm\">Présenter, analyser, proposer · 10 phrases toutes prêtes · le vocabulaire de la vente · une démarche adaptée au pays.<\/p><\/div>\n<\/div>\n<div class=\"g2\" style=\"align-items:start\">\n<div class=\"card cY\"><h3>Plan de révision<\/h3>\n<div class=\"sm\" style=\"display:flex;flex-direction:column;gap:7px\">\n<span>☐ Apprendre 10 mots de vocabulaire par jour (pages 06 à 08)<\/span>\n<span>☐ Savoir dire ton introduction de la partie b sans hésiter<\/span>\n<span>☐ Lire un article d'actualité business en anglais par semaine et le résumer en français en 3 min<\/span>\n<span>☐ Écouter de l'anglais tous les jours (podcast, série en VO sous-titrée anglais)<\/span>\n<span>☐ Faire 2 simulations complètes chronométrées avec un camarade<\/span>\n<span>☐ Revoir les erreurs et faux amis de la page 11<\/span>\n<\/div><\/div>\n<div class=\"card dark\"><h3>Le jour J<\/h3>\n<ol class=\"sm\" style=\"color:#E4E5EE;display:flex;flex-direction:column;gap:5px\">\n<li>Préparation : 12 min pour le texte, 18 min pour la mise en situation.<\/li>\n<li>Note des mots-clés, jamais des phrases à lire.<\/li>\n<li>Partie a : en français, structuré, avec les chiffres.<\/li>\n<li>Partie b : présente, analyse, propose ; parle au « client ».<\/li>\n<li>Demande de répéter si besoin : c'est de la communication.<\/li>\n<li>Souris, regarde l'examinateur, parle lentement.<\/li>\n<\/ol><\/div>\n<\/div>\n<div class=\"card cO\" style=\"padding:18px 20px\"><p class=\"quote\" style=\"font-size:20px\" lang=\"en\">Nobody expects perfect English. They expect you to communicate, adapt and sell.<\/p><p class=\"sm\">Personne n'attend un anglais parfait : on attend que tu communiques, que tu t'adaptes et que tu vendes.<\/p><\/div>\n<div class=\"card\"><h3>Sources vérifiées<\/h3><p class=\"sm mut\">Définition de l'épreuve E2 du BTS NDRC (annexe du référentiel, académie de Versailles) · cadrage de l'épreuve de LVE du BTS NDRC (académie de Normandie). Vérifié le 16 novembre 2026.<\/p><\/div>","x":"jour j ton kit minimum et le jour j partie a plan en 4 temps · les connecteurs anglais pour comprendre · les chiffres · résumer, pas traduire. partie b présenter, analyser, proposer · 10 phrases toutes prêtes · le vocabulaire de la vente · une démarche adaptée au pays. plan de révision ☐ apprendre 10 mots de vocabulaire par jour (pages 06 à 08) ☐ savoir dire ton introduction de la partie b sans hésiter ☐ lire un article d'actualité business en anglais par semaine et le résumer en français en 3 min ☐ écouter de l'anglais tous les jours (podcast, série en vo sous-titrée anglais) ☐ faire 2 simulations complètes chronométrées avec un camarade ☐ revoir les erreurs et faux amis de la page 11 le jour j préparation : 12 min pour le texte, 18 min pour la mise en situation. note des mots-clés, jamais des phrases à lire. partie a : en français, structuré, avec les chiffres. partie b : présente, analyse, propose ; parle au « client ». demande de répéter si besoin : c'est de la communication. souris, regarde l'examinateur, parle lentement. nobody expects perfect english. they expect you to communicate, adapt and sell. personne n'attend un anglais parfait : on attend que tu communiques, que tu t'adaptes et que tu vendes. sources vérifiées définition de l'épreuve e2 du bts ndrc (annexe du référentiel, académie de versailles) · cadrage de l'épreuve de lve du bts ndrc (académie de normandie). vérifié le 16 novembre 2026."}],"g":[{"n":"Déroulement de l'épreuve","tag":"","e":true,"p":[0,1,2,3,11]},{"n":"Les phrases qui sauvent","tag":"","e":false,"p":[4]},{"n":"Vocabulaire commercial et digital","tag":"","e":false,"p":[5,6,7]},{"n":"Lire un document commercial","tag":"","e":false,"p":[8]},{"n":"Grammaire, pièges et prononciation","tag":"","e":false,"p":[9,10]}],"q":[{"id":"e2q0","q":"« A discount » signifie…","o":["une remise","un compte","une découverte","une réduction d'effectifs"],"a":0,"e":"To offer a discount = proposer une remise."},{"id":"e2q1","q":"« VAT » est…","o":["la TVA","le chiffre d'affaires","une facture","un devis"],"a":0,"e":"Value Added Tax."},{"id":"e2q2","q":"« To follow up » signifie…","o":["suivre quelqu'un dans la rue","assurer le suivi, relancer","abandonner","commander"],"a":1,"e":"I'll follow up next week."},{"id":"e2q3","q":"« A complaint » est…","o":["un compliment","une réclamation","un contrat","une commande"],"a":1,"e":"To complain = se plaindre."},{"id":"e2q4","q":"« A supplier » est…","o":["un client","un fournisseur","un concurrent","un commercial"],"a":1,"e":"Supply = fournir."},{"id":"e2q5","q":"« Shipping costs » signifie…","o":["les frais de port","le coût d'un bateau","les frais bancaires","les coûts fixes"],"a":0,"e":"To ship = expédier."},{"id":"e2q6","q":"« Actually » signifie…","o":["actuellement","en fait","activement","précisément"],"a":1,"e":"Actuellement = currently."},{"id":"e2q7","q":"« Eventually » signifie…","o":["éventuellement","finalement","parfois","rapidement"],"a":1,"e":"Éventuellement = possibly."},{"id":"e2q8","q":"« I have worked here ___ two months. »","o":["since","for","during","from"],"a":1,"e":"For + durée ; since + point de départ."},{"id":"e2q9","q":"« It depends ___ the price. »","o":["of","on","from","to"],"a":1,"e":"To depend on."},{"id":"e2q10","q":"« A quote » dans un contexte commercial, c'est…","o":["une citation","un devis","une remise","une facture"],"a":1,"e":"A quote / a quotation = un devis."},{"id":"e2q11","q":"« Turnover » (UK) signifie…","o":["le chiffre d'affaires","le bénéfice","le stock","le prix"],"a":0,"e":"Aussi : revenue."},{"id":"e2q12","q":"« A trade fair » est…","o":["une foire au commerce équitable","un salon professionnel","un prix juste","un marché aux puces"],"a":1,"e":"Aussi : a trade show."},{"id":"e2q13","q":"« An invoice » est…","o":["une invitation","une facture","un devis","une commande"],"a":1,"e":"Invoice = facture."},{"id":"e2q14","q":"Quelle forme est correcte ?","o":["some informations","some information","an information","informations"],"a":1,"e":"Information est indénombrable."},{"id":"e2q15","q":"« A commercial » en anglais désigne…","o":["un commercial","une publicité télé","un commerce","une commande"],"a":1,"e":"Un commercial = a sales rep."},{"id":"e2q16","q":"« An internship » est…","o":["un stage","un internat","un entretien","un emploi"],"a":0,"e":"Un stagiaire = an intern."},{"id":"e2q17","q":"« To attend a meeting » signifie…","o":["attendre une réunion","assister à une réunion","organiser une réunion","annuler une réunion"],"a":1,"e":"Attendre = to wait for."},{"id":"e2q18","q":"« A warranty » signifie…","o":["un mandat","une garantie","un avertissement","une facture"],"a":1,"e":"Aussi : a guarantee."},{"id":"e2q19","q":"« Lead time » signifie…","o":["le temps de pause","le délai de livraison","l'heure du rendez-vous","le temps de travail"],"a":1,"e":"What's the lead time? = Quel est le délai ?"},{"id":"e2q20","q":"« A retailer » est…","o":["un grossiste","un détaillant","un fournisseur","un client"],"a":1,"e":"Retail = la vente au détail."},{"id":"e2q21","q":"« A wholesaler » est…","o":["un détaillant","un grossiste","un fabricant","un livreur"],"a":1,"e":"Wholesale = en gros."},{"id":"e2q22","q":"« To launch a product » signifie…","o":["déjeuner","lancer un produit","livrer un produit","retirer un produit"],"a":1,"e":"A launch = un lancement."},{"id":"e2q23","q":"« A booth » sur un salon, c'est…","o":["une cabine téléphonique","un stand","une entrée","un badge"],"a":1,"e":"Aussi : a stand."},{"id":"e2q24","q":"« A branch » d'entreprise est…","o":["une branche d'arbre","une succursale, une agence","un service","un produit"],"a":1,"e":"The head office = le siège."},{"id":"e2q25","q":"« Customer loyalty » signifie…","o":["la loi du client","la fidélité client","la satisfaction","la réclamation"],"a":1,"e":"A loyalty programme = un programme de fidélité."},{"id":"e2q26","q":"« A refund » est…","o":["un nouveau fonds","un remboursement","une remise","un retour"],"a":1,"e":"To refund = rembourser."},{"id":"e2q27","q":"« A cover letter » est…","o":["une enveloppe","une lettre de motivation","un CV","une couverture"],"a":1,"e":"À joindre au CV."},{"id":"e2q28","q":"« Sensible » en anglais signifie…","o":["sensible","raisonnable","sensuel","fragile"],"a":1,"e":"Sensible (français) = sensitive."},{"id":"e2q29","q":"« To achieve » signifie…","o":["achever","atteindre, réussir","acheter","arrêter"],"a":1,"e":"To achieve a goal = atteindre un objectif."},{"id":"e2q30","q":"« A location » signifie…","o":["une location","un emplacement","une localité","un loyer"],"a":1,"e":"Une location (de voiture) = a rental."},{"id":"e2q31","q":"« If you order today, you ___ get a discount. »","o":["would","will","are","had"],"a":1,"e":"If + présent → will."},{"id":"e2q32","q":"« It's ___ than the competition. » (cheap)","o":["more cheap","cheaper","cheapest","most cheap"],"a":1,"e":"Adjectif court : -er than."},{"id":"e2q33","q":"Comment dire « un conseil » ?","o":["an advice","a piece of advice","one advices","an advise"],"a":1,"e":"Advice est indénombrable."}],"r":[{"id":"e2r0","q":"Présente-toi en anglais en deux phrases : ta formation et ton stage.","p":[{"t":"I'm… / I am…","k":["i'm","i am"]},{"t":"Ta formation","k":["study","studying","degree","student","bts"]},{"t":"Ton stage","k":["internship","intern","work for","working for"]}],"m":"« I'm studying for a two-year degree in sales and customer relations. I'm doing an internship at a sports equipment shop, where I advise customers and organise events. »"},{"id":"e2r1","q":"Comment dis-tu en anglais : « Pouvez-vous répéter, s'il vous plaît ? »","p":[{"t":"Could you / Can you","k":["could you","can you"]},{"t":"Repeat","k":["repeat","say that again"]},{"t":"Please","k":["please"]}],"m":"« Could you repeat that, please? » (ou « Sorry, I didn't catch that. »)"},{"id":"e2r2","q":"Traduis : « Nous pourrions vous proposer une remise de 10 % sur votre première commande. »","p":[{"t":"We could","k":["we could"]},{"t":"Offer","k":["offer"]},{"t":"A discount","k":["discount"]},{"t":"Your first order","k":["first order"]}],"m":"« We could offer you a 10% discount on your first order. »"},{"id":"e2r3","q":"Le client dit : « It's too expensive. » Réponds-lui en anglais.","p":[{"t":"Montrer que tu comprends","k":["understand","i see","good point"]},{"t":"Nuancer : but / however","k":["but","however"]},{"t":"Un argument : qualité, économies","k":["quality","save","long run","value","last","warranty"]}],"m":"« I understand your point. However, this product is high-quality and comes with a 5-year warranty, so it will save you money in the long run. »"},{"id":"e2r4","q":"Traduis : « Je vous enverrai un devis par e-mail. »","p":[{"t":"I will / I'll","k":["i will","i'll"]},{"t":"Send you","k":["send"]},{"t":"A quote","k":["quote","quotation"]},{"t":"By email","k":["email","e-mail"]}],"m":"« I'll send you a quote by email. »"},{"id":"e2r5","q":"Corrige cette phrase : « I am agree with you, it depends of the price. »","p":[{"t":"I agree (sans am)","k":["i agree"]},{"t":"It depends on","k":["depends on"]}],"m":"« I agree with you, it depends on the price. »"},{"id":"e2r6","q":"Traduis : « Ce produit est plus léger et moins cher que celui de nos concurrents. »","p":[{"t":"Lighter","k":["lighter"]},{"t":"Cheaper / less expensive","k":["cheaper","less expensive"]},{"t":"Than","k":["than"]},{"t":"Competitors","k":["competitor"]}],"m":"« This product is lighter and cheaper than our competitors' (products). »"},{"id":"e2r7","q":"Traduis : « Je travaille ici depuis deux mois. »","p":[{"t":"Present perfect : I have worked / I've been working","k":["have worked","'ve worked","have been working","'ve been working"]},{"t":"For two months","k":["for two months","for 2 months"]}],"m":"« I have worked here for two months. » (ou « I've been working here for two months. ») On utilise for avec une durée, et le present perfect, pas le présent."}]},{"k":"cejm","n":"CEJM","s":"E3 · Éco, droit, management","c":"#16182B","p":[{"t":"Vue d'ensemble","h":"<div style=\"display:flex;flex-direction:column;gap:12px;padding-top:8px\">\n<span class=\"tag\" style=\"background:#16182B\">Fiche de révision · Épreuve E3<\/span>\n<div style=\"display:flex;align-items:flex-end;gap:18px\">\n<div style=\"font-family:'Bricolage Grotesque',Inter,sans-serif;font-weight:800;font-size:clamp(34px,11vw,150px);line-height:.85;letter-spacing:-.04em;color:#16182B\">CEJM<\/div>\n<div style=\"display:flex;flex-direction:column;gap:6px;padding-bottom:10px\">\n<span class=\"tag fB\" style=\"font-size:13px\">Économie<\/span><span class=\"tag fP\" style=\"font-size:13px\">Droit<\/span><span class=\"tag fG\" style=\"font-size:13px\">Management<\/span>\n<\/div><\/div>\n<p style=\"font-size:18px;line-height:1.4;max-width:640px\"><b>Culture économique, juridique et managériale<\/b> : tout le programme des deux années, la méthode pour chaque type de question et les repères à connaître par cœur.<\/p>\n<\/div>\n<h2>L'épreuve en un coup d'œil<\/h2>\n<div class=\"g4\">\n<div class=\"card dark\"><span class=\"bign\">4 h<\/span><span class=\"sm\" style=\"color:#D6D8E6\">écrit, sans matériel<\/span><\/div>\n<div class=\"card dark\"><span class=\"bign\">Coef. 3<\/span><span class=\"sm\" style=\"color:#D6D8E6\">en BTS NDRC<\/span><\/div>\n<div class=\"card dark\"><span class=\"bign\">3<\/span><span class=\"sm\" style=\"color:#D6D8E6\">missions, en général<\/span><\/div>\n<div class=\"card dark\"><span class=\"bign\">≈ 10<\/span><span class=\"sm\" style=\"color:#D6D8E6\">questions au total<\/span><\/div>\n<\/div>\n<div class=\"g2\">\n<div class=\"card\"><h3>Ce que contient le sujet<\/h3><ul class=\"sm\"><li>Une <b>entreprise<\/b> présentée en introduction (le contexte).<\/li><li>Des <b>missions<\/b>, chacune avec ses questions.<\/li><li>Un <b>dossier documentaire<\/b> : articles, graphiques, extraits de loi, contrats, décisions de justice, organigrammes…<\/li><\/ul><\/div>\n<div class=\"card\"><h3>Ce qu'on attend<\/h3><ul class=\"sm\"><li>Une réponse <b>construite et argumentée<\/b> à chaque question.<\/li><li>Les <b>trois champs<\/b> sont toujours couverts.<\/li><li>Toujours <b>relier<\/b> la réponse à l'entreprise du sujet.<\/li><\/ul><\/div>\n<\/div>\n<div style=\"display:flex;flex-direction:column;gap:6px\">\n<p class=\"kick mut\">Exemple de répartition (session 2020, sur 40 points)<\/p>\n<div class=\"bar\" style=\"display:flex;height:46px;border-radius:12px;overflow:hidden;font-weight:700;font-size:13px;color:#FFFFFF\">\n<div class=\"fB\" style=\"flex:12;display:flex;align-items:center;padding-left:14px\">Économie · 12 pts<\/div>\n<div class=\"fP\" style=\"flex:13;display:flex;align-items:center;padding-left:14px\">Droit · 13 pts<\/div>\n<div class=\"fG\" style=\"flex:15;display:flex;align-items:center;padding-left:14px\">Management · 15 pts<\/div>\n<\/div>\n<p class=\"sm mut\">Les trois matières pèsent à peu près autant : aucune ne peut être sacrifiée.<\/p>\n<\/div>\n<div class=\"g2 sm\" style=\"gap:4px 20px\">\n<span><b>02<\/b> · Le programme en une page<\/span><span><b>08<\/b> · Thème 3 (2/2) : risques, ressources, financement<\/span>\n<span><b>03<\/b> · Méthode générale et minutage<\/span><span><b>09<\/b> · Thème 4 : le numérique<\/span>\n<span><b>04<\/b> · Méthode par type de question<\/span><span><b>10<\/b> · Thème 5 : les mutations du travail<\/span>\n<span><b>05<\/b> · Thème 1 : l'entreprise et son environnement<\/span><span><b>11<\/b> · Thème 6 : les choix stratégiques<\/span>\n<span><b>06<\/b> · Thème 2 : la régulation<\/span><span><b>12<\/b> · Notions complémentaires<\/span>\n<span><b>07<\/b> · Thème 3 (1/2) : production, structures<\/span><span><b>13–15<\/b> · Auteurs, repères juridiques, jour J<\/span>\n<\/div>","x":"fiche de révision · épreuve e3 cejm économie droit management culture économique, juridique et managériale : tout le programme des deux années, la méthode pour chaque type de question et les repères à connaître par cœur. l'épreuve en un coup d'œil 4 h écrit, sans matériel coef. 3 en bts ndrc 3 missions, en général ≈ 10 questions au total ce que contient le sujet une entreprise présentée en introduction (le contexte). des missions , chacune avec ses questions. un dossier documentaire : articles, graphiques, extraits de loi, contrats, décisions de justice, organigrammes… ce qu'on attend une réponse construite et argumentée à chaque question. les trois champs sont toujours couverts. toujours relier la réponse à l'entreprise du sujet. exemple de répartition (session 2020, sur 40 points) économie · 12 pts droit · 13 pts management · 15 pts les trois matières pèsent à peu près autant : aucune ne peut être sacrifiée. 02 · le programme en une page 08 · thème 3 (2/2) : risques, ressources, financement 03 · méthode générale et minutage 09 · thème 4 : le numérique 04 · méthode par type de question 10 · thème 5 : les mutations du travail 05 · thème 1 : l'entreprise et son environnement 11 · thème 6 : les choix stratégiques 06 · thème 2 : la régulation 12 · notions complémentaires 07 · thème 3 (1/2) : production, structures 13–15 · auteurs, repères juridiques, jour j"},{"t":"6 thèmes, 18 questions","h":"<p class=\"kick tO\">Le programme<\/p>\n<h1>6 thèmes, 18 questions<\/h1>\n<p class=\"mut\">La 1re année pose le cadre (thèmes 1 à 3), la 2e année étudie les évolutions (thèmes 4 à 6). À l'examen, <b>tout le programme<\/b> peut tomber.<\/p>\n<div class=\"row\" style=\"gap:16px\"><span class=\"leg\"><span class=\"dot fB\"><\/span>Économie<\/span><span class=\"leg\"><span class=\"dot fP\"><\/span>Droit<\/span><span class=\"leg\"><span class=\"dot fG\"><\/span>Management<\/span><\/div>\n<div class=\"g2\" style=\"gap:10px\"><div class=\"card\" style=\"gap:6px;padding:12px 14px\"><div class=\"row\" style=\"align-items:center;gap:10px\"><span class=\"bign\" style=\"font-size:26px\">1<\/span><div><p class=\"kick mut\" style=\"font-size:10.5px\">1re année<\/p><h3>L'intégration de l'entreprise dans son environnement<\/h3><\/div><\/div><div class=\"mini\" style=\"display:flex;flex-direction:column;gap:4px\"><div class=\"row\" style=\"gap:8px;align-items:flex-start\"><span class=\"dot fB\" style=\"margin-top:5px;flex:none\"><\/span><span>Comment s'établissent les relations entre l'entreprise et son environnement économique ?<\/span><\/div><div class=\"row\" style=\"gap:8px;align-items:flex-start\"><span class=\"dot fP\" style=\"margin-top:5px;flex:none\"><\/span><span>Comment les contrats sécurisent-ils les relations entre l'entreprise et ses partenaires ?<\/span><\/div><div class=\"row\" style=\"gap:8px;align-items:flex-start\"><span class=\"dot fG\" style=\"margin-top:5px;flex:none\"><\/span><span>De quelle manière l'entreprise s'inscrit-elle dans son environnement ?<\/span><\/div><\/div><\/div><div class=\"card\" style=\"gap:6px;padding:12px 14px\"><div class=\"row\" style=\"align-items:center;gap:10px\"><span class=\"bign\" style=\"font-size:26px\">2<\/span><div><p class=\"kick mut\" style=\"font-size:10.5px\">1re année<\/p><h3>La régulation de l'activité économique<\/h3><\/div><\/div><div class=\"mini\" style=\"display:flex;flex-direction:column;gap:4px\"><div class=\"row\" style=\"gap:8px;align-items:flex-start\"><span class=\"dot fB\" style=\"margin-top:5px;flex:none\"><\/span><span>Quel est le rôle de l'État dans la régulation économique ?<\/span><\/div><div class=\"row\" style=\"gap:8px;align-items:flex-start\"><span class=\"dot fP\" style=\"margin-top:5px;flex:none\"><\/span><span>Comment les activités économiques sont-elles régulées par le droit ?<\/span><\/div><div class=\"row\" style=\"gap:8px;align-items:flex-start\"><span class=\"dot fG\" style=\"margin-top:5px;flex:none\"><\/span><span>Comment l'entreprise intègre-t-elle la connaissance de son environnement dans sa prise de décision ?<\/span><\/div><\/div><\/div><div class=\"card\" style=\"gap:6px;padding:12px 14px\"><div class=\"row\" style=\"align-items:center;gap:10px\"><span class=\"bign\" style=\"font-size:26px\">3<\/span><div><p class=\"kick mut\" style=\"font-size:10.5px\">1re année<\/p><h3>L'organisation de l'activité de l'entreprise<\/h3><\/div><\/div><div class=\"mini\" style=\"display:flex;flex-direction:column;gap:4px\"><div class=\"row\" style=\"gap:8px;align-items:flex-start\"><span class=\"dot fB\" style=\"margin-top:5px;flex:none\"><\/span><span>Comment les facteurs économiques déterminent-ils les choix de production ?<\/span><\/div><div class=\"row\" style=\"gap:8px;align-items:flex-start\"><span class=\"dot fP\" style=\"margin-top:5px;flex:none\"><\/span><span>Comment choisir une structure juridique pour l'entreprise ?<\/span><\/div><div class=\"row\" style=\"gap:8px;align-items:flex-start\"><span class=\"dot fP\" style=\"margin-top:5px;flex:none\"><\/span><span>Quelles réponses le droit apporte-t-il face aux risques auxquels s'expose l'entreprise ?<\/span><\/div><div class=\"row\" style=\"gap:8px;align-items:flex-start\"><span class=\"dot fG\" style=\"margin-top:5px;flex:none\"><\/span><span>Comment l'entreprise organise-t-elle ses ressources ?<\/span><\/div><div class=\"row\" style=\"gap:8px;align-items:flex-start\"><span class=\"dot fG\" style=\"margin-top:5px;flex:none\"><\/span><span>Quel financement pour l'entreprise ?<\/span><\/div><\/div><\/div><div class=\"card\" style=\"gap:6px;padding:12px 14px\"><div class=\"row\" style=\"align-items:center;gap:10px\"><span class=\"bign\" style=\"font-size:26px\">4<\/span><div><p class=\"kick mut\" style=\"font-size:10.5px\">2e année<\/p><h3>L'impact du numérique sur la vie de l'entreprise<\/h3><\/div><\/div><div class=\"mini\" style=\"display:flex;flex-direction:column;gap:4px\"><div class=\"row\" style=\"gap:8px;align-items:flex-start\"><span class=\"dot fB\" style=\"margin-top:5px;flex:none\"><\/span><span>Comment le numérique transforme-t-il l'environnement des entreprises ?<\/span><\/div><div class=\"row\" style=\"gap:8px;align-items:flex-start\"><span class=\"dot fP\" style=\"margin-top:5px;flex:none\"><\/span><span>Dans quelle mesure le droit répond-il aux questions posées par le développement du numérique ?<\/span><\/div><div class=\"row\" style=\"gap:8px;align-items:flex-start\"><span class=\"dot fG\" style=\"margin-top:5px;flex:none\"><\/span><span>Quelle est l'incidence du numérique sur le management ?<\/span><\/div><\/div><\/div><div class=\"card\" style=\"gap:6px;padding:12px 14px\"><div class=\"row\" style=\"align-items:center;gap:10px\"><span class=\"bign\" style=\"font-size:26px\">5<\/span><div><p class=\"kick mut\" style=\"font-size:10.5px\">2e année<\/p><h3>Les mutations du travail<\/h3><\/div><\/div><div class=\"mini\" style=\"display:flex;flex-direction:column;gap:4px\"><div class=\"row\" style=\"gap:8px;align-items:flex-start\"><span class=\"dot fB\" style=\"margin-top:5px;flex:none\"><\/span><span>Quelles sont les principales évolutions du marché du travail ?<\/span><\/div><div class=\"row\" style=\"gap:8px;align-items:flex-start\"><span class=\"dot fP\" style=\"margin-top:5px;flex:none\"><\/span><span>Comment le droit prend-il en considération les besoins des entreprises et des salariés ?<\/span><\/div><div class=\"row\" style=\"gap:8px;align-items:flex-start\"><span class=\"dot fG\" style=\"margin-top:5px;flex:none\"><\/span><span>Quel est l'impact des mutations du travail sur l'emploi et les conditions de travail ?<\/span><\/div><\/div><\/div><div class=\"card\" style=\"gap:6px;padding:12px 14px\"><div class=\"row\" style=\"align-items:center;gap:10px\"><span class=\"bign\" style=\"font-size:26px\">6<\/span><div><p class=\"kick mut\" style=\"font-size:10.5px\">2e année<\/p><h3>Les choix stratégiques de l'entreprise<\/h3><\/div><\/div><div class=\"mini\" style=\"display:flex;flex-direction:column;gap:4px\"><div class=\"row\" style=\"gap:8px;align-items:flex-start\"><span class=\"dot fG\" style=\"margin-top:5px;flex:none\"><\/span><span>Comment le diagnostic éclaire-t-il les choix stratégiques de l'entreprise ?<\/span><\/div><div class=\"row\" style=\"gap:8px;align-items:flex-start\"><span class=\"dot fG\" style=\"margin-top:5px;flex:none\"><\/span><span>Quels sont les choix stratégiques opérés par l'entreprise ?<\/span><\/div><\/div><\/div><\/div>","x":"le programme 6 thèmes, 18 questions la 1re année pose le cadre (thèmes 1 à 3), la 2e année étudie les évolutions (thèmes 4 à 6). à l'examen, tout le programme peut tomber. économie droit management 1 1re année l'intégration de l'entreprise dans son environnement comment s'établissent les relations entre l'entreprise et son environnement économique ? comment les contrats sécurisent-ils les relations entre l'entreprise et ses partenaires ? de quelle manière l'entreprise s'inscrit-elle dans son environnement ? 2 1re année la régulation de l'activité économique quel est le rôle de l'état dans la régulation économique ? comment les activités économiques sont-elles régulées par le droit ? comment l'entreprise intègre-t-elle la connaissance de son environnement dans sa prise de décision ? 3 1re année l'organisation de l'activité de l'entreprise comment les facteurs économiques déterminent-ils les choix de production ? comment choisir une structure juridique pour l'entreprise ? quelles réponses le droit apporte-t-il face aux risques auxquels s'expose l'entreprise ? comment l'entreprise organise-t-elle ses ressources ? quel financement pour l'entreprise ? 4 2e année l'impact du numérique sur la vie de l'entreprise comment le numérique transforme-t-il l'environnement des entreprises ? dans quelle mesure le droit répond-il aux questions posées par le développement du numérique ? quelle est l'incidence du numérique sur le management ? 5 2e année les mutations du travail quelles sont les principales évolutions du marché du travail ? comment le droit prend-il en considération les besoins des entreprises et des salariés ? quel est l'impact des mutations du travail sur l'emploi et les conditions de travail ? 6 2e année les choix stratégiques de l'entreprise comment le diagnostic éclaire-t-il les choix stratégiques de l'entreprise ? quels sont les choix stratégiques opérés par l'entreprise ?"},{"t":"La méthode générale","h":"<p class=\"kick tO\">Méthode<\/p>\n<h1>La méthode générale<\/h1>\n<div class=\"card dark\" style=\"padding:18px 20px\"><p class=\"kick\" style=\"color:#FFB79A\">La règle d'or<\/p><p class=\"quote\" style=\"font-size:20px\">Toujours contextualiser : relier chaque réponse à l'entreprise du sujet. Une réponse juste mais « hors contexte » ne rapporte qu'environ un tiers des points.<\/p><p class=\"sm\" style=\"color:#D6D8E6\">Source : retours officiels de correction (académie de Besançon, session 2020).<\/p><\/div>\n<h2>Le minutage conseillé<\/h2>\n<div class=\"bar\" style=\"display:flex;height:46px;border-radius:12px;overflow:hidden;font-weight:700;font-size:12.5px;color:#FFFFFF\">\n<div style=\"flex:25;display:flex;align-items:center;padding-left:12px;background:#16182B\">Lecture · 25 min<\/div>\n<div class=\"fB\" style=\"flex:60;display:flex;align-items:center;padding-left:12px\">Mission 1 · 1 h<\/div>\n<div class=\"fP\" style=\"flex:60;display:flex;align-items:center;padding-left:12px\">Mission 2 · 1 h<\/div>\n<div class=\"fG\" style=\"flex:60;display:flex;align-items:center;padding-left:12px\">Mission 3 · 1 h<\/div>\n<div class=\"fO\" style=\"flex:15;display:flex;align-items:center;justify-content:center;color:#16182B\">Relire<\/div>\n<\/div>\n<p class=\"sm mut\">Adapte le temps aux points : une question à 4 points mérite deux fois plus de lignes qu'une question à 2 points.<\/p>\n<div class=\"g4\">\n<div class=\"step\"><span class=\"bign tO\">1<\/span><b>Lire le contexte<\/b><span>Activité, taille, forme juridique, marché, dirigeant, problème posé. Surligne ce qui servira.<\/span><\/div>\n<div class=\"step\"><span class=\"bign tO\">2<\/span><b>Lire les questions<\/b><span>Repère le champ (éco, droit, management) et le verbe de consigne de chacune.<\/span><\/div>\n<div class=\"step\"><span class=\"bign tO\">3<\/span><b>Repérer les annexes<\/b><span>Note en marge quelle annexe sert à quelle question.<\/span><\/div>\n<div class=\"step\"><span class=\"bign tO\">4<\/span><b>Rédiger<\/b><span>Phrases complètes, une idée par paragraphe, une notion du cours par idée.<\/span><\/div>\n<\/div>\n<h2>Les verbes de consigne<\/h2>\n<table class=\"tb\">\n<tr><th style=\"width:28%\">Consigne<\/th><th>Ce qu'il faut faire<\/th><\/tr>\n<tr><td>Identifier, repérer<\/td><td>Nommer avec le bon vocabulaire, en citant l'annexe ou le contexte. Court mais précis.<\/td><\/tr>\n<tr><td>Caractériser<\/td><td>Décrire les traits essentiels d'une situation à l'aide des notions du cours.<\/td><\/tr>\n<tr><td>Analyser, montrer, expliquer<\/td><td>Décomposer et expliquer le « pourquoi » et le « comment » : notion, preuve tirée du dossier, effet sur l'entreprise.<\/td><\/tr>\n<tr><td>Justifier, argumenter<\/td><td>Donner des arguments appuyés sur le dossier et le cours, puis conclure.<\/td><\/tr>\n<tr><td>Vérifier, évaluer, apprécier<\/td><td>Peser les éléments pour et contre, puis trancher clairement.<\/td><\/tr>\n<tr><td>Proposer, préconiser<\/td><td>Une solution concrète, réaliste pour cette entreprise, et justifiée.<\/td><\/tr>\n<tr><td>« À l'aide d'un raisonnement juridique »<\/td><td>Méthode en 4 temps : voir page 04.<\/td><\/tr>\n<\/table>\n<div class=\"card cY\"><h3>Les auteurs : un bonus, pas une obligation<\/h3><p class=\"sm\">Le jury ne sanctionne pas l'absence d'auteur ou de théorie. Mais un auteur bien placé (Porter, Mintzberg, Herzberg…) montre que tu maîtrises le cours : vois la page 13.<\/p><\/div>","x":"méthode la méthode générale la règle d'or toujours contextualiser : relier chaque réponse à l'entreprise du sujet. une réponse juste mais « hors contexte » ne rapporte qu'environ un tiers des points. source : retours officiels de correction (académie de besançon, session 2020). le minutage conseillé lecture · 25 min mission 1 · 1 h mission 2 · 1 h mission 3 · 1 h relire adapte le temps aux points : une question à 4 points mérite deux fois plus de lignes qu'une question à 2 points. 1 lire le contexte activité, taille, forme juridique, marché, dirigeant, problème posé. surligne ce qui servira. 2 lire les questions repère le champ (éco, droit, management) et le verbe de consigne de chacune. 3 repérer les annexes note en marge quelle annexe sert à quelle question. 4 rédiger phrases complètes, une idée par paragraphe, une notion du cours par idée. les verbes de consigne consigne ce qu'il faut faire identifier, repérer nommer avec le bon vocabulaire, en citant l'annexe ou le contexte. court mais précis. caractériser décrire les traits essentiels d'une situation à l'aide des notions du cours. analyser, montrer, expliquer décomposer et expliquer le « pourquoi » et le « comment » : notion, preuve tirée du dossier, effet sur l'entreprise. justifier, argumenter donner des arguments appuyés sur le dossier et le cours, puis conclure. vérifier, évaluer, apprécier peser les éléments pour et contre, puis trancher clairement. proposer, préconiser une solution concrète, réaliste pour cette entreprise, et justifiée. « à l'aide d'un raisonnement juridique » méthode en 4 temps : voir page 04. les auteurs : un bonus, pas une obligation le jury ne sanctionne pas l'absence d'auteur ou de théorie. mais un auteur bien placé (porter, mintzberg, herzberg…) montre que tu maîtrises le cours : vois la page 13."},{"t":"Une méthode par type de question","h":"<p class=\"kick tO\">Méthode<\/p>\n<h1>Une méthode par type de question<\/h1>\n<div class=\"card cP\" style=\"gap:8px\"><span class=\"tag fP\">Droit<\/span><h3>Le raisonnement juridique en 4 temps<\/h3>\n<div class=\"g4\" style=\"gap:8px\">\n<div class=\"step\" style=\"background:#FFFFFF\"><b>1 · Les faits<\/b><span>Qui ? Quoi ? Résumer juridiquement la situation (« un vendeur professionnel », « un salarié en CDI »).<\/span><\/div>\n<div class=\"step\" style=\"background:#FFFFFF\"><b>2 · Le problème<\/b><span>Une question juridique générale : « Un consommateur peut-il… ? »<\/span><\/div>\n<div class=\"step\" style=\"background:#FFFFFF\"><b>3 · La règle<\/b><span>La règle de droit applicable, avec sa source (article, annexe), et ses conditions.<\/span><\/div>\n<div class=\"step\" style=\"background:#FFFFFF\"><b>4 · La solution<\/b><span>Appliquer la règle aux faits, condition par condition, puis <b>trancher<\/b> : une seule solution.<\/span><\/div>\n<\/div>\n<div class=\"ex\" style=\"margin-top:4px\"><p class=\"lab\">Exemple rédigé (cas fictif)<\/p><p class=\"sm\"><b>Faits :<\/b> Mme Ben, consommatrice, a acheté un fauteuil sur le site de la SARL Déco+ ; livrée il y a 10 jours, elle veut le renvoyer. <b>Problème :<\/b> un consommateur peut-il renoncer à un achat à distance sans donner de motif ? <b>Règle :<\/b> selon le Code de la consommation (art. L221-18), le consommateur dispose de 14 jours pour se rétracter d'un contrat conclu à distance, sans motif ; pour un bien, le délai court à partir de la réception. <b>Solution :<\/b> Mme Ben a reçu le fauteuil il y a 10 jours, elle est donc dans le délai. La SARL Déco+ doit accepter le retour et la rembourser.<\/p><\/div>\n<p class=\"sm\"><b>Attention :<\/b> le syllogisme strict n'est plus exigé, mais il faut un raisonnement argumenté qui aboutit à <b>une<\/b> solution.<\/p><\/div>\n<div class=\"g2\">\n<div class=\"card cB\" style=\"gap:6px\"><span class=\"tag fB\">Économie<\/span><h3>Répondre, puis relier au contexte<\/h3><ol class=\"sm\"><li>Définir la notion économique en jeu.<\/li><li>Expliquer le mécanisme (cause, effet).<\/li><li>Appliquer à l'entreprise avec les chiffres ou faits du dossier.<\/li><\/ol><div class=\"ex sm\" style=\"padding:10px 12px\"><p class=\"lab\">Exemple<\/p>« La hausse des taux d'intérêt renchérit le coût du crédit (mécanisme). Pour la SAS X, qui veut emprunter 200 000 € pour une nouvelle machine (annexe 3), l'investissement devient plus coûteux et sa rentabilité baisse : elle pourrait le reporter ou privilégier l'autofinancement (contexte). »<\/div><p class=\"sm\">Le tableau PESTEL n'est pas imposé : un classement clair suffit.<\/p><\/div>\n<div class=\"card cG\" style=\"gap:6px\"><span class=\"tag fG\">Management<\/span><h3>Notion, preuve, effet<\/h3><ol class=\"sm\"><li>Mobiliser la bonne notion (style de management, mécanisme de coordination, stratégie…).<\/li><li>Prouver avec un indice précis tiré du contexte ou d'une annexe.<\/li><li>Expliquer l'effet sur l'entreprise ou le proposer comme solution.<\/li><\/ol><div class=\"ex sm\" style=\"padding:10px 12px\"><p class=\"lab\">Exemple<\/p>« Le dirigeant consulte ses salariés avant de décider mais garde le dernier mot (annexe 2) : c'est un style de management consultatif, selon Likert. Il favorise l'adhésion de l'équipe tout en préservant la rapidité de décision. »<\/div><\/div>\n<\/div>","x":"méthode une méthode par type de question droit le raisonnement juridique en 4 temps 1 · les faits qui ? quoi ? résumer juridiquement la situation (« un vendeur professionnel », « un salarié en cdi »). 2 · le problème une question juridique générale : « un consommateur peut-il… ? » 3 · la règle la règle de droit applicable, avec sa source (article, annexe), et ses conditions. 4 · la solution appliquer la règle aux faits, condition par condition, puis trancher : une seule solution. exemple rédigé (cas fictif) faits : mme ben, consommatrice, a acheté un fauteuil sur le site de la sarl déco+ ; livrée il y a 10 jours, elle veut le renvoyer. problème : un consommateur peut-il renoncer à un achat à distance sans donner de motif ? règle : selon le code de la consommation (art. l221-18), le consommateur dispose de 14 jours pour se rétracter d'un contrat conclu à distance, sans motif ; pour un bien, le délai court à partir de la réception. solution : mme ben a reçu le fauteuil il y a 10 jours, elle est donc dans le délai. la sarl déco+ doit accepter le retour et la rembourser. attention : le syllogisme strict n'est plus exigé, mais il faut un raisonnement argumenté qui aboutit à une solution. économie répondre, puis relier au contexte définir la notion économique en jeu. expliquer le mécanisme (cause, effet). appliquer à l'entreprise avec les chiffres ou faits du dossier. exemple « la hausse des taux d'intérêt renchérit le coût du crédit (mécanisme). pour la sas x, qui veut emprunter 200 000 € pour une nouvelle machine (annexe 3), l'investissement devient plus coûteux et sa rentabilité baisse : elle pourrait le reporter ou privilégier l'autofinancement (contexte). » le tableau pestel n'est pas imposé : un classement clair suffit. management notion, preuve, effet mobiliser la bonne notion (style de management, mécanisme de coordination, stratégie…). prouver avec un indice précis tiré du contexte ou d'une annexe. expliquer l'effet sur l'entreprise ou le proposer comme solution. exemple « le dirigeant consulte ses salariés avant de décider mais garde le dernier mot (annexe 2) : c'est un style de management consultatif, selon likert. il favorise l'adhésion de l'équipe tout en préservant la rapidité de décision. »"},{"t":"L'entreprise dans son environnement","h":"<div class=\"row\" style=\"align-items:center;gap:14px\"><div style=\"width:58px;height:58px;border-radius:16px;background:#16182B;display:flex;align-items:center;justify-content:center;color:#FFFFFF\"><span class=\"bign\">1<\/span><\/div><div style=\"display:flex;flex-direction:column;gap:2px\"><p class=\"kick mut\">Thème 1 · 1re année<\/p><h1 style=\"font-size:31px\">L'entreprise dans son environnement<\/h1><\/div><\/div><div class=\"row\" style=\"flex-wrap:wrap;gap:6px\"><span class=\"chip\" style=\"font-size:12px\">Relations économiques<\/span><span class=\"chip\" style=\"font-size:12px\">Les contrats<\/span><span class=\"chip\" style=\"font-size:12px\">Finalités et parties prenantes<\/span><\/div>\n<div class=\"g2\" style=\"align-items:start\">\n<div style=\"display:flex;flex-direction:column;gap:10px\"><div class=\"card cB\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fB\">Économie<\/span><h3>Les agents et le marché<\/h3><div class=\"mini\"><div class=\"def\"><b>Agents économiques<\/b> · ménages, entreprises, administrations publiques, banques, reste du monde ; ils échangent des flux réels (biens, travail) et monétaires<\/div><div class=\"def\"><b>Marché<\/b> · lieu de rencontre de l'offre et de la demande, qui fixe un prix d'équilibre<\/div><div class=\"def\"><b>Concurrence pure et parfaite<\/b> · 5 conditions : atomicité, homogénéité du produit, libre entrée et sortie, transparence, mobilité des facteurs. C'est un modèle théorique<\/div><div class=\"def\"><b>Structures de marché<\/b> · monopole (1 offreur), oligopole (quelques offreurs), concurrence monopolistique (produits différenciés)<\/div><div class=\"def\"><b>Barrières à l'entrée<\/b> · obstacles pour un nouvel entrant : coûts d'installation, brevets, réglementation, notoriété des marques<\/div><div class=\"def\"><b>Coopération<\/b> · alliances, partenariats, réseaux : coopérer pour partager coûts et savoir-faire<\/div><div class=\"def\"><b>Asymétrie d'information<\/b> · une partie en sait plus que l'autre (vendeur de voiture d'occasion, Akerlof). Remèdes : garanties, labels, avis<\/div><div class=\"def\"><b>Externalités<\/b> · effet d'une activité sur un tiers sans compensation : positive (pollinisation) ou négative (pollution)<\/div><div class=\"def\"><b>Banques et marché financier<\/b> · financement indirect (crédit bancaire) ou direct (actions, obligations)<\/div><\/div><\/div><\/div>\n<div style=\"display:flex;flex-direction:column;gap:10px\"><div class=\"card cP\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fP\">Droit<\/span><h3>Le contrat<\/h3><div class=\"mini\"><div class=\"def\"><b>Principes<\/b> · liberté contractuelle (art. 1102 C. civ.), force obligatoire : « le contrat tient lieu de loi » (art. 1103), bonne foi (art. 1104)<\/div><div class=\"def\"><b>Validité (art. 1128)<\/b> · consentement des parties, capacité de contracter, contenu licite et certain<\/div><div class=\"def\"><b>Vices du consentement<\/b> · erreur, dol (tromperie), violence : ils entraînent la nullité<\/div><div class=\"def\"><b>Formation<\/b> · une offre précise et ferme + une acceptation<\/div><div class=\"def\"><b>Clauses utiles<\/b> · clause pénale, de réserve de propriété, limitative de responsabilité, de non-concurrence<\/div><div class=\"def\"><b>Clause abusive<\/b> · crée un déséquilibre significatif : réputée non écrite<\/div><div class=\"def\"><b>Évolution<\/b> · imprévision (art. 1195) : renégocier si un changement imprévisible rend l'exécution trop onéreuse<\/div><\/div><\/div><div class=\"card cG\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fG\">Management<\/span><h3>L'entreprise et ses finalités<\/h3><div class=\"mini\"><div class=\"def\"><b>Finalités<\/b> · économique (profit, pérennité), sociale (emploi, salariés), sociétale (environnement, territoire)<\/div><div class=\"def\"><b>Parties prenantes<\/b> · internes (salariés, dirigeants, actionnaires) et externes (clients, fournisseurs, État, ONG) : Freeman<\/div><div class=\"def\"><b>Logique entrepreneuriale<\/b> · créer, innover, prendre des risques ; logique managériale : organiser, coordonner, optimiser<\/div><div class=\"def\"><b>Indicateurs de performance<\/b> · CA, résultat, part de marché, rentabilité, satisfaction client, turnover, absentéisme, bilan carbone<\/div><\/div><\/div><\/div>\n<\/div>","x":"1 thème 1 · 1re année l'entreprise dans son environnement relations économiques les contrats finalités et parties prenantes économie les agents et le marché agents économiques · ménages, entreprises, administrations publiques, banques, reste du monde ; ils échangent des flux réels (biens, travail) et monétaires marché · lieu de rencontre de l'offre et de la demande, qui fixe un prix d'équilibre concurrence pure et parfaite · 5 conditions : atomicité, homogénéité du produit, libre entrée et sortie, transparence, mobilité des facteurs. c'est un modèle théorique structures de marché · monopole (1 offreur), oligopole (quelques offreurs), concurrence monopolistique (produits différenciés) barrières à l'entrée · obstacles pour un nouvel entrant : coûts d'installation, brevets, réglementation, notoriété des marques coopération · alliances, partenariats, réseaux : coopérer pour partager coûts et savoir-faire asymétrie d'information · une partie en sait plus que l'autre (vendeur de voiture d'occasion, akerlof). remèdes : garanties, labels, avis externalités · effet d'une activité sur un tiers sans compensation : positive (pollinisation) ou négative (pollution) banques et marché financier · financement indirect (crédit bancaire) ou direct (actions, obligations) droit le contrat principes · liberté contractuelle (art. 1102 c. civ.), force obligatoire : « le contrat tient lieu de loi » (art. 1103), bonne foi (art. 1104) validité (art. 1128) · consentement des parties, capacité de contracter, contenu licite et certain vices du consentement · erreur, dol (tromperie), violence : ils entraînent la nullité formation · une offre précise et ferme + une acceptation clauses utiles · clause pénale, de réserve de propriété, limitative de responsabilité, de non-concurrence clause abusive · crée un déséquilibre significatif : réputée non écrite évolution · imprévision (art. 1195) : renégocier si un changement imprévisible rend l'exécution trop onéreuse management l'entreprise et ses finalités finalités · économique (profit, pérennité), sociale (emploi, salariés), sociétale (environnement, territoire) parties prenantes · internes (salariés, dirigeants, actionnaires) et externes (clients, fournisseurs, état, ong) : freeman logique entrepreneuriale · créer, innover, prendre des risques ; logique managériale : organiser, coordonner, optimiser indicateurs de performance · ca, résultat, part de marché, rentabilité, satisfaction client, turnover, absentéisme, bilan carbone"},{"t":"La régulation de l'activité économique","h":"<div class=\"row\" style=\"align-items:center;gap:14px\"><div style=\"width:58px;height:58px;border-radius:16px;background:#16182B;display:flex;align-items:center;justify-content:center;color:#FFFFFF\"><span class=\"bign\">2<\/span><\/div><div style=\"display:flex;flex-direction:column;gap:2px\"><p class=\"kick mut\">Thème 2 · 1re année<\/p><h1 style=\"font-size:31px\">La régulation de l'activité économique<\/h1><\/div><\/div><div class=\"row\" style=\"flex-wrap:wrap;gap:6px\"><span class=\"chip\" style=\"font-size:12px\">Le rôle de l'État<\/span><span class=\"chip\" style=\"font-size:12px\">La régulation par le droit<\/span><span class=\"chip\" style=\"font-size:12px\">Analyser l'environnement<\/span><\/div>\n<div class=\"g2\" style=\"align-items:start\">\n<div style=\"display:flex;flex-direction:column;gap:10px\"><div class=\"card cB\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fB\">Économie<\/span><h3>L'État et les politiques économiques<\/h3><div class=\"mini\"><div class=\"def\"><b>3 fonctions (Musgrave)<\/b> · allocation (fournir des biens publics), redistribution (réduire les inégalités), régulation ou stabilisation (croissance, emploi, prix)<\/div><div class=\"def\"><b>Croissance<\/b> · hausse durable du PIB (richesse produite). Sources : plus de travail, plus de capital, progrès technique<\/div><div class=\"def\"><b>Inflation<\/b> · hausse générale et durable des prix : par la demande, par les coûts ; elle réduit le pouvoir d'achat<\/div><div class=\"def\"><b>Chômage<\/b> · personnes sans emploi qui en cherchent un : conjoncturel, structurel, frictionnel<\/div><div class=\"def\"><b>Politique budgétaire<\/b> · dépenses et recettes publiques (impôts) : levier de l'État<\/div><div class=\"def\"><b>Politique monétaire<\/b> · taux d'intérêt directeurs : levier de la BCE, dont l'objectif est une inflation de 2 % à moyen terme<\/div><div class=\"def\"><b>Conjoncturelle / structurelle<\/b> · court terme (relance, rigueur) / long terme (formation, recherche, réformes)<\/div><div class=\"def\"><b>Limites<\/b> · mondialisation, dette publique, règles européennes (déficit et dette encadrés), politique monétaire confiée à la BCE<\/div><\/div><\/div><\/div>\n<div style=\"display:flex;flex-direction:column;gap:10px\"><div class=\"card cP\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fP\">Droit<\/span><h3>La régulation par le droit<\/h3><div class=\"mini\"><div class=\"def\"><b>Rôle du droit<\/b> · fixer les règles du jeu, protéger la partie faible, sanctionner<\/div><div class=\"def\"><b>Autorités administratives indépendantes<\/b> · Autorité de la concurrence, CNIL, AMF (marchés financiers), Arcom (audiovisuel et numérique)<\/div><div class=\"def\"><b>Pratiques anticoncurrentielles<\/b> · ententes (art. L420-1 C. com., art. 101 TFUE) et abus de position dominante (art. L420-2, art. 102 TFUE). Amende jusqu'à 10 % du CA mondial<\/div><div class=\"def\"><b>Concentrations<\/b> · contrôlées avant de se réaliser<\/div><div class=\"def\"><b>Marque<\/b> · signe distinctif déposé à l'INPI, protégé 10 ans, renouvelable sans limite<\/div><div class=\"def\"><b>Brevet<\/b> · protège une invention nouvelle, inventive et industrielle, 20 ans maximum ; contrefaçon sanctionnée<\/div><\/div><\/div><div class=\"card cG\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fG\">Management<\/span><h3>Décider avec l'environnement<\/h3><div class=\"mini\"><div class=\"def\"><b>PESTEL<\/b> · facteurs Politiques, Économiques, Socioculturels, Technologiques, Écologiques, Légaux : opportunités et menaces<\/div><div class=\"def\"><b>Veille<\/b> · surveiller l'environnement : concurrentielle, technologique, juridique, commerciale<\/div><div class=\"def\"><b>Innovation<\/b> · de produit, de procédé, d'organisation, de commercialisation ; incrémentale ou de rupture. Source d'avantage concurrentiel<\/div>< r-faire, image, données)<\/div><div class=\"def\"><b>Coordination (Mintzberg)<\/b> · ajustement mutuel, supervision directe, standardisation des procédés, des résultats, des qualifications, des normes<\/div><div class=\"def\"><b>Styles (Likert)<\/b> · autoritaire exploiteur, autoritaire paternaliste, consultatif, participatif<\/div><div class=\"def\"><b>Niveaux de management<\/b> · stratégique (direction), tactique ou intermédiaire, opérationnel<\/div><div class=\"def\"><b>Processus<\/b> · suite d'activités qui crée de la valeur pour le client<\/div><div class=\"def\"><b>RSE<\/b> · responsabilité sociale et environnementale : éthique, salariés, société, planète<\/div><div class=\"def\"><b>Effet d'expérience (BCG)<\/b> · le coût unitaire baisse de 20 à 30 % à chaque doublement de la production cumulée<\/div><\/div><\/div><\/div>\n<\/div>\n<div class=\"card cB\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fB\">Gestion<\/span><h3>Le financement<\/h3><div class=\"mini\"><div class=\"def\"><b>Cycles<\/b> · exploitation (acheter, produire, vendre au quotidien) et investissement (acquérir des équipements durables)<\/div><div class=\"def\"><b>Compte de résultat<\/b> · produits − charges de l'année = résultat (bénéfice ou perte)<\/div><div class=\"def\"><b>Bilan<\/b> · photographie du patrimoine : actif (ce que l'entreprise possède) = passif (capitaux propres + dettes)<\/div><div class=\"def\"><b>Modes de financement<\/b> · autofinancement, apport ou augmentation de capital, emprunt bancaire, crédit-bail, financement participatif, aides publiques<\/div><div class=\"def\"><b>Équilibre financier<\/b> · les emplois stables (investissements) doivent être financés par des ressources stables. Trésorerie = FRNG − BFR<\/div><\/div><\/div>","x":"3 thème 3 · 1re année l'organisation de l'activité (2/2) risques et responsabilité organiser les ressources financement droit risques et responsabilité inexécution du contrat (art. 1217) · 5 sanctions : exception d'inexécution, exéc ign-items:center;gap:14px\"><div style=\"width:58px;height:58px;border-radius:16px;background:#16182B;display:flex;align-items:center;justify-content:center;color:#FFFFFF\"><span class=\"bign\">4<\/span><\/div><div style=\"display:flex;flex-direction:column;gap:2px\"><p class=\"kick mut\">Thème 4 · 2e année<\/p><h1 style=\"font-size:31px\">L'impact du numérique<\/h1><\/div><\/div><div class=\"row\" style=\"flex-wrap:wrap;gap:6px\"><span class=\"chip\" style=\"font-size:12px\">Un environnement transformé<\/span><span class=\"chip\" style=\"font-size:12px\">Le droit du numérique<\/span><span class=\"chip\" style=\"font-size:12px\">Le management et le SI<\/span><\/div>\n<div class=\"g2\" style=\"align-items:start\">\n<div style=\"display:flex;flex-direction:column;gap:10px\"><div class=\"card cB\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fB\">Économie<\/span><h3>Le numérique transforme les marchés<\/h3><div class=\"mini\"><div class=\"def\"><b>Places de marché<\/b> · plateformes qui mettent en relation vendeurs et acheteurs (Amazon, Vinted, Leboncoin)<\/div><div class=\"def\"><b>Relations d'échange<\/b> · B to B, B to C, C to C, B to G (entreprise vers administration)<\/div><div class=\"def\"><b>Externalités de réseau<\/b> · un service vaut plus quand il a plus d'utilisateurs : d'où des géants qui « raflent tout »<\/div><div class=\"def\"><b>Nouveaux modèles économiques<\/b> · gratuité financée par la publicité ou les données, freemium, abonnement, économie collaborative, usage plutôt que propriété (location, partage)<\/div><div class=\"def\"><b>Normes et standards<\/b> · règles techniques communes (USB-C, formats) qui permettent l'interopérabilité<\/div><\/div><\/div><div class=\"card cG\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fG\">Management<\/span><h3>Numérique et management<\/h3><div class=\"mini\"><div class=\"def\"><b>Organisation du travail<\/b> · télétravail, travail collaboratif, outils partagés : plus de flexibilité, plus de coordination à distance<\/div><div class=\"def\"><b>Système d'information (SI)<\/b> · collecter, stocker, traiter et diffuser l'information (ERP, CRM)<\/div><div class=\"def\"><b>Opportunités du SI<\/b> · décisions plus rapides, connaissance client, gains de productivité<\/div><div class=\"def\"><b>Risques du SI<\/b> · cyberattaques, pannes, surcharge informationnelle, dépendance, protection des données<\/div><\/div><\/div><\/div>\n<div style=\"display:flex;flex-direction:column;gap:10px\"><div class=\"card cP\" style=\"gap:4px;padding:12px 14px\"><span class=\"tag fP\">Droit<\/span><h3>Le droit face au numérique<\/h3><div class=\"mini\"><div class=\"def\"><b>CNIL<\/b> · autorité administrative indépendante qui contrôle le respect des données personnelles et sanctionne<\/div><div class=\"def\"><b>RGPD (25 mai 2018)<\/b> · données collectées pour un but précis, avec une base légale (souvent le consentement), minimisées, sécurisées ; droits d'accès, de rectification, d'effacement. Amende jusqu'à 20 M€ ou 4 % du CA mondial<\/div><div class=\"def\"><b>Droit d'auteur<\/b> · protège les œuvres originales (textes, logiciels, photos) sans formalité, jusqu'à 70 ans après la mort de l'auteur<\/div><div class=\"def\"><b>Identité numérique<\/b> · e-réputation, droit à l'oubli (déréférencement)<\/div><div class=\"def\"><b>Numérique au travail<\/b> · l'employeur peut contrôler (vidéosurveillance, messagerie) si c'est justifié, proportionné et si le salarié est informé ; droit à la déconnexion<\/div><div class=\"def\"><b>Preuve électronique<\/b> · l'écrit électronique a la même valeur que l'écrit papier si l'auteur est identifié et l'intégrité garantie (art. 1366 C. civ.)<\/div><div class=\"def\"><b>Contrat de vente électronique<\/b> · informations obligatoires, récapitulatif avant validation, confirmation ; droit de rétractation de 14 jours pour le consommateur<\/div><div class=\"def\"><b>Prestation numérique<\/b> · contrats de services en ligne : conditions générales, niveau de service, données<\/div><\/div><\/div><\/div>\n<\/div>\n<div class=\"card dark\"><h3>Lien NDRC<\/h3><p class=\"sm\" style=\"color:#E4E5EE\">E-commerce, CRM, prospection par e-mail (consentement RGPD), avis clients, réseaux sociaux : ce thème est au cœur de ton BTS. Utilise ton expérience pour contextualiser.<\/p><\/div>","x":"4 thème 4 · 2e année l'impact du numérique un environnement transformé le droit du numérique le management et le si économie le numérique transforme les marchés places de marché · plateformes qui mettent en relation vendeurs et acheteurs (amazon, vinted, leboncoin) relations d'échange · b to b, b to c, c to c, b to g (entreprise vers administration) externalités de réseau · un service vaut plus quand il a plus d'utilisateurs : d'où des géants qui « raflent tout » nouveaux modèles économiques · gratuité financée par la publicité ou les données, freemium, abonnement, économie collaborative, usage plutôt que propriété (location, partage) normes et standards · règles techniques communes (usb-c, formats) qui permettent l'interopérabilité management numérique et management organisation du travail · télétravail, travail collaboratif, outils partagés : plus de flexibilité, plus de coordination à distance système d'information (si) · collecter, stocker, traiter et diffuser l'information (erp, crm) opportunités du si · décisions plus rapides, connaissance client, gains de productivité risques du si · cyberattaques, pannes, surcharge informationnelle, dépendance, protection des données droit le droit face au numérique cnil · autorité administrative indépendante qui contrôle le respect des données personnelles et sanctionne rgpd (25 mai 2018) · données collectées pour un but précis, avec une base légale (souvent le consentement), minimisées, sécurisées ; droits d'accès, de rectification, d'effacement. amende jusqu'à 20 m€ ou 4 % du ca mondial droit d'auteur · protège les œuvres originales (textes, logiciels, photos) sans formalité, jusqu'à 70 ans après la mort d
